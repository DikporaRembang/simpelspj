<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPEL SPJ — Kabupaten Rembang</title>
<style>
:root{--primary:#14532d;--primary2:#166534;--accent:#f59e0b;--bg:#f4f7f5;--text:#17221b;--muted:#66736b;--danger:#b91c1c;--card:#fff;--border:#dfe7e1;--shadow:0 12px 32px #10271918}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:linear-gradient(135deg,#123d28dd,#123d2899),url("kantordindikpora.jpeg") center/cover fixed}
.auth-side{color:white;padding:clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center}.auth-side h1{font-size:clamp(2rem,4vw,4rem);line-height:1.05;margin:0 0 18px}.auth-side p{max-width:560px;line-height:1.8;color:#e8f4eb}.feature{display:grid;gap:12px;margin-top:28px}.feature span{display:flex;gap:10px;align-items:center}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:20px;background:#f8fbf9ee}.auth-card{width:min(100%,470px);background:var(--card);border:1px solid #ffffff99;border-radius:28px;padding:clamp(22px,4vw,38px);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{width:46px;height:46px;border-radius:14px;background:var(--primary);color:white;display:grid;place-items:center;font-weight:800}.brand h2{font-size:1.1rem;margin:0}.brand small{color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf3ee;padding:4px;border-radius:14px;margin:20px 0}.tabs button{border:0;background:transparent;padding:11px;border-radius:10px;color:var(--muted)}.tabs button.active{background:white;color:var(--primary);font-weight:700;box-shadow:0 2px 8px #0000000c}
.field{margin:13px 0}.field label{display:block;font-size:.86rem;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 13px;outline:none;background:white}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #16653414}
.password-wrap{position:relative}.password-wrap input{padding-right:48px}.toggle-pass{position:absolute;right:8px;top:5px;border:0;background:transparent;padding:8px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;transition:.2s}.btn:disabled{opacity:.5;cursor:not-allowed}.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary2)}.btn-secondary{background:#e8f0ea;color:var(--primary)}.btn-danger{background:#fee2e2;color:var(--danger)}.btn-light{background:white;border:1px solid var(--border)}.full{width:100%}
.muted{color:var(--muted);font-size:.86rem}.message{padding:11px 13px;border-radius:12px;margin:12px 0;font-size:.9rem}.message.error{background:#fef2f2;color:var(--danger)}.message.ok{background:#ecfdf5;color:#166534}
.dashboard{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(14px,3vw,34px)}.topbar .brand{margin:0}.top-actions{display:flex;align-items:center;gap:8px}.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 72px)}.sidebar{background:#123d28;color:white;padding:18px 12px}.nav-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#a9cbb4;padding:12px 12px 5px}.nav-btn{width:100%;text-align:left;border:0;background:transparent;color:#dceee2;padding:12px;border-radius:10px;margin:3px 0}.nav-btn.active,.nav-btn:hover{background:#ffffff18;color:white}.content{padding:clamp(16px,3vw,34px);min-width:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}.page-head h1{margin:0;font-size:clamp(1.35rem,3vw,2rem)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:white;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 5px 18px #10271908}.stat small{color:var(--muted)}.stat strong{display:block;font-size:1.7rem;margin-top:7px}.panel{background:white;border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 5px 18px #10271908}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px;font-size:.88rem}th,td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:#f1f6f2;color:#31523d;white-space:nowrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}.full-col{grid-column:1/-1}.section-title{font-weight:800;margin:20px 0 10px;color:var(--primary)}
.month-grid,.doc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.month-card,.doc-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;transition:.15s}.month-card:hover,.doc-card:hover{border-color:#9db5a4;box-shadow:0 7px 20px #10271910}.month-card h3,.doc-card h3{margin:0 0 7px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:.72rem;font-weight:800;background:#edf3ee;color:#31523d}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.danger{background:#fee2e2;color:#991b1b}.badge.info{background:#dbeafe;color:#1d4ed8}.progress{height:8px;background:#e5ece7;border-radius:99px;overflow:hidden;margin:12px 0}.progress>i{display:block;height:100%;background:var(--primary);border-radius:99px}.doc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.doc-row:last-child{border-bottom:0}.doc-meta{display:flex;gap:10px;align-items:center}.iconbox{width:40px;height:40px;border-radius:12px;background:#edf3ee;display:grid;place-items:center;font-weight:800;color:var(--primary)}.empty{padding:28px;text-align:center;color:var(--muted)}.loading{padding:24px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#07150dcc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-card{background:white;width:min(100%,560px);max-height:90vh;overflow:auto;border-radius:20px;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{border:0;background:#edf3ee;border-radius:10px;width:38px;height:38px}
@media(max-width:950px){.auth{grid-template-columns:1fr}.auth-side{display:none}.layout{grid-template-columns:1fr}.sidebar{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.month-grid,.doc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.auth-panel{padding:10px}.auth-card{border-radius:20px;padding:20px}.cards{grid-template-columns:1fr 1fr}.form-grid,.month-grid,.doc-grid{grid-template-columns:1fr}.top-actions .user-name{display:none}.content{padding:14px}.panel{padding:13px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbyWvJXKr1QZ1zwbeJDoULTUihycj1771SsDlGFy8jnuF4i3DsEbHXlcJU48VDAg17fqDA/exec';
const state={token:sessionStorage.getItem('simpel_token')||'',user:null,view:'home',periode:null,masters:[],docs:[],periods:[]};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('id-ID').format(Number(v)||0);
async function api(action,payload={}){
  const body={action,...payload}; if(state.token)body.token=state.token;
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const d=await r.json(); if(!d.success)throw new Error(d.message||'Permintaan gagal'); return d;
}
function msg(t,type='error'){return `<div class="message ${type}">${esc(t)}</div>`}
function passwordToggle(id){const x=$('#'+id);x.type=x.type==='password'?'text':'password'}
function authView(notice=''){
  $('#app').innerHTML=`<main class="auth"><section class="auth-side"><div><div class="brand"><div class="brand-mark">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Kabupaten Rembang</small></div></div><h1>Penilaian SPJ BOSP SD yang terintegrasi.</h1><p>Pengelolaan dokumen, pemeriksaan, penilaian, dan laporan SPJ dalam satu sistem.</p><div class="feature"><span>✓ Akses sesuai peran</span><span>✓ SPJ bulanan terstruktur</span><span>✓ Pemeriksaan dan penilaian terintegrasi</span></div></div></section><section class="auth-panel"><div class="auth-card"><div class="brand"><div class="brand-mark">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Masuk ke sistem</small></div></div>${notice}<form id="loginForm"><div class="field"><label>Username / NPSN</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="toggle-pass" onclick="passwordToggle('password')">◉</button></div></div><div id="authMsg"></div><button class="btn btn-primary full" id="loginBtn">Masuk</button></form></div></section></main>`;
  $('#loginForm').onsubmit=doLogin;
}
async function doLogin(e){
  e.preventDefault(); const b=$('#loginBtn'),m=$('#authMsg');b.disabled=true;b.textContent='Memproses...';
  try{const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});state.token=r.token;state.user=r.user;sessionStorage.setItem('simpel_token',state.token);dashboard()}catch(x){m.innerHTML=msg(x.message)}finally{b.disabled=false;b.textContent='Masuk'}
}
function role(){return String(state.user?.role||'').toUpperCase()}
function menu(){
  const r=role();
  if(r==='SEKOLAH')return[
    ['home','🏠','Dashboard'],['spjSaya','📁','SPJ Saya'],['statusSaya','📋','Status Pemeriksaan'],['profil','👤','Profil']
  ];
  if(r==='PENGAWAS')return[
    ['home','🏠','Dashboard'],['binaan','🏫','Sekolah Binaan'],['pemeriksaan','🔎','Pemeriksaan SPJ'],['temuan','⚠','Temuan'],['penilaian','📊','Penilaian'],['riwayat','📑','Riwayat Penilaian']
  ];
  return[
    ['home','🏠','Dashboard'],['monitoring','📈','Monitoring SPJ'],['laporan','📑','Laporan Penilaian'],['sekolah','🏫','Data Sekolah'],['pengawas','👨‍💼','Data Pengawas'],['master','⚙','Master Data']
  ];
}
function dashboard(){
  document.body.style.background='var(--bg)';
  const m=menu();
  $('#app').innerHTML=`<main class="dashboard"><header class="topbar"><div class="brand"><div class="brand-mark">SPJ</div><div><h2>SIMPEL SPJ</h2><small>${esc(role())}</small></div></div><div class="top-actions"><span class="muted user-name">${esc(state.user?.nama_pengguna||state.user?.username||'')}</span><button class="btn btn-light" id="logoutBtn">Keluar</button></div></header><div class="layout"><aside class="sidebar"><div class="nav-title">Menu Utama</div>${m.map(x=>`<button class="nav-btn" data-view="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</aside><section class="content" id="mainContent"></section></div></main>`;
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>loadView(b.dataset.view));
  $('#logoutBtn').onclick=logout; loadView('home');
}
async function logout(){try{await api('logout')}catch(e){}state.token='';state.user=null;sessionStorage.removeItem('simpel_token');authView(msg('Anda telah keluar.','ok'))}
function setActive(v){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function head(t,d=''){return `<div class="page-head"><div><h1>${t}</h1><div class="muted">${d}</div></div></div>`}
function loadView(v){state.view=v;setActive(v);const c=$('#mainContent');({home:homeView,spjSaya:spjSayaView,statusSaya:statusSayaView,profil:profilView,binaan:binaanView,pemeriksaan:pemeriksaanView,temuan:temuanView,penilaian:penilaianView,riwayat:riwayatView,monitoring:monitoringView,laporan:laporanView,sekolah:sekolahView,pengawas:pengawasView,master:masterView}[v]||homeView)()}
function stat(t,v,s=''){return `<div class="stat"><small>${t}</small><strong>${v}</strong>${s?`<div class="muted">${s}</div>`:''}</div>`}
async function homeView(){
  const r=role();
  if(r==='SEKOLAH')return schoolHome();
  if(r==='PENGAWAS')return supervisorHome();
  return dinasHome();
}
async function schoolHome(){
  $('#mainContent').innerHTML=head('Dashboard Sekolah','Kelola SPJ bulanan dan dokumen pertanggungjawaban')+'<div id="homeData" class="loading">Memuat data...</div>';
  try{
    const p=await api('getPeriodeSPJ');state.periods=p.data||[];
    let html='<div class="cards">'+stat('Role','SEKOLAH')+stat('SPJ Bulan',''+state.periods.length,'Periode tersedia')+stat('NPSN',esc(state.user.npsn||state.user.username))+stat('Status','Aktif')+'</div><div class="panel"><h3>SPJ Bulanan</h3><p class="muted">Pilih bulan untuk membuka struktur dokumen SPJ.</p><div class="month-grid">'+state.periods.map(x=>`<div class="month-card"><h3>${esc(x.nama_periode||x.bulan||'Periode')}</h3><span class="badge info">${esc(x.status||'AKTIF')}</span><div class="toolbar" style="margin-top:14px"><button class="btn btn-primary" onclick="openPeriod('${esc(x.id_periode)}')">Buka SPJ</button></div></div>`).join('')+'</div></div>';
    $('#homeData').outerHTML=html;
  }catch(e){$('#homeData').outerHTML=msg(e.message)}
}
async function openPeriod(id){state.periode=id;loadView('spjSaya');await renderPeriod(id)}
async function spjSayaView(){
  $('#mainContent').innerHTML=head('SPJ Saya','Pilih periode dan kelola dokumen berdasarkan kelompok SPJ')+'<div class="panel"><div class="field"><label>Periode SPJ</label><select id="periodeSelect"></select></div></div><div id="periodContent" class="loading">Pilih periode.</div>';
  state.periods=(await api('getPeriodeSPJ')).data||[];
  $('#periodeSelect').innerHTML=state.periods.map(p=>`<option value="${esc(p.id_periode)}">${esc(p.nama_periode||p.bulan)}</option>`).join('');
  if(state.periode)$('#periodeSelect').value=state.periode; else if(state.periods[0])state.periode=state.periods[0].id_periode;
  $('#periodeSelect').onchange=()=>{state.periode=$('#periodeSelect').value;renderPeriod(state.periode)};
  if(state.periode)await renderPeriod(state.periode);
}
async function renderPeriod(pid){
  const box=$('#periodContent');if(!box)return;box.innerHTML='<div class="loading">Memuat struktur SPJ...</div>';
  try{
    const [m,d]=await Promise.all([api('getMasterSPJ'),api('getDokumenSPJ',{idPeriode:pid})]);
    state.masters=(m.data||[]).filter(x=>String(x.status_aktif).toUpperCase()==='AKTIF').sort((a,b)=>(Number(a.urutan)||0)-(Number(b.urutan)||0));
    state.docs=d.data||[];
    const groups=state.masters.map(x=>{const doc=state.docs.filter(y=>y.id_spj===x.id_spj&&String(y.status).toUpperCase()!=='NONAKTIF')[0];return {m:x,d:doc}});
    const uploaded=groups.filter(x=>x.d).length,total=groups.length,pct=total?Math.round(uploaded/total*100):0;
    box.innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h3 style="margin:0">Paket SPJ Bulanan</h3><div class="muted">${uploaded} dari ${total} komponen terisi</div></div><strong>${pct}%</strong></div><div class="progress"><i style="width:${pct}%"></i></div></div><div class="panel"><h3>Dokumen SPJ</h3>${groups.length?groups.map(x=>docRow(x.m,x.d)).join(''):'<div class="empty">Master SPJ belum tersedia.</div>'}</div>`;
  }catch(e){box.innerHTML=msg(e.message)}
}
function docRow(m,d){
  const ok=!!d, status=ok?String(d.status||'SUDAH_UPLOAD'):'BELUM_UPLOAD';
  return `<div class="doc-row"><div class="doc-meta"><div class="iconbox">PDF</div><div><strong>${esc(m.nama_spj||m.kode_spj)}</strong><div class="muted">${esc(m.keterangan||'Dokumen SPJ')}</div></div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge ${ok?'ok':'warn'}">${esc(status)}</span><button class="btn ${ok?'btn-light':'btn-primary'}" onclick="uploadModal('${esc(m.id_spj)}','${esc(m.nama_spj||m.kode_spj)}')">${ok?'Ganti PDF':'Upload PDF'}</button>${ok&&d.file_url?`<button class="btn btn-secondary" onclick="window.open('${esc(d.file_url)}','_blank')">Lihat</button>`:''}</div></div>`
}
function uploadModal(idSpj,nama){
  const modal=document.createElement('div');modal.className='modal';modal.id='uploadModal';modal.innerHTML=`<div class="modal-card"><div class="modal-head"><div><h3 style="margin:0">Upload Dokumen</h3><div class="muted">${esc(nama)}</div></div><button class="close" onclick="document.getElementById('uploadModal').remove()">×</button></div><div class="field"><label>File PDF</label><input id="upFile" type="file" accept="application/pdf,.pdf" required><div class="muted">Dokumen harus berupa PDF.</div></div><div id="upMsg"></div><button class="btn btn-primary full" id="upBtn">Upload dan Simpan</button></div>`;
  document.body.appendChild(modal);
  $('#upBtn').onclick=async()=>{
    const f=$('#upFile').files[0],b=$('#upBtn'),m=$('#upMsg');if(!f)return m.innerHTML=msg('Pilih file PDF terlebih dahulu.');
    if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return m.innerHTML=msg('File harus berformat PDF.');
    b.disabled=true;b.textContent='Mengunggah...';
    try{
      const reader=new FileReader();reader.onload=async()=>{try{
        const base64=String(reader.result).split(',')[1]||'';
        await api('uploadDanSimpanDokumenSPJ',{data:{npsn:state.user.npsn||state.user.username,id_periode:state.periode,id_spj:idSpj,nama_file:f.name,mimeType:'application/pdf',base64}});
        modal.remove();await renderPeriod(state.periode);
      }catch(e){m.innerHTML=msg(e.message);b.disabled=false;b.textContent='Upload dan Simpan'}};
      reader.readAsDataURL(f);
    }catch(e){m.innerHTML=msg(e.message);b.disabled=false;b.textContent='Upload dan Simpan'}
  }
}
async function statusSayaView(){
  $('#mainContent').innerHTML=head('Status Pemeriksaan','Status SPJ yang telah dikirim kepada Pengawas')+'<div id="statusBox" class="loading">Memuat...</div>';
  try{
    const ps=await api('getPeriodeSPJ');const periods=ps.data||[];
    let rows=[];
    for(const p of periods){try{const r=await api('ringkasanSPJBulanan',{idPeriode:p.id_periode});rows.push({p,r:r})}catch(e){}}
    $('#statusBox').innerHTML=`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Periode</th><th>Kelengkapan</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.p.nama_periode||x.p.bulan)}</td><td>${esc(JSON.stringify(x.r.data||x.r.ringkasan||'-'))}</td><td><span class="badge info">Dipantau</span></td></tr>`).join('')||'<tr><td colspan="3">Belum ada data.</td></tr>'}</tbody></table></div></div>`
  }catch(e){$('#statusBox').outerHTML=msg(e.message)}
}
function profilView(){$('#mainContent').innerHTML=head('Profil','Informasi akun sekolah')+`<div class="panel"><div class="form-grid"><div><div class="muted">Nama pengguna</div><strong>${esc(state.user?.nama_pengguna||'-')}</strong></div><div><div class="muted">Username / NPSN</div><strong>${esc(state.user?.username||'-')}</strong></div><div><div class="muted">Role</div><strong>${esc(state.user?.role||'-')}</strong></div></div></div>`}
async function supervisorHome(){
  $('#mainContent').innerHTML=head('Dashboard Pengawas','Pemeriksaan SPJ sekolah binaan')+'<div id="supHome" class="loading">Memuat data...</div>';
  try{const [s,p]=await Promise.all([api('getSekolah'),api('getPeriodeSPJ')]);$('#supHome').innerHTML=`<div class="cards">${stat('Sekolah Binaan',(s.data||[]).length)}${stat('Periode SPJ',(p.data||[]).length)}${stat('Role','PENGAWAS')} ${stat('Status','Aktif')}</div><div class="panel"><h3>Sekolah Binaan</h3>${(s.data||[]).map(x=>`<div class="doc-row"><div><strong>${esc(x.nama_sekolah)}</strong><div class="muted">${esc(x.npsn)} · ${esc(x.kecamatan)}</div></div><button class="btn btn-primary" onclick="selectSchool('${esc(x.npsn)}')">Periksa SPJ</button></div>`).join('')||'<div class="empty">Belum ada sekolah binaan.</div>'}</div>`}catch(e){$('#supHome').outerHTML=msg(e.message)}
}
function selectSchool(n){state.school=n;loadView('pemeriksaan')}
async function binaanView(){
  $('#mainContent').innerHTML=head('Sekolah Binaan','Sekolah yang menjadi tanggung jawab Anda')+'<div id="binaanBox" class="loading">Memuat...</div>';
  try{const r=await api('getSekolah');$('#binaanBox').innerHTML=`<div class="doc-grid">${(r.data||[]).map(x=>`<div class="doc-card"><h3>${esc(x.nama_sekolah)}</h3><div class="muted">${esc(x.npsn)} · ${esc(x.kecamatan)}</div><div class="toolbar" style="margin-top:14px"><button class="btn btn-primary" onclick="selectSchool('${esc(x.npsn)}')">Buka SPJ</button></div></div>`).join('')||'<div class="empty">Tidak ada sekolah binaan.</div>'}</div>`}catch(e){$('#binaanBox').outerHTML=msg(e.message)}
}
async function pemeriksaanView(){
  $('#mainContent').innerHTML=head('Pemeriksaan SPJ','Pilih sekolah dan periode, lalu periksa dokumen')+'<div class="panel"><div class="form-grid"><div class="field"><label>Sekolah</label><select id="schoolSel"></select></div><div class="field"><label>Periode</label><select id="periodSel"></select></div></div><button class="btn btn-primary" id="openCheck">Buka Pemeriksaan</button></div><div id="checkBox"></div>';
  try{
    const [s,p]=await Promise.all([api('getSekolah'),api('getPeriodeSPJ')]);$('#schoolSel').innerHTML=(s.data||[]).map(x=>`<option value="${esc(x.npsn)}">${esc(x.nama_sekolah)} (${esc(x.npsn)})</option>`).join('');$('#periodSel').innerHTML=(p.data||[]).map(x=>`<option value="${esc(x.id_periode)}">${esc(x.nama_periode||x.bulan)}</option>`).join('');if(state.school)$('#schoolSel').value=state.school;
    $('#openCheck').onclick=async()=>{state.school=$('#schoolSel').value;state.periode=$('#periodSel').value;$('#checkBox').innerHTML='<div class="loading">Memuat dokumen...</div>';try{const r=await api('getDokumenSPJ',{idPeriode:state.periode,npsn:state.school});$('#checkBox').innerHTML=`<div class="panel"><h3>Dokumen SPJ</h3>${(r.data||[]).map(d=>`<div class="doc-row"><div class="doc-meta"><div class="iconbox">PDF</div><div><strong>${esc(d.nama_file)}</strong><div class="muted">${esc(d.id_spj)} · Versi ${esc(d.versi)}</div></div></div>${d.file_url?`<button class="btn btn-secondary" onclick="window.open('${esc(d.file_url)}','_blank')">Buka PDF</button>`:''}</div>`).join('')||'<div class="empty">Belum ada dokumen.</div>'}</div><div class="panel"><h3>Langkah pemeriksaan</h3><p class="muted">Setelah dokumen diperiksa, lanjutkan ke Temuan dan Penilaian.</p><button class="btn btn-primary" onclick="loadView('temuan')">Buka Temuan</button> <button class="btn btn-secondary" onclick="loadView('penilaian')">Buka Penilaian</button></div>`}catch(e){$('#checkBox').innerHTML=msg(e.message)}}}
  }catch(e){$('#checkBox').innerHTML=msg(e.message)}
}
async function temuanView(){
  $('#mainContent').innerHTML=head('Temuan','Temuan hasil pemeriksaan SPJ')+'<div class="panel"><div class="form-grid"><div class="field"><label>Periode</label><input id="tp"></div><div class="field"><label>NPSN</label><input id="tn" value="${esc(state.school||'')}"></div></div><button class="btn btn-primary" id="tbtn">Tampilkan Temuan</button></div><div id="tbox"></div>';
  $('#tbtn').onclick=async()=>{try{const r=await api('getTemuanSPJ',{idPeriode:$('#tp').value,npsn:$('#tn').value});$('#tbox').innerHTML=`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Level</th><th>Status</th><th>Catatan</th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${esc(x.kode_temuan)}</td><td>${esc(x.level_temuan)}</td><td>${esc(x.hasil_verifikasi||x.status_temuan)}</td><td>${esc(x.catatan_pengawas||x.catatan_sistem)}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada temuan.</td></tr>'}</tbody></table></div></div>`}catch(e){$('#tbox').innerHTML=msg(e.message)}}
}
async function penilaianView(){
  $('#mainContent').innerHTML=head('Penilaian SPJ','Nilai indikator berdasarkan pemeriksaan dan bukti dokumen')+'<div class="panel"><div class="form-grid"><div class="field"><label>Periode</label><input id="ap"></div><div class="field"><label>NPSN</label><input id="an" value="${esc(state.school||'')}"></div></div><button class="btn btn-primary" id="startAssessment">Buka Penilaian</button></div><div id="abox"></div>';
  $('#startAssessment').onclick=async()=>{try{const r=await api('buatAtauAmbilAsesmen',{idPeriode:$('#ap').value,npsn:$('#an').value});const a=r.data||r;$('#abox').innerHTML=`<div class="panel"><h3>Asesmen ${esc(a.id_asesmen)}</h3><p class="muted">Status: ${esc(a.status_asesmen||'DALAM_PEMERIKSAAN')}</p><div class="toolbar"><button class="btn btn-secondary" onclick="hitungIndikator('${esc($('#ap').value)}','${esc($('#an').value)}')">Hitung Indikator</button><button class="btn btn-primary" onclick="finalize('${esc(a.id_asesmen)}')">Finalisasi</button></div><div id="indicatorBox"></div></div>`}catch(e){$('#abox').innerHTML=msg(e.message)}}
}
async function hitungIndikator(p,n){
  try{const r=await api('hitungIndikatorDariTemuan',{idPeriode:p,npsn:n});$('#indicatorBox').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Indikator</th><th>Temuan</th><th>Skor Sistem</th><th>Skor Pengawas</th></tr></thead><tbody>${(r.data||[]).map(i=>`<tr><td>${esc(i.nama_indikator)}</td><td>${esc(i.jumlah_temuan)}</td><td>${esc(i.skor)}</td><td><input id="score_${esc(i.id_indikator)}" type="number" min="0" max="4" value="${esc(i.skor)}"></td></tr>`).join('')}</tbody></table></div><p class="muted">Simpan detail indikator menggunakan endpoint asesmen setelah nilai diperiksa.</p>`}catch(e){$('#indicatorBox').innerHTML=msg(e.message)}
}
async function finalize(id){try{const r=await api('finalisasiAsesmen',{idAsesmen:id});$('#abox').insertAdjacentHTML('beforeend',msg(`Penilaian selesai. Nilai kualitas ${Number(r.nilai_kualitas||0).toFixed(2)}, indeks kompleksitas ${Number(r.indeks_kompleksitas||0).toFixed(2)}, nilai akhir ${Number(r.nilai_akhir||0).toFixed(2)}.`,'ok'))}catch(e){$('#abox').insertAdjacentHTML('beforeend',msg(e.message))}}
async function riwayatView(){$('#mainContent').innerHTML=head('Riwayat Penilaian','Riwayat pemeriksaan dan hasil asesmen')+'<div class="panel"><p class="muted">Riwayat detail asesmen akan ditampilkan setelah data asesmen tersedia.</p></div>'}
async function dinasHome(){
  $('#mainContent').innerHTML=head('Dashboard Dinas','Monitoring hasil pemeriksaan SPJ dari Pengawas')+'<div id="dhome" class="loading">Memuat...</div>';
  try{const [s,p]=await Promise.all([api('getSekolah'),api('getPeriodeSPJ')]);$('#dhome').innerHTML=`<div class="cards">${stat('Sekolah',(s.data||[]).length)}${stat('Periode',(p.data||[]).length)}${stat('Role','DINAS')} ${stat('Monitoring','Aktif')}</div><div class="panel"><h3>Alur laporan</h3><p class="muted">Sekolah mengunggah SPJ → Pengawas memeriksa dan menilai → hasil penilaian diterima DINAS.</p><button class="btn btn-primary" onclick="loadView('laporan')">Buka Laporan Penilaian</button></div>`}catch(e){$('#dhome').outerHTML=msg(e.message)}
}
async function monitoringView(){
  $('#mainContent').innerHTML=head('Monitoring SPJ','Pantau sekolah dan periode yang tersedia')+'<div id="mon" class="loading">Memuat...</div>';
  try{const [s,p]=await Promise.all([api('getSekolah'),api('getPeriodeSPJ')]);$('#mon').innerHTML=`<div class="panel"><h3>Sekolah</h3><div class="table-wrap"><table><thead><tr><th>NPSN</th><th>Sekolah</th><th>Kecamatan</th></tr></thead><tbody>${(s.data||[]).map(x=>`<tr><td>${esc(x.npsn)}</td><td>${esc(x.nama_sekolah)}</td><td>${esc(x.kecamatan)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Periode SPJ</h3><div class="month-grid">${(p.data||[]).map(x=>`<div class="month-card"><h3>${esc(x.nama_periode||x.bulan)}</h3><span class="badge info">${esc(x.status||'AKTIF')}</span></div>`).join('')}</div></div>`}catch(e){$('#mon').outerHTML=msg(e.message)}
}
async function laporanView(){
  $('#mainContent').innerHTML=head('Laporan Penilaian','Hasil penilaian yang telah difinalisasi oleh Pengawas')+'<div class="panel"><p class="muted">Dashboard laporan memakai data asesmen sebagai sumber. Endpoint rekap DINAS khusus belum tersedia pada backend baseline, sehingga tidak menampilkan data fiktif.</p></div>';
}
async function sekolahView(){await monitoringView()}
async function pengawasView(){await monitoringView()}
async function masterView(){
  $('#mainContent').innerHTML=head('Master Data','Master SPJ, indikator, dan periode')+'<div id="masterBox" class="loading">Memuat...</div>';
  try{const [a,b,c]=await Promise.all([api('getMasterSPJ'),api('getMasterIndikator'),api('getPeriodeSPJ')]);$('#masterBox').innerHTML=`<div class="panel"><h3>Master SPJ</h3>${(a.data||[]).map(x=>`<div class="doc-row"><strong>${esc(x.nama_spj)}</strong><span class="badge">${esc(x.status_aktif)}</span></div>`).join('')}</div><div class="panel"><h3>Indikator</h3><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Indikator</th><th>Bobot</th></tr></thead><tbody>${(b.data||[]).map(x=>`<tr><td>${esc(x.kode_indikator)}</td><td>${esc(x.nama_indikator)}</td><td>${esc(x.bobot)}</td></tr>`).join('')}</tbody></table></div></div>`}catch(e){$('#masterBox').outerHTML=msg(e.message)}
}
window.addEventListener('load',()=>{if(state.token){api('getSession').then(r=>{if(r.success&&r.data){state.user=r.data;dashboard()}else{sessionStorage.removeItem('simpel_token');state.token='';authView()}}).catch(()=>{state.token='';authView()})}else authView()});
</script>
