<script>
/* ============================================================================
 * RKAS REPLACE UI — FINAL17
 * Dinas only: Ganti seluruh sekolah / satu sekolah.
 * Parser khusus format DPA/RKA seperti "RKA Unit - Manajemen Aplikasi RKAS".
 * ========================================================================== */

function _rkasReplaceNorm_(v){
  return String(v ?? '').replace(/\u00a0/g,' ').trim();
}
function _rkasReplaceCode_(v){
  const s=_rkasReplaceNorm_(v).replace(/\s+/g,'');
  return /^\d+(?:\.\d+){5}$/.test(s) ? s : '';
}
function _rkasReplaceNpsn_(v){
  const s=_rkasReplaceNorm_(v).replace(/[^\d]/g,'');
  return /^\d{8}$/.test(s)?s:'';
}
function _rkasReplaceNum_(v){
  if(typeof v==='number' && Number.isFinite(v)) return v;
  const s=_rkasReplaceNorm_(v).replace(/[^\d,.-]/g,'');
  if(!s)return 0;
  if(s.includes(',') && s.includes('.')) return Number(s.replace(/\./g,'').replace(',','.'))||0;
  if(s.includes(',')) return Number(s.replace(',','.'))||0;
  return Number(s)||0;
}

/**
 * Parser format DPA:
 * col A = Kode Rekening / NPSN
 * col F = Uraian
 * col U = Volume
 * col X = Satuan
 * col AA = Harga Satuan
 * col AD = Jumlah
 *
 * Parser tidak menganggap baris subtotal sebagai barang.
 * Kode rekening penuh diwariskan ke detail sampai muncul kode rekening baru.
 */
function _rkasParseDpaWorkbookClient(wb){
  const all = [];
  const diagnostics = { sheets: [], mode: 'DPA_HIERARCHICAL', ignoredSubtotal: 0, ignoredHeader: 0 };
  
  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    
    // Default posisi kolom baku
    let codeCol = 0, descCol = 5, volCol = 20, unitCol = 23, priceCol = 26, totalCol = 29;
    let headerRow = -1;

    // Cari baris header yang mengandung "KODE REKENING" dan "URAIAN"
    for(let r = 0; r < Math.min(rows.length, 300); r++){
      const cells = (rows[r] || []).map(x => _rkasReplaceNorm_(x).toUpperCase());
      const hasCode = cells.some(x => x.includes('KODE REKENING') || x.includes('KODE'));
      const hasUraian = cells.some(x => x.includes('URAIAN'));
      if(hasCode && hasUraian){ 
        headerRow = r; 
        break; 
      }
    }

    // Jika header tidak ditemukan secara persis, gunakan baris default baku
    if(headerRow < 0) headerRow = 27;

    // DINAMIS: Deteksi indeks kolom secara otomatis dari baris header yang ditemukan
    if(headerRow >= 0 && rows[headerRow]) {
      const headerCells = rows[headerRow].map(x => _rkasReplaceNorm_(x).toUpperCase());
      const cCode = headerCells.findIndex(x => x.includes('KODE'));
      const cDesc = headerCells.findIndex(x => x.includes('URAIAN'));
      const cVol  = headerCells.findIndex(x => x.includes('VOL') || x.includes('JUMLAH'));
      const cPrice= headerCells.findIndex(x => x.includes('HARGA') || x.includes('TARIF'));
      const cTotal= headerCells.findIndex(x => x.includes('TOTAL') || x.includes('PAGU') || x.includes('JUMLAH HARGA'));

      if(cCode >= 0) codeCol = cCode;
      if(cDesc >= 0) descCol = cDesc;
      if(cVol >= 0)  volCol = cVol;
      if(cPrice >= 0)priceCol = cPrice;
      if(cTotal >= 0)totalCol = cTotal;
    }

    let currentKode = '';
    let currentNpsn = '';
    let currentKegiatan = '';
    let currentKodeKegiatan = '';

    for(let r = headerRow + 1; r < rows.length; r++){
      const row = rows[r] || [];
      const a = _rkasReplaceNorm_(row[codeCol]);
      const uraian = _rkasReplaceNorm_(row[descCol]);
      const fullCode = _rkasReplaceCode_(a);
      const npsn = _rkasReplaceNpsn_(a);

      // Lewati baris header berulang atau nomor urut kolom
      if(/^KODE\s*$/i.test(a) || /^URAIAN$/i.test(uraian) || a === '1' || a === '2'){
        diagnostics.ignoredHeader++;
        continue;
      }

      // NPSN menandai awal blok sekolah
      if(npsn){
        currentNpsn = npsn;
        continue;
      }

      // Kode rekening penuh menandai parent objek belanja
      if(fullCode){
        currentKode = fullCode;
        currentNpsn = currentNpsn || '';
        continue;
      }

      // Baris subtotal hierarki (misal: 5., 5.1, 5.1.02) diabaikan dari detail item
      if(/^\d+(?:\.\d+){0,4}\.?$/.test(a) && a){
        diagnostics.ignoredSubtotal++;
        continue;
      }

      if(!currentKode || !currentNpsn || !uraian) continue;

      const volume = _rkasReplaceNum_(row[volCol]);
      const harga = _rkasReplaceNum_(row[priceCol]);
      const pagu = _rkasReplaceNum_(row[totalCol]);

      // Detail item valid minimal harus memiliki pagu > 0
      if(!(pagu > 0)) {
        diagnostics.ignoredSubtotal++;
        continue;
      }

      all.push({
        npsn: currentNpsn,
        kode_rekening: currentKode,
        kode_kegiatan: currentKodeKegiatan,
        kegiatan: currentKegiatan,
        nama_belanja_asli: uraian,
        uraian: uraian,
        volume: volume || 1,
        satuan: _rkasReplaceNorm_(row[unitCol]) || 'paket',
        harga_satuan: harga || pagu,
        pagu: pagu,
        nomor_baris_sumber: r + 1,
        sheet_name: sheetName
      });
    }

    diagnostics.sheets.push({ sheet: sheetName, rows: rows.length });
  }

  return { rows: all, diagnostics };
}

function _rkasReplaceSchoolSet_(rows){
  return [...new Set((rows||[]).map(x=>_rkasReplaceNpsn_(x.npsn)).filter(Boolean))];
}

function _rkasReplaceTotal_(rows){
  return (rows||[]).reduce((a,x)=>a+Number(x.pagu||0),0);
}

        </div>
        <button class="btn btn-light" onclick="$('#rkasReplaceModal').remove()">✕ Tutup</button>
      </div>

      <div class="panel" style="margin-top:16px;background:#f8fafc">
        <div class="form-grid">
          <div class="field">
            <label>Mode Penggantian</label>
            <select id="rkasReplaceScope" onchange="toggleRkasReplaceSchool()">
              <option value="ONE">Ganti 1 sekolah</option>
              <option value="ALL">Ganti seluruh sekolah dari file</option>
            </select>
          </div>
          <div class="field" id="rkasReplaceSchoolField">
            <label>Sekolah</label>
            <input id="rkasReplaceSchoolSearch" placeholder="🔎 Cari nama sekolah atau NPSN..." oninput="filterRkasReplaceSchools()" autocomplete="off">
            <select id="rkasReplaceNpsn" style="margin-top:8px">${options}</select>
          </div>
          <div class="field">
            <label>Tahun Anggaran</label>
            <input id="rkasReplaceYear" type="number" value="${new Date().getFullYear()}" min="2000" max="2100">
          </div>
          <div class="field">
            <label>Versi RKAS</label>
            <input id="rkasReplaceVersion" value="PERUBAHAN" placeholder="Contoh: PERUBAHAN / 2026">
          </div>
          <div class="field">
            <label>File Excel RKAS</label>
            <input id="rkasReplaceFile" type="file" accept=".xlsx,.xls" required>
          </div>
        </div>
        <div id="rkasReplaceMsg" style="margin-top:12px"></div>
        <div class="toolbar" style="justify-content:flex-end;margin-top:12px">
          <button class="btn btn-light" onclick="$('#rkasReplaceModal').remove()">Batal</button>
          <button class="btn btn-primary" id="rkasReplaceAnalyzeBtn" onclick="analyzeRkasReplaceFile()">🔎 Analisis File</button>
        </div>
      </div>

      <div id="rkasReplacePreview" style="margin-top:16px"></div>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  // Pastikan mode awal konsisten dan sekolah disabled pada mode ALL.
  toggleRkasReplaceSchool();
  filterRkasReplaceSchools();
};

window.filterRkasReplaceSchools=function(){
  const q=String($('#rkasReplaceSchoolSearch')?.value||'').trim().toLowerCase();
  const sel=$('#rkasReplaceNpsn');
  if(!sel)return;
  const all=Array.isArray(window._rkasReplaceSchools)?window._rkasReplaceSchools:[];
  const current=String(sel.value||'');
  const filtered=!q?all:all.filter(s=>{
    const n=_rkasReplaceNpsn_(s.npsn);
    return String(n).includes(q)||String(s.nama_sekolah||'').toLowerCase().includes(q)||String(s.kecamatan||'').toLowerCase().includes(q);
  });
  sel.innerHTML=filtered.map(s=>{
    const n=_rkasReplaceNpsn_(s.npsn);
    return `<option value="${esc(n)}">${esc(s.nama_sekolah||'-')} — ${esc(n)}</option>`;
  }).join('');
  if(current && filtered.some(s=>_rkasReplaceNpsn_(s.npsn)===current)) sel.value=current;
};

window.toggleRkasReplaceSchool=function(){
  const scope=$('#rkasReplaceScope')?.value||'ONE';
  const f=$('#rkasReplaceSchoolField');
  const sel=$('#rkasReplaceNpsn');
  const one=scope==='ONE';
  if(f){
    f.style.display=one?'block':'none';
    f.setAttribute('aria-hidden',one?'false':'true');
  }
  if(sel)sel.disabled=!one;
};

window.analyzeRkasReplaceFile=async function(){
  const file=$('#rkasReplaceFile')?.files?.[0];
  const out=$('#rkasReplacePreview'), msgHost=$('#rkasReplaceMsg'), btn=$('#rkasReplaceAnalyzeBtn');
  if(!file){msgHost.innerHTML=msg('Pilih file Excel RKAS terlebih dahulu.','warning');return;}
  btn.disabled=true;
  try{ await ensureXlsxLib(); }catch(e){ msgHost.innerHTML=msg(e.message,'warning'); btn.disabled=false; return; }btn.textContent='Menganalisis...';
  out.innerHTML=loading('Membaca struktur DPA/RKAS dan memisahkan subtotal dari detail barang...');
  try{
    const buffer=await file.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buffer),{type:'array',cellDates:true});
    const parsed=_rkasParseDpaWorkbookClient(wb);
    let rows=parsed.rows||[];
    if(!rows.length) throw new Error('Tidak ditemukan detail barang RKAS. Pastikan file menggunakan format DPA/RKA yang memiliki Kode Rekening, NPSN sekolah, uraian barang, volume, harga, dan jumlah.');

    const scope=$('#rkasReplaceScope').value;
    const selected=_rkasReplaceNpsn_($('#rkasReplaceNpsn')?.value||'');
    if(scope==='ONE'){
      const before=rows.length;
      rows=rows.filter(x=>x.npsn===selected);
      if(!rows.length) throw new Error(`NPSN ${selected} tidak ditemukan pada file.`);
      parsed.filtered=before-rows.length;
    }

    let officialSchoolMap={};
    try{
      const sr=await api('getSekolah',{});
      (sr.data||[]).forEach(s=>{
        const n=_rkasReplaceNpsn_(s.npsn);
        if(n) officialSchoolMap[n]=s;
      });
    }catch(e){ throw new Error('Gagal membaca master sekolah: '+errorText(e)); }

    const unknownNpsn=[...new Set(rows.map(x=>x.npsn).filter(n=>!officialSchoolMap[n]))];
    const originalRows=rows.length;
    if(scope==='ALL'){
      rows=rows.filter(x=>!!officialSchoolMap[x.npsn]);
    }
    if(!rows.length) throw new Error('Tidak ada detail RKAS yang cocok dengan sekolah resmi.');
    const schools=_rkasReplaceSchoolSet_(rows);
    const total=_rkasReplaceTotal_(rows);
    const bySchool={};
    rows.forEach(x=>{
      if(!bySchool[x.npsn])bySchool[x.npsn]={npsn:x.npsn,count:0,total:0};
      bySchool[x.npsn].count++;
      bySchool[x.npsn].total+=Number(x.pagu||0);
    });

    window._rkasReplacePreview={file,rows,scope,selectedNpsn:selected,schools,bySchool,total,diagnostics:parsed.diagnostics};
    const schoolCards=Object.values(bySchool).slice(0,30).map(x=>
      `<div class="panel" style="margin:0;padding:10px"><b>${esc(x.npsn)}</b><div class="muted">${fmtNum(x.count)} item • ${fmtRupiah(x.total)}</div></div>`
    ).join('');
    
    out.innerHTML=`<div class="panel" style="background:#f0fdf4">
      <h3>Analisis Berhasil</h3>
      <div class="muted">Total baris valid: <b>${fmtNum(rows.length)}</b> • Total Pagu: <b>${fmtRupiah(total)}</b> • Sekolah: <b>${schools.length}</b></div>
      <div class="school-index-grid" style="margin-top:12px">${schoolCards}</div>
      <div class="toolbar" style="margin-top:16px;justify-content:flex-end">
        <button class="btn btn-primary" onclick="executeRkasReplace()">⚡ Lakukan Penggantian RKAS</button>
      </div>
    </div>`;
  }catch(e){
    out.innerHTML=msg(errorText(e),'error');
  }finally{
    btn.disabled=false;
    btn.textContent='🔎 Analisis File';
  }
};

window.executeRkasReplace=async function(){
  const p=window._rkasReplacePreview;
  if(!p||!p.rows?.length){toast('Belum ada hasil analisis file.','warning');return;}
  const btns=$('#rkasReplacePreview')?.querySelectorAll('button')||[];
  btns.forEach(b=>b.disabled=true);
  const msgHost=$('#rkasReplaceMsg');
  try{
    if(!confirm(
      p.scope==='ALL'
      ? `Ganti RKAS untuk ${p.schools.length} sekolah dari file ini?\n\n${fmtNum(p.rows.length)} detail akan diproses. Data lama baru dibersihkan setelah verifikasi berhasil.`
      : `Ganti RKAS sekolah ${p.selectedNpsn}?\n\n${fmtNum(p.rows.length)} detail akan diproses. Data lama baru dibersihkan setelah verifikasi berhasil.`
    )){btns.forEach(b=>b.disabled=false);return;}

    msgHost.innerHTML=msg('Membuat sesi penggantian RKAS...','info');
    const start=await api('rkasReplaceStart',{data:{
      scope:p.scope,
      npsn:p.scope==='ONE'?p.selectedNpsn:'',
      tahun:Number($('#rkasReplaceYear').value||new Date().getFullYear()),
      versi_rkas:$('#rkasReplaceVersion').value.trim()||'PERUBAHAN',
      nama_file:p.file.name,
      jenis_file:p.file.name.toLowerCase().endsWith('.xls')?'XLS':'XLSX'
    }});
    const importId=start.id_import;
    // Batch lebih besar mengurangi round-trip Apps Script secara drastis.
    // Backend juga tidak lagi membaca ulang seluruh staging pada setiap batch.
    const batchSize=2000;
    let done=0;
    const totalRows=p.rows.length;
    const startedAt=Date.now();
    for(let i=0;i<totalRows;i+=batchSize){
      const batch=p.rows.slice(i,i+batchSize);
      const r=await api('rkasReplaceAppend',{data:{
        id_import:importId,
        scope:p.scope,
        npsn:p.scope==='ONE'?p.selectedNpsn:'',
        rows:batch,
        source_start:i+1
      }});
      done=Math.min(i+batch.length,totalRows);
      const elapsed=Math.max(1,Date.now()-startedAt);
      const rate=done/(elapsed/1000);
      const remain=Math.max(0,totalRows-done);
      const eta=rate>0?Math.round(remain/rate):0;
      const etaText=eta>0?` • perkiraan ${Math.ceil(eta/60)} menit lagi`:'';
      msgHost.innerHTML=msg(
        `♻️ Memproses RKAS: ${fmtNum(done)} / ${fmtNum(totalRows)} detail (${Math.round(done/totalRows*100)}%)${etaText}<br>`+
        `<span class="muted">Batch ${Math.ceil(done/batchSize)} • ${fmtNum(r.accepted||batch.length)} detail diterima</span>`,
        'info'
      );
      await new Promise(requestAnimationFrame);
    }

    msgHost.innerHTML=msg('Semua detail sudah masuk staging. Memverifikasi dan mengganti RKAS lama...','info');
    const fin=await api('rkasReplaceFinalize',{data:{
      id_import:importId,
      scope:p.scope,
      npsn:p.scope==='ONE'?p.selectedNpsn:''
    }});
    invalidateRkasFrontendCaches();

    msgHost.innerHTML=msg(
      `Berhasil. ${fmtNum(fin.jumlah_baris)} detail menjadi APPROVED. `+
      `${fmtNum(fin.archived_karena_transaksi||0)} baris RKAS APPROVED lama diarsipkan sebagai histori; tidak ada RKAS lama yang dihapus fisik.`,
      'ok'
    );
    toast('RKAS berhasil diganti.','ok',6000);
    setTimeout(async()=>{
      $('#rkasReplaceModal')?.remove();
      await renderDinasRkasReview();
    },900);
  }catch(e){
    msgHost.innerHTML=msg(errorText(e),'error');
    btns.forEach(b=>b.disabled=false);
  }
};

<script id="rc2PipelineIntegratedClient">
async function resolveReadinessPeriodV2(){
  if(state.selectedPeriode)return state.selectedPeriode;
  try{
    const periods=await ensurePeriodeMaster();
    const active=(periods||[]).find(x=>upper(x.status||'AKTIF')==='AKTIF')||(periods||[])[0];
    if(active?.id_periode)state.selectedPeriode=active.id_periode;
  }catch(e){}
  return state.selectedPeriode||'';
}
function readinessStatusChipV2(textValue,kind){
  return `<span class="pipeline-status-chip ${kind||''}">${esc(textValue||'-')}</span>`;
}
window.openReadinessActionV2=function(npsn,view){
  if(npsn)state.selectedNpsn=npsn;
  loadView(view);
};

window.renderRoleReadinessPanel=async function(forceRefresh=false){
  const host=$('#roleReadinessPanel'); if(!host)return;
  const p=await resolveReadinessPeriodV2();
  if(!p){host.innerHTML=msg('Belum ada periode DINAS yang dapat ditampilkan.','warning');return;}
  host.innerHTML=loading('Memuat ringkasan posisi sekolah...');
  try{
    const r=await api('getAssessmentDashboardBuckets',{idPeriode:p,forceRefresh:!!forceRefresh});
    window._assessmentDashboardBuckets=r;
    const roleNow=String(role()||'').toUpperCase();

    if(roleNow==='SEKOLAH'){
      const order=r.bucket_order||[], buckets=r.buckets||{};
      let x=null,bucketMeta=null;
      for(const b of order){
        if((buckets[b.id]||[]).length){x=buckets[b.id][0];bucketMeta=b;break;}
      }
      x=x||{};
      const status=bucketMeta?.label||'Belum ada status';
      const purePreSchedule=String(x.bucket||'')==='PRA_JADWAL_TIDAK_BERLAKU';
      host.innerHTML=`<div class="pipeline-readiness-head">
        <div><h3>Posisi SPJ Sekolah</h3><p>Ringkasan cepat • detail dimuat hanya saat dibuka • Periode ${esc(p)}</p></div>
        <button class="btn btn-light btn-sm" onclick="renderRoleReadinessPanel(true)">Muat Ulang</button>
      </div>
      <div class="bucket-grid-fast">
        <div class="bucket-card-fast"><small>Posisi Saat Ini</small><strong style="font-size:1rem">${esc(status)}</strong></div>
        <div class="bucket-card-fast"><small>BKU Data</small><strong style="font-size:1rem">${x.bku_ready?'VALID':Number(x.pre_schedule_invalid_bku||0)>0?'PRA-JADWAL':'BELUM'}</strong></div>
        <div class="bucket-card-fast"><small>10 Dokumen Scan</small><strong>${fmtNum(x.documents_complete_count||0)}/10</strong></div>
        <div class="bucket-card-fast"><small>Langkah Berikut</small><strong style="font-size:.9rem">${esc(x.next_label||'-')}</strong></div>
      </div>
      ${x.pre_schedule_requires_reupload?`<div class="message warning"><b>${purePreSchedule?'DATA PRA-JADWAL TIDAK BERLAKU':'Sebagian histori pra-jadwal diabaikan.'}</b><br>Ditemukan ${fmtNum(x.pre_schedule_invalid_bku||0)} snapshot BKU dan ${fmtNum(x.pre_schedule_invalid_documents||0)} komponen dokumen yang diunggah sebelum jadwal DINAS sah. Riwayat tidak dihapus, tetapi tidak dihitung. ${purePreSchedule?'Sekolah harus mengunggah ulang saat jadwal INPUT SPJ/PERBAIKAN aktif.':'Lanjutkan hanya dengan data yang diunggah pada jadwal aktif.'}</div>`:''}
      <div class="toolbar"><button class="btn btn-light" onclick="loadView('dokumenBulanan')">Lihat Kelengkapan Dokumen</button><button class="btn btn-primary" onclick="loadView('hasilPenilaian')">Lihat Detail Posisi</button></div>`;
      return;
    }

    const wanted=roleNow==='PENGAWAS'
      ? ['PRA_JADWAL_TIDAK_BERLAKU','KURANG_LENGKAP','LENGKAP_SIAP_FASE1','FASE1_PROSES','FASE1_MASUK_DINAS','FASE1_DISETUJUI','FINAL']
      : ['PRA_JADWAL_TIDAK_BERLAKU','KURANG_LENGKAP','LENGKAP_SIAP_FASE1','FASE1_MASUK_DINAS','FASE1_DISETUJUI','SIAP_FASE2','FASE2_SELESAI','FINAL'];
    const labelMap=Object.fromEntries((r.bucket_order||[]).map(x=>[x.id,x.label]));
    const cards=wanted.map(id=>`<button type="button" class="bucket-card-fast" data-bucket="${id}" onclick="showAssessmentBucketFast('${id}')"><small>${esc(labelMap[id]||id.replaceAll('_',' '))}</small><strong>${fmtNum(r.counts?.[id]||0)}</strong></button>`).join('');

    const title=roleNow==='PENGAWAS'?'Kelompok Posisi Sekolah Tugas':'Kelompok Posisi Seluruh Sekolah';
    const sub=roleNow==='PENGAWAS'
      ?'Mulai dari kelompok yang siap Fase 1; sekolah kurang lengkap tetap terlihat tanpa memuat detail berat.'
      :'DINAS langsung melihat sekolah yang kurang, lengkap, Fase 1 masuk, dan yang benar-benar siap Fase 2.';
    host.innerHTML=`<div class="pipeline-readiness-head"><div><h3>${esc(title)}</h3><p>${esc(sub)} • Periode ${esc(p)} • Stage ${esc(r.active_stage||'-')}</p></div><button class="btn btn-light btn-sm" onclick="renderRoleReadinessPanel(true)">Muat Ulang</button></div>
      <div class="bucket-grid-fast">${cards}</div>
      <div id="assessmentBucketListFast" class="bucket-list-fast"><div class="muted">Klik salah satu kelompok untuk melihat daftar sekolah. Detail tidak dimuat sebelum dibutuhkan.</div></div>`;
  }catch(e){host.innerHTML=msg(errorText(e),'error');}
};

window.showAssessmentBucketFast=function(bucketId){
  const data=window._assessmentDashboardBuckets||{},host=$('#assessmentBucketListFast');
  if(!host)return;
  document.querySelectorAll('.bucket-card-fast[data-bucket]').forEach(x=>x.classList.toggle('active',x.dataset.bucket===bucketId));
  const rows=(data.buckets||{})[bucketId]||[];
  const label=(data.bucket_order||[]).find(x=>x.id===bucketId)?.label||bucketId.replaceAll('_',' ');
  if(!rows.length){host.innerHTML=msg(`Tidak ada sekolah pada kelompok ${label}.`,'warning');return;}

  const roleNow=String(role()||'').toUpperCase();
  host.innerHTML=`<div class="panel" style="margin:0"><div class="section-head"><div><b>${esc(label)}</b><div class="muted">${fmtNum(rows.length)} sekolah</div></div></div>
    ${rows.map(x=>{
      let view='statusSekolah',action='Buka';
      if(roleNow==='PENGAWAS'){
        if(['LENGKAP_SIAP_FASE1','FASE1_PROSES'].includes(bucketId)){view='penilaianFase1';action='Fase 1';}
        else if(['KURANG_LENGKAP','PRA_JADWAL_TIDAK_BERLAKU'].includes(bucketId)){view='pdfInteraktif';action=bucketId==='PRA_JADWAL_TIDAK_BERLAKU'?'Lihat Histori':'Periksa';}
        else {view='arsipPenilaianV5';action='Hasil';}
      }else{
        if(bucketId==='PRA_JADWAL_TIDAK_BERLAKU'){view='statusSekolah';action='Lihat Status';}
        else if(bucketId==='FASE1_MASUK_DINAS'){view='penilaianFase1';action='Review Fase 1';}
        else if(bucketId==='FASE1_DISETUJUI'){view='rekonsiliasi';action='Rekonsiliasi';}
        else if(bucketId==='SIAP_FASE2'){view='penilaianFase2';action='Nilai Fase 2';}
        else if(bucketId==='FASE2_SELESAI'){view='finalisasiSpj';action='Finalisasi';}
        else if(bucketId==='FINAL'){view='arsipPenilaianV5';action='Laporan';}
      }
      const bkuLabel=x.bku_ready?'BKU VALID':Number(x.pre_schedule_invalid_bku||0)>0?'BKU PRA-JADWAL':'BKU BELUM';
      const bkuKind=x.bku_ready?'ok':Number(x.pre_schedule_invalid_bku||0)>0?'info':'warn';
      const docActive=`${fmtNum(x.documents_complete_count||0)}/10 aktif`;
      const historyParts=[];
      if(Number(x.pre_schedule_invalid_bku||0)>0)historyParts.push(`${fmtNum(x.pre_schedule_invalid_bku)} BKU lama`);
      if(Number(x.pre_schedule_invalid_documents||0)>0)historyParts.push(`${fmtNum(x.pre_schedule_invalid_documents)} dokumen lama`);
      const historyNote=historyParts.length?`<span class="bucket-history-note ${bucketId==='PRA_JADWAL_TIDAK_BERLAKU'?'danger':''}">${esc(historyParts.join(' • '))} tidak berlaku</span>`:'';
      return `<div class="bucket-school-row">
        <div><div class="school-name">${esc(x.nama_sekolah||x.npsn)}</div><div class="school-meta">${esc(x.npsn)} • ${esc(x.kecamatan||'-')}</div>${historyNote}</div>
        <div>${readinessStatusChipV2(bkuLabel,bkuKind)}</div>
        <div>${readinessStatusChipV2(docActive,x.documents_complete?'ok':'warn')}${Number(x.pre_schedule_invalid_documents||0)>0?`<span class="bucket-history-note">${fmtNum(x.pre_schedule_invalid_documents)} pra-jadwal diabaikan</span>`:''}</div>
        <div class="school-meta"><b>${bucketId==='PRA_JADWAL_TIDAK_BERLAKU'?'UPLOAD ULANG':'STATUS'}</b><br>${esc(x.next_label||'-')}</div>
        <div class="bucket-action"><button class="btn btn-light btn-sm" onclick="openReadinessActionV2('${esc(x.npsn)}','${view}')">${esc(action)} →</button></div>
      </div>`;
    }).join('')}
  </div>`;
};
</script>

  display:grid;
  grid-template-columns:repeat(var(--v225-cols,3),minmax(0,1fr));
  gap:10px;
}
.v225-step{
  position:relative;
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:14px;
  min-height:105px;
  border:1px solid var(--role-border,var(--border));
  background:var(--role-soft-2,#f8faf9);
  border-radius:14px;
  text-align:left;
  cursor:pointer;
}
.v225-step:hover{
  border-color:var(--primary);

}

  flex:0 0 28px;height:28px;border-radius:999px;

  gap:14px;

  background:var(--role-soft,#f3f7f5);
  border:1px solid var(--role-border,var(--border));
}
.v225-home-next small{display:block;color:var(--muted);font-weight:800;margin-bottom:3px}
.v225-home-next strong{color:var(--text);font-size:1rem}
.v225-support{
  display:flex;gap:8px;flex-wrap:wrap;

<script>
/* ==========================================================================
   V23.7 — ONE ORDERED WORKFLOW PER ROLE
   ========================================================================== */
(function(){
  const OFFICE_PHOTO='https://raw.githubusercontent.com/DikporaRembang/simpelspj/main/kantordindikpora.jpeg';

  const FLOWS={
    SEKOLAH:[
      {view:'jadwalTahapan',title:'Tahap Aktif DINAS',desc:'Lihat tahap yang dibuka DINAS. Sekolah tidak menentukan periodisasi atau stage sendiri.'},
      {view:'transaksi',title:'BKU Data',desc:'Pilih tepat satu sumber: Excel BKU atau PDF BKU Digital non-scan; keduanya menjadi transaksi kanonik.'},
      {view:'dokumenBulanan',title:'Dokumen SPJ & BKU Resmi',desc:'Unggah scan PDF BKU resmi bertanda tangan dan bukti SPJ secara terpisah dari BKU Data.'},
      {view:'perbaikanSpj',title:'Perbaikan / Tindak Lanjut',desc:'Kerjakan koreksi hanya ketika tahap PERBAIKAN dibuka DINAS.'},
      {view:'hasilPenilaian',title:'Hasil Penilaian',desc:'Pantau Fase 1, Rekonsiliasi, Fase 2, dan status finalisasi DINAS.'},
      {view:'arsipPenilaianV5',title:'Laporan Fase 1 & Fase 2',desc:'Cetak laporan Fase 1 atau Fase 2 khusus sekolah sendiri setelah hasil tahap tersebut tersedia.'}
    ],
    PENGAWAS:[
      {view:'jadwalTahapan',title:'Tahap Aktif DINAS',desc:'Pemeriksaan hanya berjalan ketika stage yang relevan dibuka DINAS.'},
      {view:'penugasan',title:'Sekolah Tugas',desc:'Pilih sekolah binaan sesuai penugasan aktif.'},
      {view:'pdfInteraktif',title:'Pemeriksaan BKU & Dokumen',desc:'Periksa transaksi kanonik, BKU resmi, dan bukti SPJ tanpa mengambil alih penilaian DINAS.'},
      {view:'temuan',title:'Temuan & Rekomendasi',desc:'Catat temuan berbasis bukti dan rekomendasi tindak lanjut.'},
      {view:'verifikasiUlang',title:'Verifikasi Ulang / Review',desc:'Verifikasi hasil perbaikan sebelum Penilaian Fase 1.'},
      {view:'penilaianFase1',title:'Penilaian Fase 1',desc:'Nilai 10 dokumen berbasis BKU Data lalu kirimkan hasil kepada DINAS.'},
      {view:'arsipPenilaianV5',title:'Laporan Fase 1',desc:'Buat rekap sekolah binaan atau laporan per sekolah setelah Fase 1 disetujui DINAS.'}
    ],
    DINAS:[
      {view:'masterSpj',title:'Master Periodisasi & Standar',desc:'Tetapkan periodisasi yang wajib diikuti seluruh sekolah dan Pengawas.'},
      {view:'jadwalTahapan',title:'Workflow Stage Control',desc:'Buka dan tutup stage kerja: Persiapan sampai Finalisasi.'},
      {view:'penugasan',title:'Penugasan Pengawas',desc:'Tetapkan Pengawas untuk sekolah dan kunci penugasan saat siap.'},
      {view:'monitoringGlobal',title:'Monitoring SPJ',desc:'Pantau kesiapan BKU, dokumen, pemeriksaan, dan perbaikan.'},
      {view:'penilaianFase1',title:'Persetujuan Fase 1 Pengawas',desc:'Review hasil Fase 1 yang dikirim Pengawas, lalu setujui atau kembalikan untuk revisi.'},
      {view:'rekonsiliasi',title:'Rekonsiliasi',desc:'Cocokkan hasil Fase 1 dengan BKU Data, dokumen, temuan, dan tindak lanjut.'},
      {view:'penilaianFase2',title:'Penilaian Fase 2',desc:'DINAS menetapkan hasil akhir setelah rekonsiliasi selesai.'},
      {view:'finalisasiSpj',title:'Finalisasi',desc:'DINAS mengesahkan hasil akhir dan menutup proses SPJ.'},
      {view:'arsipPenilaianV5',title:'Pusat Laporan Penilaian',desc:'Buat rekap semua sekolah, per kecamatan, atau laporan per sekolah beserta 10 lampiran scan.'}
    ]
  };

  const SUPPORT={
    SEKOLAH:[['pesan','Pesan'],['tutorialV5','Panduan'],['ubahPassword','Akun']],
    PENGAWAS:[['pesan','Pesan'],['tutorialV5','Panduan'],['ubahPassword','Akun']],
    DINAS:[['sekolah','Data Sekolah'],['temuan','Temuan'],['pesan','Pesan'],['dbCheck','Validasi Sistem'],['tutorialV5','Panduan']]
  };

  function roleV225(){return String(state?.user?.role||'SEKOLAH').trim().toUpperCase()}
  function flowV225(){return FLOWS[roleV225()]||FLOWS.SEKOLAH}
  function idxV225(view){return flowV225().findIndex(x=>x.view===view)}
  function roleTitleV225(){
    const r=roleV225();
    return r==='DINAS'?'DINAS':r==='PENGAWAS'?'PENGAWAS':'SEKOLAH';
  }
  function nameV225(){
    return state?.user?.nama_pengguna||state?.user?.nama_sekolah||state?.user?.nama||state?.user?.username||'Pengguna';
  }

  window.v225Go=function(view){
    const r=roleV225();
    if(r==='PENGAWAS' && view!=='penugasan' && ['pdfInteraktif','temuan','verifikasiUlang','penilaianFase1'].includes(view) && !state.selectedNpsn){
      toast('Pilih sekolah binaan terlebih dahulu.','warning');
      loadView('penugasan');
      return;
    }
    loadView(view);
  };

  function heroTextV225(){
    const r=roleV225();
    if(r==='SEKOLAH')return {
      kicker:'ALUR SPJ SEKOLAH',
      title:'Kerjakan SPJ secara berurutan',
      desc:'Ikuti tahap yang dibuka DINAS, tetapkan BKU Data, lengkapi BKU Resmi dan bukti, lalu ikuti pemeriksaan serta hasil penilaian.'
    };
    if(r==='PENGAWAS')return {
      kicker:'ALUR PEMERIKSAAN PENGAWAS',
      title:'Satu sekolah, satu alur sampai Fase 1',
      desc:'Periksa BKU dan 10 dokumen, selesaikan temuan, nilai Fase 1, lalu kirim hasil kepada DINAS.'
    };
    return {
      kicker:'ALUR PENGELOLAAN DINAS',
      title:'Kelola SPJ dari kesiapan sampai laporan',
      desc:'Pantau kelengkapan sekolah, setujui Fase 1 Pengawas, lakukan Rekonsiliasi, Penilaian Fase 2, Finalisasi, dan laporan.'
    };
  }

  setHomeRenderer_(async function(){
    const r=roleV225();
    const flow=flowV225();
    const h=heroTextV225();
    const cols=Math.min(flow.length,4);

    let nextIndex=0;
    let homeWorkflow=null;
    if(r==='SEKOLAH'){
      // Jadwal adalah langkah pertama; periode yang sudah dipilih mengarahkan
      // user ke pekerjaan operasional berikutnya tanpa mengubah data/status.
      nextIndex=state.selectedPeriode?1:0;
    }else if(r==='PENGAWAS'){
      // Jadwal tetap terlihat sebagai langkah pertama. Setelah sekolah dipilih,
      // pekerjaan berikutnya adalah Workbench BKU & bukti.
      nextIndex=state.selectedNpsn?2:1;
    }else if(r==='DINAS'){
      // DINAS harus melihat pekerjaan berikutnya berdasarkan stage yang benar-benar ACTIVE.
      homeWorkflow=await safeApi('getWorkflowOverview',{},null);
      const active=String(homeWorkflow?.active_stage||'PERSIAPAN').toUpperCase();
      const stageToIndex={
        PERSIAPAN:0,
        INPUT_SPJ:3,
        PEMERIKSAAN:3,
        PERBAIKAN:3,
        PENILAIAN_1:4,
        REKONSILIASI:5,
        PENILAIAN_2:6,
        FINALISASI:7
      };
      nextIndex=Object.prototype.hasOwnProperty.call(stageToIndex,active)?stageToIndex[active]:0;
    }
    const next=flow[nextIndex]||flow[0];

    const steps=flow.map((x,i)=>`
      <button class="v225-step" onclick="v225Go('${x.view}')">
        <span class="v225-step-num">${String(i+1).padStart(2,'0')}</span>
        <div class="v236-step-copy"><b>${esc(x.title)}</b><span class="v236-step-desc">${esc(x.desc)}</span></div>
      </button>`).join('');

    const support=(SUPPORT[r]||[]).map(x=>`<button onclick="loadView('${x[0]}')">${x[1]}</button>`).join('');

    $('#mainContent').innerHTML=`
      <div class="v225-home">
        <section class="v225-home-hero">
          <img src="${OFFICE_PHOTO}" alt="Kantor Dindikpora Kabupaten Rembang" onerror="this.style.display='none'">
          <div class="v225-home-copy">
            <small>${esc(h.kicker)}</small>
            <h1>${esc(h.title)}</h1>
            <p>Selamat datang, <b>${esc(nameV225())}</b>. ${esc(h.desc)}</p>
          </div>
        </section>

        <section class="v225-home-next">
          <div>
            <small>LANGKAH BERIKUTNYA${r==='DINAS'&&homeWorkflow?.active_stage?` • STAGE ACTIVE: ${esc(homeWorkflow.active_stage)}`:''}</small>
            <strong>${nextIndex+1}. ${esc(next.title)}</strong>
            <div class="muted" style="margin-top:4px">${esc(next.desc)}</div>
          </div>
          <button class="btn btn-primary" onclick="v225Go('${next.view}')">Buka langkah ${nextIndex+1} →</button>
        </section>

        <section id="roleReadinessPanel" class="pipeline-readiness-shell">${loading('Memuat posisi kelengkapan dan penilaian...')}</section>

        <section class="v225-workflow">
          <div class="v225-workflow-head">
            <div>
              <h3>Alur kerja ${esc(roleTitleV225())}</h3>
              <p>Ikuti dari kiri ke kanan. Menu pendukung tidak menjadi bagian dari urutan utama.</p>
            </div>
          </div>
          <div class="v225-steps" style="--v225-cols:${cols}">${steps}</div>
        </section>

        <div class="v225-support">${support}</div>
      </div>`;
    setTimeout(()=>window.renderRoleReadinessPanel?.(),0);
  });

  function buildFlowBarV225(view){
    const flow=flowV225();
    const idx=idxV225(view);
    if(idx<0)return null;

    const cur=flow[idx];
    const prev=idx>0?flow[idx-1]:null;
    const next=idx<flow.length-1?flow[idx+1]:null;

    const bar=document.createElement('div');
    bar.className='v225-flowbar';
    bar.innerHTML=`
      <div class="v225-flow-actions">
        ${prev?`<button class="v225-flow-btn" onclick="v225Go('${prev.view}')">← ${esc(prev.title)}</button>`:`<button class="v225-flow-btn" onclick="loadView('home')">← Beranda</button>`}
      </div>
      <div class="v225-flow-center">
        <span class="v225-flow-kicker">${esc(roleTitleV225())} • LANGKAH ${idx+1} DARI ${flow.length}</span>
        <div class="v225-flow-title"><span class="v225-step-pill">${idx+1}</span>${esc(cur.title)}</div>
      </div>
      <div class="v225-flow-actions">
        ${next?`<button class="v225-flow-btn primary" onclick="v225Go('${next.view}')">Buka: ${esc(next.title)} →</button>`:`<button class="v225-flow-btn primary" onclick="loadView('home')">Selesai • Beranda</button>`}
      </div>`;
    return bar;
  }

  // Post-render hook: exactly one role flow-bar, without wrapping navigation again.
  window.afterViewRenderV237=function(view,c){
    if(!c)return;
    c.querySelectorAll('.v225-flowbar').forEach(x=>x.remove());
    if(view==='home')return;
    const bar=buildFlowBarV225(view);
    if(bar)c.prepend(bar);
  };
})();
</script>

<script id="v232WorkflowEnhancements">
/* ========================================================================== 
   V23.2 — FAST REVIEW + STRUCTURED APPEAL
   - PDF: prefetch adjacent pages (PDF.js internal page cache)
   - Appeal: per-instrument selection + structured reason/decision
   - No database-column changes: payload remains JSON in pesan_koordinasi
   ========================================================================== */
function prefetchInteractivePdfNeighbors_(pdf,currentPage){
  if(!pdf || !Number(pdf.numPages)) return;
  const pages=[Number(currentPage)-1,Number(currentPage)+1]
    .filter(p=>p>=1 && p<=Number(pdf.numPages));
  pages.forEach(p=>{ try{ Promise.resolve(pdf.getPage(p)).catch(()=>{}); }catch(_){} });
}

function appealCategoryLabel_(v){
  const map={
    NILAI_TIDAK_SESUAI:'Nilai tidak sesuai hasil pemeriksaan sekolah',
    BUKTI_TIDAK_TEPAT:'Bukti yang dinilai bukan bukti yang tepat',
    BUKTI_BELUM_DIPERHITUNGKAN:'Bukti/dokumen belum diperhitungkan',
    HALAMAN_BUKTI_TIDAK_TEPAT:'Halaman bukti yang digunakan tidak tepat',
    LAINNYA:'Alasan lainnya'
  };
  return map[String(v||'').toUpperCase()]||String(v||'-').replaceAll('_',' ');
}
function appealDecisionLabel_(v){
  const map={DITERIMA:'Keberatan diterima',DITOLAK:'Nilai dipertahankan',DIPERBAIKI:'Penilaian diperbaiki'};
  return map[String(v||'').toUpperCase()]||String(v||'-').replaceAll('_',' ');
}
function closeAppealModalV232(){ document.getElementById('v232AppealModal')?.remove(); }
function closeAppealDecisionModalV232(){ document.getElementById('v232AppealDecisionModal')?.remove(); }

async function getAppealIndicatorsV232_(idAsesmen){
  const row=(window.__appealRows||[]).find(x=>String(x.id_asesmen)===String(idAsesmen))||{};
  try{
    const r=await api('hitungIndikatorDariTemuan',{
      idPeriode:row.id_periode||state.selectedPeriode||'',
      npsn:row.npsn||ownNpsn()||'',
      idAsesmen:idAsesmen
    });
    const data=Array.isArray(r?.data)?r.data:[];
    if(data.length) return data;
  }catch(e){ console.warn('Instrumen keberatan fallback:',e); }
  const names=[
    'Buku Kas Umum (BKU)','Buku Pembantu Bank','Buku Pembantu Kas Tunai','Buku Pembantu Pajak',
    'Rekening Koran Bank','Invoice / Nota / Kuitansi','Bukti Pendukung Lainnya','SSP Pajak Pusat',
    'SSP Pajak Daerah','Foto / Dokumentasi'
  ];
  const weights=[10,8,8,8,10,20,12,8,6,10];
  return names.map((nama,i)=>({id_indikator:'',no_instrumen:i+1,kode_indikator:'I'+String(i+1).padStart(2,'0'),nama_indikator:nama,bobot:weights[i],skor:''}));
}

window.ajukanKeberatan=async function(idAsesmen){
  document.getElementById('v232AppealModal')?.remove();
  const indicators=await getAppealIndicatorsV232_(idAsesmen);
  const row=(window.__appealRows||[]).find(x=>String(x.id_asesmen)===String(idAsesmen))||{};
  const modal=document.createElement('div');
  modal.id='v232AppealModal'; modal.className='simple-modal';
  modal.innerHTML=`<div class="simple-modal-card v232-appeal-card">
    <div class="v232-modal-head"><div><span class="v232-eyebrow">KEBERATAN PENILAIAN</span><h3>Pilih bagian yang perlu dikaji ulang</h3><p>Nilai saat ini <b>${esc(row.nilai_akhir??'-')}</b>. Pilih minimal satu instrumen agar Pengawas langsung mengetahui objek keberatan.</p></div><button class="v232-close" type="button" onclick="closeAppealModalV232()">×</button></div>
    <div class="v232-instrument-grid">${indicators.map((d,i)=>{
      const no=Number(d.no_instrumen||i+1),score=(d.skor===null||d.skor===''||d.skor===undefined)?'—':Number(d.skor).toFixed(2);
      return `<label class="v232-instrument-choice"><input type="checkbox" class="v232-appeal-ind" data-json="${esc(JSON.stringify({id_indikator:d.id_indikator||'',no_instrumen:no,kode_indikator:d.kode_indikator||'',nama_indikator:d.nama_indikator||'',skor_sebelum:d.skor??'',bobot:d.bobot_efektif??d.bobot??''}))}"><span><b>${no}. ${esc(d.nama_indikator||d.kode_indikator||'Instrumen')}</b><small>Skor ${esc(score)}/4 • Bobot ${esc(d.bobot_efektif??d.bobot??'-')}%</small></span></label>`;
    }).join('')}</div>
    <div class="field"><label>Jenis keberatan</label><select id="v232AppealCategory"><option value="NILAI_TIDAK_SESUAI">Nilai tidak sesuai hasil pemeriksaan sekolah</option><option value="BUKTI_TIDAK_TEPAT">Bukti yang dinilai bukan bukti yang tepat</option><option value="BUKTI_BELUM_DIPERHITUNGKAN">Bukti/dokumen belum diperhitungkan</option><option value="HALAMAN_BUKTI_TIDAK_TEPAT">Halaman bukti yang digunakan tidak tepat</option><option value="LAINNYA">Lainnya</option></select></div>
    <div class="field" style="margin-top:12px"><label>Penjelasan Sekolah</label><textarea id="v232AppealReason" rows="4" maxlength="1200" placeholder="Jelaskan secara singkat apa yang perlu dikaji ulang dan bukti yang mendukung."></textarea><small class="muted">Minimal 10 karakter. Gunakan fakta dan bukti yang dapat diperiksa Pengawas.</small></div>
    <div id="v232AppealMsg" style="margin-top:10px"></div>
    <div class="simple-modal-actions"><button class="btn btn-light" type="button" onclick="closeAppealModalV232()">Batal</button><button id="v232AppealSubmit" class="btn btn-primary" type="button">Kirim Keberatan</button></div>
  </div>`;
  document.body.appendChild(modal);
  $('#v232AppealSubmit').onclick=async()=>{
    const selected=[...document.querySelectorAll('.v232-appeal-ind:checked')].map(el=>{try{return JSON.parse(el.dataset.json||'{}')}catch(_){return {}}});
    const alasan=$('#v232AppealReason')?.value?.trim()||'';
    const kategori=$('#v232AppealCategory')?.value||'LAINNYA';
    const box=$('#v232AppealMsg');
    if(!selected.length){box.innerHTML=msg('Pilih minimal satu instrumen yang dipersoalkan.','warning');return;}

    const btn=$('#v232AppealSubmit');btn.disabled=true;btn.textContent='Mengirim...';
    try{
      await api('ajukanKeberatanPenilaian',{data:{id_asesmen:idAsesmen,kategori_alasan:kategori,instrumen_keberatan:selected,alasan}});
      toast('Keberatan berhasil dikirim. Pengawas akan melihat instrumen yang Anda pilih.','ok',4500);
      closeAppealModalV232(); await renderKeberatanList();
    }catch(e){box.innerHTML=msg(errorText(e),'error');btn.disabled=false;btn.textContent='Kirim Keberatan';}
  };
};

window.selesaikanKajiUlang=async function(idPesan){
  document.getElementById('v232AppealDecisionModal')?.remove();
  const row=(window.__appealRows||[]).find(x=>String(x.id_pesan)===String(idPesan))||{};
  const chosen=(row.instrumen_keberatan||[]).map(x=>`<span class="v232-chip">${esc((x.no_instrumen?x.no_instrumen+'. ':'')+(x.nama_indikator||x.kode_indikator||'Instrumen'))}${x.skor_sebelum!==''&&x.skor_sebelum!=null?' • '+esc(Number(x.skor_sebelum).toFixed(2))+'/4':''}</span>`).join('');
  const modal=document.createElement('div');modal.id='v232AppealDecisionModal';modal.className='simple-modal';
  modal.innerHTML=`<div class="simple-modal-card v232-appeal-card"><div class="v232-modal-head"><div><span class="v232-eyebrow">SELESAIKAN KAJI ULANG</span><h3>Catat keputusan Pengawas</h3><p>${esc(appealCategoryLabel_(row.kategori_alasan))}</p></div><button class="v232-close" onclick="closeAppealDecisionModalV232()">×</button></div>
    ${chosen?`<div class="v232-chip-row">${chosen}</div>`:''}
    <div class="v232-school-reason"><b>Alasan Sekolah</b><p>${esc(row.alasan||'-')}</p></div>
    <div class="field"><label>Keputusan</label><select id="v232AppealDecision"><option value="">-- Pilih keputusan --</option><option value="DITERIMA">Keberatan diterima</option><option value="DIPERBAIKI">Penilaian diperbaiki</option><option value="DITOLAK">Nilai sebelumnya dipertahankan</option></select></div>
    <div class="field" style="margin-top:12px"><label>Tanggapan Pengawas</label><textarea id="v232AppealResponse" rows="4" maxlength="1200" placeholder="Tuliskan dasar keputusan berdasarkan bukti dan hasil kaji ulang."></textarea><small class="muted">Minimal 10 karakter agar jejak audit mudah dipahami.</small></div>
    <div id="v232AppealDecisionMsg" style="margin-top:10px"></div>
    <div class="simple-modal-actions"><button class="btn btn-light" onclick="closeAppealDecisionModalV232()">Batal</button><button id="v232AppealDecisionSubmit" class="btn btn-primary">Selesaikan Kaji Ulang</button></div></div>`;
  document.body.appendChild(modal);
  $('#v232AppealDecisionSubmit').onclick=async()=>{
    const keputusan=$('#v232AppealDecision')?.value||'',tanggapan=$('#v232AppealResponse')?.value?.trim()||'',box=$('#v232AppealDecisionMsg');
    if(!keputusan){box.innerHTML=msg('Pilih keputusan kaji ulang.','warning');return;}
    if(tanggapan.length<10){box.innerHTML=msg('Tanggapan Pengawas minimal 10 karakter.','warning');return;}
    const btn=$('#v232AppealDecisionSubmit');btn.disabled=true;btn.textContent='Menyelesaikan...';
    try{
      const r=await api('selesaikanKajiUlangKeberatan',{data:{id_pesan:idPesan,keputusan,tanggapan_pengawas:tanggapan}});
      toast(`Kaji ulang selesai. Nilai akhir: ${r.nilai_akhir??'-'}`,'ok',5000); closeAppealDecisionModalV232(); await renderKeberatanList();
    }catch(e){box.innerHTML=msg(errorText(e),'error');btn.disabled=false;btn.textContent='Selesaikan Kaji Ulang';}
  };
};
</script>

<script id="v236UserReadinessLogic">
/* ==========================================================================
   V23.6 — MANAJEMEN USER & KESIAPAN REGISTRASI
   ========================================================================== */
window._userReadinessData = null;
window._userReadinessFilter = 'ALL';
window._userReadinessQuery = '';

function readinessUserBadge(status){
  const st=String(status||'BELUM_MENDAFTAR').toUpperCase();
  const meta={SIAP:['SIAP','success'],BELUM_MENDAFTAR:['BELUM DAFTAR','warning'],NONAKTIF:['NONAKTIF','danger'],DUPLIKAT:['DUPLIKAT','danger']}[st]||[st,'info'];
  return badge(meta[0],meta[1]);
}
function readinessPct(v){return Math.max(0,Math.min(100,Number(v||0))).toFixed(1)+'%';}
function readinessDate(v){if(!v)return'-';try{return formatTanggalPenugasan(v)||'-';}catch(_){return String(v||'-');}}

async function manajemenUserView(){
  const c=$('#mainContent'); if(!c)return;
  if(!isDinas()){c.innerHTML=msg('Modul Manajemen User hanya tersedia untuk DINAS.','warning');return;}
  c.innerHTML=head('Manajemen User & Kesiapan','Pastikan seluruh sekolah dan pengawas resmi sudah memiliki satu akun aktif sebelum pendelegasian dimulai.')+
    `<div id="userReadinessPage">${loading('Menghitung kesiapan akun...')}</div>`;
  await reloadUserReadiness();
}

async function reloadUserReadiness(){
  const host=$('#userReadinessPage'); if(host)host.innerHTML=loading('Menghitung kesiapan akun...');
  try{
    const year=Number(window._workflowSelectedYear||0)||undefined;
    const r=await api('getUserReadiness',year?{tahun:year}:{});
    window._userReadinessData=r;
    window._workflowSelectedYear=Number(r.year||window._workflowSelectedYear||new Date().getFullYear());
    renderUserReadiness();
  }catch(e){if(host)host.innerHTML=msg(errorText(e));}
}

function renderUserReadiness(){
  const host=$('#userReadinessPage'),r=window._userReadinessData;if(!host||!r)return;
  const sum=r.summary||{},s=sum.schools||{},p=sum.pengawas||{};
  const allReady=!!sum.all_ready,completed=!!sum.registration_completed;
  const pengawasConfigured=!!sum.pengawas_target_configured;
  const completionClass=completed?'complete':allReady?'ready':'waiting';
  const completionLabel=completed?'PENDAFTARAN SELESAI':allReady?'SEMUA AKUN SIAP':'BELUM LENGKAP';
  const orphanCount=(r.orphan_school_accounts||[]).length+(r.orphan_pengawas_accounts||[]).length;
  host.innerHTML=`
    <section class="ur-hero ${completionClass}">
      <div><span>TAHUN OPERASIONAL ${fmtNum(r.year||0)}</span><h2>Kesiapan Registrasi Pengguna</h2><p>Target sekolah diambil dari NPSN unik master sekolah. Target pengawas diambil dari master NIP pengawas DINAS.</p></div>
      <div class="ur-state"><small>STATUS</small><strong>${esc(completionLabel)}</strong><span>${completed?'Tahap pendelegasian dapat dilanjutkan.':allReady?'DINAS dapat menyatakan pendaftaran selesai.':'Lengkapi akun yang masih bermasalah.'}</span></div>
    </section>
    <section class="ur-summary-grid">
      ${userReadinessSummaryCard('🏫','SEKOLAH',s)}
      ${userReadinessSummaryCard('🧑‍💼','PENGAWAS',p,!pengawasConfigured)}
      <article class="ur-summary-card"><small>KONTROL REGISTRASI</small><strong>${completed?'TERKUNCI SELESAI':'MASIH TERBUKA'}</strong><span>${completed_at_text(sum.registration_completed_at)}</span><div class="ur-card-action"><button class="btn ${completed?'btn-light':'btn-primary'} btn-sm" ${(!completed&&!allReady)?'disabled':''} onclick="toggleRegistrationCompletionUI()">${completed?'↩ Buka Kembali':'✓ Nyatakan Selesai'}</button></div></article>
      <article class="ur-summary-card ${orphanCount?'warn':''}"><small>ANOMALI IDENTITAS</small><strong>${fmtNum(orphanCount)}</strong><span>Akun di luar master resmi</span><div class="ur-card-action">${orphanCount?'<span class="badge badge-warning">Perlu diperiksa</span>':'<span class="badge badge-success">Bersih</span>'}</div></article>
    </section>
    ${!pengawasConfigured?`<div class="message error"><b>Master pengawas belum diisi.</b> Tambahkan daftar NIP pengawas resmi agar sistem dapat mengetahui target registrasi pengawas secara pasti.</div>`:''}
    <section class="panel ur-toolbar">
      <div><b>Daftar Kesiapan</b><div class="muted">Gunakan filter untuk menemukan akun yang belum mendaftar, nonaktif, atau duplikat.</div></div>
      <div class="ur-toolbar-actions"><select id="urFilter" onchange="setUserReadinessFilter(this.value)"><option value="ALL">Semua status</option><option value="BELUM_MENDAFTAR">Belum mendaftar</option><option value="NONAKTIF">Nonaktif</option><option value="DUPLIKAT">Duplikat</option><option value="SIAP">Siap</option></select><input id="urSearch" placeholder="🔍 Cari NPSN, NIP, nama, kecamatan..." oninput="setUserReadinessQuery(this.value)"><button class="btn btn-primary" onclick="openMasterPengawasModal()">+ Master Pengawas</button></div>
    </section>
    <section class="ur-two-col">
      <div class="panel"><div class="ur-section-head"><div><small>SEKOLAH</small><h3>Registrasi Akun Sekolah</h3></div><span>${fmtNum(s.ready||0)} / ${fmtNum(s.target||0)}</span></div><div id="urSchoolsTable"></div></div>
      <div class="panel"><div class="ur-section-head"><div><small>PENGAWAS</small><h3>Registrasi Akun Pengawas</h3></div><span>${fmtNum(p.ready||0)} / ${fmtNum(p.target||0)}</span></div><div id="urPengawasTable"></div></div>
    </section>
    <section class="panel" style="margin-top:14px"><div class="ur-section-head"><div><small>MASTER RESMI</small><h3>Daftar NIP Pengawas DINAS</h3></div><button class="btn btn-light btn-sm" onclick="openMasterPengawasModal()">+ Tambah</button></div><div id="urMasterPengawasTable"></div></section>
    ${renderUserReadinessOrphans(r)}
  `;
  const filter=$('#urFilter');if(filter)filter.value=window._userReadinessFilter||'ALL';
  const search=$('#urSearch');if(search)search.value=window._userReadinessQuery||'';
  renderUserReadinessTables();
}

function completed_at_text(v){return v?'Ditetapkan '+readinessDate(v):'Belum dinyatakan selesai';}
function userReadinessSummaryCard(icon,label,x,notConfigured){
  x=x||{};const target=Number(x.target||0),ready=Number(x.ready||0),missing=Number(x.missing||0),inactive=Number(x.inactive||0),dup=Number(x.duplicates||0);
  return `<article class="ur-summary-card ${notConfigured?'warn':''}"><small>${icon} ${esc(label)}</small><strong>${fmtNum(ready)} / ${fmtNum(target)}</strong><span>${notConfigured?'Target belum dikonfigurasi':readinessPct(x.progress)+' siap'}</span><div class="ur-progress"><i style="width:${Math.max(0,Math.min(100,Number(x.progress||0)))}%"></i></div><div class="ur-mini"><span>Belum ${fmtNum(missing)}</span><span>Nonaktif ${fmtNum(inactive)}</span><span>Duplikat ${fmtNum(dup)}</span></div></article>`;
}

function setUserReadinessFilter(v){window._userReadinessFilter=String(v||'ALL');renderUserReadinessTables();}
function setUserReadinessQuery(v){window._userReadinessQuery=String(v||'').trim().toLowerCase();renderUserReadinessTables();}
function readinessRowVisible(x){
  const f=window._userReadinessFilter||'ALL',q=window._userReadinessQuery||'';
  if(f!=='ALL'&&String(x.readiness||'').toUpperCase()!==f)return false;
  if(!q)return true;
  return Object.values(x||{}).some(v=>String(v??'').toLowerCase().includes(q));
}
function renderUserReadinessTables(){
  const r=window._userReadinessData;if(!r)return;
  const schools=(r.schools||[]).filter(readinessRowVisible);
  const pengawas=(r.pengawas||[]).filter(readinessRowVisible);
  const sHost=$('#urSchoolsTable'),pHost=$('#urPengawasTable'),mHost=$('#urMasterPengawasTable');
  if(sHost)sHost.innerHTML=`<div class="table-wrap ur-table"><table class="friendly-table"><thead><tr><th>NPSN / Sekolah</th><th>Akun</th><th>Status</th><th>Login Terakhir</th><th>Aksi</th></tr></thead><tbody>${schools.map(x=>`<tr><td><b>${esc(x.npsn)}</b><div>${esc(x.nama_sekolah||'-')}</div><small>${esc(x.kecamatan||'-')}</small></td><td>${x.username?`<code>${esc(x.username)}</code><small>${esc(x.nama_pengguna||'')}</small>`:'-'}</td><td>${readinessUserBadge(x.readiness)}</td><td>${esc(readinessDate(x.last_login))}</td><td>${managedUserAction(x)}</td></tr>`).join('')||emptyRow(5,'Tidak ada sekolah sesuai filter.')}</tbody></table></div>`;
  if(pHost)pHost.innerHTML=`<div class="table-wrap ur-table"><table class="friendly-table"><thead><tr><th>NIP / Pengawas</th><th>Akun</th><th>Status</th><th>Login Terakhir</th><th>Aksi</th></tr></thead><tbody>${pengawas.map(x=>`<tr><td><b>${esc(x.nip)}</b><div>${esc(x.nama_pengawas||'-')}</div></td><td>${x.username?`<code>${esc(x.username)}</code><small>${esc(x.nama_pengguna||'')}</small>`:'-'}</td><td>${readinessUserBadge(x.readiness)}</td><td>${esc(readinessDate(x.last_login))}</td><td>${managedUserAction(x)}</td></tr>`).join('')||emptyRow(5,'Tidak ada pengawas sesuai filter.')}</tbody></table></div>`;
  const master=(r.master_pengawas_all||[]);
  if(mHost)mHost.innerHTML=`<div class="table-wrap ur-table"><table class="friendly-table"><thead><tr><th>NIP</th><th>Nama</th><th>Status Master</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody>${master.map(x=>`<tr><td><code>${esc(x.nip)}</code></td><td><b>${esc(x.nama_pengawas||'-')}</b></td><td>${badge(x.master_status||'AKTIF',(x.master_status||'AKTIF')==='AKTIF'?'success':'danger')}</td><td>${esc(x.catatan||'-')}</td><td><div class="ur-actions"><button class="btn btn-light btn-sm" onclick="openMasterPengawasModal('${esc(x.nip)}')">Edit</button><button class="btn btn-light btn-sm" onclick="toggleMasterPengawasStatusUI('${esc(x.nip)}','${(x.master_status||'AKTIF')==='AKTIF'?'NONAKTIF':'AKTIF'}')">${(x.master_status||'AKTIF')==='AKTIF'?'Nonaktifkan':'Aktifkan'}</button></div></td></tr>`).join('')||emptyRow(5,'Belum ada master pengawas.')}</tbody></table></div>`;
}
function managedUserAction(x){
  if(!x.user_id)return '<span class="muted">Menunggu registrasi</span>';
  const active=String(x.account_status||'').toUpperCase()==='AKTIF';
  return `<div class="ur-actions"><button class="btn btn-light btn-sm" onclick="toggleManagedUserStatusUI('${esc(x.user_id)}','${active?'NONAKTIF':'AKTIF'}')">${active?'Nonaktifkan':'Aktifkan Kembali'}</button><button class="btn btn-light btn-sm" onclick="openManagedUserPasswordReset('${esc(x.user_id)}')">Reset Password</button></div>`;
}
function renderUserReadinessOrphans(r){
  const s=r.orphan_school_accounts||[],p=r.orphan_pengawas_accounts||[];if(!s.length&&!p.length)return'';
  return `<section class="panel ur-orphans"><div class="ur-section-head"><div><small>ANOMALI</small><h3>Akun yang tidak cocok dengan master</h3></div></div>${s.length?`<p><b>Sekolah:</b> ${s.map(x=>esc(x.npsn)).join(', ')}</p>`:''}${p.length?`<p><b>Pengawas:</b> ${p.map(x=>esc(x.nip)).join(', ')}</p>`:''}</section>`;
}

window.openMasterPengawasModal=function(nip=''){
  const r=window._userReadinessData||{},row=(r.master_pengawas_all||[]).find(x=>String(x.nip)===String(nip))||{};
  const wrap=document.createElement('div');wrap.id='masterPengawasModal';wrap.className='workflow-modal-backdrop';
  wrap.innerHTML=`<div class="workflow-modal-card" style="width:min(520px,96vw)"><h3>${nip?'Edit':'Tambah'} Master Pengawas</h3><div class="field"><label>NIP (18 digit)</label><input id="mpNip" value="${esc(row.nip||'')}" ${nip?'readonly':''} placeholder="198001012005011001"></div><div class="field"><label>Nama Pengawas</label><input id="mpNama" value="${esc(row.nama_pengawas||'')}" placeholder="Nama lengkap dan gelar"></div><div class="field"><label>Catatan</label><textarea id="mpCatatan" rows="3" placeholder="Opsional">${esc(row.catatan||'')}</textarea></div><div id="mpMsg"></div><div class="workflow-modal-actions"><button class="btn btn-light" onclick="$('#masterPengawasModal').remove()">Batal</button><button class="btn btn-primary" onclick="saveMasterPengawasUI()">Simpan</button></div></div>`;
  document.body.appendChild(wrap);
};
window.saveMasterPengawasUI=async function(){
  try{
    const nip=$('#mpNip').value.trim(),nama=$('#mpNama').value.trim(),catatan=$('#mpCatatan').value.trim();
    await api('saveMasterPengawas',{data:{nip,nama_pengawas:nama,catatan,status:'AKTIF'}});
    $('#masterPengawasModal')?.remove();toast('Master pengawas tersimpan.','ok');await reloadUserReadiness();
  }catch(e){const box=$('#mpMsg');if(box)box.innerHTML=msg(errorText(e));else toast(errorText(e),'error');}
};
window.toggleMasterPengawasStatusUI=async function(nip,status){
  if(!confirm(`${status==='AKTIF'?'Aktifkan':'Nonaktifkan'} NIP ${nip} pada master pengawas?`))return;
  try{await api('setMasterPengawasStatus',{data:{nip,status}});toast('Status master pengawas diperbarui.','ok');await reloadUserReadiness();}catch(e){toast(errorText(e),'error');}
};
window.toggleManagedUserStatusUI=async function(userId,status){
  let alasan='';if(status==='NONAKTIF'){alasan=prompt('Alasan menonaktifkan akun:','')||'';if(!alasan.trim())return;}
  try{await api('setManagedUserStatus',{data:{user_id:userId,status,alasan}});toast('Status akun diperbarui.','ok');await reloadUserReadiness();}catch(e){toast(errorText(e),'error');}
};
window.openManagedUserPasswordReset=function(userId){
  const r=window._userReadinessData||{};
  const all=[...(r.schools||[]),...(r.pengawas||[])];
  const row=all.find(x=>String(x.user_id||'')===String(userId))||{};
  const label=row.nama_sekolah||row.nama_pengawas||row.nama_pengguna||row.username||'pengguna';
  const wrap=document.createElement('div');wrap.id='managedUserPasswordModal';wrap.className='workflow-modal-backdrop';
  wrap.innerHTML=`<div class="workflow-modal-card account-reset-modal"><div class="account-reset-head"><div><small>ADMINISTRASI AKUN</small><h3>Reset Password</h3><p>${esc(label)}${row.username?` · ${esc(row.username)}`:''}</p></div><button type="button" class="account-reset-close" onclick="$('#managedUserPasswordModal').remove()" aria-label="Tutup">×</button></div><div class="field"><label>Password Baru</label><input id="managedNewPassword" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></div><div class="field"><label>Konfirmasi Password Baru</label><input id="managedConfirmPassword" type="password" autocomplete="new-password" placeholder="Ulangi password baru"></div><div class="message warning account-reset-note">Reset tidak membuat akun baru. NPSN/NIP dan seluruh histori akun tetap sama.</div><div id="managedPasswordMsg"></div><div class="workflow-modal-actions"><button class="btn btn-light" onclick="$('#managedUserPasswordModal').remove()">Batal</button><button class="btn btn-primary" onclick="submitManagedUserPasswordReset('${esc(userId)}')">Simpan Password Baru</button></div></div>`;
  document.body.appendChild(wrap);
  setTimeout(()=>$('#managedNewPassword')?.focus(),0);
};
window.submitManagedUserPasswordReset=async function(userId){
  const password=$('#managedNewPassword')?.value||'',confirmPw=$('#managedConfirmPassword')?.value||'',box=$('#managedPasswordMsg');
  if(password.length<6){if(box)box.innerHTML=msg('Password baru minimal 6 karakter.');return;}
  if(password!==confirmPw){if(box)box.innerHTML=msg('Konfirmasi password baru tidak sama.');return;}
  try{
    await api('resetManagedUserPassword',{data:{user_id:userId,password_baru:password}});
    $('#managedUserPasswordModal')?.remove();
    toast('Password akun berhasil direset.','ok');
  }catch(e){if(box)box.innerHTML=msg(errorText(e));else toast(errorText(e),'error');}
};

window.toggleRegistrationCompletionUI=async function(){
  const r=window._userReadinessData||{},sum=r.summary||{},completed=!!sum.registration_completed;
  let reason='';
  if(completed){reason=prompt('Alasan membuka kembali pendaftaran (wajib):','')||'';if(!reason.trim())return;}
  else if(!confirm('Semua akun sudah siap. Nyatakan pendaftaran selesai dan lanjutkan ke tahap pendelegasian?'))return;
  try{await api('setRegistrationCompletion',{data:{tahun:r.year,completed:!completed,reason}});toast(completed?'Pendaftaran dibuka kembali.':'Pendaftaran dinyatakan selesai.','ok');await reloadUserReadiness();}catch(e){toast(errorText(e),'error');}
};
</script>
