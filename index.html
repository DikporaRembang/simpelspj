<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPEL SPJ — Kabupaten Rembang</title>
<style>
:root{
  --primary:#0f5132;--primary-2:#146c43;--primary-3:#198754;
  --accent:#f0a500;--bg:#f5f8f6;--surface:#fff;--surface-2:#edf5ef;
  --text:#18231d;--muted:#66736b;--border:#dbe6de;--danger:#b42318;--success:#198754;
  --shadow:0 14px 40px rgba(20,50,34,.10);--radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}

/* Brand & Logos */
.brand{display:flex;align-items:center;gap:12px}
.app-logo{width:46px;height:46px;object-fit:contain;border-radius:12px;background:#fff;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.brand h2{font-size:1.08rem;margin:0}
.brand small{color:var(--muted)}

.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:750;transition:.18s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-2)}
.btn-secondary{background:#e6f2e9;color:var(--primary)}
.btn-light{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fee4e2;color:var(--danger)}
.btn-sm{padding:6px 10px;min-height:32px;font-size:.8rem;border-radius:8px}
.full{width:100%}

/* Landing / login dengan Background Kantor Dindikpora */
.auth{
  min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);
  background: 
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.16),transparent 30%),
    linear-gradient(135deg,#0b3d27,#12643d 58%,#198754);
}
.auth-side{color:#fff;padding:clamp(28px,6vw,84px);display:flex;flex-direction:column;justify-content:space-between}
.auth-side-inner{max-width:700px;margin:auto 0}
.auth-side h1{font-size:clamp(2rem,4.5vw,4.4rem);line-height:1.02;margin:26px 0 18px;letter-spacing:-1.5px}
.auth-side p{max-width:620px;line-height:1.75;color:#e9f6ed;font-size:1.02rem}
.feature{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:30px}
.feature span{display:flex;gap:10px;align-items:center;padding:13px 15px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);border-radius:15px;font-size:.9rem}

/* Footer Logos */
.auth-footer-logos{display:flex;align-items:center;gap:16px;margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.2);flex-wrap:wrap}
.footer-logo-item{display:flex;align-items:center;gap:10px}
.footer-logo-item img{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.footer-logo-item div span{display:block;font-size:.76rem;font-weight:700;color:#fff;line-height:1.2}
.footer-logo-item div small{font-size:.66rem;color:#d4edda}

.auth-panel{display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,40px);background:rgba(248,251,249,.96)}
.auth-card{width:min(100%,480px);background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:26px;padding:clamp(22px,4vw,38px);box-shadow:var(--shadow)}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf3ee;padding:4px;border-radius:14px;margin:18px 0}
.tabs button{border:0;background:transparent;padding:11px;border-radius:10px;color:var(--muted);font-weight:700}
.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 9px rgba(0,0,0,.07)}

.field{margin:13px 0}
.field label{display:block;font-size:.86rem;font-weight:750;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:13px;padding:12px 13px;outline:0;background:#fff;min-height:44px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-3);box-shadow:0 0 0 3px rgba(25,135,84,.12)}
.password-wrap{position:relative}.password-wrap input{padding-right:50px}
.toggle-pass{position:absolute;right:6px;top:4px;border:0;background:transparent;padding:9px;color:var(--muted)}
.message{padding:11px 13px;border-radius:13px;margin:12px 0;font-size:.9rem}
.message.error{background:#fff0ef;color:var(--danger)}.message.ok{background:#e9f8ef;color:#146c43}

/* Application shell */
.dashboard{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:11px clamp(14px,3vw,34px)
}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{background:linear-gradient(180deg,#0c4229,#0a3522);color:#dff3e5;padding:18px 12px;display:flex;flex-direction:column;justify-content:space-between}
.nav-group{display:flex;flex-direction:column}
.nav-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:#8ab59b;margin:14px 0 6px 10px;font-weight:800}
.nav-btn{
  width:100%;text-align:left;border:0;background:transparent;color:#dceee2;padding:12px 13px;
  border-radius:12px;margin:3px 0;font-weight:650;display:flex;align-items:center;gap:9px
}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.12);color:#fff}

.sidebar-footer{padding-top:14px;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:8px}
.sidebar-logo-row{display:flex;align-items:center;gap:8px}
.sidebar-logo-row img{width:28px;height:28px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.sidebar-logo-row div span{display:block;font-size:.7rem;color:#fff;line-height:1.2;font-weight:700}

.content{padding:clamp(16px,3vw,34px);min-width:0;max-width:1500px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{margin:0;font-size:clamp(1.45rem,3vw,2.15rem);letter-spacing:-.5px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat,.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:1.65rem;margin-top:7px}
.panel{padding:18px;margin-top:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:650px;font-size:.88rem}
th,td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:#f0f6f2;color:#31523d;white-space:nowrap}
pre{white-space:pre-wrap;word-break:break-word;background:#102018;color:#d7f5df;border-radius:13px;padding:14px;max-height:430px;overflow:auto}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.form-grid .full-col{grid-column:1/-1}
.section-title{font-weight:800;margin:20px 0 10px;color:var(--primary)}
.mobile-menu{display:none}

@media (max-width:1050px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:72px;bottom:0;width:min(84vw,310px);z-index:45;
    transform:translateX(-105%);transition:transform .22s;box-shadow:20px 0 40px rgba(0,0,0,.12)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:inline-flex;align-items:center;justify-content:center}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:22px}
}
@media (max-width:640px){
  .topbar{padding:10px 12px}.topbar .app-logo{width:36px;height:36px}
  .topbar .brand h2{font-size:.96rem}.top-actions .user-name{display:none}
  .layout{min-height:calc(100vh - 62px)}
  .sidebar{top:62px}
  .content{padding:13px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:14px;border-radius:16px}.stat strong{font-size:1.2rem}
  .panel{padding:14px;border-radius:16px;margin-top:13px}
  .form-grid{grid-template-columns:1fr}.form-grid .full-col{grid-column:auto}
  .page-head{margin-bottom:14px}.page-head h1{font-size:1.35rem}
  .btn{padding:10px 13px;min-height:42px}
  .auth-panel{padding:10px}.auth-card{padding:20px;border-radius:20px}
  .feature{grid-template-columns:1fr}
  .auth-side{display:flex;padding:24px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbyWvJXKr1QZ1zwbeJDoULTUihycj1771SsDlGFy8jnuF4i3DsEbHXlcJU48VDAg17fqDA/exec';

/* Role-Based Guidance: Panduan Berbasis Peran (Zero Friction) */
const ROLE_RULES={
  SEKOLAH:['home','rkas','dokumen','transaksi','crosscheck','temuan'],
  DINAS:['home','verifikasiDinas','sekolah','penugasan','dbcheck','master','rkas','dokumen','transaksi','crosscheck'],
  PENGAWAS:['home','sekolah','penugasan','crosscheck','temuan','asesmen','master']
};

const state={token:sessionStorage.getItem('simpel_token')||'',user:null,view:'home',captchaAns:0};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));
function msg(text,type='error'){return `<div class="message ${type}">${esc(text)}</div>`}

async function api(action,payload={}){
  const body={action,...payload}; if(state.token) body.token=state.token;
  if(API_URL.startsWith('PASTE_')) throw new Error('URL Web App Apps Script belum diisi.');
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const data=await r.json(); if(!data.success)throw new Error(data.message||'Permintaan gagal'); return data;
}

function passwordToggle(id){const el=document.getElementById(id);if(el)el.type=el.type==='password'?'text':'password'}

function generateMathCaptcha(){
  const n1 = Math.floor(Math.random() * 8) + 2;
  const n2 = Math.floor(Math.random() * 8) + 2;
  const ops = ['+', '-'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  state.captchaAns = op === '+' ? n1 + n2 : n1 - n2;
  return `Berapakah hasil dari ${n1} ${op} ${n2} ?`;
}

function authView(mode='login',notice=''){
 const login=mode==='login';
 const qText = generateMathCaptcha();
 $('#app').innerHTML=`<main class="auth"><section class="auth-side"><div class="auth-side-inner"><div class="brand"><img src="bidangsd.png" class="app-logo" alt="Logo"><div><h2 style="color:#fff">SIMPEL SPJ</h2><small style="color:#d9eee0">Kabupaten Rembang</small></div></div><h1>Pengelolaan SPJ BOS SD terintegrasi.</h1><p>Kelola RKAS, dokumen SPJ, transaksi, pemeriksaan, temuan, hingga asesmen mutu dengan prinsip minim hambatan sesuai peran Anda.</p><div class="feature"><span>✓ Peran Berbasis Panduan</span><span>✓ Verifikasi Usulan Dinas</span><span>✓ Asesmen Indikator SPJ</span><span>✓ Responsif & Ringan</span></div></div><div class="auth-footer-logos"><div class="footer-logo-item"><img src="logorembang.png" alt="Rembang"><div><span>Dindikpora Kab. Rembang</span><small>Kabupaten Rembang</small></div></div><div class="footer-logo-item"><img src="logopendidikan.png" alt="Kemdikdasmen"><div><span>Direktorat SD Kemdikdasmen</span><small>Pembinaan Sekolah Dasar</small></div></div></div></section><section class="auth-panel"><div class="auth-card"><div class="brand"><img src="bidangsd.png" class="app-logo" alt="Logo"><div><h2>SIMPEL SPJ</h2><small>Masuk ke sistem</small></div></div><div class="tabs"><button class="${login?'active':''}" id="tabLogin">Masuk</button><button class="${!login?'active':''}" id="tabRegister">Pendaftaran</button></div>${notice}<div id="authBody"></div></div></section></main>`;
 $('#tabLogin').onclick=()=>authView('login');$('#tabRegister').onclick=()=>authView('register');
 $('#authBody').innerHTML=login?loginForm(qText):registerForm(qText);
}

function loginForm(qText){
  return `<form id="loginForm">
    <div class="field"><label>Username / NPSN</label><input id="username" autocomplete="username" required placeholder="Masukkan username atau NPSN"></div>
    <div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"><button type="button" class="toggle-pass" onclick="passwordToggle('password')">👁</button></div></div>
    <div class="field"><label>Verifikasi Keamanan (${qText})</label><input id="captchaInput" type="number" required placeholder="Masukkan jawaban angka"></div>
    <div id="authMsg"></div>
    <button class="btn btn-primary full" type="submit" id="loginBtn" style="margin-top:14px">Masuk</button>
  </form>`;
}

function registerForm(qText){
  return `<div class="message" style="background:#fff7ed;color:#9a3412">Pendaftaran akun mandiri divalidasi oleh administrator Dinas Kabupaten.</div>
  <form onsubmit="event.preventDefault();$('#registerMsg').innerHTML=msg('Pendaftaran belum aktif. Hubungi Dinas.','error')">
    <div class="field"><label>Nama Sekolah / Pengguna</label><input required placeholder="Nama instansi"></div>
    <div class="field"><label>Username / NPSN</label><input required placeholder="NPSN"></div>
    <div class="field"><label>Password</label><input type="password" required placeholder="Password"></div>
    <div class="field"><label>Verifikasi Keamanan (${qText})</label><input id="captchaRegInput" type="number" required placeholder="Jawaban angka"></div>
    <div id="registerMsg"></div>
    <button class="btn btn-primary full" style="margin-top:12px">Ajukan Pendaftaran</button>
  </form>`;
}

async function doLogin(e){
  e.preventDefault();
  const m=$('#authMsg');
  const userAns = Number($('#captchaInput')?.value);
  if(userAns !== state.captchaAns){
    m.innerHTML=msg('Jawaban verifikasi keamanan (captcha matematika) salah.');
    return;
  }
  const b=$('#loginBtn'); b.disabled=true; b.textContent='Memproses...';
  try{
    const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});
    state.token=r.token; state.user=r.user;
    sessionStorage.setItem('simpel_token',state.token);
    dashboard();
  }catch(err){
    m.innerHTML=msg(err.message);
  }finally{
    b.disabled=false; b.textContent='Masuk';
  }
}

function navItems(){
  const role=String(state.user?.role||'').toUpperCase();
  const allowed=ROLE_RULES[role]||ROLE_RULES.SEKOLAH;
  const all=[
    {id:'home',label:'Dashboard'},
    {id:'verifikasiDinas',label:'Verifikasi Usulan Dinas'},
    {id:'sekolah',label:'Data Sekolah'},
    {id:'penugasan',label:'Penugasan Pengawas'},
    {id:'dbcheck',label:'Cek Struktur DB'},
    {id:'master',label:'Master SPJ & Indikator'},
    {id:'rkas',label:'Pengelolaan RKAS'},
    {id:'dokumen',label:'Dokumen SPJ (Drive)'},
    {id:'transaksi',label:'Transaksi & Realisasi'},
    {id:'crosscheck',label:'Cross-check Otomatis'},
    {id:'temuan',label:'Temuan & Verifikasi'},
    {id:'asesmen',label:'Asesmen Mutu & Finalisasi'}
  ];
  return all.filter(n=>allowed.includes(n.id)||n.id==='home');
}

function dashboard(){document.body.style.background='var(--bg)';renderShell();loadView('home')}
function renderShell(){
  const u=state.user||{};
  $('#app').innerHTML=`<main class="dashboard"><header class="topbar"><div style="display:flex;align-items:center;gap:9px"><button class="btn btn-light mobile-menu" id="menuBtn" aria-label="Buka menu">☰</button><div class="brand"><img src="bidangsd.png" class="app-logo" alt="Logo"><div><h2>SIMPEL SPJ</h2><small>${esc(u.role||'Pengguna')}</small></div></div></div><div class="top-actions"><span class="muted user-name">${esc(u.nama_pengguna||u.username||'')}</span><button class="btn btn-light" id="logoutBtn">Keluar</button></div></header><div class="layout"><aside class="sidebar" id="sidebar"><div class="nav-group"><div class="nav-section-title">Menu Utama</div>${navItems().map(n=>`<button class="nav-btn" data-view="${n.id}">${n.label}</button>`).join('')}</div><div class="sidebar-footer"><div class="sidebar-logo-row"><img src="logorembang.png" alt="Rembang"><div><span>Dindikpora Rembang</span></div></div><div class="sidebar-logo-row"><img src="logopendidikan.png" alt="Kemdikdasmen"><div><span>Direktorat SD</span></div></div></div></aside><section class="content" id="mainContent"></section></div></main>`;
  $$('[data-view]').forEach(b=>b.onclick=()=>{loadView(b.dataset.view);$('#sidebar')?.classList.remove('open')});
  $('#logoutBtn').onclick=logout;$('#menuBtn').onclick=()=>$('#sidebar')?.classList.toggle('open') } async function logout(){try{if(state.token)await api('logout')}catch(e){}state.token='';state.user=null;sessionStorage.removeItem('simpel_token');authView('login',msg('Anda telah keluar.','ok'))} function setActive(view){$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}

function loadView(view){
  state.view=view; setActive(view);
  if(view==='home') return homeView();
  if(view==='verifikasiDinas') return verifikasiDinasView();
  if(view==='sekolah') return dataActionView('Data Sekolah','getSekolah');
  if(view==='penugasan') return dataActionView('Penugasan Pengawas','getPenugasanPengawas');
  if(view==='dbcheck') return dbCheckView();
  if(view==='master') return masterView();
  if(view==='rkas') return rkasInteractiveView();
  if(view==='dokumen') return dokumenView();
  if(view==='transaksi') return transaksiView();
  if(view==='crosscheck') return crosscheckView();
  if(view==='temuan') return temuanView();
  if(view==='asesmen') return asesmenInteractiveView();
}

function head(title,desc=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${desc}</div></div></div>`}
function actionPanel(action,fields=[]){return `<div class="panel"><div class="toolbar"><button class="btn btn-primary run-action">Jalankan</button><button class="btn btn-light clear-res">Bersihkan</button></div><div class="form-grid">${fields.map(f=>`<div class="${f.full?'full-col':''} field"><label>${f.label}</label><input id="f_${f.id}" placeholder="${f.placeholder||''}"></div>`).join('')}</div><pre class="res-pre">Belum ada hasil.</pre></div>`}
function bindPanel(panel,action,fields=[]){
  panel.querySelector('.run-action').onclick=async()=>{
    let payload={}; fields.forEach(f=>payload[f.key||f.id]=panel.querySelector('#f_'+f.id)?.value||'');
    panel.querySelector('.res-pre').textContent='Memproses...';
    try{panel.querySelector('.res-pre').textContent=JSON.stringify(await api(action,payload),null,2)}catch(e){panel.querySelector('.res-pre').textContent=e.message}
  };
  panel.querySelector('.clear-res').onclick=()=>panel.querySelector('.res-pre').textContent='Belum ada hasil.';
}

function homeView(){
  const role=String(state.user?.role||'').toUpperCase();
  $('#mainContent').innerHTML=head('Dashboard SIMPEL SPJ','Ringkasan akses dan modul aplikasi sesuai peran')+
  `<div class="cards"><div class="stat"><small>Role Pengguna</small><b>${esc(role)}</b></div><div class="stat"><small>Username</small><b style="font-size:1.1rem">${esc(state.user?.username||'-')}</b></div><div class="stat"><small>Status Sesi</small><b style="font-size:1.1rem">Aktif</b></div><div class="stat"><small>Kabupaten</small><b style="font-size:1.1rem">Rembang</b></div></div>`+
  `<div class="panel"><h3>Selamat datang di SIMPEL SPJ</h3><p class="muted">Sistem dirancang dengan prinsip minim hambatan (Zero Friction). Pilih menu di sebelah kiri untuk mengelola anggaran RKAS, catatan transaksi, dokumen Google Drive, hingga verifikasi temuan audit dan penilaian asesmen.</p></div>`;
}

function dataActionView(title,action){
  $('#mainContent').innerHTML=head(title,'Data dari backend')+actionPanel(action);
  bindPanel($('.panel'),action);
}

function dbCheckView(){
  $('#mainContent').innerHTML=head('Validasi Struktur Database','Pemeriksaan integritas header Google Spreadsheet')+
  `<div class="panel"><button class="btn btn-primary" id="checkDbBtn">Cek Struktur Database</button><pre id="dbResult" style="margin-top:14px">Belum ada hasil.</pre></div>`;
  $('#checkDbBtn').onclick=async()=>{
    $('#dbResult').textContent='Memeriksa struktur database...';
    try{const r=await api('validateDatabaseStructure');$('#dbResult').textContent=JSON.stringify(r,null,2)}catch(e){$('#dbResult').textContent=e.message}
  };
}

function verifikasiDinasView(){
  $('#mainContent').innerHTML=head('Verifikasi Usulan RKAS Dinas','Pusat peninjauan usulan perubahan RKAS dari sekolah')+   actionPanel('getSemuaUsulanRKAS')+   actionPanel('reviewRKAS',[{id:'versiRkas',label:'Versi RKAS'},{id:'keputusan',label:'Keputusan (APPROVED / DITOLAK)'}]);   const panels=$$('#mainContent .panel');
  bindPanel(panels[0],'getSemuaUsulanRKAS');
  bindPanel(panels[1],'reviewRKAS',[{id:'versiRkas'},{id:'keputusan'}]);
}

function masterView(){
  $('#mainContent').innerHTML=head('Master SPJ & Indikator','Master, indikator, dan periode')+   actionPanel('getMasterSPJ')+   actionPanel('getMasterIndikator',[{id:'idSpj',label:'ID SPJ (opsional)'}])+   actionPanel('getPeriodeSPJ');   const panels=$$('#mainContent .panel');
  bindPanel(panels[0],'getMasterSPJ');
  bindPanel(panels[1],'getMasterIndikator',[{id:'idSpj'}]);

function uploadDokumenView(){
  $('#mainContent').innerHTML=head('Unggah Dokumen SPJ','Hanya akun SEKOLAH yang dapat mengunggah dokumen')+
  `<div class="panel"><form id="uploadForm"><div class="form-grid"><div class="field"><label>ID Periode</label><input id="up_periode" required placeholder="Contoh: BLN-01"></div><div class="field"><label>ID SPJ</label><input id="up_spj" required placeholder="ID Master SPJ"></div><div class="field full-col"><label>Pilih File Dokumen (.pdf)</label><input id="up_file" type="file" accept=".pdf" required></div></div><div id="upMsg"></div><button class="btn btn-primary" style="margin-top:10px">Unggah dan Simpan ke Drive</button></form><pre id="upResult" style="margin-top:14px">Belum ada hasil.</pre></div>`;
  $('#uploadForm').onsubmit=async e=>{
    e.preventDefault(); const f=$('#up_file').files[0]; if(!f)return;
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        const base64=String(reader.result).split(',')[1]||'';
        const r=await api('uploadDanSimpanDokumenSPJ',{data:{id_periode:$('#up_periode').value,id_spj:$('#up_spj').value,nama_file:f.name,mimeType:f.type,base64}});
        $('#upResult').textContent=JSON.stringify(r,null,2);
      }catch(err){$('#upResult').textContent=err.message}
    };
    reader.readAsDataURL(f);
  };
}
