<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>SIMPEL SPJ</title>
<style>
:root{--primary:#1f4f82;--primary2:#2e74b5;--bg:#f4f7fb;--text:#1f2937;--muted:#6b7280;--line:#dbe3ec;--danger:#b42318;--ok:#087443;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:600}button.secondary{background:#e8eef6;color:var(--primary)}button.danger{background:#b42318}button.ok{background:#087443}button.warn{background:#9a6700}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}
.app{min-height:100vh}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 12px 40px #16324d12}.brand{font-size:25px;font-weight:800;color:var(--primary);margin-bottom:6px}.sub{color:var(--muted);font-size:14px;margin-bottom:24px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.field textarea{min-height:90px;resize:vertical}.error{color:var(--danger);font-size:13px;margin:10px 0}.notice{padding:12px;border-radius:9px;background:#edf5ff;color:#234b76;font-size:13px}.linkbtn{background:none;color:var(--primary);padding:0;font-weight:700}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#173b62;color:#fff;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.sidebar .brand{color:#fff}.role-note{font-size:12px;color:#cbd5e1}.nav{display:grid;gap:7px;margin-top:25px}.nav button{background:transparent;text-align:left;color:#dbeafe}.nav button.active,.nav button:hover{background:#2c5f91;color:#fff}.main{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.userbox{font-size:13px;color:var(--muted);text-align:right}.content{padding:24px;max-width:1600px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.page-title h1{font-size:24px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #173b6208}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:25px;font-weight:800;margin-top:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}.panel h3{margin-top:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;min-width:180px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f3f6fa;font-size:12px}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eef6;color:#315778;font-size:11px;font-weight:700}.badge.ok{background:#e5f6ed;color:var(--ok)}.badge.bad{background:#ffebe9;color:var(--danger)}.badge.warn{background:#fff4d6;color:var(--warn)}.empty{padding:30px;text-align:center;color:var(--muted)}.loading{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:#172b40;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:0 10px 30px #0002;z-index:50}.modal-backdrop{position:fixed;inset:0;background:#0b1f3388;display:grid;place-items:center;padding:18px;z-index:30}.modal{background:#fff;width:min(850px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{margin:0;font-size:19px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.progress{height:8px;background:#e7edf4;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--primary2)}.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.photo{max-width:260px;max-height:180px;border-radius:10px;border:1px solid var(--line);object-fit:cover}.nowrap{white-space:nowrap}.danger-text{color:var(--danger)}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:14px}.nav{display:flex;flex-wrap:wrap;margin-top:14px}.nav button{padding:8px 10px}.grid,.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.content{padding:15px}.topbar{padding:14px}}
@media(max-width:560px){.grid,.kpi-grid,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.topbar{align-items:flex-start;flex-direction:column}.userbox{text-align:left}}
</style>

<body>
<div id="app"></div><div id="toast" class="toast hidden"></div><div id="modalRoot"></div>
<script>
'use strict';
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbyWvJXKr1QZ1zwbeJDoULTUihycj1771SsDlGFy8jnuF4i3DsEbHXlcJU48VDAg17fqDA/exec'};
const state={token:null,user:null,page:'dashboard',cache:{},loading:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(String(v??0).replace(/[^0-9.-]/g,'' )||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const num=v=>{let s=String(v??'').trim().replace(/Rp/gi,'').replace(/\s/g,'');if(!s)return 0;if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(',')){s=s.replace(',','.')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}else if(/\.\d{3}$/.test(s)){s=s.replace('.','')}return Number(s.replace(/[^0-9.-]/g,''))||0};
const pct=v=>{let n=num(String(v).replace('%',''));return n>0&&n<=1?n*100:n};
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3800)}
function showModal(title,body,actions=''){ $('#modalRoot').innerHTML=`<div class="modal-backdrop" data-close><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2><button class="secondary" data-modal-close>×</button></div>${body}<div class="modal-actions">${actions}</div></div></div>` }
function closeModal(){$('#modalRoot').innerHTML=''}
$('#modalRoot').addEventListener('click',e=>{if(e.target.matches('[data-close],[data-modal-close]'))closeModal()});
async function api(action, data = {}, retry = true) {
  if (CONFIG.API_URL.startsWith('GANTI_')) {
    throw Error('API_URL belum diisi pada index.html.');
  }

  const payload = {
    action,
    ...data
  };

  if (state.token) {
    payload.token = state.token;
  }

  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  });

  const json = await res.json();

  if (json && json.status === 'error') {
    throw Error(json.pesan || 'Permintaan gagal.');
  }

  if (json && json.success === false) {
    throw Error(json.message || 'Permintaan gagal.');
  }

  return json;
}
 const json=await r.json();if(!json)throw Error('Respons backend kosong.');
 if(String(json.status||'').toLowerCase()==='error')throw Error(json.pesan||json.message||'Permintaan gagal.');
 return json;
}
function rows(r){return Array.isArray(r)?r:Array.isArray(r?.data)?r.data:Array.isArray(r?.records)?r.records:[]}
function saveSession(result) {
  const d = result?.data || {};

  state.token = d.token || result?.token || null;

  state.user = {
    id: d.id || '',
    username: d.username || '',
    nama_pengguna: d.nama_pengguna || '',
    role: d.role || '',
    status: d.status || '',
    perencana: d.perencana || '',
    pengawas: d.pengawas || ''
  };

  if (!state.token) {
    console.error('Response login:', result);
    throw Error('Token sesi tidak diterima backend.');
  }

  sessionStorage.setItem(
    'simpel_spj_session',
    JSON.stringify({
      token: state.token,
      user: state.user
    })
  );
}
function restoreSession(){try{const s=JSON.parse(sessionStorage.getItem('simpel_spj_session')||'null');if(s?.token){state.token=s.token;state.user=s.user;return true}}catch(e){}return false}
function role(){return String(state.user?.role||'').toUpperCase()}
async function logout(){try{if(state.token)await api('logout',{})}catch(e){}state.token=null;state.user=null;sessionStorage.removeItem('simpel_spj_session');renderLogin()}
function allowed(p){const r=role();if(p==='dashboard')return true;if(p==='paket')return r==='SEKOLAH';if(p==='laporan')return r==='SEKOLAH';if(p==='pagu')return r==='DINAS';if(p==='laporanDinas')return r==='DINAS';if(p==='pendaftaran')return r==='DINAS';if(p==='sekolah')return r==='DINAS';if(p==='notifikasi')return ['DINAS','SEKOLAH'].includes(r);if(p==='riwayatPagu')return r==='SEKOLAH';if(p==='master')return ['DINAS','SEKOLAH'].includes(r);if(p==='profil')return r==='SEKOLAH';return false}
function renderLogin(){
 $('#app').innerHTML=`<div class="login-wrap"><div class="login-card"><div class="brand">SIMPEL SPJ</div><div class="sub">Sistem Penilaian SPJ BOS SD Kabupaten Rembang</div><form id="loginForm"><div class="field"><label>Username / NPSN</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="error"></div><button id="loginBtn" style="width:100%">Masuk</button></form><div style="text-align:center;margin-top:18px"><button id="registerOpen" class="linkbtn">Pendaftaran akun sekolah</button></div></div></div>`;
 $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#loginBtn');b.disabled=true;b.textContent='Memproses...';$('#loginError').textContent='';try{saveSession(await api('login',{username:$('#username').value.trim(),password:$('#password').value}));await renderApp()}catch(err){$('#loginError').textContent=err.message}finally{b.disabled=false;b.textContent='Masuk'}});
 $('#registerOpen').onclick=showRegister;
}
function showRegister(){showModal('Pendaftaran Akun Sekolah',`<form id="registerForm"><div class="form-grid"><div class="field"><label>NPSN</label><input id="regNpsn" required maxlength="12"></div><div class="field"><label>Nama lengkap / penanggung jawab</label><input id="regNama"></div><div class="field full"><label>Password</label><input id="regPass" type="password" required minlength="6"></div></div><div id="regMsg" class="error"></div></form>`,`<button class="secondary" data-modal-close>Batal</button><button id="registerBtn">Kirim Pendaftaran</button>`);$('#registerBtn').onclick=async()=>{const b=$('#registerBtn');b.disabled=true;b.textContent='Mengirim...';$('#regMsg').textContent='';try{const r=await api('register',{npsn:$('#regNpsn').value.trim(),nama_lengkap:$('#regNama').value.trim(),password:$('#regPass').value});$('#regMsg').className='notice';$('#regMsg').textContent=r.pesan||'Pendaftaran berhasil dikirim.';setTimeout(closeModal,1200)}catch(e){$('#regMsg').textContent=e.message}finally{b.disabled=false;b.textContent='Kirim Pendaftaran'}}}
function shell(){
 const r=role(),items=[['dashboard','Dashboard'],['paket','Paket Pekerjaan SD'],['laporan','Laporan Progres'],['pagu','Verifikasi PAGU'],['laporanDinas','Verifikasi Laporan'],['pendaftaran','Pendaftaran Sekolah'],['sekolah','Monitoring Sekolah'],['riwayatPagu','Riwayat PAGU'],['profil','Profil & Tim Teknis'],['notifikasi','Notifikasi'],['master','Data Referensi']];
 $('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand">SIMPEL SPJ</div><div class="role-note">Sistem Penilaian SPJ BOS SD</div><div class="role-note" style="margin-top:7px">Role: <b>${esc(r)}</b></div><nav class="nav">${items.filter(x=>allowed(x[0])).map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join('')}<button id="logoutBtn" class="danger" style="margin-top:18px">Keluar</button></nav></aside><section class="main"><header class="topbar"><strong id="headerTitle">Dashboard</strong><div class="userbox"><b>${esc(state.user?.nama_pengguna||state.user?.username||'Pengguna')}</b><br>${esc(state.user?.username||'')}</div></header><main id="content" class="content"></main></section></div>`;
 $('#logoutBtn').onclick=logout;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
}
const titles={dashboard:'Dashboard',paket:'Paket Pekerjaan SD',laporan:'Laporan Progres',pagu:'Verifikasi PAGU',laporanDinas:'Verifikasi Laporan Progres',pendaftaran:'Pendaftaran Sekolah',sekolah:'Monitoring Sekolah',riwayatPagu:'Riwayat PAGU',profil:'Profil & Tim Teknis',notifikasi:'Notifikasi',master:'Data Referensi'};
function navigate(page){if(!allowed(page))return toast('Anda tidak memiliki akses ke menu ini.');state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#headerTitle').textContent=titles[page]||page;loadPage()}
async function loadPage(){const c=$('#content');c.innerHTML='<div class="loading">Memuat data...</div>';try{const fn={dashboard:dashboard,paket:paketPage,laporan:laporanPage,pagu:paguPage,laporanDinas:laporanDinasPage,pendaftaran:pendaftaranPage,sekolah:sekolahPage,riwayatPagu:riwayatPaguPage,profil:profilPage,notifikasi:notifikasiPage,master:masterPage}[state.page];if(fn)return await fn(c);c.innerHTML='<div class="panel">Menu belum tersedia.</div>'}catch(e){c.innerHTML=`<div class="panel"><div class="error">${esc(e.message)}</div><button class="secondary" onclick="loadPage()">Coba lagi</button></div>`}}
function badge(v){const s=String(v??'-'),u=s.toUpperCase();let cls='';if(['DISETUJUI','APPROVED','AKTIF','ACTIVE','NORMAL'].includes(u))cls='ok';else if(['DITOLAK','REJECTED','TERLAMBAT','JATUH TEMPO'].includes(u))cls='bad';else if(['DIAJUKAN','PENDING','PERHATIAN','BELUM ADA LAPORAN'].includes(u))cls='warn';return `<span class="badge ${cls}">${esc(s)}</span>`}
function table(data,cols,opts={}){if(!data.length)return '<div class="empty">Tidak ada data.</div>';return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c.label||c)}</th>`).join('')}${opts.actions?'<th>Aksi</th>':''}</tr></thead><tbody>${data.map((r,i)=>`<tr>${cols.map(c=>{const k=c.key||c,v=r[k];return `<td>${c.badge?badge(v):c.money?money(v):c.percent?(pct(v).toFixed(2)+'%'):esc(v)}</td>`}).join('')}${opts.actions?`<td>${opts.actions(r,i)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
async function dashboard(c){
 if(role()==='DINAS')return dashboardDinas(c);
 const [pak,lap,notif]=await Promise.all([api('getData',{sheet:'paket_pekerjaan_sd'}),api('getData',{sheet:'laporan_progres'}),api('getNotifikasi',{penerima:role()})]);const ps=rows(pak),ls=rows(lap),ns=rows(notif);const approved=ps.filter(x=>String(x.status_pagu).toUpperCase()==='DISETUJUI');c.innerHTML=`<div class="page-title"><h1>Dashboard</h1>${badge(role())}</div><div class="grid"><div class="card"><div class="stat-label">Paket pekerjaan</div><div class="stat-value">${ps.length}</div></div><div class="card"><div class="stat-label">Paket disetujui</div><div class="stat-value">${approved.length}</div></div><div class="card"><div class="stat-label">Laporan progres</div><div class="stat-value">${ls.length}</div></div><div class="card"><div class="stat-label">Notifikasi aktif</div><div class="stat-value">${ns.length}</div></div></div><div class="panel"><h3>Ringkasan Paket</h3>${table(ps,[{key:'paket_id',label:'Paket ID'},{key:'nama_menu',label:'Nama Menu'},{key:'pagu_usulan',label:'PAGU Usulan',money:true},{key:'pagu',label:'PAGU',money:true},{key:'status_pagu',label:'Status',badge:true},{key:'tgl_selesai',label:'Selesai'}])}</div>`}
async function dashboardDinas(c){const r=await api('getDashboardDinas',{token:state.token});const k=r.kpi||{},m=r.monitoring||[];c.innerHTML=`<div class="page-title"><h1>Dashboard DINAS</h1><span class="small">${esc(r.generated_at||'')}</span></div><div class="kpi-grid">${[['Sekolah',k.total_sekolah],['Sekolah berakun',k.sekolah_user],['Paket',k.total_paket],['Paket disetujui',k.paket_disetujui],['Laporan diajukan',k.laporan_diajukan],['Total laporan',k.total_laporan],['PAGU disetujui',money(k.total_pagu_disetujui)],['Rata-rata fisik',(k.rata_fisik_approved??0)+'%']].map(x=>`<div class="card"><div class="stat-label">${esc(x[0])}</div><div class="stat-value">${esc(x[1])}</div></div>`).join('')}</div><div class="panel"><h3>Monitoring yang perlu perhatian</h3>${table(m,[{key:'nama_sekolah',label:'Sekolah'},{key:'kecamatan',label:'Kecamatan'},{key:'nama_menu',label:'Pekerjaan'},{key:'target',label:'Target',percent:true},{key:'realisasi',label:'Realisasi',percent:true},{key:'deviasi',label:'Deviasi',percent:true},{key:'status_monitoring',label:'Status',badge:true},{key:'tgl_selesai',label:'Tanggal selesai'}],{actions:r=>`<button class="secondary" onclick='openSchool(${JSON.stringify(String(r.npsn))})'>Detail</button>`})}</div>`}
async function paketPage(c){const d=rows(await api('getData',{sheet:'paket_pekerjaan_sd'}));c.innerHTML=`<div class="page-title"><h1>Paket Pekerjaan SD</h1><button id="addPaket">+ Paket Baru</button></div><div class="panel"><div class="toolbar"><input id="paketSearch" placeholder="Cari paket / nama menu..."></div><div id="paketTable"></div></div>`;const render=()=>{const q=$('#paketSearch').value.toLowerCase();const a=d.filter(x=>(String(x.paket_id)+' '+String(x.nama_menu)).toLowerCase().includes(q));$('#paketTable').innerHTML=table(a,[{key:'paket_id',label:'Paket ID'},{key:'nama_menu',label:'Nama Menu'},{key:'pagu_usulan',label:'PAGU Usulan',money:true},{key:'pagu',label:'PAGU',money:true},{key:'status_pagu',label:'Status',badge:true},{key:'tanggal_mulai',label:'Mulai'},{key:'tgl_selesai',label:'Selesai'}],{actions:r=>`<div class="actions"><button class="secondary" onclick='editPaket(${JSON.stringify(r)})'>Edit</button><button class="danger" onclick='hapusRow("paket_pekerjaan_sd",${Number(r._rowIndex||r.rowid)})'>Hapus</button></div>`})};$('#paketSearch').oninput=render;render();$('#addPaket').onclick=()=>editPaket(null)}
function editPaket(r){const edit=!!r;showModal(edit?'Edit Paket Pekerjaan':'Paket Pekerjaan Baru',`<form id="paketForm"><div class="form-grid"><div class="field"><label>Paket ID</label><input id="p_paket_id" value="${esc(r?.paket_id||'')}" ${edit?'readonly':''} required></div><div class="field"><label>Nama Menu</label><input id="p_nama_menu" value="${esc(r?.nama_menu||'')}" ${edit?'readonly':''} required></div><div class="field"><label>PAGU USULAN</label><input id="p_pagu_usulan" inputmode="numeric" value="${esc(r?.pagu_usulan||'')}" required></div><div class="field"><label>Tanggal Mulai</label><input id="p_tanggal_mulai" type="date" value="${esc(r?.tanggal_mulai||'')}" ${edit?'readonly':''} required></div><div class="field"><label>Lama Hari</label><input id="p_lama_hari" type="number" min="1" value="${esc(r?.lama_hari||'')}" ${edit?'readonly':''} required></div><div class="field"><label>Tanggal Selesai</label><input id="p_tgl_selesai" type="date" value="${esc(r?.tgl_selesai||'')}" ${edit?'readonly':''}></div></div><div id="p_msg" class="error"></div></form>`,`<button class="secondary" data-modal-close>Batal</button><button id="savePaket">Simpan / Ajukan</button>`);$('#savePaket').onclick=async()=>{try{const formData={paket_id:$('#p_paket_id').value.trim(),nama_menu:$('#p_nama_menu').value.trim(),pagu_usulan:$('#p_pagu_usulan').value,tanggal_mulai:$('#p_tanggal_mulai').value,lama_hari:$('#p_lama_hari').value,tgl_selesai:$('#p_tgl_selesai').value};const r2=await api('simpanPaketPekerjaan',{formData,rowIndex:r?Number(r._rowIndex||r.rowid):0});toast(r2.pesan||'Tersimpan');closeModal();loadPage()}catch(e){$('#p_msg').textContent=e.message}}}
async function laporanPage(c){const [lap,pak]=await Promise.all([api('getData',{sheet:'laporan_progres'}),api('getData',{sheet:'paket_pekerjaan_sd'})]);const ld=rows(lap),pd=rows(pak).filter(x=>String(x.status_pagu).toUpperCase()==='DISETUJUI');c.innerHTML=`<div class="page-title"><h1>Laporan Progres</h1><button id="addLaporan">+ Laporan Baru</button></div><div class="panel">${table(ld,[{key:'id',label:'ID'},{key:'paket_id',label:'Paket'},{key:'minggu_ke',label:'Minggu'},{key:'tanggal_lapor',label:'Tanggal'},{key:'target_kurva_s',label:'Target'},{key:'realisasi_fisik',label:'Realisasi'},{key:'penggunaan_anggaran',label:'Anggaran',money:true},{key:'status_verifikasi',label:'Status',badge:true}],{actions:r=>`<button class="secondary" onclick='editLaporan(${JSON.stringify(r)})'>Revisi</button>`})}</div>`;$('#addLaporan').onclick=()=>editLaporan(null,pd)}
function editLaporan(r,pd){const opts=pd||state.cache.approvedPackages||[];state.cache.approvedPackages=opts;showModal(r?'Revisi Laporan Progres':'Laporan Progres Baru',`<form id="lapForm"><div class="form-grid"><div class="field"><label>Paket</label><select id="l_paket_id" ${r?'disabled':''}>${opts.map(x=>`<option value="${esc(x.paket_id)}" ${String(x.paket_id)===String(r?.paket_id)?'selected':''}>${esc(x.paket_id+' - '+x.nama_menu)}</option>`).join('')}</select></div><div class="field"><label>Minggu ke</label><input id="l_minggu" type="number" min="1" value="${esc(r?.minggu_ke||'')}" ${r?'readonly':''} required></div><div class="field"><label>Tanggal Lapor</label><input id="l_tanggal" type="date" value="${esc(r?.tanggal_lapor||new Date().toISOString().slice(0,10))}" required></div><div class="field"><label>Target Kurva S (%)</label><input id="l_target" type="number" min="0" max="100" step="0.01" value="${esc(pct(r?.target_kurva_s)||0)}" required></div><div class="field"><label>Realisasi Fisik (%)</label><input id="l_realisasi" type="number" min="0" max="100" step="0.01" value="${esc(pct(r?.realisasi_fisik)||0)}" required></div><div class="field"><label>Penggunaan Anggaran</label><input id="l_anggaran" inputmode="numeric" value="${esc(r?.penggunaan_anggaran||'')}" required></div><div class="field full"><label>Foto Dokumentasi</label><input id="l_foto" type="file" accept="image/*"><div class="small">Metadata waktu/lokasi tetap mengikuti data yang dikirim dari perangkat bila tersedia. Backend akan menyimpan foto ke Drive.</div></div><div class="field full"><label>Catatan Pekerjaan</label><textarea id="l_catatan" placeholder="Catatan pekerjaan digunakan backend untuk validasi revisi. ${r?'Catatan DINAS tidak dapat diubah oleh sekolah.':''}"></textarea></div></div><div id="l_msg" class="error"></div></form>`,`<button class="secondary" data-modal-close>Batal</button><button id="saveLaporan">Simpan / Ajukan</button>`);$('#saveLaporan').onclick=async()=>{const b=$('#saveLaporan');b.disabled=true;try{let foto='';const f=$('#l_foto').files[0];if(f)foto=await fileData(f);const formData={id:r?.id||'',paket_id:r?.paket_id||$('#l_paket_id').value,minggu_ke:$('#l_minggu').value,tanggal_lapor:$('#l_tanggal').value,target_kurva_s:$('#l_target').value,realisasi_fisik:$('#l_realisasi').value,penggunaan_anggaran:$('#l_anggaran').value,catatan_pekerjaan:$('#l_catatan').value,foto_dokumentasi:foto};const rr=await api('simpanLaporanProgres',{formData,rowIndex:r?Number(r._rowIndex||r.rowid):0});toast(rr.pesan||'Laporan tersimpan');closeModal();loadPage()}catch(e){$('#l_msg').textContent=e.message}finally{b.disabled=false}}}
function fileData(f){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)})}
async function paguPage(c){const d=rows(await api('getData',{sheet:'paket_pekerjaan_sd'})).filter(x=>String(x.status_pagu).toUpperCase()==='DIAJUKAN');c.innerHTML=`<div class="page-title"><h1>Verifikasi PAGU</h1><span class="small">DINAS</span></div><div class="panel">${table(d,[{key:'npsn',label:'NPSN'},{key:'paket_id',label:'Paket'},{key:'nama_menu',label:'Nama Menu'},{key:'pagu_usulan',label:'PAGU Usulan',money:true},{key:'pagu',label:'PAGU Lama',money:true},{key:'status_pagu',label:'Status',badge:true}],{actions:r=>`<div class="actions"><button class="ok" onclick='verifikasiPaguRow(${JSON.stringify(String(r.paket_id))},"DISETUJUI")'>Setujui</button><button class="danger" onclick='verifikasiPaguRow(${JSON.stringify(String(r.paket_id))},"DITOLAK")'>Tolak</button></div>`})}</div>`}
async function verifikasiPaguRow(paketId,keputusan){if(keputusan==='DITOLAK'&&!confirm('Tolak PAGU USULAN ini?'))return;try{const r=await api('verifikasiPagu',{paketId,keputusan});toast(r.pesan||'Verifikasi selesai');loadPage()}catch(e){toast(e.message)}}
async function laporanDinasPage(c){const d=rows(await api('getData',{sheet:'laporan_progres'})).filter(x=>['DIAJUKAN','PENDING'].includes(String(x.status_verifikasi).toUpperCase()));c.innerHTML=`<div class="page-title"><h1>Verifikasi Laporan Progres</h1></div><div class="panel">${table(d,[{key:'id',label:'ID'},{key:'npsn',label:'NPSN'},{key:'paket_id',label:'Paket'},{key:'minggu_ke',label:'Minggu'},{key:'tanggal_lapor',label:'Tanggal'},{key:'target_kurva_s',label:'Target'},{key:'realisasi_fisik',label:'Realisasi'},{key:'penggunaan_anggaran',label:'Anggaran',money:true},{key:'foto_dokumentasi',label:'Foto'}],{actions:r=>`<div class="actions"><button class="secondary" onclick='reviewLaporan(${JSON.stringify(r)})'>Review</button></div>`})}</div>`}
function reviewLaporan(r){showModal('Review Laporan Progres',`<div class="form-grid"><div><b>ID</b><br>${esc(r.id)}</div><div><b>NPSN</b><br>${esc(r.npsn)}</div><div><b>Paket</b><br>${esc(r.paket_id)}</div><div><b>Minggu</b><br>${esc(r.minggu_ke)}</div><div><b>Target</b><br>${esc(r.target_kurva_s)}</div><div><b>Realisasi</b><br>${esc(r.realisasi_fisik)}</div><div><b>Anggaran</b><br>${money(r.penggunaan_anggaran)}</div><div><b>Lokasi</b><br>${esc(r.lokasi_koordinat||'-')}</div><div class="full"><b>Foto</b><br><div id="photoBox">Memuat foto...</div></div><div class="field full"><label>Catatan DINAS</label><textarea id="verCatatan"></textarea></div></div><div id="verMsg" class="error"></div>`,`<button class="danger" id="rejectLap">Tolak</button><button class="ok" id="approveLap">Setujui</button>`);loadPhoto(r.foto_dokumentasi);$('#approveLap').onclick=()=>doVerLaporan(r,'DISETUJUI');$('#rejectLap').onclick=()=>doVerLaporan(r,'DITOLAK')}
async function loadPhoto(ref){if(!ref)return $('#photoBox').textContent='Tidak ada foto.';try{const r=await api('getPhotoData',{fileRef:ref},'GET');const d=r.data||r;const src=d.dataUrl||d.base64||d.url;if(src)$('#photoBox').innerHTML=`<img class="photo" src="${esc(src)}" alt="Dokumentasi">`;else $('#photoBox').textContent='Data foto tidak tersedia.'}catch(e){$('#photoBox').textContent='Foto tidak dapat dimuat: '+e.message}}
async function doVerLaporan(r,status){try{if(status==='DITOLAK'&&!$('#verCatatan').value.trim())throw Error('Catatan DINAS wajib diisi saat laporan ditolak.');const x=await api('verifikasiLaporan',{idLaporan:r.id,status,catatanDinas:$('#verCatatan').value.trim()});toast(x.pesan||'Verifikasi berhasil');closeModal();loadPage()}catch(e){$('#verMsg').textContent=e.message}}
async function pendaftaranPage(c){const d=rows(await api('getData',{sheet:'sekolah_pending'}));c.innerHTML=`<div class="page-title"><h1>Pendaftaran Sekolah</h1></div><div class="panel">${table(d,[{key:'npsn',label:'NPSN'},{key:'nama_sekolah',label:'Nama Sekolah'},{key:'status',label:'Status',badge:true},{key:'tanggal_daftar',label:'Tanggal'}],{actions:r=>`<div class="actions"><button class="ok" onclick='verifikasiDaftar(${JSON.stringify(r)},"DISETUJUI")'>Setujui</button><button class="danger" onclick='verifikasiDaftar(${JSON.stringify(r)},"DITOLAK")'>Tolak</button></div>`})}</div>`}
async function verifikasiDaftar(r,status){if(status==='DITOLAK'&&!confirm('Tolak pendaftaran sekolah ini?'))return;try{const x=await api('verifyRegister',{npsn:r.npsn,rowIndex:Number(r._rowIndex||r.rowid),status});toast(x.pesan||'Verifikasi selesai');loadPage()}catch(e){toast(e.message)}}
async function sekolahPage(c){const d=rows(await api('getData',{sheet:'sekolah'}));c.innerHTML=`<div class="page-title"><h1>Monitoring Sekolah</h1></div><div class="panel"><div class="toolbar"><input id="schoolSearch" placeholder="Cari NPSN / sekolah / kecamatan..."></div><div id="schoolTable"></div></div>`;const render=()=>{const q=$('#schoolSearch').value.toLowerCase();const a=d.filter(x=>(String(x.npsn)+' '+String(x.nama_sekolah)+' '+String(x.kecamatan)).toLowerCase().includes(q));$('#schoolTable').innerHTML=table(a,[{key:'npsn',label:'NPSN'},{key:'nama_sekolah',label:'Nama Sekolah'},{key:'kecamatan',label:'Kecamatan'},{key:'alamat_lengkap',label:'Alamat'}],{actions:r=>`<button class="secondary" onclick='openSchool(${JSON.stringify(String(r.npsn))})'>Detail</button>`})};$('#schoolSearch').oninput=render;render()}
async function openSchool(npsn){try{const r=await api('getDetailSekolah',{npsn});const s=r.sekolah||{};const p=r.paket||[];showModal('Detail Sekolah',`<div class="two-col"><div><div class="panel" style="margin-top:0"><h3>Profil</h3><p><b>${esc(s.nama_sekolah||'-')}</b></p><p>NPSN: ${esc(s.npsn||npsn)}</p><p>Kecamatan: ${esc(s.kecamatan||'-')}</p><p>Alamat: ${esc(s.alamat_lengkap||'-')}</p><p>Perencana: ${esc(s.perencana||'-')}</p><p>Pengawas: ${esc(s.pengawas||'-')}</p></div></div><div><div class="panel" style="margin-top:0"><h3>Ringkasan</h3><p>Total paket: <b>${esc(r.total_paket||p.length)}</b></p><p>Paket disetujui: <b>${esc(r.paket_disetujui||0)}</b></p><p>Status monitoring: ${badge(r.status_monitoring||'-')}</p></div></div></div><div class="panel"><h3>Paket & Monitoring</h3>${table(p,[{key:'paket_id',label:'Paket'},{key:'nama_menu',label:'Pekerjaan'},{key:'pagu',label:'PAGU',money:true},{key:'status_pagu',label:'Status',badge:true},{key:'target',label:'Target',percent:true},{key:'realisasi',label:'Realisasi',percent:true},{key:'deviasi',label:'Deviasi',percent:true},{key:'status_monitoring',label:'Monitoring',badge:true}])}</div>`,`<button class="secondary" data-modal-close>Tutup</button>`)}catch(e){toast(e.message)}}
async function riwayatPaguPage(c){const d=rows(await api('getData',{sheet:'riwayat_pagu'}));c.innerHTML=`<div class="page-title"><h1>Riwayat PAGU</h1></div><div class="panel">${table(d,[{key:'riwayat_id',label:'ID'},{key:'paket_id',label:'Paket'},{key:'pagu_lama',label:'PAGU Lama',money:true},{key:'pagu_baru',label:'PAGU Baru',money:true},{key:'keterangan',label:'Keterangan'},{key:'time_stamp',label:'Waktu'}])}</div>`}
async function profilPage(c){const d=rows(await api('getRef',{type:'users'}));const u=d[0]||state.user;c.innerHTML=`<div class="page-title"><h1>Profil & Tim Teknis</h1></div><div class="panel"><div class="form-grid"><div><b>NPSN</b><br>${esc(u.username||'-')}</div><div><b>Nama Pengguna</b><br>${esc(u.nama_pengguna||'-')}</div><div><b>Status</b><br>${badge(u.status||'-')}</div><div><b>Perencana</b><br>${esc(u.perencana||'-')}</div><div><b>Pengawas</b><br>${esc(u.pengawas||'-')}</div></div><p class="small" style="margin-top:18px">Penetapan Perencana dan Pengawas dikelola melalui data pengguna sesuai kewenangan backend.</p></div>`}
async function notifikasiPage(c){const d=rows(await api('getNotifikasi',{penerima:role()}));c.innerHTML=`<div class="page-title"><h1>Notifikasi</h1></div><div class="panel">${d.length?d.map(x=>`<div class="card" style="margin-bottom:10px"><b>${esc(x.judul||x.title||'Notifikasi')}</b><div style="margin:7px 0">${esc(x.pesan||x.message||'')}</div><div class="small">${esc(x.waktu||x.time_stamp||'')} · ${badge(x.status_baca||'BELUM DIBACA')}</div><div style="margin-top:9px"><button class="secondary" onclick='hapusNotif(${JSON.stringify(String(x.id_notif||x.id_notifikasi||x.id||''))})'>Hapus/selesaikan</button></div></div>`).join(''):'<div class="empty">Tidak ada notifikasi aktif.</div>'}</div>`}
async function hapusNotif(id){try{const x=await api('hapusNotifikasi',{id_notif:id,id_notifikasi:id});toast(x.pesan||'Notifikasi diproses');loadPage()}catch(e){toast(e.message)}}
async function masterPage(c){const [menu,school]=await Promise.all([api('getRef',{type:'menu_pekerjaan'}),api('getRef',{type:'sekolah'})]);c.innerHTML=`<div class="page-title"><h1>Data Referensi</h1></div><div class="panel"><h3>Menu Pekerjaan</h3>${table(rows(menu),Object.keys(rows(menu)[0]||{}).filter(k=>!['_rowIndex','rowid'].includes(k)).slice(0,12).map(k=>({key:k,label:k})) )}</div><div class="panel"><h3>Master Sekolah</h3>${table(rows(school),Object.keys(rows(school)[0]||{}).filter(k=>!['_rowIndex','rowid'].includes(k)).slice(0,10).map(k=>({key:k,label:k})) )}</div>`}
async function hapusRow(sheet,rowIndex){if(!confirm('Hapus data ini?'))return;try{const r=await api('deleteData',{sheet,rowIndex});toast(r.pesan||'Data dihapus');loadPage()}catch(e){toast(e.message)}}
async function renderApp(){shell();navigate('dashboard')}
(async()=>{if(restoreSession()){try{await renderApp()}catch(e){sessionStorage.removeItem('simpel_spj_session');renderLogin()}}else renderLogin()})();
</script>
</body>
</html>
