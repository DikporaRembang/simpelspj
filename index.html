<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPEL SPJ — Kabupaten Rembang</title>
<!-- SheetJS untuk membaca file Excel BKU secara lokal -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#0A192F;--primary-2:#0F4C3A;--primary-3:#16654b;
  --gold:#D4AF37;--gold-light:#F3E5AB;--bg:#f4f7f6;--surface:#fff;
  --text:#0f172a;--muted:#64748b;--border:#cbd5e1;--danger:#991b1b;--success:#15803d;
  --shadow:0 12px 32px rgba(10,25,47,.08);--radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}

/* Brand & Logos */
.brand{display:flex;align-items:center;gap:12px}
.app-logo{width:46px;height:46px;object-fit:contain;border-radius:12px;background:#fff;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.brand h2{font-size:1.1rem;margin:0;font-weight:800;color:var(--primary);letter-spacing:-.3px}
.brand small{color:var(--muted);font-size:.78rem;font-weight:500}

@keyframes logoBounce {
  0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(0.8,0,1,1); }
  50% { transform: translateY(-12px); animation-timing-function: cubic-bezier(0,0,0.2,1); }
}
.loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 16px; }
.loading-logo { width: 54px; height: 54px; object-fit: contain; background: #fff; border-radius: 14px; padding: 6px; box-shadow: 0 6px 20px rgba(15,76,58,.2); animation: logoBounce 0.9s infinite; }
.loading-text { font-size: 0.9rem; font-weight: 600; color: var(--muted); letter-spacing: .3px; }

@keyframes smoothWelcome {
  0% { opacity: 0; transform: scale(0.92) translateY(10px); backdrop-filter: blur(0px); }
  25% { opacity: 1; transform: scale(1) translateY(0); backdrop-filter: blur(10px); }
  75% { opacity: 1; transform: scale(1) translateY(0); backdrop-filter: blur(10px); }
  100% { opacity: 0; transform: scale(1.03) translateY(-10px); backdrop-filter: blur(0px); visibility: hidden; }
}
.welcome-overlay {
  position: fixed; inset: 0; background: linear-gradient(135deg, rgba(10,25,47,0.96) 0%, rgba(15,76,58,0.96) 100%);
  z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;
  animation: smoothWelcome 3.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; padding: 24px; text-align: center;
}
.welcome-logo-lg { width: 84px; height: 84px; object-fit: contain; background: #fff; border-radius: 22px; padding: 10px; box-shadow: 0 12px 35px rgba(0,0,0,.35); margin-bottom: 22px; animation: logoBounce 1.2s infinite; }
.welcome-title-anim {
  font-size: clamp(1.8rem, 4.5vw, 3.2rem); font-weight: 900; text-transform: uppercase;
  background: linear-gradient(to right, #FBF5B7, #D4AF37, #FCF6BA, #B38728);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1.8px; margin: 0;
  text-shadow: 0 10px 30px rgba(0,0,0,.3);
}
.welcome-subtitle-anim { color: #cbd5e1; font-size: 1.05rem; margin-top: 12px; font-weight: 500; letter-spacing: .6px; }

.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;transition:.2s;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg, var(--primary-2), var(--primary-3));color:#fff;box-shadow:0 4px 14px rgba(15,76,58,.25)}.btn-primary:hover{opacity:.9}
.btn-secondary{background:#e2f8ec;color:var(--primary-2)}
.btn-light{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fee4e2;color:var(--danger)}
.btn-sm{padding:8px 14px;min-height:38px;font-size:.85rem;border-radius:10px}
.full{width:100%}

.auth{
  min-height:100vh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(400px,.9fr);
  background: var(--bg); position:relative; overflow:hidden;
}
.auth-side{
  color:#fff; padding:clamp(32px,6vw,80px); display:flex; flex-direction:column; justify-content:space-between; position:relative;
  background: linear-gradient(135deg, rgba(10, 25, 47, 0.82), rgba(15, 76, 58, 0.78)), url('kantordindikpora.jpeg') center/cover no-repeat;
}
.auth-side-inner{max-width:680px;margin:auto 0;position:relative;z-index:2}
.auth-side h1{font-size:clamp(2rem,4vw,3.6rem);line-height:1.15;margin:20px 0 16px;letter-spacing:-1px;font-weight:800}
.auth-side p{max-width:560px;line-height:1.7;color:#cbd5e1;font-size:1.02rem}

.footer-logos{display:flex;align-items:center;gap:20px;margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.15);flex-wrap:wrap;position:relative;z-index:2}
.footer-logo-item{display:flex;align-items:center;gap:12px}
.footer-logo-item img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.footer-logo-item div span{display:block;font-size:.78rem;font-weight:800;color:#fff;line-height:1.2;letter-spacing:.3px}
.footer-logo-item div small{font-size:.68rem;color:#cbd5e1}

.auth-panel{display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,36px);background:rgba(255,255,255,.98)}
.auth-card{width:min(100%,460px);background:#fff;border:1px solid var(--border);border-radius:24px;padding:clamp(24px,4vw,36px);box-shadow:0 20px 40px rgba(10,25,47,.1)}

.field{margin:16px 0}
.field label{display:block;font-size:.9rem;font-weight:700;margin-bottom:6px;color:var(--primary)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px 16px;outline:0;background:#fff;min-height:50px;font-size:1rem;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(15,76,58,.12)}
.message{padding:14px 16px;border-radius:12px;margin:14px 0;font-size:.95rem}
.message.error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}.message.ok{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}

.dashboard{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:12px clamp(16px,3vw,32px);box-shadow:0 2px 8px rgba(0,0,0,.03)
}
.topbar .brand{margin:0}.top-actions{display:flex;align-items:center;gap:12px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 72px)}

.sidebar{background:linear-gradient(180deg,#0A192F,#0F4C3A);color:#e2e8f0;padding:24px 16px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid rgba(255,255,255,.05)}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:18px 0 8px 12px;font-weight:800}
.nav-btn{
  width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:14px 16px;
  border-radius:12px;font-weight:650;display:flex;align-items:center;gap:12px;font-size:.95rem;transition:.18s;min-height:48px
}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateX(3px)}

.sidebar-footer{padding-top:16px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:12px}
.sidebar-footer-item{display:flex;align-items:center;gap:10px}
.sidebar-footer-item img{width:32px;height:32px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.sidebar-footer-item div span{display:block;font-size:.7rem;font-weight:700;color:#fff;line-height:1.2}
.sidebar-footer-item div small{font-size:.62px;color:#cbd5e1}

.content{padding:clamp(20px,3vw,36px);min-width:0;max-width:1480px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{margin:0;font-size:clamp(1.5rem,2.5vw,2.1rem);letter-spacing:-.5px;color:var(--primary);font-weight:800}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat,.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.stat{padding:20px}.stat small{color:var(--muted);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.3px}.stat strong{display:block;font-size:1.75rem;margin-top:8px;color:var(--primary);font-weight:800}
.panel{padding:24px;margin-top:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}

.table-wrap{width:100%;overflow-x:auto;margin-top:14px;border:1px solid var(--border);border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}
.friendly-table{width:100%;border-collapse:collapse;font-size:.95rem}
.friendly-table th{background:#f1f5f9;color:var(--primary);padding:14px 16px;text-align:left;font-weight:800;border-bottom:1px solid var(--border);white-space:nowrap}
.friendly-table td{padding:14px 16px;border-bottom:1px solid var(--border);color:#334155;vertical-align:middle}
.friendly-table tr:hover{background:#f8fafc}

.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.badge-success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}
.badge-warning{background:#fefce8;color:#a16207;border:1px solid #fef08a}
.badge-danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.badge-info{background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form-grid .full-col{grid-column:1/-1}
.section-title{font-weight:800;margin:20px 0 12px;color:var(--primary);font-size:1.1rem}
.mobile-menu{display:none}

@media (max-width:1050px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:72px;bottom:0;width:min(85vw,300px);z-index:45;
    transform:translateX(-105%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:20px 0 40px rgba(0,0,0,.2)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:inline-flex;align-items:center;justify-content:center}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:16px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbyWvJXKr1QZ1zwbeJDoULTUihycj1771SsDlGFy8jnuF4i3DsEbHXlcJU48VDAg17fqDA/exec';

const ROLE_MENUS = {
  SEKOLAH: [
    { category:'UTAMA', items:[{id:'home', label:'Beranda Utama'}, {id:'pesan', label:'Pesan & Koordinasi'}]},
    { category:'RKAS & KEUANGAN', items:[{id:'rkasReview', label:'RKAS & Realisasi'},{id:'transaksi', label:'Transaksi SPJ'}]},
    { category:'PELAPORAN SPJ', items:[{id:'dokumenBulanan', label:'Dokumen SPJ Semesteran'},{id:'statusSpj', label:'Status SPJ'}]}
  ],
  DINAS: [
    { category:'UTAMA', items:[{id:'home', label:'Dashboard Dinas'},{id:'dinasMonitoring', label:'Command Center Dinas'}, {id:'pesan', label:'Pusat Pesan & Teguran'}]},
    { category:'MANAJEMEN', items:[{id:'sekolah', label:'Daftar Sekolah'},{id:'penugasan', label:'Penugasan Pengawas'},{id:'rkasReview', label:'Review & Usulan RKAS'}]},
    { category:'MONITORING & AUDIT', items:[{id:'crosscheck', label:'Pemeriksaan SPJ'},{id:'temuan', label:'Temuan SPJ'},{id:'dbCheck', label:'Validasi Database'}]}
  ],
  PENGAWAS: [
    { category:'UTAMA', items:[{id:'home', label:'Beranda Pengawas'},{id:'penugasan', label:'Sekolah Binaan'}, {id:'pesan', label:'Pesan & Feedback'}]},
    { category:'PEMERIKSAAN', items:[{id:'crosscheck', label:'Cross-check SPJ'},{id:'temuan', label:'Temuan & Verifikasi'},{id:'asesmen', label:'Asesmen SPJ'}]}
  ]
};

const COMPONENT_FALLBACK = [
  ['SPJ-01','Buku Kas Umum (BKU)'],['SPJ-02','Buku Pembantu Bank'],['SPJ-03','Buku Pembantu Kas Tunai'],
  ['SPJ-04','Buku Pembantu Pajak'],['SPJ-05','Rekening Koran Bank'],['SPJ-06','Invoice / Nota / Kuitansi'],
  ['SPJ-07','Bukti Pendukung Lainnya'],['SPJ-08','SSP Pajak Pusat'],['SPJ-09','SSP Pajak Daerah'],['SPJ-10','Foto / Dokumentasi']
].map(([id,nama])=>({id,nama}));

const state = {
  token: sessionStorage.getItem('simpel_token') || '',
  user: null,
  view: 'home',
  selectedPeriode: '',
  selectedNpsn: '',
  masterSpj: [],
  importedTransactions: [],
  captchaAns: 0
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRupiah = v => {
  const n = Number(v);
  return Number.isFinite(n) ? new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n) : '-';
};
const fmtNum = v => Number.isFinite(Number(v)) ? new Intl.NumberFormat('id-ID').format(Number(v)) : '-';
const msg = (text,type='error') => `<div class="message ${type}">${esc(text)}</div>`;
const badge = (text,type='info') => `<span class="badge badge-${type}">${esc(text || '-')}</span>`;
const role = () => String(state.user?.role || '').toUpperCase();
const isSchool = () => role()==='SEKOLAH';
const isDinas = () => role()==='DINAS';
const isPengawas = () => role()==='PENGAWAS';
const ownNpsn = () => String(state.user?.npsn || state.user?.username || '').trim();

function formatUserLabel(username, namaPengguna){
  if(!username && !namaPengguna) return '-';
  if(!namaPengguna) return esc(username);
  return `<b>${esc(username)}</b> <span style="color:var(--muted);font-size:0.88rem">(${esc(namaPengguna)})</span>`;
}

function errorText(err){ return err?.message || String(err || 'Terjadi kesalahan.'); }
function loading(text='Memuat data...'){ return `<div class="loading-container"><img src="bidangsd.png" class="loading-logo" alt="Loading"><div class="loading-text">${esc(text)}</div></div>`; }
function head(title,desc=''){ return `<div class="page-head"><div><h1>${esc(title)}</h1>${desc?`<div class="muted">${esc(desc)}</div>`:''}</div></div>`; }
function emptyRow(cols,text='Tidak ada data.'){ return `<tr><td colspan="${cols}" class="muted" style="text-align:center;padding:25px">${esc(text)}</td></tr>`; }

async function api(action, payload={}){
  const body = { action, ...payload };
  if(state.token) body.token = state.token;
  const response = await fetch(API_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(!response.ok) throw new Error(`Server HTTP ${response.status}`);
  const data = await response.json();
  if(!data.success) throw new Error(data.message || 'Permintaan gagal.');
  return data;
}
async function safeApi(action,payload={},fallback=null){ try{return await api(action,payload);}catch(e){return fallback;} }

function generateMathCaptcha(){
  const a=Math.floor(Math.random()*7)+2, b=Math.floor(Math.random()*6)+1;
  state.captchaAns=a+b; return `Berapa hasil ${a} + ${b} ?`;
}

function authView(notice=''){
  document.body.style.background='var(--bg)';
  $('#app').innerHTML=`
    <main class="auth">
      <section class="auth-side"><div class="auth-side-inner">
        <div class="brand">
          <img src="bidangsd.png" class="app-logo" alt="Logo">
          <div><h2 style="color:#fff">SIMPEL SPJ</h2><small style="color:#cbd5e1">Kabupaten Rembang</small></div>
        </div>
        <h1>Sistem Penilaian SPJ BOS SD Kabupaten Rembang.</h1>
        <p>Sistem terintegrasi tingkat lanjut untuk pencatatan BKU harian, pemeriksaan otomatis, hingga asesmen tata kelola keuangan berbasis RKAS.</p>
        
        <div class="footer-logos">
          <div class="footer-logo-item">
            <img src="logorembang.png" alt="Rembang">
            <div><span>DINDIKPORA REMBANG</span><small>Pemerintah Kab. Rembang</small></div>
          </div>
          <div class="footer-logo-item">
            <img src="logopendidikan.png" alt="Kemdikdasmen">
            <div><span>KEMENDIKDASMEN RI</span><small>Direktorat SD</small></div>
          </div>
        </div>
      </div></section>

      <section class="auth-panel"><div class="auth-card">
        <div class="brand" style="margin-bottom:20px">
          <img src="bidangsd.png" class="app-logo" alt="Logo">
          <div><h2>SIMPEL SPJ</h2><small>Silakan masuk ke akun Anda</small></div>
        </div>
        ${notice}
        <form id="loginForm">
          <div class="field"><label>Username / NPSN</label><input id="username" required autocomplete="username" placeholder="Masukkan username atau NPSN"></div>
          <div class="field"><label>Kata Sandi</label><input id="password" type="password" required autocomplete="current-password" placeholder="Masukkan password"></div>
          <div class="field"><label>Verifikasi Keamanan (${generateMathCaptcha()})</label><input id="captchaInput" type="number" required placeholder="Jawaban angka"></div>
          <div id="authMsg"></div>
          <button class="btn btn-primary full" type="submit" style="margin-top:8px">Masuk ke Aplikasi</button>
        </form>
        <div style="text-align:center;margin-top:16px">
          <a href="#" onclick="showRegisterView(event)" style="color:var(--primary-2);font-weight:700;font-size:0.9rem;text-decoration:none">Belum punya akun? Pendaftaran Akun Baru</a>
        </div>
      </div></section>
    </main>`;
}

async function doLogin(e){
  e.preventDefault();
  if(Number($('#captchaInput').value)!==state.captchaAns){$('#authMsg').innerHTML=msg('Jawaban verifikasi salah.');return;}
  try{
    const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});
    state.token=r.token; state.user=r.user || {};
    sessionStorage.setItem('simpel_token',state.token);
    showWelcomeAnimation(() => { startApp(); });
  }catch(err){$('#authMsg').innerHTML=msg(errorText(err));}
}

window.showRegisterView = function(e) {
  if(e) e.preventDefault();
  const card = $('.auth-card');
  if(!card) return;
  card.innerHTML = `
    <div class="brand" style="margin-bottom:16px">
      <img src="bidangsd.png" class="app-logo" alt="Logo">
      <div><h2>SIMPEL SPJ</h2><small>Pendaftaran Akun Baru (Sekolah / Pengawas)</small></div>
    </div>
    <form id="registerForm">
      <div class="field">
        <label>Pilih Peran (Role)</label>
        <select id="regRole" required onchange="toggleRegisterFields()">
          <option value="SEKOLAH">Satuan Pendidikan (Sekolah)</option>
          <option value="PENGAWAS">Pengawas Pembina</option>
        </select>
      </div>

      <div class="field" id="fieldNpsnGroup">
        <label>NPSN Sekolah</label>
        <input id="regNpsn" placeholder="Contoh: 20301234" onblur="autoFillSekolahByNpsn(this.value)">
        <small class="muted" style="font-size:0.75rem;">Ketik NPSN lalu klik di luar kotak untuk mengisi nama sekolah otomatis.</small>
      </div>

      <div class="field" id="fieldNamaGroup">
        <label id="labelNamaUser">Nama Satuan Pendidikan</label>
        <input id="regNamaSekolah" required placeholder="Contoh: SD Negeri 1 Rembang">
      </div>

      <!-- BAGIAN NIP PENGAWAS YANG DISINKRONKAN DENGAN USERNAME -->
      <div class="field" id="fieldNipGroup" style="display:none">
        <label>NIP / ID Pengawas</label>
        <input id="regNip" placeholder="Contoh: 196611061986081001" oninput="$('#regUsername').value = this.value">
        <small class="muted" style="font-size:0.75rem;">Username login akan terisi otomatis dari NIP/ID yang diketik.</small>
      </div>

      <div class="field">
        <label id="labelUsername">Username</label>
        <input id="regUsername" required placeholder="Username untuk login">
      </div>

      <div class="field">
        <label>Kata Sandi</label>
        <input id="regPassword" type="password" required placeholder="Minimal 6 karakter">
      </div>

      <div id="regMsg"></div>
      <button class="btn btn-primary full" type="submit" style="margin-top:10px">Daftarkan Akun Sekarang</button>
      <div style="text-align:center;margin-top:14px">
        <a href="#" onclick="authView()" style="color:var(--muted);font-size:0.88rem;text-decoration:none">← Kembali ke Halaman Masuk</a>
      </div>
    </form>`;

  toggleRegisterFields();

  $('#registerForm').onsubmit = async ev => {
    ev.preventDefault();
    const roleVal = $('#regRole').value;
    const payload = {
      role: roleVal,
      npsn: roleVal === 'SEKOLAH' ? $('#regNpsn').value.trim() : '',
      nama_sekolah: roleVal === 'SEKOLAH' ? $('#regNamaSekolah').value.trim() : '',
      username: $('#regUsername').value.trim(),
      password: $('#regPassword').value,

let cachedPeriodeList = [
  { id_periode: 'SEM-1-2026', nama_periode: 'Semester 1 (Januari - Juni 2026)' },
  { id_periode: 'SEM-2-2026', nama_periode: 'Semester 2 (Juli - Desember 2026)' }
];

async function ensurePeriodeMaster() {
  try {
    const res = await safeApi('getPeriodeSPJ', {}, null);
    if (res && res.data && res.data.length > 0) {
      cachedPeriodeList = res.data;
    }
  } catch (e) {}
}

async function periodeSelect(id = 'periodeSelect', required = true, mode = 'semester') {
  await ensurePeriodeMaster();
  
  let optionsHtml = '';
  const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  if (mode === 'bulan') {
    let bulanList = cachedPeriodeList.filter(p => Number(p.bulan) >= 1 && Number(p.bulan) <= 12);
    if (!bulanList.length) {
      bulanList = namaBulan.map((nama, i) => ({
        id_periode: `PER-2026-${String(i+1).padStart(2,'0')}`,
        nama_periode: `${nama} 2026`
      }));
    }
    optionsHtml = bulanList.map(p => `<option value="${esc(p.id_periode)}">${esc(p.nama_periode || p.id_periode)}</option>`).join('');
  } else {
    let semList = cachedPeriodeList.filter(p => String(p.id_periode).startsWith('SEM'));
    if (!semList.length) {
      semList = [
        { id_periode: 'SEM-1-2026', nama_periode: 'Semester 1 (Januari - Juni 2026)' },
        { id_periode: 'SEM-2-2026', nama_periode: 'Semester 2 (Juli - Desember 2026)' }
      ];
    }
    optionsHtml = semList.map(s => `<option value="${esc(s.id_periode)}">${esc(s.nama_periode || s.id_periode)}</option>`).join('');
  }

  return `<select id="${id}" ${required ? 'required' : ''}><option value="">-- Pilih Periode (${mode === 'bulan' ? 'Bulanan' : 'Semesteran'}) --</option>${optionsHtml}</select>`;
}

  const f=$('#excelFile').files[0], out=$('#excelPreview');if(!f){out.innerHTML=msg('Pilih file Excel.');return;}
  if(typeof XLSX==='undefined'){out.innerHTML=msg('Library Excel belum tersedia.');return;}
  const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}), ws=wb.Sheets[wb.SheetNames[0]], rows=XLSX.utils.sheet_to_json(ws,{header:1});
    const data=[];
    rows.slice(16).forEach(row=>{
      const tanggal=row[0], kodeKegi=row[3], kodeReken=row[5], bukti=row[7], uraian=row[9], penerimaan=Number(row[13])||0, pengeluaran=Number(row[16])||0;
      if(String(tanggal)>='1'&&String(tanggal)<='8'&&!String(tanggal).includes('-')) return;
      const hasPenerimaan = penerimaan > 0;
      const hasPengeluaranOrCode = (pengeluaran > 0 || (kodeKegi && kodeReken));
      if(!hasPenerimaan && !hasPengeluaranOrCode) return;
      data.push({
        tanggal:String(tanggal).trim(),
        kode_rekening:kodeReken?String(kodeReken).trim():'-',
        nomor_bukti:String(bukti||'-').trim(),
        uraian_transaksi:String(uraian||(hasPenerimaan?'Penerimaan Dana / Kas Masuk BKU':'Transaksi BKU')).trim(),
        nilai_transaksi:pengeluaran||penerimaan
      });
    });
    state.importedTransactions=data;
    out.innerHTML=msg(`Berhasil membaca ${data.length} transaksi valid.`,'ok')+`<div class="table-wrap"><table class="friendly-table"><thead><tr><th>Tanggal</th><th>Kode Rekening</th><th>No Bukti</th><th>Uraian</th><th>Nilai</th></tr></thead><tbody>${data.slice(0,50).map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.kode_rekening)}</td><td>${esc(x.nomor_bukti)}</td><td>${esc(x.uraian_transaksi)}</td><td>${fmtRupiah(x.nilai_transaksi)}</td></tr>`).join('')}</tbody></table></div><button class="btn btn-primary" style="margin-top:12px" onclick="saveImportedTransactions()">Simpan Transaksi</button>`;
  }catch(err){out.innerHTML=msg(errorText(err));}};r.readAsArrayBuffer(f);
};

  alert(`Selesai. Berhasil: ${ok}. Gagal: ${fail}.`);$('#excelModal')?.remove();await renderTransaksi();
};

  document.body.appendChild(wrap);

  $('#formKirimPesan').onsubmit = async e => {
    e.preventDefault();

      await api('kirimPesan', { data: { tujuan: $('#pesanTujuan').value, subjek: $('#pesanSubjek').value.trim(), isi_pesan: $('#pesanIsi').value.trim(), kategori: isSchool()?'FEEDBACK':'INFORMASI', pengirim: state.user?.username || ownNpsn() } });
      alert('Pesan berhasil dikirim!'); $('#pesanModal').remove(); await loadPesanData();
    } catch(err) { $('#pesanModalMsg').innerHTML = msg(errorText(err)); }
  };
};

window.openBalasPesanModal = function(idPesan, pengirimAsal) {

      await api('kirimPesan', { data: { tujuan: pengirimAsal, subjek: 'Re: Balasan Pesan', isi_pesan: isi, kategori: 'BALASAN', pengirim: state.user?.username || ownNpsn() } });

window.loadFindings=async function(){

window.openAssessment=async function(){
  const p=$('#periodeSelect').value,n=isSchool()?ownNpsn():$('#npsnSelect')?.value;if(!p||!n){alert('Wajib pilih periode & sekolah.');return;}
  state.selectedPeriode=p;state.selectedNpsn=n;const a=$('#assessmentArea');a.innerHTML=loading();
  try{const r=await api('buatAtauAmbilAsesmen',{idPeriode:p,npsn:n});const indRes=await safeApi('hitungIndikatorDariTemuan',{idPeriode:p,npsn:n},{data:[]});renderAssessment(r,indRes.data||[]);;}catch(e){a.innerHTML=msg(errorText(e));}

function renderAssessment(r, indicators){
  const a=r.data||r.asesmen||r;
  const rows=indicators.map(d=>`<tr><td>${esc(d.kode_indikator)}</td><td>${esc(d.nama_indikator)}</td><td>${esc(d.bobot)}</td><td><b>${esc(d.skor)}</b></td><td>${isPengawas()?`<button class="btn btn-sm btn-primary" onclick="editScore('${esc(a.id_asesmen)}','${esc(d.id_indikator)}',${d.skor})">Edit</button>`:'-'}</td></tr>`).join('');
  $('#assessmentArea').innerHTML=`<div class="cards"><div class="stat"><small>Status</small><strong style="font-size:1.1rem">${esc(a.status_asesmen||'-')}</strong></div><div class="stat"><small>Nilai</small><strong>${a.nilai_kualitas??'-'}</strong></div><div class="stat"><small>Kompleksitas</small><strong>${a.indeks_kompleksitas??'-'}</strong></div><div class="stat"><small>Nilai Akhir</small><strong>${a.nilai_akhir??'-'}</strong></div></div><div class="table-wrap"><table class="friendly-table"><thead><tr><th>Kode</th><th>Indikator</th><th>Bobot</th><th>Skor</th><th>Aksi</th></tr></thead><tbody>${rows||emptyRow(5)}</tbody></table></div>`;
}
window.editScore=async function(idAsesmen, idIndikator, current){
  const v=prompt('Masukkan skor (0-4):',current??4);if(v===null)return;const n=Number(v);if(n<0||n>4)return;
  try{await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:n,catatan_pengawas:'',status_berlaku:'BERLAKU'}});await openAssessment();}catch(e){alert(errorText(e));}
};

function formatSekolahLabel(npsn, namaSekolah = '', kecamatan = '') {
  if (!npsn) return '-';
  const cleanNpsn = esc(npsn);
  const cleanNama = esc(namaSekolah || 'Satuan Pendidikan');
  const cleanKec = esc(kecamatan ? `Kec. ${kecamatan}` : '');
  return `<b>${cleanNpsn}</b> — ${cleanNama} ${cleanKec ? `<small class="muted">(${cleanKec})</small>` : ''}`;
}

function formatPengawasLabel(idPengawas, namaPengguna = '') {
  if (!idPengawas) return '-';
  return `<b>${esc(idPengawas)}</b> ${namaPengguna ? `<span style="color:var(--muted);font-size:0.88rem">(${esc(namaPengguna)})</span>` : ''}`;
}

window.autoFillSekolahByNpsn = async function(npsn) {
  if(!npsn || npsn.trim().length < 4) return;
  const cleanNpsn = npsn.trim();
  const namaSekolahInput = $('#regNamaSekolah');
  const usernameInput = $('#regUsername');
  
  if(namaSekolahInput) namaSekolahInput.value = 'Mencari data sekolah...';
  if(usernameInput) usernameInput.value = cleanNpsn;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getSekolah' })
    });
    const res = await response.json();
    const list = Array.isArray(res) ? res : (res.data || res.sekolah || []);
    const found = list.find(s => String(s.npsn || s.NPSN || '').trim() === cleanNpsn);
    if(found) {
      const namaVal = found.nama_sekolah || found.nama_satuan_pendidikan || found.nama || found.sekolah || '';
      if(namaSekolahInput) namaSekolahInput.value = namaVal;
    } else {
      if(namaSekolahInput) namaSekolahInput.value = '';
      alert('NPSN tidak ditemukan di database tabel sekolah. Silakan ketik nama satuan pendidikan secara manual.');
    }
  } catch(e) {
    if(namaSekolahInput) namaSekolahInput.value = '';
    console.warn('Gagal memuat otomatis nama sekolah:', e.message);
  }
};
