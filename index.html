<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPEL SPJ — Kabupaten Rembang</title>
<!-- SheetJS untuk membaca file Excel BKU secara lokal -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#0f5132;--primary-2:#146c43;--primary-3:#198754;
  --accent:#f0a500;--bg:#f4f7f5;--surface:#fff;--surface-2:#eaf2ec;
  --text:#18231d;--muted:#5f6e65;--border:#d4e2d8;--danger:#b42318;--success:#198754;
  --shadow:0 10px 30px rgba(15,81,50,.08);--radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}

/* Brand & Logos */
.brand{display:flex;align-items:center;gap:12px}
.app-logo{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.brand h2{font-size:1.05rem;margin:0;font-weight:800;color:var(--primary)}
.brand small{color:var(--muted);font-size:.78rem}

.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;transition:.18s;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-2)}
.btn-secondary{background:#e2efe5;color:var(--primary)}
.btn-light{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fee4e2;color:var(--danger)}
.btn-sm{padding:6px 12px;min-height:32px;font-size:.82rem;border-radius:8px}
.full{width:100%}

/* Landing / login */
.auth{
  min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);
  background: linear-gradient(rgba(11, 61, 39, 0.9), rgba(18, 100, 61, 0.85));
  position:relative;
}
.auth-side{color:#fff;padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:space-between}
.auth-side-inner{max-width:680px;margin:auto 0}
.auth-side h1{font-size:clamp(1.9rem,4vw,3.8rem);line-height:1.1;margin:20px 0 14px;letter-spacing:-1px}
.auth-side p{max-width:580px;line-height:1.7;color:#e9f6ed;font-size:1rem}

.auth-panel{display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,36px);background:rgba(248,251,249,.98)}
.auth-card{width:min(100%,440px);background:#fff;border:1px solid var(--border);border-radius:24px;padding:clamp(20px,4vw,32px);box-shadow:var(--shadow)}

.field{margin:14px 0}
.field label{display:block;font-size:.88rem;font-weight:700;margin-bottom:6px;color:#2c3e35}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;outline:0;background:#fff;min-height:46px;font-size:.95rem}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-3);box-shadow:0 0 0 3px rgba(25,135,84,.12)}
.message{padding:12px 14px;border-radius:12px;margin:12px 0;font-size:.9rem}
.message.error{background:#fff0ef;color:var(--danger)}.message.ok{background:#e9f8ef;color:#146c43}

/* Application shell */
.dashboard{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px clamp(16px,3vw,30px)
}
.topbar .brand{margin:0}.top-actions{display:flex;align-items:center;gap:10px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 66px)}

.sidebar{background:linear-gradient(180deg,#0c4229,#082c1b);color:#dff3e5;padding:20px 12px;display:flex;flex-direction:column;justify-content:space-between}
.nav-group{display:flex;flex-direction:column;gap:3px}
.nav-section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:#8ab59b;margin:16px 0 6px 10px;font-weight:800}
.nav-btn{
  width:100%;text-align:left;border:0;background:transparent;color:#dceee2;padding:11px 13px;
  border-radius:12px;font-weight:650;display:flex;align-items:center;gap:10px;font-size:.88rem;transition:.15s
}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.12);color:#fff}

.content{padding:clamp(20px,3vw,34px);min-width:0;max-width:1450px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{margin:0;font-size:clamp(1.4rem,2.5vw,2rem);letter-spacing:-.5px;color:#11291b}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat,.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.stat{padding:18px}.stat small{color:var(--muted);font-weight:600;font-size:.82rem}.stat strong{display:block;font-size:1.6rem;margin-top:6px;color:#0f5132}
.panel{padding:20px;margin-top:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.table-wrap{width:100%;overflow-x:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:#fff}
.friendly-table{width:100%;border-collapse:collapse;font-size:.88rem}
.friendly-table th{background:#f0f5f1;color:#183824;padding:11px 13px;text-align:left;font-weight:750;border-bottom:1px solid var(--border);white-space:nowrap}
.friendly-table td{padding:11px 13px;border-bottom:1px solid var(--border);color:#2b3a32;vertical-align:middle}
.friendly-table tr:hover{background:#f8fbf9}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:750;text-transform:uppercase}
.badge-success{background:#e9f8ef;color:#146c43}
.badge-warning{background:#fef3c7;color:#b45309}
.badge-danger{background:#fee4e2;color:#b42318}
.badge-info{background:#e0f2fe;color:#0369a1}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.form-grid .full-col{grid-column:1/-1}
.section-title{font-weight:800;margin:18px 0 10px;color:var(--primary);font-size:1.05rem}
.mobile-menu{display:none}

@media (max-width:1050px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:66px;bottom:0;width:min(82vw,280px);z-index:45;
    transform:translateX(-105%);transition:transform .22s;box-shadow:15px 0 30px rgba(0,0,0,.15)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:inline-flex;align-items:center;justify-content:center}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:18px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
'use strict';

/* ============================================================================
 * SIMPEL SPJ - FRONTEND MASTER
 * Sinkron dengan code.gs compiled backend
 * ========================================================================== */

// ============================================================================
// 01. KONFIGURASI
// ============================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbyWvJXKr1QZ1zwbeJDoULTUihycj1771SsDlGFy8jnuF4i3DsEbHXlcJU48VDAg17fqDA/exec';

const ROLE_MENUS = {
  SEKOLAH: [
    { category:'UTAMA', items:[
      {id:'home', label:'Beranda'}
    ]},
    { category:'RKAS & KEUANGAN', items:[
      {id:'rkasReview', label:'RKAS'},
      {id:'transaksi', label:'Transaksi SPJ'}
    ]},
    { category:'PELAPORAN SPJ', items:[
      {id:'dokumenBulanan', label:'Dokumen SPJ Bulanan'},
      {id:'statusSpj', label:'Status SPJ'}
    ]}
  ],
  DINAS: [
    { category:'UTAMA', items:[
      {id:'home', label:'Dashboard Dinas'},
      {id:'sekolah', label:'Daftar Sekolah'}
    ]},
    { category:'MANAJEMEN', items:[
      {id:'penugasan', label:'Penugasan Pengawas'},
      {id:'rkasReview', label:'Review RKAS'}
    ]},
    { category:'MONITORING', items:[
      {id:'crosscheck', label:'Pemeriksaan SPJ'},
      {id:'temuan', label:'Temuan SPJ'},
      {id:'dbCheck', label:'Validasi Database'}
    ]}
  ],
  PENGAWAS: [
    { category:'UTAMA', items:[
      {id:'home', label:'Beranda Pengawas'},
      {id:'penugasan', label:'Sekolah Binaan'}
    ]},
    { category:'PEMERIKSAAN', items:[
      {id:'crosscheck', label:'Cross-check SPJ'},
      {id:'temuan', label:'Temuan & Verifikasi'},
      {id:'asesmen', label:'Asesmen SPJ'}
    ]}
  ]
};

const COMPONENT_FALLBACK = [
  ['SPJ-01','Buku Kas Umum (BKU)'],
  ['SPJ-02','Buku Pembantu Bank'],
  ['SPJ-03','Buku Pembantu Kas Tunai'],
  ['SPJ-04','Buku Pembantu Pajak'],
  ['SPJ-05','Rekening Koran Bank'],
  ['SPJ-06','Invoice / Nota / Kuitansi'],
  ['SPJ-07','Bukti Pendukung Lainnya'],
  ['SPJ-08','SSP Pajak Pusat'],
  ['SPJ-09','SSP Pajak Daerah'],
  ['SPJ-10','Foto / Dokumentasi']
].map(([id,nama])=>({id,nama}));

// ============================================================================
// 02. STATE & UTILITAS
// ============================================================================
const state = {
  token: sessionStorage.getItem('simpel_token') || '',
  user: null,
  view: 'home',
  selectedPeriode: '',
  selectedNpsn: '',
  masterSpj: [],
  periode: [],
  importedTransactions: [],
  captchaAns: 0,
  busy: false
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRupiah = v => {
  const n = Number(v);
  return Number.isFinite(n) ? new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n) : '-';
};
const fmtNum = v => Number.isFinite(Number(v)) ? new Intl.NumberFormat('id-ID').format(Number(v)) : '-';
const msg = (text,type='error') => `<div class="message ${type}">${esc(text)}</div>`;
const badge = (text,type='info') => `<span class="badge badge-${type}">${esc(text || '-')}</span>`;
const role = () => String(state.user?.role || '').toUpperCase();
const isSchool = () => role()==='SEKOLAH';
const isDinas = () => role()==='DINAS';
const isPengawas = () => role()==='PENGAWAS';
const ownNpsn = () => String(state.user?.npsn || state.user?.username || '').trim();

function errorText(err){ return err?.message || String(err || 'Terjadi kesalahan.'); }
function loading(text='Memuat data...'){ return `<p class="muted">${esc(text)}</p>`; }
function head(title,desc=''){
  return `<div class="page-head"><div><h1>${esc(title)}</h1>${desc?`<div class="muted">${esc(desc)}</div>`:''}</div></div>`;
}
function emptyRow(cols,text='Tidak ada data.'){
  return `<tr><td colspan="${cols}" class="muted" style="text-align:center;padding:25px">${esc(text)}</td></tr>`;
}

// ============================================================================
// 03. API CLIENT
// ============================================================================
async function api(action, payload={}){
  const body = { action, ...payload };
  if(state.token) body.token = state.token;

  const response = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)
  });

  if(!response.ok) throw new Error(`Server HTTP ${response.status}`);
  const data = await response.json();
  if(!data.success) throw new Error(data.message || 'Permintaan gagal.');
  return data;
}

async function safeApi(action,payload={},fallback=null){
  try{return await api(action,payload);}catch(e){return fallback;}
}

// ============================================================================
// 04. AUTHENTICATION
// ============================================================================
function generateMathCaptcha(){
  const a=Math.floor(Math.random()*7)+2;
  const b=Math.floor(Math.random()*6)+1;
  state.captchaAns=a+b;
  return `Berapa hasil ${a} + ${b} ?`;
}

function authView(notice=''){
  document.body.style.background='var(--bg)';
  $('#app').innerHTML=`
    <main class="auth">
      <section class="auth-side">
        <div class="auth-side-inner">
          <div class="brand"><div class="app-logo">SPJ</div><div><h2 style="color:#fff">SIMPEL SPJ</h2><small style="color:#d9eee0">Kabupaten Rembang</small></div></div>
          <h1>Penilaian SPJ BOS SD yang terstruktur.</h1>
          <p>Pengelolaan RKAS, dokumen SPJ, transaksi, pemeriksaan silang, temuan, dan asesmen berada dalam satu alur kerja.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="brand"><div class="app-logo">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Masuk ke sistem</small></div></div>
          ${notice}
          <form id="loginForm">
            <div class="field"><label>Username / NPSN</label><input id="username" required autocomplete="username" placeholder="Masukkan username atau NPSN"></div>
            <div class="field"><label>Kata Sandi</label><input id="password" type="password" required autocomplete="current-password" placeholder="Masukkan password"></div>
            <div class="field"><label>Verifikasi Keamanan (${generateMathCaptcha()})</label><input id="captchaInput" type="number" required placeholder="Jawaban angka"></div>
            <div id="authMsg"></div>
            <button class="btn btn-primary full" type="submit">Masuk ke Aplikasi</button>
          </form>
        </div>
      </section>
    </main>`;
}

async function doLogin(e){
  e.preventDefault();
  if(Number($('#captchaInput').value)!==state.captchaAns){
    $('#authMsg').innerHTML=msg('Jawaban verifikasi salah.');
    return;
  }
  try{
    const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});
    state.token=r.token;
    state.user=r.user || {};
    sessionStorage.setItem('simpel_token',state.token);
    await startApp();
  }catch(err){ $('#authMsg').innerHTML=msg(errorText(err)); }
}

async function restoreSession(){
  if(!state.token){authView();return;}
  try{
    const r=await api('getSession');
    if(!r.data) throw new Error('Sesi berakhir.');
    state.user=r.data;
    await startApp();
  }catch(e){
    state.token=''; state.user=null; sessionStorage.removeItem('simpel_token'); authView();
  }
}

async function logout(){
  try{if(state.token) await api('logout');}catch(e){}
  state.token=''; state.user=null;
  sessionStorage.removeItem('simpel_token');
  authView(msg('Anda telah keluar dari aplikasi.','ok'));
}

// ============================================================================
// 05. APP SHELL & NAVIGATION
// ============================================================================
async function startApp(){
  document.body.style.background='var(--bg)';
  renderShell();
  await loadView('home');
}

function renderShell(){
  const menus=ROLE_MENUS[role()] || ROLE_MENUS.SEKOLAH;
  $('#app').innerHTML=`
    <main class="dashboard">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn btn-light mobile-menu" id="menuBtn">☰</button>
          <div class="brand"><div class="app-logo">SPJ</div><div><h2>SIMPEL SPJ</h2><small>${esc(role())}</small></div></div>
        </div>
        <div class="top-actions"><span class="muted">${esc(state.user?.nama_pengguna || state.user?.username || '')}</span><button class="btn btn-light" id="logoutBtn">Keluar</button></div>
      </header>
      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <div class="nav-group">
            ${menus.map(g=>`<div class="nav-section-title">${esc(g.category)}</div>${g.items.map(n=>`<button class="nav-btn" data-view="${esc(n.id)}">${esc(n.label)}</button>`).join('')}`).join('')}
          </div>
        </aside>
        <section class="content" id="mainContent"></section>
      </div>
    </main>`;

  $$('[data-view]').forEach(b=>b.onclick=()=>{loadView(b.dataset.view);$('#sidebar')?.classList.remove('open');});
  $('#logoutBtn').onclick=logout;
  $('#menuBtn').onclick=()=>$('#sidebar')?.classList.toggle('open');
}

function setActive(view){
  $$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
}

async function loadView(view){
  state.view=view; setActive(view);
  const c=$('#mainContent'); if(!c)return;
  c.innerHTML=loading('Memuat modul...');
  try{
    const map={
      home:homeView,
      dokumenBulanan:dokumenBulananView,
      statusSpj:statusSpjView,
      transaksi:transaksiView,
      sekolah:sekolahView,
      penugasan:penugasanView,
      rkasReview:rkasView,
      crosscheck:crosscheckView,
      temuan:temuanView,
      asesmen:asesmenView,
      dbCheck:dbCheckView
    };
    if(!map[view]) throw new Error('Modul belum tersedia: '+view);
    await map[view]();
  }catch(e){c.innerHTML=msg(errorText(e));}
}

// ============================================================================
// 06. DASHBOARD
// ============================================================================
async function homeView(){
  const r=await safeApi('getRingkasanSPJBulanan',{idPeriode:state.selectedPeriode||''},null);
  const summary=r?.ringkasan || {};
  $('#mainContent').innerHTML=head(`Beranda ${role()}`,'Ringkasan akses dan pekerjaan SIMPEL SPJ')+
    `<div class="cards">
      <div class="stat"><small>Pengguna</small><strong style="font-size:1.1rem">${esc(state.user?.nama_pengguna||'-')}</strong></div>
      <div class="stat"><small>Peran</small><strong>${esc(role())}</strong></div>
      <div class="stat"><small>NPSN</small><strong style="font-size:1.1rem">${esc(state.user?.npsn||'-')}</strong></div>
      <div class="stat"><small>Status Sesi</small><strong>Aktif</strong></div>
    </div>
    <div class="panel">
      <h3 class="section-title" style="margin-top:0">Alur Kerja SIMPEL SPJ</h3>
      <div class="form-grid">
        <div><b>1. RKAS</b><p class="muted">RKAS aktif menjadi dasar transaksi SPJ.</p></div>
        <div><b>2. Transaksi</b><p class="muted">Transaksi dicatat dan dikaitkan dengan RKAS.</p></div>
        <div><b>3. Dokumen</b><p class="muted">10 komponen SPJ bulanan dilengkapi.</p></div>
        <div><b>4. Pemeriksaan</b><p class="muted">Sistem menghasilkan temuan untuk diverifikasi Pengawas.</p></div>
      </div>
    </div>`;
}

// ============================================================================
// 07. MASTER SPJ & PERIODE
// ============================================================================
async function ensureMasters(){
  if(!state.masterSpj.length){
    const r=await safeApi('getMasterSPJ',{},null);
    state.masterSpj=r?.data||[];
  }
  if(!state.periode.length){
    const r=await safeApi('getPeriodeSPJ',{},null);
    state.periode=r?.data||[];
  }
}

async function periodeSelect(id='periodeSelect',required=true){
  await ensureMasters();

  // Periode SPJ ditampilkan sebagai daftar bulan. Jika master periode sudah
  // tersedia di database, gunakan ID database dan nama bulan dari master.
  // Jika master belum terisi, sediakan fallback Januari–Desember 2026.
  const namaBulan=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  let periods=state.periode||[];

  if(!periods.length){
    periods=namaBulan.map((nama,i)=>({
      id_periode:`PER-2026-${String(i+1).padStart(2,'0')}`,
      nama_periode:`${nama} 2026`,
      tahun:2026,
      bulan:i+1
    }));
  }

  const options=periods.map(p=>{
    const bulan=Number(p.bulan||0);
    const tahun=Number(p.tahun||2026);
    const label=bulan>=1&&bulan<=12 ? `${namaBulan[bulan-1]} ${tahun}` : (p.nama_periode||p.id_periode);
    return `<option value="${esc(p.id_periode)}">${esc(label)}</option>`;
  }).join('');

  return `<select id="${id}" ${required?'required':''}><option value="">-- Pilih Bulan SPJ --</option>${options}</select>`;
}

async function componentList(){
  await ensureMasters();
  const active=state.masterSpj.filter(x=>String(x.status_aktif).toUpperCase()!=='NONAKTIF').sort((a,b)=>Number(a.urutan||0)-Number(b.urutan||0));
  return active.length?active.map(x=>({id:x.id_spj,nama:x.nama_spj})):COMPONENT_FALLBACK;
}

// ============================================================================
// 08. DOKUMEN SPJ SEKOLAH
// ============================================================================
async function dokumenBulananView(){
  const periods=await periodeSelect();
  $('#mainContent').innerHTML=head('Dokumen SPJ Bulanan','Unggah 10 komponen SPJ dan pantau statusnya')+
    `<div class="panel"><div class="form-grid"><div class="field"><label>Periode</label>${periods}</div></div><div id="dokumenArea" style="margin-top:18px">${msg('Pilih periode untuk menampilkan dokumen.','ok')}</div></div>`;
  $('#periodeSelect').value=state.selectedPeriode;
  $('#periodeSelect').onchange=()=>{state.selectedPeriode=$('#periodeSelect').value;renderDokumenTable();};
  if(state.selectedPeriode) await renderDokumenTable();
}

async function renderDokumenTable(){
  const area=$('#dokumenArea'); if(!area)return;
  const periode=$('#periodeSelect').value; if(!periode){area.innerHTML=msg('Pilih periode terlebih dahulu.','ok');return;}
  area.innerHTML=loading();
  const [docsRes,statusRes,components]=await Promise.all([
    api('getDokumenSPJ',{idPeriode:periode}),
    safeApi('statusSPJBulanan',{idPeriode:periode},null),
    componentList()
  ]);
  const docs=docsRes.data||[]; const statuses=statusRes?.data||[];
  const rows=components.map(c=>{
    const d=docs.filter(x=>String(x.id_spj)===String(c.id)).sort((a,b)=>Number(b.versi||0)-Number(a.versi||0))[0];
    const st=statuses.find(x=>String(x.id_spj)===String(c.id));
    const status=st?.status||d?.status||'BELUM_UPLOAD';
    let action='';
    if(status==='N/A') action=badge('N/A','warning');
    else if(d?.file_url) action=`<a class="btn btn-sm btn-secondary" href="${esc(d.file_url)}" target="_blank" rel="noopener">Lihat</a> <button class="btn btn-sm btn-light" onclick="openUpload('${esc(c.id)}','${esc(c.nama)}')">Ganti</button>`;
    else action=`<button class="btn btn-sm btn-primary" onclick="openUpload('${esc(c.id)}','${esc(c.nama)}')">Unggah PDF</button>`;
    if(['SPJ-04','SPJ-08','SPJ-09'].includes(String(c.id))) action+=` <button class="btn btn-sm btn-light" onclick="setNA('${esc(c.id)}')">N/A</button>`;
    const type=status==='SUDAH_UPLOAD'||status==='SELESAI_DINILAI'?'success':status==='N/A'||status==='PERLU_PERBAIKAN'?'warning':'danger';
    return `<tr><td><b>${esc(c.nama)}</b></td><td>${badge(status,type)}</td><td>${action}</td></tr>`;
  }).join('');
  area.innerHTML=`<div class="table-wrap"><table class="friendly-table"><thead><tr><th>Komponen</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows||emptyRow(3)}</tbody></table></div>`;

window.parseExcelBku=function(){
  const f=$('#excelFile').files[0], out=$('#excelPreview');if(!f){out.innerHTML=msg('Pilih file Excel.');return;}
  if(typeof XLSX==='undefined'){out.innerHTML=msg('Library Excel belum tersedia.');return;}
  const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}), ws=wb.Sheets[wb.SheetNames[0]], rows=XLSX.utils.sheet_to_json(ws,{header:1});
    const data=[];rows.forEach(row=>{const tanggal=row[0],kode=row[5],bukti=row[7],uraian=row[9],penerimaan=Number(row[13])||0,pengeluaran=Number(row[16])||0;if(!tanggal&&!uraian)return;if(penerimaan<=0&&pengeluaran<=0&&!kode)return;data.push({tanggal:String(tanggal||'').trim(),kode_rekening:String(kode||'').trim(),nomor_bukti:String(bukti||'').trim(),uraian_transaksi:String(uraian||'').trim(),nilai_transaksi:pengeluaran||penerimaan});});state.importedTransactions=data;out.innerHTML=msg(`Berhasil membaca ${data.length} transaksi.`,'ok')+`<div class="table-wrap"><table class="friendly-table"><thead><tr><th>Tanggal</th><th>Kode</th><th>No Bukti</th><th>Uraian</th><th>Nilai</th></tr></thead><tbody>${data.slice(0,50).map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.kode_rekening)}</td><td>${esc(x.nomor_bukti)}</td><td>${esc(x.uraian_transaksi)}</td><td>${fmtRupiah(x.nilai_transaksi)}</td></tr>`).join('')}</tbody></table></div><button class="btn btn-primary" onclick="saveImportedTransactions()">Simpan Transaksi</button>`;
  }catch(err){out.innerHTML=msg(errorText(err));}};r.readAsArrayBuffer(f);
};
window.saveImportedTransactions=async function(){
  const p=$('#periodeSelect').value;if(!state.importedTransactions.length)return;
  if(!confirm(`Simpan ${state.importedTransactions.length} transaksi ke server?`))return;
  let ok=0,fail=0;for(const x of state.importedTransactions){try{await api('simpanTransaksiSPJ',{data:{...x,id_periode:p}});ok++;}catch(e){fail++;}}
  alert(`Selesai. Berhasil: ${ok}. Gagal: ${fail}.`);$('#excelModal')?.remove();await renderTransaksi();
};

};
function renderAssessment(r){
  const a=r.data||r.asesmen||r;const details=r.details||r.detail||[];const rows=details.map(d=>`<tr><td>${esc(d.kode_indikator||d.id_indikator)}</td><td>${esc(d.nama_indikator||'-')}</td><td>${esc(d.metode_pemeriksaan||'-')}</td><td>${d.skor===''||d.skor==null?'-':esc(d.skor)}</td><td>${isPengawas()&&String(d.metode_pemeriksaan).toUpperCase()==='MANUAL'?`<button class="btn btn-sm btn-primary" onclick="editScore('${esc(d.id_detail)}',${esc(d.skor==null?'null':d.skor)})">Isi Skor</button>`:'-'}</td></tr>`).join('');
  $('#assessmentArea').innerHTML=`<div class="cards"><div class="stat"><small>Status</small><strong style="font-size:1.05rem">${esc(a.status_asesmen||'-')}</strong></div><div class="stat"><small>Nilai Kualitas</small><strong>${a.nilai_kualitas??'-'}</strong></div><div class="stat"><small>Kompleksitas</small><strong>${a.indeks_kompleksitas??'-'}</strong></div><div class="stat"><small>Nilai Akhir</small><strong>${a.nilai_akhir??'-'}</strong></div></div><div class="table-wrap"><table class="friendly-table"><thead><tr><th>Kode</th><th>Indikator</th><th>Metode</th><th>Skor</th><th>Aksi</th></tr></thead><tbody>${rows||emptyRow(5)}</tbody></table></div>${isPengawas()?`<div class="toolbar"><button class="btn btn-primary" onclick="finalizeAssessment('${esc(a.id_asesmen||r.id_asesmen||'')}')">Finalisasi Asesmen</button></div>`:''}`;
}
window.editScore=async function(idDetail,current){
  const v=prompt('Masukkan skor indikator 0 sampai 4:',current==null?'4':current);if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<0||n>4){alert('Skor harus bilangan bulat 0–4.');return;}
  try{await api('simpanDetailAsesmen',{data:{id_detail:idDetail,skor:n}});await openAssessment();}catch(e){alert(errorText(e));}
};
window.finalizeAssessment=async function(id){if(!id)return;if(!confirm('Finalisasi asesmen? Pastikan seluruh indikator yang wajib telah dinilai dan temuan telah diverifikasi.'))return;try{await api('finalisasiAsesmen',{idAsesmen:id});await openAssessment();}catch(e){alert(errorText(e));}};

// ============================================================================
// 16. VALIDASI DATABASE
// ============================================================================
async function dbCheckView(){
  $('#mainContent').innerHTML=head('Validasi Database','Memeriksa struktur 13 tabel SIMPEL SPJ')+`<div class="panel"><button class="btn btn-primary" onclick="runDbCheck()">Jalankan Validasi</button><div id="dbResult" style="margin-top:15px">${msg('Klik tombol untuk memulai.','ok')}</div></div>`;
}
window.runDbCheck=async function(){const r=$('#dbResult');r.innerHTML=loading();try{const x=await api('validateDatabaseStructure');r.innerHTML=msg(x.message||'Struktur database valid.','ok')+`<pre style="white-space:pre-wrap;background:#f7faf8;padding:12px;border-radius:10px">${esc(JSON.stringify(x.data||x,null,2))}</pre>`;}catch(e){r.innerHTML=msg(errorText(e));}};

// ============================================================================
// 17. INITIALIZATION
// ============================================================================
document.addEventListener('submit',e=>{if(e.target.id==='loginForm')doLogin(e);});
window.addEventListener('DOMContentLoaded',restoreSession);
</script>
</body>
