async function renderSchoolRkasAndRealisasi(){
  const area = $('#mainContent');
  if(!area) return;

  const schoolMode = isSchool();
  const schoolUser = state.user || {};
  const ownNpsn = normalizeNpsnClient(
    schoolUser.npsn ||
    schoolUser.npsn_sekolah ||
    schoolUser.npsnSekolah ||
    ''
  );

  if(schoolMode){
    area.innerHTML = head(
      'RKAS & Realisasi Anggaran',
      `Rincian RKAS sekolah ${esc(ownNpsn || '')}.`
    ) + `<div id="schoolRkasArea">${loading('Memuat rincian RKAS sekolah...')}</div>`;

    if(!ownNpsn){
      $('#schoolRkasArea').innerHTML = msg(
        'NPSN sekolah belum tersedia pada data sesi login. Silakan login ulang agar identitas sekolah dimuat.',
        'warning'
      );
      return;
    }

    try{
      // Mengambil data realisasi dan riwayat secara paralel
      const [real, h] = await Promise.all([
        safeApi('realisasiRKAS', { npsn: ownNpsn }, { data: [] }),
        safeApi('rkasHistory', { npsn: ownNpsn }, { data: [] })
      ]);

      const raw = Array.isArray(real.data) ? real.data : [];

      const norm = v => String(v ?? '').trim().toLowerCase().replace(/\s+/g,' ');
      const amount = v => {
        const n = Number(v);
        return Number.isFinite(n) ? n : norm(v);
      };

      const displayKey = x => [
        'ITEM',
        norm(x.npsn ?? ownNpsn),
        norm(x.kode_rekening ?? x.kodeRekening ?? x.kode),
        norm(x.uraian ?? x.nama_belanja_asli ?? x.nama_barang ?? x.namaBarang ?? x.deskripsi),
        amount(x.volume ?? ''),
        norm(x.satuan ?? ''),
        amount(x.harga_satuan ?? ''),
        amount(x.pagu ?? x.nilai ?? x.jumlah_pagu ?? x.jumlahPagu),
        norm(x.id_referensi_barang ?? x.kode_barang ?? ''),
        norm(x.status_rkas ?? x.status ?? 'APPROVED')
      ].join('|');

      const seen = new Set();
      const mergedList = raw.filter(x => {
        const k = displayKey(x);
        if(seen.has(k)) return false;
        seen.add(k);
        return true;
      });

      const totalPaguKeseluruhan = mergedList.reduce((sum,x)=>sum+Number(x.pagu||0),0);

      const rows = groups.flatMap(g => [

            <td style="text-align:center;color:var(--muted);font-weight:600">${++nomor}</td>
            <td><code>${esc(x.kode_rekening || '-')}</code></td>
            <td><b>${esc(x.uraian || '-')}</b></td>
            <td><b>${fmtRupiah(x.pagu)}</b></td>
            <td style="color:var(--success);font-weight:600">${fmtRupiah(x.total_realisasi)}</td>
            <td style="color:${Number(x.sisa_pagu)<0?'var(--danger)':'var(--text)'};font-weight:600">${fmtRupiah(x.sisa_pagu)}</td>
            <td>${badge(x.status_rkas || 'APPROVED', 'success')}</td>

                <button class="btn btn-sm btn-light btn-edit-rkas"
                  data-id="${esc(x.id_rkas || '')}"

        </div>

        <div class="panel">
          <div class="section-head" style="margin-bottom:12px;">
            <div>
              <b>Rincian RKAS Sekolah</b>
              <div class="muted">NPSN ${esc(ownNpsn)} • ${fmtNum(mergedList.length)} item</div>
            </div>
            <div class="toolbar">
              <button class="btn btn-light btn-sm" onclick="exportRkasExcel()">📥 Unduh Excel</button>
              <button class="btn btn-primary btn-sm" onclick="openRkasImportModal()">📤 Upload RKAS</button>

window.loadDinasRkasTab = async function(statusFilter){
  window._activeDinasStatus = statusFilter;
  const a = $('#btnTabDiajukan'), b = $('#btnTabApproved');
  if(a) a.className = statusFilter === 'DIAJUKAN' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-light';
  if(b) b.className = statusFilter === 'APPROVED' ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-light';
  
  const panel = $('#dinasRkasPanel'); 
  if(!panel) return;
  
  panel.innerHTML = loading('Memuat paket RKAS...');
  try{
    const r = await safeApi('getRKASApprovalQueue', { statusRkas: statusFilter }, { data: [] });
    window._currentDinasRkasList = (r.data || []).map(x => Object.assign({}, x, {
      npsn: normalizeNpsnClient(x.npsn),
      jumlah_baris: Number(x.jumlah_baris || x.total_baris || 0),
      total_pagu: Number(x.total_pagu || 0),
      status_rkas: String(x.status_rkas || x.status_import || statusFilter).toUpperCase()
    }));
    window._selectedDinasRkasPackage = null;
    filterAndRenderDinasRkasTable();
  }catch(e){
    panel.innerHTML = msg(errorText(e), 'error');
  }
};

window.filterAndRenderDinasRkasTable = function(){
  const panel = $('#dinasRkasPanel'), stat = $('#dinasRkasStatArea'); 
  if(!panel) return;
  
  const q = String($('#searchDinasRkas')?.value || '').trim().toLowerCase();
  const list = (window._currentDinasRkasList || []).filter(x => {
    if(!q) return true;
    return [x.npsn, x.nama_sekolah, x.kecamatan, x.nama_file, x.versi_rkas, x.id_import].some(v => String(v || '').toLowerCase().includes(q));
  });
  
  window._renderedDinasRkasList = list;
  const total = list.reduce((s, x) => s + Number(x.total_pagu || 0), 0);
  
  if(stat) {
    stat.innerHTML = `
      <div class="cards">
        <div class="stat"><small>Paket RKAS</small><strong>${fmtNum(list.length)}</strong></div>
        <div class="stat"><small>Total Item</small><strong>${fmtNum(list.reduce((s, x) => s + Number(x.jumlah_baris || 0), 0))}</strong></div>
        <div class="stat"><small>Total Pagu</small><strong>${fmtRupiah(total)}</strong></div>
      </div>`;
  }
  
  if(!list.length){
    panel.innerHTML = msg(window._activeDinasStatus === 'APPROVED' ? 'Belum ada RKAS yang disetujui.' : 'Belum ada RKAS yang menunggu persetujuan.', 'warning');
    return;
  }

  // OPTIMASI: Menggunakan metode .map().join('') untuk merender kartu grid sekali jalan di memori
  const cardsHtml = list.map((x, i) => `
    <div class="panel school-index-card" style="margin:0;border:1px solid var(--border);">
      <div style="font-size:.76rem;color:var(--muted);font-weight:800;">${x._queue_source === 'LEGACY' ? 'RKAS LAMA' : 'PAKET IMPORT'}</div>
      <div style="font-size:1.08rem;font-weight:900;color:var(--primary);">${esc(x.npsn || '-')}</div>
      <div style="font-weight:850;margin-top:4px;">${esc(x.nama_sekolah || 'Nama sekolah tidak tersedia')}</div>
      <div class="muted" style="margin-top:3px;">Kecamatan ${esc(x.kecamatan || '-')}</div>
      <div class="muted" style="margin-top:7px;font-size:.78rem;">${esc(x.nama_file || x.versi_rkas || 'RKAS tersimpan')}</div>
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px;">
        <span class="muted">${fmtNum(x.jumlah_baris || 0)} item</span><b>${fmtRupiah(x.total_pagu || 0)}</b>
      </div>
      <div style="margin-top:10px;">${badge(x.status_rkas || window._activeDinasStatus, 'success')}</div>
      <button class="btn btn-sm btn-primary" style="margin-top:12px;width:100%;" onclick="openDinasRkasPackage(${i})">Buka →</button>
    </div>`).join('');

  panel.innerHTML = `<div class="school-index-grid">${cardsHtml}</div>`;
};

window.openDinasRkasPackage = function(index){
  const list = window._renderedDinasRkasList || window._currentDinasRkasList || [];
  const pkg = list[index]; 
  if(!pkg) return;
  
  window._selectedDinasRkasPackage = pkg;
  renderDinasRkasPackageDetail();
};

    } else {
      r = await api('getRKASImport', { idImport: pkg.id_import_paket || pkg.id_import });

      rkasAccountHeaderHtml(g),
      ...g.items.map(x => `
        <tr>
          <td>${++no}</td>
          <td><code>${esc(x.kode_rekening || '')}</code></td>
          <td>${esc(x.uraian || x.nama_belanja_asli || '')}</td>

            : `<span class="muted">${pkg.status_rkas === 'APPROVED' ? 'Telah Disetujui' : 'Data Legacy'}</span>`
          }</td>
        </tr>`)
    ]).join('');

    panel.innerHTML = `
      <div class="toolbar"><button class="btn btn-sm btn-light" onclick="filterAndRenderDinasRkasTable()">← Kembali</button><span class="muted">${fmtNum(rows.length)} item RKAS</span></div>
      <div class="table-wrap">

          <thead>
            <tr><th>No</th><th>Kode</th><th>Uraian</th><th>Pagu</th><th>Status</th><th>Aksi</th></tr>
          </thead>
          <tbody>${detail || emptyRow(6)}</tbody>
        </table>
      </div>`;
  }catch(e){
    panel.innerHTML = msg(errorText(e), 'error');
  }

window.doReviewRkas = async function(versiRkas, keputusan) {
  if (!versiRkas || !keputusan) return;
  const label = keputusan === 'APPROVED' ? 'menyetujui' : (keputusan === 'DITOLAK' ? 'menolak' : 'meminta perbaikan');
  if (!confirm(`Yakin ${label} RKAS versi ${versiRkas}?`)) return;
  try {
    await api('reviewRKAS', { versiRkas, keputusan });
    invalidateRkasFrontendCaches();
    toast('Keputusan review RKAS berhasil disimpan.', 'ok');
    await renderDinasRkasReview();
  } catch (err) {
    alert(errorText(err));
  }
};

// Cache global lokal di browser untuk direktori sekolah agar instan saat dibuka kembali
window._schoolDirectoryCache = null;

async function sekolahView(){
  const c = $('#mainContent');
  if(!c) return;

  c.innerHTML = head('Daftar Sekolah','Pusat navigasi DINAS: cari sekolah, lihat pagu RKAS, lalu buka konteks sekolah.') +
    `<div class="school-directory-toolbar">
       <input id="searchSekolahInput" class="search-box" placeholder="🔍 Cari nama sekolah, NPSN, atau kecamatan...">
       <button class="btn btn-light" onclick="clearSchoolDirectorySearch()">Bersihkan</button>
     </div>
     <div class="panel" id="sekolahContent">${loading('Memuat daftar sekolah...')}</div>`;
     
  try{
    // OPTIMASI: Manfaatkan cache lokal frontend jika data sudah pernah ditarik sebelumnya
    if (!window._schoolDirectoryCache) {
      const [schoolRes, paguRes] = await Promise.all([
        api('getSekolah'),
        isDinas() ? safeApi('getRekapPaguRKAS', {}, { data: [] }) : Promise.resolve({ data: [] })
      ]);
      const list = schoolRes.data || [];
      const paguMap = buildPaguMap(paguRes.data || []);
      
      window._schoolDirectoryCache = list.map(x => Object.assign({}, x, { 
        total_pagu: Number(paguMap[normalizeNpsnClient(x.npsn)] || 0) 
      }));
    }

    window._schoolDirectoryData = window._schoolDirectoryCache;
    renderSchoolDirectory(window._schoolDirectoryData);
    
    const searchInput = $('#searchSekolahInput');
    if(searchInput) {
      searchInput.oninput = e => filterSchoolDirectory(e.target.value);
    }
  }catch(e){
    $('#sekolahContent').innerHTML = msg(errorText(e));
  }
}

function buildPaguMap(list){
  const map = {};
  (Array.isArray(list) ? list : []).forEach(x => {
    const n = normalizeNpsnClient(x.npsn);
    if(n) map[n] = Number(x.total_pagu || 0);
  });
  return map;
}

function filterSchoolDirectory(query){
  const q = String(query || '').trim().toLowerCase();
  const source = window._schoolDirectoryData || [];
  renderSchoolDirectory(!q ? source : source.filter(x =>
    String(x.npsn || '').toLowerCase().includes(q) ||
    String(x.nama_sekolah || '').toLowerCase().includes(q) ||
    String(x.kecamatan || '').toLowerCase().includes(q)
  ));
}

window.clearSchoolDirectorySearch = function(){
  const i = $('#searchSekolahInput');
  if(i) i.value = '';
  filterSchoolDirectory('');
};

function formatTanggalPenugasan(v){
  if(v==null || v==='') return '-';
  const raw=String(v).trim();
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(raw)) return raw;
  const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  const d=new Date(raw);
  if(!isNaN(d.getTime())) return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
  return raw;
}

function workflowPhaseMeta(phase){
  const p=String(phase||'LOCKED').toUpperCase();
  const map={
    ACTIVE:{label:'ACTIVE',cls:'active'},AKTIF:{label:'ACTIVE',cls:'active'},
    TOLERANSI:{label:'ACTIVE • TOLERANSI',cls:'tolerance'},OVERRIDE:{label:'ACTIVE • OVERRIDE',cls:'override'},
    CLOSED:{label:'CLOSED',cls:'closed'},DITUTUP:{label:'CLOSED',cls:'closed'},
    LOCKED:{label:'LOCKED',cls:'upcoming'},BELUM_DIBUKA:{label:'LOCKED',cls:'upcoming'},BELUM_DIJADWALKAN:{label:'LOCKED',cls:'upcoming'},
    PERLU_IDENTITAS:{label:'PERIKSA IDENTITAS',cls:'upcoming'},PENDAFTARAN_SELESAI:{label:'CLOSED',cls:'closed'},
    BELUM_DIATUR:{label:'ACTIVE',cls:'active'},KONFIGURASI_TIDAK_VALID:{label:'KONFIGURASI TIDAK VALID',cls:'danger'}
  };
  return map[p]||{label:p,cls:'neutral'};
}
function fmtWorkflowDate(v){
  if(!v) return '-';
  const d=new Date(v);
  if(!isNaN(d.getTime())) return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){ const x=new Date(Number(m[1]),Number(m[2])-1,Number(m[3])); return x.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
  return String(v);
}
function workflowDateInput(v){
  if(!v)return'';
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return`${m[1]}-${m[2]}-${m[3]}`;
  const d=new Date(v); if(isNaN(d.getTime()))return'';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function workflowTargetLabel(x){
  const t=String(x?.target_type||'SEMUA').toUpperCase();
  const v=x?.target_label||x?.target_value||'';
  if(t==='SEMUA')return'Semua user terkait';
  if(t==='ROLE')return`Role ${v}`;
  if(t==='KECAMATAN')return`Kecamatan ${v}`;
  if(t==='SEKOLAH')return`Sekolah ${v}`;
  if(t==='PENGAWAS')return`Pengawas ${v}`;
  return v||t;
}

function renderPenugasanTable(list){
  const content = $('#penugasanContent'); 
  if(!content) return;
  
  const rows = Array.isArray(list) ? list : [];

  rows.forEach(x => {
    const id = String(x.id_pengawas || '').trim();
    const nama = String(x.nama_pengawas || '').trim();
    const key = id || nama || 'TANPA_PENGAWAS';
    if(!groupsMap.has(key)) groupsMap.set(key, { id, nama: nama || id || 'Tanpa Pengawas', items: [] });
    const item = Object.assign({}, x, { total_pagu: Number(x.pagu_rkas ?? x.total_pagu ?? 0) });
    groupsMap.get(key).items.push(item);
  });
  
  const groups = Array.from(groupsMap.values()).sort((a, b) => String(a.nama).localeCompare(String(b.nama), 'id', { sensitivity: 'base' }));
  const totalPenugasan = rows.length;
  const totalPengawas = groups.length;
  const uniqueSchools = new Set(rows.map(x => normalizeNpsnClient(x.npsn)).filter(Boolean)).size;
  const aktif = rows.filter(x => upper(x.status || '') === 'AKTIF').length;
  const totalPagu = rows.reduce((sum, x) => sum + Number(x.pagu_rkas ?? x.total_pagu ?? 0), 0);

  if(!rows.length){
    content.innerHTML = `<div class="panel" style="text-align:center;padding:36px 20px"><div style="font-size:2rem">👥</div><h3>Belum ada penugasan</h3><p class="muted">Belum terdapat data penugasan pengawas yang sesuai dengan pencarian.</p></div>`;

    </div>`;

  // OPTIMASI: Rendering grup pengawas menggunakan .map().join('')
  const groupsHtml = groups.map((g, index) => {
    const items = g.items.slice().sort((a, b) => String(a.nama_sekolah || a.npsn || '').localeCompare(String(b.nama_sekolah || b.npsn || ''), 'id', { sensitivity: 'base' }));
    const subtotalSekolah = new Set(items.map(x => normalizeNpsnClient(x.npsn)).filter(Boolean)).size;
    const subtotalAktif = items.filter(x => upper(x.status || '') === 'AKTIF').length;

      </div>
      <div style="font-size:1.15rem;font-weight:900">${fmtRupiah(totalPagu)}</div>

window.loadDinasPenugasanData_=async function(force=false){
  const content=$('#penugasanContent');
  if(!content) return;
  if(!force && Array.isArray(window._cachedPenugasanGlobal)){
    window._cachedPenugasan=window._cachedPenugasanGlobal;
    window._cachedPaguSekolah=window._cachedPenugasanGlobal;
    renderPenugasanTable(window._cachedPenugasanGlobal);
    return;
  }
  content.innerHTML=loading('Memuat penugasan, status kunci, dan kesiapan akun...');
  try{
    const res=await api('getPenugasanDashboardDinas');
    const payload=res.data||{};
    await refreshDelegationLockState(payload.lock||{});
    await refreshDelegationReadinessState(payload.readiness_summary||{});
    const list=(payload.penugasan||[]).map(x=>{
      const direct=Number(x.pagu_rkas ?? x.total_pagu ?? 0);
      return Object.assign({},x,{pagu_rkas:Number.isFinite(direct)?direct:0,total_pagu:Number.isFinite(direct)?direct:0});
    });
    window._cachedPenugasanGlobal=list;
    window._cachedPenugasan=list;
    window._cachedPaguSekolah=list;
    window._paguRkasMeta=payload.meta||{};
    renderPenugasanTable(list);
  }catch(bundleErr){
    // Fallback kompatibilitas bila frontend baru sempat dipakai dengan deployment backend lama.
    try{
      const [lockRes,readyRes,assignRes]=await Promise.all([
        api('getDelegationLock'), api('getUserReadiness'), api('getPenugasanPengawas')
      ]);
      await refreshDelegationLockState(lockRes.data||{});
      await refreshDelegationReadinessState(readyRes.summary||{});
      const list=(assignRes.data||[]).map(x=>{
        const direct=Number(x.pagu_rkas ?? x.total_pagu ?? 0);
        return Object.assign({},x,{pagu_rkas:Number.isFinite(direct)?direct:0,total_pagu:Number.isFinite(direct)?direct:0});
      });
      window._cachedPenugasanGlobal=list;window._cachedPenugasan=list;window._cachedPaguSekolah=list;window._paguRkasMeta=assignRes.meta||{};
      renderPenugasanTable(list);
    }catch(e){
      content.innerHTML=msg(errorText(e));
    }
  }
};
window.toggleDelegationLockFromPenugasan=async function(){
  const lockIt=!window._delegationLocked;

function pesanStatusMeta_(status){
  const s=String(status||'BELUM').toUpperCase();
  if(s==='SELESAI') return {label:'Selesai',cls:'done'};
  if(s==='DIBACA') return {label:'Dibaca',cls:'read'};
  if(s==='SEBAGIAN_SELESAI') return {label:'Sebagian selesai',cls:'partial'};
  return {label:'Belum dibaca',cls:'unread'};
}
function pesanKategoriMeta_(kategori){
  const k=String(kategori||'INFORMASI').toUpperCase();
  if(k==='TEGURAN')return {label:'Teguran',cls:'warning'};
  if(k==='FEEDBACK')return {label:'Feedback',cls:'feedback'};
  if(k==='BALASAN')return {label:'Balasan',cls:'reply'};
  return {label:'Informasi',cls:'info'};
}

async function loadPesanData(){
  const area=$('#pesanContent'); if(!area)return;
  area.innerHTML=loading('Memuat '+pesanBoxTitle_().toLowerCase()+'...');
  try{
    const res=await safeApi('getPesan',{box:_pesanBox,limit:_pesanLimit,mark_read:_pesanBox==='INBOX'},{data:[],has_more:false});
    const unreadRes=await safeApi('getJumlahPesanBelum',{}, {count:0});
    const unread=Number(unreadRes.count||0),pill=$('#msgUnreadPill');
    if(pill) pill.textContent=unread>0?String(unread):'';
    updateUnreadMessageBadgeFromCount_(unread);
    const list=res.data||[];
    if(!list.length){
      const copy=_pesanBox==='SENT'?'Belum ada pesan yang Anda kirim.':_pesanBox==='DONE'?'Belum ada pesan yang diselesaikan.':'Kotak masuk bersih. Tidak ada pesan aktif.';
      area.innerHTML=`<div class="msg-empty"><div class="msg-empty-icon">✓</div><strong>${esc(copy)}</strong><span>${_pesanBox==='INBOX'?'Pesan baru dari pihak terkait akan muncul di sini.':'Riwayat akan muncul otomatis ketika tersedia.'}</span></div>`;
      return;
    }
    area.innerHTML=list.map(x=>{
      const km=pesanKategoriMeta_(x.kategori),sm=pesanStatusMeta_(x.status_baca);
      const counterpart=_pesanBox==='SENT'?(x.tujuan_label||x.tujuan):_pesanBox==='ALL'?(x._direction==='OUT'?(x.tujuan_label||x.tujuan):x._direction==='IN'?(x.pengirim_label||x.pengirim):`${x.pengirim_label||x.pengirim} → ${x.tujuan_label||x.tujuan}`):(x.pengirim_label||x.pengirim);
      const legacy=x._legacy_shared?`<span class="msg-legacy">Pesan lama • read-only</span>`:'';
      const actions=_pesanBox==='INBOX' && x._can_update ? `<div class="msg-actions"><button class="btn btn-primary btn-sm" onclick="openBalasPesanModal('${esc(x.id_pesan)}','${esc(x.pengirim)}','${esc(x.subjek||'')}')">Balas</button><button class="btn btn-light btn-sm" onclick="tutupNotifikasiPesan('${esc(x.id_pesan)}')">Selesai</button></div>` : '';
      const broadcast=Number(x.recipient_count||0)>1?`<span class="msg-recipient-summary">${fmtNum(x.recipient_done||0)}/${fmtNum(x.recipient_count)} selesai</span>`:'';
      return `<article class="msg-card ${x._unread?'is-unread':''}">
        <div class="msg-card-top"><div class="msg-avatar">${esc(String(counterpart||'?').trim().charAt(0).toUpperCase()||'?')}</div><div class="msg-who"><strong>${esc(counterpart||'-')}</strong><span>${esc(x.tanggal||'')}</span></div><span class="msg-kind ${km.cls}">${esc(km.label)}</span></div>
        <div class="msg-body"><h3>${esc(x.subjek||'Tanpa subjek')}</h3><p>${esc(x.isi_pesan||'')}</p></div>
        <div class="msg-footer"><div><span class="msg-status ${sm.cls}">${esc(sm.label)}</span>${legacy}${broadcast}</div>${actions}</div>
      </article>`;
    }).join('')+(res.has_more?`<div class="msg-more"><button class="btn btn-light" onclick="loadMorePesan()">Muat lebih banyak</button></div>`:'');
  }catch(e){ area.innerHTML=msg(errorText(e)); }
}

window._cachedAuditSchoolsGlobal = null;

async function getCachedAuditSchools_() {
  if (!window._cachedAuditSchoolsGlobal) {
    if (isPengawas()) {
      const r = await safeApi('getPenugasanPengawas', {}, { data: [] });
      const seen = new Set();
      window._cachedAuditSchoolsGlobal = (r.data || []).filter(x => {
        const n = normalizeNpsnClient(x.npsn);
        if (!n || seen.has(n)) return false;
        seen.add(n);
        x.npsn = n;
        return true;
      }).sort((a,b)=>String(a.nama_sekolah||'').localeCompare(String(b.nama_sekolah||''), 'id'));
    } else {
      const r = await safeApi('getSekolah', {}, { data: [] });
      window._cachedAuditSchoolsGlobal = r.data || [];
    }
  }
  return window._cachedAuditSchoolsGlobal;
}

/* ============================================================================
 * PROTECTED PDF VIEWER
 * PDF pemeriksaan tidak lagi membuka URL Google Drive langsung.
 * Alur: file_id -> API Base64 -> Uint8Array -> PDF.js -> Canvas.
 * ========================================================================== */
function drivePreviewUrl(url){ return ''; }

let __pdfJsPromise=null;
const __protectedPdfCache=new Map();

async function ensurePdfJs(){
  if(window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return window.pdfjsLib;
  }
  if(!__pdfJsPromise){
    __pdfJsPromise=new Promise((resolve,reject)=>{
      const existing=document.querySelector('script[data-simpel-pdfjs]');
      if(existing){ existing.addEventListener('load',()=>resolve(window.pdfjsLib)); existing.addEventListener('error',()=>reject(new Error('Library PDF.js gagal dimuat.'))); return; }
      const sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.dataset.simpelPdfjs='1';
      sc.onload=()=>resolve(window.pdfjsLib);
      sc.onerror=()=>reject(new Error('Library PDF.js gagal dimuat.'));
      document.head.appendChild(sc);
    });
  }
  const lib=await __pdfJsPromise;
  if(!lib) throw new Error('PDF.js tidak tersedia.');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return lib;
}

function base64ToUint8Array_(base64){
  const raw=atob(String(base64||''));
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}

async function getProtectedPdfDocument_(doc){
  const fileId=String(doc?.file_id||'');
  const period=String(window.__pdfInteractiveContext?.p||state.selectedPeriode||'');
  const npsn=String(window.__pdfInteractiveContext?.n||state.selectedNpsn||ownNpsn()||'');
  if(!fileId) throw new Error('Dokumen ini tidak memiliki file_id Drive yang dapat dibaca oleh viewer aman.');
  const lib=await ensurePdfJs();
  if(__protectedPdfCache.has(fileId)) return __protectedPdfCache.get(fileId);
  const r=await api('getDokumenPdfBase64',{fileId,idPeriode:period,npsn});
  if(!r?.base64) throw new Error('Server tidak mengembalikan data PDF.');
  const loadingTask=lib.getDocument({data:base64ToUint8Array_(r.base64)});
  const pdf=await loadingTask.promise;
  __protectedPdfCache.set(fileId,pdf);
  return pdf;
}

function _ocrNormText_(v){
  return String(v||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function _ocrDigits_(v){ return String(v||'').replace(/\D/g,''); }
function _ocrMoneyVariants_(v){
  const n=Math.round(Math.abs(Number(v)||0)); if(!n) return [];
  const raw=String(n), dot=raw.replace(/\B(?=(\d{3})+(?!\d))/g,'.'), comma=raw.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return [raw,dot,comma,'RP '+dot,'RP'+dot];
}
function _ocrDateVariants_(v){
  const s=String(v||'').slice(0,10); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return [];
  return [m[3]+'/'+m[2]+'/'+m[1],m[3]+'-'+m[2]+'-'+m[1],m[3]+' '+m[2]+' '+m[1],m[1]+'-'+m[2]+'-'+m[3]];
}
function _scoreTxAgainstOcrPage_(tx,pageText){
  const raw=String(pageText||'').toUpperCase(); const norm=_ocrNormText_(raw); const digits=_ocrDigits_(raw);
  let score=0, reasons=[];
  const bukti=String(tx.nomor_bukti||'').trim();
  if(bukti){
    const bn=_ocrNormText_(bukti); const bd=_ocrDigits_(bukti);
    if((bn.length>=3 && norm.includes(bn)) || (bd.length>=4 && digits.includes(bd))){score+=38;reasons.push('nomor bukti');}
  }
  const kode=String(tx.kode_rekening||'').trim();
  if(kode){const kd=_ocrDigits_(kode);if(kd.length>=6 && digits.includes(kd)){score+=24;reasons.push('kode rekening');}}
  if(_ocrMoneyVariants_(tx.nilai_transaksi).some(v=>raw.includes(v))){score+=28;reasons.push('nominal');}
  if(_ocrDateVariants_(tx.tanggal_transaksi).some(v=>raw.includes(v))){score+=10;reasons.push('tanggal');}
  const words=_ocrNormText_(tx.uraian_transaksi||'').split(' ').filter(w=>w.length>=5 && !/^\d+$/.test(w));
  if(words.length){
    const uniq=[...new Set(words)].slice(0,12); const hit=uniq.filter(w=>norm.includes(w)).length;
    const ratio=hit/uniq.length;
    if(hit>=2){const add=Math.min(18,Math.round(ratio*18));score+=add;reasons.push('uraian');}
  }
  return {score:Math.min(100,score),reasons};
}
function _matchTransactionsToOcrPages_(transactions,pages){
  return (transactions||[]).map(tx=>{
    let best={page:0,score:0,reasons:[]};
    (pages||[]).forEach(p=>{const s=_scoreTxAgainstOcrPage_(tx,p.text);if(s.score>best.score)best={page:p.page,score:s.score,reasons:s.reasons};});
    let level='RENDAH'; if(best.score>=75)level='TINGGI'; else if(best.score>=50)level='SEDANG';
    return {id_transaksi:String(tx.id_transaksi||''),page:best.page,confidence:best.score,confidence_level:level,reasons:best.reasons};
  });
}
async function _canvasToBase64Jpeg_(canvas,quality=.9){
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Canvas tidak dapat dikonversi.')),'image/jpeg',quality));
  const buf=await blob.arrayBuffer(); const bytes=new Uint8Array(buf); let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(binary);
}
function _showPageAwareOcrModal_(name,totalPages){
  document.querySelector('#pageAwareOcrModal')?.remove();
  const modal=document.createElement('div');modal.id='pageAwareOcrModal';modal.className='simple-modal';
  modal.innerHTML=`<div class="simple-modal-card" style="width:min(920px,96vw);max-height:88vh;overflow:auto">
    <h3>OCR Presisi per Halaman — ${esc(name||'Dokumen PDF')}</h3>
    <p class="muted">Sistem membaca text-layer PDF terlebih dahulu. OCR gambar hanya dipakai untuk halaman scan agar lebih cepat dan ringan.</p>
    <div class="progress" style="margin:12px 0"><i id="pageOcrProgressBar" style="width:0%"></i></div>
    <div id="pageOcrProgressText" class="muted">Menyiapkan ${fmtNum(totalPages)} halaman...</div>
    <div id="pageOcrResult" style="margin-top:14px"></div>
    <div class="simple-modal-actions"><button id="pageOcrCancelBtn" class="btn btn-light">Batalkan</button><button class="btn btn-primary" onclick="this.closest('.simple-modal').remove()">Tutup</button></div>
  </div>`;
  document.body.appendChild(modal);
  $('#pageOcrCancelBtn').onclick=()=>{window.__pageAwareOcrCancel=true;$('#pageOcrCancelBtn').disabled=true;$('#pageOcrCancelBtn').textContent='Membatalkan...';};
  return modal;
}

window.ocrCurrentInteractivePdf=async function(){
  const c=window.__pdfInteractiveContext||{}; const select=$('#interactiveDocSelect');
  const doc=(c.docs||[]).find(d=>String(d.file_id||d.id_dokumen)===String(select?.value||''))||c.docs?.[0];
  if(!doc?.file_id){toast('Dokumen tidak memiliki file_id.','warning');return;}

  // Hasil untuk file yang sama tidak diproses ulang selama sesi browser.
  const cached=window.__pageAwareOcrCache?.[String(doc.file_id)];
  if(cached?.pages?.length){
    const reuse=confirm(`Analisis dokumen ini sudah tersedia (${cached.pages.length} halaman). Gunakan hasil yang sudah ada?`);
    if(reuse){
      const byId={};(cached.matches||[]).forEach(m=>{if(m.id_transaksi)byId[m.id_transaksi]=m;});
      (c.tx||[]).forEach(t=>{const m=byId[String(t.id_transaksi||'')];if(m){t.ocr_page=m.page;t.ocr_confidence=m.confidence;t.ocr_confidence_level=m.confidence_level;t.ocr_reasons=m.reasons;}});
      renderPdfInteractive(c); return;
    }
  }

  window.__pageAwareOcrCancel=false;
  try{
    const pdf=await getProtectedPdfDocument_(doc);
    _showPageAwareOcrModal_(doc.nama_file||'Dokumen PDF',pdf.numPages);
    const pages=[];
    const scannedPages=[];

    // TAHAP 1 — ekstraksi text-layer PDF. Ini sangat ringan dan tidak membutuhkan OCR/API.
    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
      if(window.__pageAwareOcrCancel) break;
      const p=await pdf.getPage(pageNo);
      let extracted='';
      try{
        const tc=await p.getTextContent({normalizeWhitespace:true,disableCombineTextItems:false});
        extracted=(tc.items||[]).map(i=>String(i.str||'')).join(' ').replace(/\s+/g,' ').trim();
      }catch(_){}
      if(extracted.length>=80){
        pages.push({page:pageNo,text:extracted,characters:extracted.length,source:'PDF_TEXT'});
      }else{
        scannedPages.push(pageNo);
      }
      const pct=Math.round(pageNo/pdf.numPages*45);
      const bar=$('#pageOcrProgressBar'),txt=$('#pageOcrProgressText');
      if(bar)bar.style.width=pct+'%';
      if(txt)txt.textContent=`Membaca struktur PDF ${pageNo}/${pdf.numPages} • ${scannedPages.length} halaman memerlukan OCR`;
      // Beri browser kesempatan menggambar UI agar aplikasi tidak terasa freeze.
      if(pageNo%4===0) await new Promise(r=>setTimeout(r,0));
    }

    if(window.__pageAwareOcrCancel){
      toast('Analisis dibatalkan.','warning'); return;
    }

    // TAHAP 2 — hanya halaman scan/tanpa text-layer yang dirender menjadi gambar.
    let ocrAvailable=true;
    if(scannedPages.length){
      const cap=await safeApi('getOcrCapability',{}, {success:true,available:false});
      ocrAvailable=!!cap.available;
    }

    if(scannedPages.length && !ocrAvailable){
      toast(`${scannedPages.length} halaman berupa scan dan memerlukan Drive API untuk OCR. Halaman yang memiliki text-layer tetap dianalisis.`,'warning',9000);
    }

    let processedScan=0;
    if(ocrAvailable){
      for(const pageNo of scannedPages){
        if(window.__pageAwareOcrCancel) break;
        const p=await pdf.getPage(pageNo);
        const base=p.getViewport({scale:1});
        // Resolusi dibuat secukupnya: lebih ringan daripada V20.1 (1500–2200 px).
        const targetWidth=Math.min(1500,Math.max(1100,base.width*1.55));
        const vp=p.getViewport({scale:targetWidth/base.width});
        const canvas=document.createElement('canvas');
        canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
        const ctx=canvas.getContext('2d',{alpha:false});
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        await p.render({canvasContext:ctx,viewport:vp}).promise;
        const imageBase64=await _canvasToBase64Jpeg_(canvas,.78);
        const r=await api('ocrPdfPageImage',{data:{fileId:doc.file_id,idPeriode:c.p,npsn:c.n,pageNo,imageBase64,mimeType:'image/jpeg'}});
        pages.push({page:pageNo,text:String(r.text||''),characters:Number(r.characters||0),source:'OCR'});
        processedScan++;
        canvas.width=1;canvas.height=1;
        const completed=pages.length;
        const pct=45+Math.round(processedScan/Math.max(1,scannedPages.length)*55);
        const bar=$('#pageOcrProgressBar'),txt=$('#pageOcrProgressText');
        if(bar)bar.style.width=Math.min(100,pct)+'%';
        if(txt)txt.textContent=`OCR scan ${processedScan}/${scannedPages.length} • total halaman terbaca ${completed}/${pdf.numPages}`;
        await new Promise(r=>setTimeout(r,0));
      }
    }

    pages.sort((a,b)=>a.page-b.page);
    if(!pages.length){
      toast('Tidak ada teks yang dapat dibaca dari dokumen ini.','warning',7000); return;
    }

    const matches=_matchTransactionsToOcrPages_(c.tx||[],pages);
    window.__pageAwareOcrCache[String(doc.file_id)]={pages,matches,createdAt:Date.now(),scannedPages:scannedPages.length,ocrUsed:processedScan};
    const byId={};matches.forEach(m=>{if(m.id_transaksi)byId[m.id_transaksi]=m;});
    (c.tx||[]).forEach(t=>{const m=byId[String(t.id_transaksi||'')];if(m){t.ocr_page=m.page;t.ocr_confidence=m.confidence;t.ocr_confidence_level=m.confidence_level;t.ocr_reasons=m.reasons;}});

    const high=matches.filter(m=>m.confidence>=75).length;
    const medium=matches.filter(m=>m.confidence>=50&&m.confidence<75).length;
    const low=matches.filter(m=>m.confidence<50).length;
    const textPages=pages.filter(p=>p.source==='PDF_TEXT').length;
    const ocrPages=pages.filter(p=>p.source==='OCR').length;
    const result=$('#pageOcrResult');
    if(result) result.innerHTML=`<div class="cards" style="margin-bottom:12px">
      <div class="stat"><small>Halaman terbaca</small><strong>${pages.length}/${pdf.numPages}</strong></div>
      <div class="stat"><small>Text-layer</small><strong>${textPages}</strong></div>
      <div class="stat"><small>OCR scan</small><strong>${ocrPages}</strong></div>
      <div class="stat"><small>Confidence tinggi</small><strong>${high}</strong></div>
    </div>${msg(`Analisis selesai. ${high} transaksi cocok tinggi, ${medium} sedang, ${low} rendah. OCR gambar hanya dijalankan pada halaman yang tidak memiliki text-layer.`,'ok')}`;

    const txt=$('#pageOcrProgressText');
    if(txt)txt.textContent=window.__pageAwareOcrCancel?`Dihentikan setelah ${pages.length} halaman.`:`Selesai • ${textPages} halaman dibaca langsung • ${ocrPages} halaman memakai OCR`;
    const bar=$('#pageOcrProgressBar');if(bar)bar.style.width='100%';
    const cancel=$('#pageOcrCancelBtn');if(cancel){cancel.disabled=true;cancel.textContent='Selesai';}
    renderPdfInteractive(c);
  }catch(e){toast(errorText(e),'error',9000);}
  finally{renderInteractiveEvidenceSummary_();}
};

function _v217PdfCompareHtml_(r){
  if(!r)return '';
  if(r.status==='PDF_BELUM_UPLOAD')return `<div class="message warning">${esc(r.message||'PDF belum diunggah.')}</div>`;
  if(r.status==='TIDAK_BERLAKU')return `<div class="message info">${esc(r.message||'Tidak berlaku.')}</div>`;
  const cmp=r.comparison||{}, fields=cmp.fields||[];
  const type=r.status==='COCOK'?'ok':(r.status==='SELISIH'?'error':'warning');
  const rows=fields.map(x=>`<tr><td>${esc(x.label)}</td><td>${fmtRupiah(x.expected||0)}</td><td>${x.readable?fmtRupiah(x.pdf||0):'<span class="badge badge-warning">Tidak terbaca</span>'}</td><td>${x.readable?fmtRupiah(x.difference||0):'-'}</td><td>${x.match?'<span class="badge badge-success">COCOK</span>':(x.readable?'<span class="badge badge-danger">SELISIH</span>':'<span class="badge badge-warning">CEK MANUAL</span>')}</td></tr>`).join('');
  return `<div class="message ${type}" style="margin-bottom:8px"><b>${esc(r.status)}</b> — ${esc(r.message||'')}</div><div class="table-wrap"><table class="friendly-table"><thead><tr><th>Komponen</th><th>BKU Data</th><th>PDF Pembanding</th><th>Selisih</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

window.renderInteractivePdfPage=async function(pageNo){
  const c=window.__pdfInteractiveContext||{};
  const docs=c.docs||[];
  const select=$('#interactiveDocSelect');
  const doc=docs.find(d=>String(d.file_id||d.id_dokumen)===String(select?.value||''))||docs[0];
  const wrap=$('#interactivePdfFrame'); if(!wrap||!doc)return;
  const ui=window.__pdfInteractiveUiState||(window.__pdfInteractiveUiState={docId:'',page:1,zoom:1,totalPages:0});
  ui.docId=String(doc.file_id||doc.id_dokumen||'');
  const requested=Math.max(1,Number(pageNo)||1);
  wrap.innerHTML=loading(`Memuat halaman ${requested}...`);
  try{
    const pdf=await getProtectedPdfDocument_(doc);
    ui.totalPages=pdf.numPages;
    const safePage=Math.min(requested,pdf.numPages);
    ui.page=safePage;
    const input=$('#interactivePage'); if(input){input.value=safePage;input.max=pdf.numPages;}
    const page=await pdf.getPage(safePage);
    const base=page.getViewport({scale:1});
    const maxWidth=Math.max(320,Math.min(wrap.clientWidth-28,1100));
    const fit=Math.min(maxWidth/base.width,1.55);
    ui.zoom=Math.max(.7,Math.min(2,Number(ui.zoom)||1));
    const vp=page.getViewport({scale:fit*ui.zoom});
    const canvas=document.createElement('canvas');
    canvas.style.display='block';canvas.style.maxWidth='100%';canvas.style.height='auto';canvas.style.background='#fff';canvas.style.boxShadow='0 8px 25px rgba(16,42,67,.14)';
    canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
    wrap.innerHTML='';wrap.appendChild(canvas);
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    wrap.dataset.page=String(safePage);wrap.dataset.fileId=ui.docId;
    const info=$('#interactivePageInfo');if(info)info.textContent=`/ ${pdf.numPages}`;
    const zi=$('#interactiveZoomInfo');if(zi)zi.textContent=`${Math.round(ui.zoom*100)}%`;
    const first=$('#interactiveFirstBtn');if(first)first.disabled=safePage<=1;
    const prev=$('#interactivePrevBtn');if(prev)prev.disabled=safePage<=1;
    const next=$('#interactiveNextBtn');if(next)next.disabled=safePage>=pdf.numPages;
    const last=$('#interactiveLastBtn');if(last)last.disabled=safePage>=pdf.numPages;
    renderInteractiveEvidenceSummary_();
    setTimeout(()=>prefetchInteractivePdfNeighbors_(pdf,safePage),0);
    if(document.activeElement===document.body || !document.activeElement){
      wrap.focus({preventScroll:true});
    }
  }catch(e){wrap.innerHTML=msg('PDF tidak dapat ditampilkan: '+errorText(e),'error');}
};

function ensureInteractivePdfKeyboard_(){
  if(window.__interactivePdfKeyboardBound)return;
  window.__interactivePdfKeyboardBound=true;
  document.addEventListener('keydown',e=>{
    if(state.view!=='pdfInteraktif'||!document.getElementById('interactivePdfFrame'))return;
    const tag=String(e.target?.tagName||'').toLowerCase();
    if(['input','textarea','select'].includes(tag)||e.target?.isContentEditable)return;

    const key=e.key;
    if(key==='ArrowLeft'||key==='PageUp'){
      e.preventDefault();interactivePdfPrev();
    }else if(key==='ArrowRight'||key==='PageDown'){
      e.preventDefault();interactivePdfNext();
    }else if(key==='Home'){
      e.preventDefault();renderInteractivePdfPage(1);
    }else if(key==='End'){
      e.preventDefault();renderInteractivePdfPage(window.__pdfInteractiveUiState?.totalPages||1);
    }else if(key==='+'||key==='='){
      e.preventDefault();interactivePdfZoom(.1);
    }else if(key==='-'||key==='_'){
      e.preventDefault();interactivePdfZoom(-.1);
    }else if(key==='0'){
      e.preventDefault();interactivePdfResetZoom();
    }
  });
}

window.saveBkuAutoAssessment=async function(idAsesmen,idIndikator,auto){
  const scoreEl=$('#bkuScore_'+idIndikator), noteEl=$('#bkuNote_'+idIndikator), pageEl=$('#bkuPage_'+idIndikator);
  const selected=scoreEl?.value||'', note=noteEl?.value?.trim()||'', score=selected===''?'':Number(selected);
  if(score!=='' && Math.abs(score-Number(auto))>0.001 && !note){toast('Catatan wajib diisi jika nilai manual berbeda dari nilai otomatis.','warning');return;}
  try{await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,hasil_otomatis:Number(auto),catatan_pengawas:note,halaman_bukti:pageEl?.value||''}});toast(score===''?'Nilai otomatis disimpan.':'Nilai penilaian disimpan.','ok');await openPdfInteractive();}catch(e){toast(errorText(e),'error',5000);}
};

window.saveInlinePdfAssessment=async function(idAsesmen,idIndikator,automatic,idTemuan){
  const scoreEl=$('#v11score_'+idIndikator), pageEl=$('#v11page_'+idIndikator), noteEl=$('#v11note_'+idIndikator);
  if(!pageEl||!/^\d+$/.test(String(pageEl.value||''))||Number(pageEl.value)<1){toast('Nomor halaman bukti wajib diisi dengan benar.','warning');return;}
  const raw=scoreEl?.value||'';
  const score=raw===''?'':Number(raw);
  const auto=Number(automatic);
  let note=(noteEl?.value||'').trim();
  if(score!=='' && (score<0||score>4)){toast('Skor harus 0 sampai 4.','warning');return;}
  if(score!=='' && Math.abs(score-auto)>.001 && !note){toast('Jika skor berbeda dari sistem, alasan/catatan Pengawas wajib diisi.','warning');noteEl?.focus();return;}
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU',halaman_bukti:String(pageEl.value),id_temuan:idTemuan||''}});
    const page=String(pageEl.value);
    $('#interactivePage').value=page;
    toast('Penilaian dan bukti halaman berhasil disimpan.','ok');
    await openPdfInteractive();
  }catch(e){toast(errorText(e),'error',5000);}
};

window.interactiveEditScore=async function(idAsesmen,idIndikator,current,automatic,page,idTemuan){
  const p=prompt('Nomor halaman PDF yang menjadi bukti indikator ini:',page||($('#interactivePage')?.value||'1')); if(p===null)return;
  if(p && (!/^\d+$/.test(p)||Number(p)<1)){toast('Nomor halaman tidak valid.','warning');return;}
  let score=prompt(`Skor indikator 0–4. Skor otomatis: ${automatic}`,current);
  if(score===null)return; score=score.trim()===''?'':Number(score);
  if(score!==''&&(!Number.isFinite(score)||score<0||score>4)){toast('Skor harus 0 sampai 4.','warning');return;}
  let note=''; if(score!==''&&Math.abs(Number(score)-Number(automatic))>.001){note=prompt('Alasan koreksi manual:','');if(note===null||!note.trim()){toast('Koreksi manual wajib memiliki alasan.','warning');return;}}
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU',halaman_bukti:p,id_temuan:idTemuan||''}});

  }catch(e){toast(errorText(e),'error',4500);}
};

function reportPhaseLabelRc2(p){return p==='FASE2'?'FASE 2':p==='GABUNGAN'?'FASE 1 & FASE 2':'FASE 1';}
function reportScopeLabelRc2(s){return ({ALL:'REKAP SEMUA SEKOLAH',KECAMATAN:'REKAP PER KECAMATAN',SEKOLAH:'PER SEKOLAH',BINAAN:'REKAP SEKOLAH BINAAN',OWN:'SEKOLAH SENDIRI'})[s]||s;}
function reportDateRc2(v){try{return new Date(v||Date.now()).toLocaleString('id-ID');}catch(e){return String(v||'');}}
function reportStatusTextRc2(row,phase){
  if(phase==='FASE1')return row.phase1_approved?'DISETUJUI DINAS':row.phase1_submitted?'DIAJUKAN KE DINAS':String(row.phase1_state||'BELUM').replaceAll('_',' ');
  if(phase==='FASE2')return row.phase2_done?'FASE 2 SELESAI':row.ready_for_phase2?'SIAP FASE 2':'BELUM SIAP FASE 2';
  return row.final_done?'FINAL':row.phase2_done?'FASE 2 SELESAI':row.phase1_approved?'FASE 1 DISETUJUI':'PROSES';
}

async function ensurePdfLibRc2(){
  if(window.PDFLib)return window.PDFLib;
  await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Library PDF export gagal dimuat.'));document.head.appendChild(s);});

function pdfSafeTextRc2(v){return String(v??'').normalize('NFKD').replace(/[^\x20-\x7E]/g,' ').replace(/\s+/g,' ').trim();}
function pdfWrapLinesRc2(text,font,size,maxWidth){
  const words=pdfSafeTextRc2(text).split(' '),lines=[];let line='';
  for(const word of words){const test=line?line+' '+word:word;if(font.widthOfTextAtSize(test,size)<=maxWidth)line=test;else{if(line)lines.push(line);line=word;}}
  if(line)lines.push(line);return lines;
}
function addPdfTextBlockRc2(page,text,x,y,font,size,maxWidth,lineHeight=14){
  const lines=pdfWrapLinesRc2(text,font,size,maxWidth);lines.forEach((ln,i)=>page.drawText(ln,{x,y:y-i*lineHeight,size,font}));return y-lines.length*lineHeight;
}

window.loadPenilaianFase1Rc2=async function(){
  const {npsn,idPeriode}=rc2Context_('rc2f1'),area=$('#rc2F1Area');
  if(!npsn||!idPeriode){area.innerHTML=msg('Pilih sekolah dan periode.','warning');return;}
  area.innerHTML=loading('Memuat Penilaian Fase 1...');
  try{
    const [r,p]=await Promise.all([
      api('getPenilaianFase1',{npsn,idPeriode}),
      api('getPipelinePenilaianSPJ',{npsn,idPeriode})
    ]);
    const ready=r.readiness||{},a=r.asesmen||null,rows=r.indikator||[];
    if(!a){
      area.innerHTML=`${rc2PipelineCards_(p)}
        <div class="message ${ready.phase1_ready?'ok':'warning'}" style="margin-top:14px">
          <b>${ready.phase1_ready?'Sekolah siap Fase 1.':'Fase 1 belum dapat dimulai.'}</b><br>
          BKU Data: ${ready.bku_ready?'VALID':'BELUM'} • Dokumen: ${fmtNum(ready.documents_complete_count||0)}/10.
          ${(ready.blockers||[]).length?`<br>${esc((ready.blockers||[]).join(' • '))}`:''}
        </div>`;
      return;
    }

    const editable=isPengawas()&&!r.read_only;
    const body=rows.map(x=>{
      const evidence=`${esc(x.status_verifikasi||'-')} · temuan ${fmtNum(x.jumlah_temuan||0)}${x.catatan_pengawas?`<br><small>${esc(x.catatan_pengawas)}</small>`:''}`;
      const action=editable
        ? `<button class="btn btn-light btn-sm" onclick="editFase1ScoreRc2('${esc(a.id_asesmen)}','${esc(x.id_indikator)}','${x.skor??''}','${x.skor_otomatis??''}')">Verifikasi Pengawas</button>`
        : '-';
      return `<tr><td><b>${x.no_instrumen}. ${esc(x.nama_indikator)}</b><br><small class="muted">${esc(x.nama_file||'Belum ada dokumen')}</small></td><td>${fmtRupiah(x.nilai_acuan_bku||0)}</td><td>${evidence}</td><td>${x.skor_otomatis==null?'—':Number(x.skor_otomatis).toFixed(2)}</td><td>${x.skor==null?'—':Number(x.skor).toFixed(2)}</td><td>${action}</td></tr>`;
    }).join('');

    let footer='';
    const status=String(a.status_asesmen||'').toUpperCase();
    if(isPengawas()){
      if(status==='FASE_1_DIAJUKAN') footer='<div class="message ok"><b>Fase 1 sudah dikirim ke DINAS.</b> Tunggu persetujuan DINAS.</div>';
      else if(status==='FASE_1_SELESAI'||status==='FASE_2_SELESAI'||status==='FINAL') footer='<div class="message ok"><b>Fase 1 sudah disetujui DINAS.</b> Laporan Fase 1 resmi tersedia pada Hasil / Arsip.</div>';
      else if(status==='FASE_1_REVISI') footer=`<div class="message warning"><b>DINAS meminta revisi.</b><br>${esc(ready.phase1_revision_note||'Periksa kembali hasil Fase 1.')}</div><div class="toolbar"><button class="btn btn-primary" onclick="submitFase1PengawasRc2('${esc(a.id_asesmen)}')" ${r.can_submit?'':'disabled'}>Kirim Ulang ke DINAS</button></div>`;
      else footer=`<div class="toolbar" style="margin-top:14px"><button class="btn btn-primary" onclick="submitFase1PengawasRc2('${esc(a.id_asesmen)}')" ${r.can_submit?'':'disabled'}>Kirim Fase 1 ke DINAS</button></div>`;
    }else{
      if(status==='FASE_1_DIAJUKAN'){
        footer=`<div class="message warning"><b>Menunggu keputusan DINAS.</b> Nilai Fase 1 Pengawas: <b>${esc(a.nilai_kualitas??'-')}</b></div>
        <div class="field"><label>Catatan persetujuan / pengembalian</label><textarea id="rc2F1DinasNote" rows="3" placeholder="Catatan DINAS..."></textarea></div>
        <div class="toolbar"><button class="btn btn-primary" onclick="approveFase1DinasRc2('${esc(a.id_asesmen)}')">Setujui Fase 1</button><button class="btn btn-light" onclick="returnFase1DinasRc2('${esc(a.id_asesmen)}')">Kembalikan ke Pengawas</button></div>`;
      }else if(['FASE_1_SELESAI','FASE_2_SELESAI','FINAL'].includes(status)){
        footer=`<div class="message ok"><b>Fase 1 disetujui DINAS.</b> Nilai: <b>${esc(a.nilai_kualitas??'-')}</b>${ready.phase1_approved_at?` • ${esc(ready.phase1_approved_at)}`:''}</div>${rc2ReadinessBanner_(p)}`;
      }else{
        footer='<div class="message warning">Pengawas belum mengirim Fase 1 kepada DINAS.</div>';
      }
    }

    area.innerHTML=`${rc2PipelineCards_(p)}
      <div class="cards" style="margin-top:14px">
        <div class="stat"><small>BKU Data</small><strong style="font-size:1rem">${r.bku_ready?'VALID':'BELUM'}</strong></div>
        <div class="stat"><small>Dokumen</small><strong>${fmtNum(ready.documents_complete_count||0)}/10</strong></div>
        <div class="stat"><small>Temuan pending</small><strong>${fmtNum(r.pending_findings||0)}</strong></div>
        <div class="stat"><small>Verifikasi nilai pending</small><strong>${fmtNum(r.pending_value_verifications||0)}</strong></div>
      </div>
      <div class="table-wrap"><table class="friendly-table"><thead><tr><th>10 Komponen Dokumen</th><th>Acuan BKU</th><th>Hasil Pemeriksaan</th><th>Rekomendasi Sistem</th><th>Skor Fase 1</th><th>${isPengawas()?'Aksi Pengawas':'Status'}</th></tr></thead><tbody>${body||emptyRow(6)}</tbody></table></div>
      ${footer}`;
  }catch(e){area.innerHTML=msg(errorText(e));}
};

window.editFase1ScoreRc2=async function(idAsesmen,idIndikator,current,automatic){
  if(!isPengawas()){toast('Koreksi skor Fase 1 hanya dilakukan Pengawas.','warning');return;}
  const raw=prompt(`Skor Pengawas 0–4. Rekomendasi sistem: ${automatic}`,current);
  if(raw===null)return;
  const score=raw.trim()===''?'':Number(raw);
  if(score!==''&&(!Number.isFinite(score)||score<0||score>4)){toast('Skor harus 0–4.','warning');return;}
  let note='';
  if(score!==''&&Math.abs(Number(score)-Number(automatic))>.001){
    note=prompt('Alasan koreksi/verifikasi Pengawas:','')||'';
    if(!note.trim()){toast('Alasan wajib diisi bila skor berbeda dari rekomendasi sistem.','warning');return;}
  }
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU'}});
    toast('Penilaian Fase 1 Pengawas tersimpan.','ok');
    await loadPenilaianFase1Rc2();
  }catch(e){toast(errorText(e),'error',5000);}
};

window.submitFase1PengawasRc2=async function(idAsesmen){
  if(!confirm('Kirim Penilaian Fase 1 kepada DINAS? Setelah dikirim, Pengawas menunggu keputusan DINAS.'))return;
  try{
    const r=await api('submitPenilaianFase1Pengawas',{idAsesmen});
    toast(`Fase 1 dikirim ke DINAS. Nilai: ${r.nilai_kualitas}`,'ok',5000);
    await loadPenilaianFase1Rc2();
  }catch(e){toast(errorText(e),'error',6000);}
};

window.approveFase1DinasRc2=async function(idAsesmen){
  const catatan=$('#rc2F1DinasNote')?.value.trim()||'Disetujui DINAS';
  if(!confirm('Setujui hasil Penilaian Fase 1 Pengawas?'))return;
  try{
    await api('approvePenilaianFase1Dinas',{data:{id_asesmen:idAsesmen,catatan}});
    toast('Fase 1 disetujui DINAS. Sekolah siap masuk Rekonsiliasi.','ok',5000);
    await loadPenilaianFase1Rc2();
    window.renderRoleReadinessPanel?.();
  }catch(e){toast(errorText(e),'error',6000);}
};

window.returnFase1DinasRc2=async function(idAsesmen){
  const catatan=$('#rc2F1DinasNote')?.value.trim()||'';
  if(catatan.length<5){toast('Isi catatan koreksi DINAS minimal 5 karakter.','warning');return;}
  if(!confirm('Kembalikan Fase 1 kepada Pengawas untuk direvisi?'))return;
  try{
    await api('returnPenilaianFase1Dinas',{data:{id_asesmen:idAsesmen,catatan}});
    toast('Fase 1 dikembalikan kepada Pengawas.','ok',5000);
    await loadPenilaianFase1Rc2();
  }catch(e){toast(errorText(e),'error',6000);}
};

async function penilaianFase2View(){
  if(!isDinas()){ $('#mainContent').innerHTML=msg('Penilaian Fase 2 merupakan kewenangan DINAS.','warning'); return; }

  const [schoolRes,periods,assignRes]=await Promise.all([
    safeApi('getSekolah',{}, {data:[]}),
    ensurePeriodeMaster(),
    safeApi('getPenugasanPengawas',{}, {data:[]})
  ]);

  const schools=schoolRes?.data||[];
  const assignments=(assignRes?.data||[]).filter(x=>!x.status||upper(x.status)==='AKTIF');
  window._rc2Fase2Assignments=assignments;

  const npsn=state.selectedNpsn||'';
  const per=state.selectedPeriode||periods?.[0]?.id_periode||'';
  const schoolOptions=schools.map(x=>`<option value="${esc(x.npsn)}" ${String(x.npsn)===String(npsn)?'selected':''}>${esc(x.npsn)} — ${esc(x.nama_sekolah||'-')}</option>`).join('');
  const periodOptions=(periods||[]).map(x=>`<option value="${esc(x.id_periode)}" ${String(x.id_periode)===String(per)?'selected':''}>${esc(x.nama_periode||x.id_periode)}${x.tahun?` • ${esc(x.tahun)}`:''}</option>`).join('');

  const pengawasMap=new Map();
  assignments.forEach(x=>{
    const id=String(x.id_pengawas||'').trim();
    if(!id)return;
    if(!pengawasMap.has(id))pengawasMap.set(id,{
      id_pengawas:id,
      nama_pengawas:x.nama_pengawas||id,
      count:0
    });
    pengawasMap.get(id).count++;
  });
  const pengawasOptions=Array.from(pengawasMap.values())
    .sort((a,b)=>String(a.nama_pengawas).localeCompare(String(b.nama_pengawas),'id'))
    .map(x=>`<option value="${esc(x.id_pengawas)}">${esc(x.nama_pengawas)} • ${fmtNum(x.count)} sekolah</option>`)
    .join('');

  $('#mainContent').innerHTML=head('Penilaian Fase 2','DINAS menetapkan hasil akhir setelah rekonsiliasi. Pilih cara kerja per sekolah atau kelompok sekolah per Pengawas.')+`
    <div class="panel">
      <div class="message info"><b>Opsi pengelompokan hanya mempermudah navigasi Fase 2.</b> Syarat, scoring, rekonsiliasi, finalisasi, dan algoritma backend tidak diubah.</div>

      <div class="form-grid">
        <div class="field">
          <label>Mode Penilaian</label>
          <select id="rc2F2Mode" onchange="switchFase2ModeRc2()">
            <option value="SEKOLAH">Per Sekolah</option>
            <option value="PENGAWAS">Kelompok per Pengawas</option>
          </select>
        </div>
        <div class="field">
          <label>Periode DINAS</label>
          <select id="rc2f2Periode" onchange="onFase2PeriodChangeRc2()">
            <option value="">-- Pilih periode --</option>${periodOptions}
          </select>
        </div>
      </div>

      <div id="rc2F2SchoolMode">
        <div class="field">
          <label>Sekolah</label>
          <select id="rc2f2Npsn">
            <option value="">-- Pilih sekolah --</option>${schoolOptions}
          </select>
        </div>
        <div class="toolbar">
          <button class="btn btn-primary" onclick="loadFase2Rc2()">Muat Fase 2</button>
        </div>
      </div>

      <div id="rc2F2PengawasMode" hidden>
        <div class="form-grid">
          <div class="field">
            <label>Pengawas</label>
            <select id="rc2F2Pengawas" onchange="loadFase2GroupRc2()">
              <option value="">-- Pilih Pengawas --</option>${pengawasOptions}
            </select>
          </div>
          <div class="field">
            <label>Filter Sekolah</label>
            <select id="rc2F2GroupFilter" onchange="renderFase2GroupRc2()">
              <option value="ALL">Semua Sekolah Binaan</option>
              <option value="READY">Siap Dinilai Fase 2</option>
              <option value="DONE">Fase 2 Selesai</option>
              <option value="NOT_READY">Belum Siap Fase 2</option>
            </select>
          </div>
        </div>
        <div id="rc2F2GroupArea" style="margin-top:12px">
          <div class="muted">Pilih Pengawas untuk menampilkan sekolah binaannya.</div>
        </div>
      </div>

      <div id="rc2F2Area" style="margin-top:14px"></div>
    </div>`;

  if(state.selectedPeriode&&state.selectedNpsn)setTimeout(()=>loadFase2Rc2(),0);
}

window.switchFase2ModeRc2=function(){
  const mode=$('#rc2F2Mode')?.value||'SEKOLAH';
  const school=$('#rc2F2SchoolMode'),group=$('#rc2F2PengawasMode'),detail=$('#rc2F2Area');
  if(school)school.hidden=mode!=='SEKOLAH';
  if(group)group.hidden=mode!=='PENGAWAS';
  if(detail)detail.innerHTML='';
  if(mode==='PENGAWAS'&&$('#rc2F2Pengawas')?.value)loadFase2GroupRc2();
};

window.onFase2PeriodChangeRc2=function(){
  const p=$('#rc2f2Periode')?.value||'';
  if(p)state.selectedPeriode=p;
  if(($('#rc2F2Mode')?.value||'SEKOLAH')==='PENGAWAS'&&$('#rc2F2Pengawas')?.value){
    loadFase2GroupRc2();
  }else{
    const area=$('#rc2F2Area');if(area)area.innerHTML='';
  }
};

window.loadFase2GroupRc2=async function(){
  const area=$('#rc2F2GroupArea');
  const idPengawas=$('#rc2F2Pengawas')?.value||'';
  const idPeriode=$('#rc2f2Periode')?.value||state.selectedPeriode||'';
  if(!area)return;
  if(!idPengawas){area.innerHTML='<div class="muted">Pilih Pengawas.</div>';return;}
  if(!idPeriode){area.innerHTML=msg('Pilih periode DINAS.','warning');return;}

  state.selectedPeriode=idPeriode;
  area.innerHTML=loading('Mengelompokkan sekolah binaan untuk Fase 2...');
  try{
    const bucket=await api('getAssessmentDashboardBuckets',{idPeriode});
    const assignmentRows=(window._rc2Fase2Assignments||[]).filter(x=>String(x.id_pengawas||'')===String(idPengawas));
    const schoolSet=new Set(assignmentRows.map(x=>String(x.npsn||'')));
    const rowMap=new Map();
    (bucket.bucket_order||[]).forEach(b=>{
      ((bucket.buckets||{})[b.id]||[]).forEach(x=>{
        if(schoolSet.has(String(x.npsn||'')))rowMap.set(String(x.npsn),x);
      });
    });

    // Tetap tampilkan sekolah binaan yang belum mempunyai snapshot readiness.
    assignmentRows.forEach(a=>{
      const n=String(a.npsn||'');
      if(!rowMap.has(n))rowMap.set(n,{
        npsn:n,
        nama_sekolah:a.nama_sekolah||n,
        kecamatan:a.kecamatan||'-',
        phase1_approved:false,
        reconciliation_done:false,
        ready_for_phase2:false,
        phase2_done:false,
        phase2_score:null,
        next_label:'Belum siap Fase 2'
      });
    });

    window._rc2Fase2GroupRows=Array.from(rowMap.values()).sort((a,b)=>String(a.nama_sekolah||'').localeCompare(String(b.nama_sekolah||''),'id'));
    renderFase2GroupRc2();
  }catch(e){area.innerHTML=msg(errorText(e),'error');}
};

window.renderFase2GroupRc2=function(){
  const area=$('#rc2F2GroupArea');if(!area)return;
  const filter=$('#rc2F2GroupFilter')?.value||'ALL';
  let rows=window._rc2Fase2GroupRows||[];

  if(filter==='READY')rows=rows.filter(x=>x.ready_for_phase2&&!x.phase2_done);
  else if(filter==='DONE')rows=rows.filter(x=>x.phase2_done);
  else if(filter==='NOT_READY')rows=rows.filter(x=>!x.ready_for_phase2&&!x.phase2_done);

  const all=window._rc2Fase2GroupRows||[];
  const readyCount=all.filter(x=>x.ready_for_phase2&&!x.phase2_done).length;
  const doneCount=all.filter(x=>x.phase2_done).length;
  const pendingCount=all.length-readyCount-doneCount;

  const cards=`<div class="cards" style="margin-bottom:12px">
    <div class="stat"><small>Sekolah Binaan</small><strong>${fmtNum(all.length)}</strong></div>
    <div class="stat"><small>Siap Fase 2</small><strong>${fmtNum(readyCount)}</strong></div>
    <div class="stat"><small>Fase 2 Selesai</small><strong>${fmtNum(doneCount)}</strong></div>
    <div class="stat"><small>Belum Siap</small><strong>${fmtNum(pendingCount)}</strong></div>
  </div>`;

  const body=rows.map(x=>{
    const ready=!!x.ready_for_phase2&&!x.phase2_done;
    const done=!!x.phase2_done;
    const status=done
      ? '<span class="badge badge-success">FASE 2 SELESAI</span>'
      : ready
        ? '<span class="badge badge-success">SIAP DINILAI FASE 2</span>'
        : '<span class="badge badge-warning">BELUM SIAP FASE 2</span>';
    const f1=x.phase1_score==null?'—':Number(x.phase1_score).toFixed(2);
    const f2=x.phase2_score==null?'—':Number(x.phase2_score).toFixed(2);
    const action=done
      ? `<button class="btn btn-light btn-sm" onclick="openFase2SchoolFromGroupRc2('${esc(x.npsn)}')">Lihat →</button>`
      : ready
        ? `<button class="btn btn-primary btn-sm" onclick="openFase2SchoolFromGroupRc2('${esc(x.npsn)}')">Nilai Fase 2 →</button>`
        : `<button class="btn btn-light btn-sm" onclick="openFase2SchoolFromGroupRc2('${esc(x.npsn)}')">Lihat Status →</button>`;
    return `<tr>
      <td><b>${esc(x.nama_sekolah||x.npsn)}</b><br><small class="muted">${esc(x.npsn)} • ${esc(x.kecamatan||'-')}</small></td>
      <td>${status}</td>
      <td>${x.phase1_approved?'<span class="badge badge-success">DISETUJUI</span>':'<span class="badge badge-warning">BELUM</span>'}<br><small>Nilai ${f1}</small></td>
      <td>${x.reconciliation_done?'<span class="badge badge-success">SELESAI</span>':'<span class="badge badge-warning">BELUM</span>'}</td>
      <td>${done?`<b>${f2}</b>`:'—'}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');

  area.innerHTML=cards+`<div class="table-wrap"><table class="friendly-table">
    <thead><tr><th>Sekolah</th><th>Status Fase 2</th><th>Fase 1</th><th>Rekonsiliasi</th><th>Nilai Fase 2</th><th>Aksi</th></tr></thead>
    <tbody>${body||emptyRow(6,'Tidak ada sekolah pada filter ini.')}</tbody>
  </table></div>`;
};

window.saveFase2Rc2=async function(){const {npsn,idPeriode}=rc2Context_('rc2f2'),nilai=Number($('#rc2F2Score')?.value),catatan=$('#rc2F2Note')?.value.trim()||'';if(!Number.isFinite(nilai)||nilai<0||nilai>100){toast('Nilai harus 0–100.','warning');return;}try{await api('finalisasiPenilaianFase2',{data:{npsn,id_periode:idPeriode,nilai_akhir:nilai,catatan}});toast('Penilaian Fase 2 ditetapkan.','ok');await loadFase2Rc2();}catch(e){toast(errorText(e),'error',5000);}};

async function finalisasiSpjView(){
  if(!isDinas()){ $('#mainContent').innerHTML=msg('Finalisasi merupakan kewenangan DINAS.','warning'); return; }

window.openAgreementAssessmentV226=async function(){
  const p=$('#periodeSelect')?.value||state.selectedPeriode;
  const n=isSchool()?ownNpsn():($('#npsnSelect')?.value||state.selectedNpsn);

  if(!p || !n){
    toast('Pilih periode dan sekolah terlebih dahulu.','warning');
    return;
  }

  state.selectedPeriode=p;
  state.selectedNpsn=n;

  const area=$('#assessmentArea');
  if(!area)return;
  area.innerHTML=loading('Memuat hasil penilaian dan status pengesahan...');

  try{
    if(isDinas()){
      const s=await api('getPengesahanPenilaianByPeriode',{idPeriode:p,npsn:n});
      const d=s.data;
      if(!d){
        area.innerHTML=msg('Penilaian sekolah/periode ini belum tersedia.','warning');
        return;
      }
      window.__v227CurrentAssessmentId=d.id_asesmen;
      area.innerHTML=v227ApprovalLifecycleHtml_(d,true);
      return;
    }

    const r=await api('buatAtauAmbilAsesmen',{idPeriode:p,npsn:n});
    const asesmen=r.data||r.asesmen||r;
    const indRes=await safeApi(
      'hitungIndikatorDariTemuan',
      {idPeriode:p,npsn:n,idAsesmen:asesmen.id_asesmen},
      {data:[]}
    );
    renderAssessment(asesmen,indRes.data||[]);

    const st=upper(asesmen.status_asesmen||'');
    if(st!=='SELESAI' && st!=='KAJI_ULANG'){
      const info=document.createElement('div');
      info.className='message warning';
      info.style.marginTop='12px';
      info.innerHTML='<b>Penilaian belum final.</b> Tahap persetujuan atau keberatan aktif setelah Pengawas memfinalisasi penilaian.';
      area.prepend(info);
    }
  }catch(e){
    area.innerHTML=msg(errorText(e));
  }
};

        <div class="muted" style="margin-top:9px;">Nilai saat ini: <b>${esc(x.nilai_akhir??'-')}</b></div>
        ${isPengawas()&&status==='DIAJUKAN'?`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="mulaiKajiUlang('${esc(x.id_pesan)}')">🔎 Mulai Kaji Ulang</button></div>`:''}
        ${isPengawas()&&status==='DIKAJI_ULANG'?`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="bukaPenilaianUntukKajiUlang('${esc(x.id_asesmen)}')">✎ Buka Penilaian</button><button class="btn btn-light" onclick="selesaikanKajiUlang('${esc(x.id_pesan)}')">Selesaikan Kaji Ulang</button></div>`:''}
        ${status==='SELESAI'?`<div class="message ok" style="margin-top:12px"><b>Hasil kaji ulang:</b> ${esc(x.keputusan||'DITINJAU')}<br>${esc(x.tanggapan_pengawas||'')}</div>`:''}

function renderAssessment(a, indicators){
  const interactiveBtn=`<button class="btn btn-light" onclick="loadView('pdfInteraktif')">📄 Buka PDF & Penilaian Interaktif</button>`;
  const applicable=indicators.filter(x=>x.berlaku!==false);
  const totalWeight=applicable.reduce((s,x)=>s+Math.max(0,Number(x.bobot_efektif??x.bobot)||0),0);
  const earned=applicable.reduce((s,x)=>s+((Number(x.skor)||0)/4)*Math.max(0,Number(x.bobot_efektif??x.bobot)||0),0);
  const preview=Number((totalWeight>0?(earned/totalWeight)*100:0).toFixed(2));
  const pendingValue=Number(indicatorResp.pending_value_verifications||0);
  const bkuReady=indicatorResp.bku_ready!==false;
  const done=indicators.filter(x=>String(x.sumber_penilaian||'').toUpperCase()==='KOREKSI_MANUAL').length;
  const rows=indicators.map(d=>{
    const manual=String(d.sumber_penilaian||'').toUpperCase()==='KOREKSI_MANUAL';
    const pending=Number(d.temuan_belum_verifikasi||0);
    const na=d.berlaku===false;
    const status=na?'N/A':String(d.status_verifikasi||'BELUM UPLOAD').replaceAll('_',' ');
    const statusClass=na?'info':status.includes('BELUM')?'danger':status.includes('PERLU')?'warning':status.includes('SELISIH')?'danger':'success';
    const resolved=d.skor!==null && d.skor!=='' && d.skor!==undefined;
    const scoreText=na?'-':(resolved?Number(d.skor).toFixed(2):'—');
    const autoText=na?'Tidak berlaku':(d.skor_otomatis==null?'menunggu verifikasi nilai':`rekomendasi ${Number(d.skor_otomatis).toFixed(2)}`);
    const comp=d.komponen_acuan_bku||{};
    const compParts=Object.entries(comp).filter(([,v])=>Number(v)!==0).map(([k,v])=>`${esc(k.replaceAll('_',' '))}: <b>${fmtRupiah(v)}</b>`);
    return `<tr>
      <td>
        <b>${Number(d.no_instrumen||0)}. ${esc(d.nama_indikator)}</b>
        <br><small class="muted">${d.nama_file?`📄 ${esc(d.nama_file)}`:'Belum ada file aktif'}</small>
        ${d.ocr_confidence?`<br><small class="muted">OCR confidence ${Number(d.ocr_confidence).toFixed(0)}% — hanya alat bantu</small>`:''}
      </td>
      <td>
        <div><b>${fmtRupiah(d.nilai_acuan_bku||0)}</b></div>
        <small class="muted">${esc(d.label_acuan_bku||'Acuan BKU Data')}</small>
        ${compParts.length?`<div class="v230-components">${compParts.join(' · ')}</div>`:''}
      </td>
      <td><span class="badge badge-${statusClass}">${esc(status)}</span></td>
      <td><b>${Number(d.bobot||0).toFixed(0)}%</b>${na?'<br><small class="muted">dikeluarkan dari pembagi</small>':''}</td>
      <td><span class="${manual?'score-manual':'score-auto'}">${scoreText}</span><br><small class="muted">${autoText}</small></td>
      <td>
        ${d.nilai_dokumen_terverifikasi!=null?`<div><small class="muted">Nilai dokumen:</small> <b>${fmtRupiah(d.nilai_dokumen_terverifikasi)}</b></div>`:''}
        ${d.nilai_selisih!=null?`<div><small class="muted">Selisih:</small> <b>${fmtRupiah(d.nilai_selisih)}</b></div>`:''}
        ${pending?`<div style="margin-top:4px"><span class="badge badge-warning">${pending} temuan belum diverifikasi</span></div>`:''}
      </td>
      <td>${isPengawas()&&!na&&String(a.status_asesmen||'').toUpperCase()!=='SELESAI'?`<button class="btn btn-sm btn-light" onclick="editScore('${esc(a.id_asesmen)}','${esc(d.id_indikator)}','${resolved?d.skor:''}','${d.skor_otomatis??''}')">${manual?'Ubah verifikasi':'Verifikasi manual'}</button>`:'-'}</td>
    </tr>`;
  }).join('');

  $('#assessmentArea').innerHTML=`
    <div class="toolbar" style="margin-bottom:12px">${interactiveBtn}</div>
    ${String(a.status_asesmen||'').toUpperCase()==='KAJI_ULANG'?`<div class="message warning" style="margin-bottom:14px"><b>Mode Kaji Ulang.</b> Sekolah mengajukan keberatan atas penilaian ini. Silakan periksa kembali bukti, temuan, dan skor sebelum memfinalisasi ulang.</div>`:''}
    ${!bkuReady?'<div class="message error">BKU Data periode ini belum siap. Nilai acuan 10 dokumen belum dapat dihitung.</div>':''}
    ${pendingValue?`<div class="message warning"><b>${pendingValue} dokumen</b> masih menunggu verifikasi kesesuaian nilai terhadap BKU Data.</div>`:''}
    <div class="assessment-guide">
      <div class="assessment-guide-card"><strong>1. Nilai acuan dari BKU Data</strong><span>Setiap dokumen dibandingkan dengan nilai yang dihitung dari transaksi kanonik BKU Data pada periode yang sama.</span></div>
      <div class="assessment-guide-card"><strong>2. Upload bukan otomatis skor 4</strong><span>Dokumen harus cocok nilainya dengan acuan BKU, atau diverifikasi manual oleh Pengawas bila OCR tidak mampu membaca.</span></div>
      <div class="assessment-guide-card"><strong>3. N/A dikeluarkan dari perhitungan</strong><span>Dokumen yang memang tidak berlaku pada periode tersebut tidak dihukum dan bobotnya dinormalisasi.</span></div>
    </div>
    <div class="cards">
      <div class="stat"><small>Status</small><strong style="font-size:1.05rem">${esc(a.status_asesmen||'-')}</strong></div>
      <div class="stat"><small>Nilai kualitas sementara</small><strong>${a.nilai_kualitas??preview}</strong></div>
      <div class="stat"><small>Dokumen Dinilai</small><strong>${indicators.length}/10</strong></div>

window.editScore=async function(idAsesmen,idIndikator,current,automatic){
  const raw=prompt(`Skor kesesuaian dokumen terhadap nilai acuan BKU Data (0–4).\nSkor otomatis: ${automatic}\nKosongkan untuk kembali ke skor otomatis.`,current??automatic);
  if(raw===null)return;
  let score=raw.trim()===''?'':Number(raw);
  if(score!=='' && (!Number.isFinite(score)||score<0||score>4)){toast('Skor harus antara 0 sampai 4.','warning');return;}
  let note='';
  if(score!=='' && Math.abs(Number(score)-Number(automatic))>0.001){
    note=prompt('Jelaskan alasan koreksi manual:','');
    if(note===null||!note.trim()){toast('Koreksi manual wajib memiliki alasan.','warning');return;}
  }
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU'}});
    toast(score===''?'Dokumen dikembalikan ke rekomendasi sistem.':'Koreksi skor dokumen tersimpan.','ok');
    await openAssessment();
  }catch(e){toast(errorText(e),'error',4500);}
};

window.autoFillSekolahByNpsn = async function(npsn) {
  const raw = String(npsn || '').trim();
  if(!raw || raw.length < 4) return;

  // Gunakan key NPSN kanonik 8 digit agar number/text Google Sheets tetap cocok.
  const digits = raw.replace(/\D/g,'');
  const cleanNpsn = digits.length === 8 ? digits : raw;
  const namaSekolahInput = $('#regNamaSekolah');
  const usernameInput = $('#regUsername');

  if(namaSekolahInput) namaSekolahInput.value = 'Mencari data sekolah...';
  if(usernameInput) usernameInput.value = cleanNpsn;

  try {
    // Endpoint publik khusus lookup satu NPSN. getSekolah membutuhkan session,
    // sedangkan halaman registrasi memang belum mempunyai session login.
    const res = await api('getSekolahByNpsnPublic', { npsn: cleanNpsn });
    const found = res?.data || null;
    if(!found || !found.npsn) throw new Error('NPSN tidak ditemukan di database sekolah.');

    const namaVal = found.nama_sekolah || found.nama_satuan_pendidikan || found.nama || found.sekolah || '';
    if(namaSekolahInput) {
      namaSekolahInput.value = namaVal;
      namaSekolahInput.dataset.lookupOk = '1';
    }
    if(usernameInput) usernameInput.value = String(found.npsn || cleanNpsn).trim();
  } catch(e) {
    if(namaSekolahInput) {
      namaSekolahInput.value = '';
      namaSekolahInput.dataset.lookupOk = '0';
    }
    console.warn('Gagal memuat otomatis nama sekolah:', e?.message || e);
    alert(errorText(e) || 'NPSN tidak ditemukan di database sekolah.');
  }
};

window.resetPageAndFilter = function() {

// 3. Logika Gabungan Filter (Pencarian & Kecamatan), Sorting, & Pagination
window.applyGlobalMonFilterAndSort = function() {
  const rawData = window._cachedGlobalMon || [];
  const searchInput = $('#searchGlobalMon');
  const query = searchInput ? searchInput.value.toLowerCase() : '';
  const selectedKec = $('#filterKecamatan') ? $('#filterKecamatan').value : '';
  const sortMode = $('#sortGlobalMon') ? $('#sortGlobalMon').value : 'nama_asc';
  const pageSizeVal = $('#pageSizeGlobalMon') ? $('#pageSizeGlobalMon').value : '25';

  // A. Filter Data
  let result = rawData.filter(x => {
    const matchText = String(x.npsn).toLowerCase().includes(query) || 
                      String(x.nama_sekolah).toLowerCase().includes(query) || 
                      String(x.kecamatan).toLowerCase().includes(query) ||
                      String(x.alamat_lengkap).toLowerCase().includes(query);
    const matchKec = !selectedKec || String(x.kecamatan) === selectedKec;
    return matchText && matchKec;
  });

  // B. Sorting Data
  result.sort((a, b) => {
    if (sortMode === 'nama_asc') {
      return (a.nama_sekolah || '').localeCompare(b.nama_sekolah || '');
    } else if (sortMode === 'pagu_desc') {
      const valA = typeof num === 'function' ? num(a.total_pagu) : (Number(a.total_pagu) || 0);
      const valB = typeof num === 'function' ? num(b.total_pagu) : (Number(b.total_pagu) || 0);
      return valB - valA;
    } else if (sortMode === 'realisasi_desc') {
      const valA = typeof num === 'function' ? num(a.total_realisasi) : (Number(a.total_realisasi) || 0);
      const valB = typeof num === 'function' ? num(b.total_realisasi) : (Number(b.total_realisasi) || 0);
      return valB - valA;
    } else if (sortMode === 'npsn_asc') {
      return String(a.npsn).localeCompare(String(b.npsn));
    }
    return 0;
  });

  // C. Pagination Logic
  const totalData = result.length;
  let paginatedResult = result;
  let totalPages = 1;

  if (pageSizeVal !== 'all') {
    const limit = parseInt(pageSizeVal) || 25;
    totalPages = Math.ceil(totalData / limit) || 1;
    if (window._monState.currentPage > totalPages) window._monState.currentPage = totalPages;
    if (window._monState.currentPage < 1) window._monState.currentPage = 1;

    const startIdx = (window._monState.currentPage - 1) * limit;
    paginatedResult = result.slice(startIdx, startIdx + limit);
  } else {
    window._monState.currentPage = 1;
  }

  // D. Render Baris Tabel
  const body = $('#globalMonBody');
  const countLabel = $('#countGlobalMon');
  const pagInfo = $('#paginationInfo');
  const pagControls = $('#paginationControls');

  if(body) {
    const startIndexOffset = pageSizeVal === 'all' ? 0 : (window._monState.currentPage - 1) * (parseInt(pageSizeVal) || 25);
    body.innerHTML = generateGlobalMonRows(paginatedResult, startIndexOffset);
  }
  if(countLabel) countLabel.innerText = result.length;
  if(pagInfo && pageSizeVal !== 'all') {
    pagInfo.innerText = `Halaman ${window._monState.currentPage} dari ${totalPages}`;
  } else if(pagInfo) {
    pagInfo.innerText = 'Menampilkan seluruh data';
  }

  // E. Render Tombol Navigasi Halaman
  if(pagControls) {
    if(pageSizeVal === 'all' || totalPages <= 1) {
      pagControls.innerHTML = '';
    } else {
      pagControls.innerHTML = `
        <button class="btn btn-light btn-sm" ${window._monState.currentPage === 1 ? 'disabled' : ''} onclick="changeMonPage(-1)">← Sebelumnya</button>
        <span style="font-size:0.9rem; font-weight:600;">Hal ${window._monState.currentPage} / ${totalPages}</span>
        <button class="btn btn-light btn-sm" ${window._monState.currentPage === totalPages ? 'disabled' : ''} onclick="changeMonPage(1)">Selanjutnya →</button>`;
    }
  }
};

// 4. Fungsi Navigasi Halaman
window.changeMonPage = function(direction) {
  window._monState.currentPage += direction;
  applyGlobalMonFilterAndSort();
};

function generateGlobalMonRows(list, offset = 0) {
  if(!list || list.length === 0) return emptyRow(7, 'Tidak ada data yang cocok dengan filter.');
  return list.map((x, idx) => `
    <tr>
      <td style="text-align:center">${offset + idx + 1}</td>
      <td><b>${esc(x.npsn)}</b></td>
      <td>
        <b>${esc(x.nama_sekolah)}</b><br>
        <small class="muted">📍 ${esc(x.alamat_lengkap)} (Kec. ${esc(x.kecamatan)})</small>
      </td>
