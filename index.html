window.analyzeRkasReplaceFile=async function(){
  const file=$('#rkasReplaceFile')?.files?.[0];
  const out=$('#rkasReplacePreview'), msgHost=$('#rkasReplaceMsg'), btn=$('#rkasReplaceAnalyzeBtn');
  if(!file){msgHost.innerHTML=msg('Pilih file Excel RKAS terlebih dahulu.','warning');return;}
  btn.disabled=true;
  try{ await ensureXlsxLib(); }catch(e){ msgHost.innerHTML=msg(e.message,'warning'); btn.disabled=false; return; }btn.textContent='Menganalisis...';
  out.innerHTML=loading('Membaca struktur DPA/RKAS dan memisahkan subtotal dari detail barang...');
  try{
    const buffer=await file.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buffer),{type:'array',cellDates:true});
    const parsed=_rkasParseDpaWorkbookClient(wb);
    let rows=parsed.rows||[];
    if(!rows.length) throw new Error('Tidak ditemukan detail barang RKAS. Pastikan file menggunakan format DPA/RKA yang memiliki Kode Rekening, NPSN sekolah, uraian barang, volume, harga, dan jumlah.');

    const scope=$('#rkasReplaceScope').value;
    const selected=_rkasReplaceNpsn_($('#rkasReplaceNpsn')?.value||'');
    if(scope==='ONE'){
      const before=rows.length;
      rows=rows.filter(x=>x.npsn===selected);
      if(!rows.length) throw new Error(`NPSN ${selected} tidak ditemukan pada file.`);
      parsed.filtered=before-rows.length;
    }

    let officialSchoolMap={};
    try{
      const sr=await api('getSekolah',{});
      (sr.data||[]).forEach(s=>{
        const n=_rkasReplaceNpsn_(s.npsn);
        if(n) officialSchoolMap[n]=s;
      });
    }catch(e){ throw new Error('Gagal membaca master sekolah: '+errorText(e)); }

    const unknownNpsn=[...new Set(rows.map(x=>x.npsn).filter(n=>!officialSchoolMap[n]))];
    const originalRows=rows.length;
    if(scope==='ALL'){
      rows=rows.filter(x=>!!officialSchoolMap[x.npsn]);
    }
    if(!rows.length) throw new Error('Tidak ada detail RKAS yang cocok dengan sekolah resmi.');
    const schools=_rkasReplaceSchoolSet_(rows);
    const total=_rkasReplaceTotal_(rows);
    const bySchool={};
    rows.forEach(x=>{
      if(!bySchool[x.npsn])bySchool[x.npsn]={npsn:x.npsn,count:0,total:0};
      bySchool[x.npsn].count++;
      bySchool[x.npsn].total+=Number(x.pagu||0);
    });

    window._rkasReplacePreview={file,rows,scope,selectedNpsn:selected,schools,bySchool,total,diagnostics:parsed.diagnostics};
    const schoolCards=Object.values(bySchool).slice(0,30).map(x=>
      `<div class="panel" style="margin:0;padding:10px"><b>${esc(x.npsn)}</b><div class="muted">${fmtNum(x.count)} item • ${fmtRupiah(x.total)}</div></div>`
    ).join('');
    
    out.innerHTML=`<div class="panel" style="background:#f0fdf4">
      <h3>Analisis Berhasil</h3>
      <div class="muted">Total baris valid: <b>${fmtNum(rows.length)}</b> • Total Pagu: <b>${fmtRupiah(total)}</b> • Sekolah: <b>${schools.length}</b></div>
      <div class="school-index-grid" style="margin-top:12px">${schoolCards}</div>
      <div class="toolbar" style="margin-top:16px;justify-content:flex-end">
        <button class="btn btn-primary" onclick="commitRkasReplace()">⚡ Lakukan Penggantian RKAS</button>
      </div>
    </div>`;
  }catch(e){
    out.innerHTML=msg(errorText(e),'error');
  }finally{
    btn.disabled=false;
    btn.textContent='🔎 Analisis File';
  }
};

window.executeRkasReplace=async function(){
  const p=window._rkasReplacePreview;
  if(!p||!p.rows?.length){toast('Belum ada hasil analisis file.','warning');return;}
  const btns=$('#rkasReplacePreview')?.querySelectorAll('button')||[];
  btns.forEach(b=>b.disabled=true);
  const msgHost=$('#rkasReplaceMsg');
  try{
    if(!confirm(
      p.scope==='ALL'
      ? `Ganti RKAS untuk ${p.schools.length} sekolah dari file ini?\n\n${fmtNum(p.rows.length)} detail akan diproses. Data lama baru dibersihkan setelah verifikasi berhasil.`
      : `Ganti RKAS sekolah ${p.selectedNpsn}?\n\n${fmtNum(p.rows.length)} detail akan diproses. Data lama baru dibersihkan setelah verifikasi berhasil.`
    )){btns.forEach(b=>b.disabled=false);return;}

    msgHost.innerHTML=msg('Membuat sesi penggantian RKAS...','info');
    const start=await api('rkasReplaceStart',{data:{
      scope:p.scope,
      npsn:p.scope==='ONE'?p.selectedNpsn:'',
      tahun:Number($('#rkasReplaceYear').value||new Date().getFullYear()),
      versi_rkas:$('#rkasReplaceVersion').value.trim()||'PERUBAHAN',
      nama_file:p.file.name,
      jenis_file:p.file.name.toLowerCase().endsWith('.xls')?'XLS':'XLSX'
    }});
    const importId=start.id_import;
    // Batch lebih besar mengurangi round-trip Apps Script secara drastis.
    // Backend juga tidak lagi membaca ulang seluruh staging pada setiap batch.
    const batchSize=2000;
    let done=0;
    const totalRows=p.rows.length;
    const startedAt=Date.now();
    for(let i=0;i<totalRows;i+=batchSize){
      const batch=p.rows.slice(i,i+batchSize);
      const r=await api('rkasReplaceAppend',{data:{
        id_import:importId,
        scope:p.scope,
        npsn:p.scope==='ONE'?p.selectedNpsn:'',
        rows:batch,
        source_start:i+1
      }});
      done=Math.min(i+batch.length,totalRows);
      const elapsed=Math.max(1,Date.now()-startedAt);
      const rate=done/(elapsed/1000);
      const remain=Math.max(0,totalRows-done);
      const eta=rate>0?Math.round(remain/rate):0;
      const etaText=eta>0?` • perkiraan ${Math.ceil(eta/60)} menit lagi`:'';
      msgHost.innerHTML=msg(
        `♻️ Memproses RKAS: ${fmtNum(done)} / ${fmtNum(totalRows)} detail (${Math.round(done/totalRows*100)}%)${etaText}<br>`+
        `<span class="muted">Batch ${Math.ceil(done/batchSize)} • ${fmtNum(r.accepted||batch.length)} detail diterima</span>`,
        'info'
      );
      await new Promise(requestAnimationFrame);
    }

    msgHost.innerHTML=msg('Semua detail sudah masuk staging. Memverifikasi dan mengganti RKAS lama...','info');
    const fin=await api('rkasReplaceFinalize',{data:{
      id_import:importId,
      scope:p.scope,
      npsn:p.scope==='ONE'?p.selectedNpsn:''
    }});

    msgHost.innerHTML=msg(
      `Berhasil. ${fmtNum(fin.jumlah_baris)} detail menjadi APPROVED. `+
      `${fmtNum(fin.deleted_lama)} baris RKAS lama dihapus`+
      (fin.archived_karena_transaksi?`; ${fmtNum(fin.archived_karena_transaksi)} baris lama dipertahankan karena dipakai transaksi SPJ.`:'')+'.',
      'ok'
    );
    toast('RKAS berhasil diganti.','ok',6000);
    setTimeout(async()=>{
      $('#rkasReplaceModal')?.remove();
      await renderDinasRkasReview();
    },900);
  }catch(e){
    msgHost.innerHTML=msg(errorText(e),'error');
    btns.forEach(b=>b.disabled=false);
  }
};

    let periods=[];

    const pr=await _homeTimeout_(
      safeApi('getPeriodeSPJ',{status:'AKTIF'},{data:[]}),
      7000,
      {data:[]}
    );
    periods=pr?.data||[];

    if(!period && periods[0]){
      period=periods[0].id_periode||periods[0].id||'';
      state.selectedPeriode=period;
    }

    const pObj=periods.find(x=>String(x.id_periode||x.id)===String(period));
    const pName=pObj?.nama_periode||period||'Belum ada periode';
    const periodEl=document.getElementById('v214PeriodName');
    if(periodEl) periodEl.textContent=pName;

    if(!period){
      const title=document.getElementById('v214NextTitle');
      const desc=document.getElementById('v214NextDesc');
      if(title) title.textContent='Periode SPJ belum tersedia.';
      if(desc) desc.textContent='DINAS perlu menyiapkan periode SPJ terlebih dahulu.';
      return;
    }

    // Beranda memakai endpoint ringan. Workbench penuh hanya dibuka saat user
    // memang masuk ke modul pemeriksaan.
    const [sr,ir]=await Promise.all([
      _homeTimeout_(safeApi('getStatusSPJ',{idPeriode:period},{data:[]}),8000,{data:[]}),
      _homeTimeout_(safeApi('getBkuImportStatus',{idPeriode:period,npsn:npsn},{ready:false,data:null}),8000,{ready:false,data:null})
    ]);

    // Jika user sudah pindah modul, jangan menimpa halaman baru.
    if(state.view!=='home') return;

    const spj=sr?.data||[];
    const imp=ir?.data||null;
    const hasExcel=!!(ir?.ready && imp?.id_import);
    const total=spj.length;
    const done=spj.filter(x=>!['BELUM_UPLOAD','N/A'].includes(upper(x.status||''))).length;
    const repair=spj.filter(x=>upper(x.status||'')==='PERLU_PERBAIKAN').length;
    const pct=total?Math.round(done/total*100):0;

    let next='',action='transaksi',label='Tetapkan Excel BKU';
    if(!hasExcel){
      next='Tetapkan Excel BKU ARKAS terlebih dahulu.';
    }else if(repair){
      next=`Ada ${repair} bukti/dokumen yang perlu diperbaiki.`;
      action='dokumenBulanan'; label='Perbaiki Bukti';
    }else if(total && done<total){
      next=`Excel BKU sudah aktif. Lengkapi ${total-done} komponen bukti SPJ.`;
      action='dokumenBulanan'; label='Lengkapi Bukti';
    }else{
      next='BKU dan bukti sudah siap. Lihat status pemeriksaan dan hasil penilaian.';
      action='statusSpj'; label='Lihat Status';
    }

    const card=document.getElementById('v214NextCard');
    if(card) card.classList.toggle('danger',!!repair);
    const title=document.getElementById('v214NextTitle');
    if(title) title.textContent=next;
    const desc=document.getElementById('v214NextDesc');
    if(desc) desc.textContent=hasExcel
      ? `${fmtNum(imp.total_valid||0)} transaksi berasal dari ${imp.source_name||'Excel BKU aktif'}.`
      : 'Penilaian belum dimulai sebelum Excel BKU ditetapkan.';
    const btn=document.getElementById('v214NextBtn');
    if(btn){btn.textContent=label+' →';btn.onclick=()=>loadView(action);}
    const bku=document.getElementById('v214BkuStatus');
    if(bku) bku.textContent=hasExcel?'BKU AKTIF':'BELUM ADA BKU';
    const ev=document.getElementById('v214EvidenceStatus');
    if(ev) ev.textContent=`${done} dari ${total} bukti selesai`;
    const bar=document.getElementById('v214ProgressBar');
    if(bar) bar.style.width=(hasExcel?Math.max(34,pct):8)+'%';
    const step=document.getElementById('v214StepBku');
    if(step) step.textContent=hasExcel?'✓':'1';
    const stepTxt=document.getElementById('v214StepBkuText');
    if(stepTxt) stepTxt.textContent=hasExcel?'Snapshot aktif':'Tetapkan sumber transaksi';
  }

  window.homeView = async function(){
    const isS=String(state?.user?.role||'').toUpperCase()==='SEKOLAH';
    if(!isS){
      return baseHomeView ? baseHomeView() : undefined;
    }

    const name=state.user?.nama_pengguna||state.user?.nama||state.user?.nama_sekolah||state.user?.username||'Sekolah';
    const npsn=state.user?.npsn||state.user?.username||'-';

    // PENTING: render langsung dan return. Jangan menahan navigation shield sambil
    // menunggu Google Sheets/API.
    _renderSchoolHomeShell_(name,npsn,state.selectedPeriode||'');
    setTimeout(()=>{ _refreshSchoolHomeV214_(npsn).catch(e=>{
      if(state.view!=='home') return;
      const t=document.getElementById('v214NextTitle');
      const d=document.getElementById('v214NextDesc');
      if(t) t.textContent='Beranda siap digunakan.';
      if(d) d.textContent='Ringkasan belum berhasil dimuat. Anda tetap dapat membuka Excel BKU, Bukti SPJ, atau Status & Hasil.';
      console.error('Home summary:',e);
    }); },0);
  };
  window.schoolChoosePeriod = async function(){
    const r=await safeApi('getPeriodeSPJ',{status:'AKTIF'},{data:[]});
    const rows=(r.data||[]).map(x=>{const id=x.id_periode||x.id;return `<button class="v16-period-choice ${String(id)===String(state.selectedPeriode)?'active':''}" onclick="state.selectedPeriode='${esc(String(id))}';document.getElementById('v16PeriodModal')?.remove();schoolGoHome();"><b>${esc(x.nama_periode||id)}</b><small>${esc(x.tahun||'')}</small></button>`;}).join('');
    const wrap=document.createElement('div');wrap.id='v16PeriodModal';wrap.className='v16-modal';wrap.innerHTML=`<div class="v16-modal-card"><div class="v16-modal-head"><div><small>PILIH PERIODE</small><h3>Periode SPJ</h3></div><button class="v16-close" onclick="this.closest('.v16-modal').remove()">×</button></div>${rows||'<p class="muted">Belum ada periode aktif.</p>'}</div>`;document.body.appendChild(wrap);
  };
})();
</script>

<script>
(function(){
  const OFFICE_PHOTO='https://raw.githubusercontent.com/DikporaRembang/simpelspj/main/kantordindikpora.jpeg';

  function roleNow(){
    return String(window.state?.user?.role||'').toUpperCase();
  }
  function displayName(){
    return window.state?.user?.nama_pengguna ||
           window.state?.user?.nama ||
           window.state?.user?.nama_sekolah ||
           window.state?.user?.username || '';
  }
  function heroHtml(role){
    const labels={
      DINAS:'DINAS PENDIDIKAN, PEMUDA DAN OLAHRAGA',
      PENGAWAS:'RUANG KERJA PENGAWAS',
      SEKOLAH:'RUANG KERJA SEKOLAH'
    };
    const title={
      DINAS:'SIMPEL SPJ Kabupaten Rembang',
      PENGAWAS:'Pemeriksaan dan Penilaian SPJ',
      SEKOLAH:'Pengelolaan dan Cross-check SPJ'
    };
    const desc={
      DINAS:'Kelola periodisasi, sekolah, penugasan, anggaran, monitoring, temuan, serta laporan hasil penilaian dari satu sistem.',
      PENGAWAS:'Pilih sekolah binaan, periksa distribusi BKU dan PDF pendukung, tindak lanjuti temuan, lalu selesaikan penilaian.',
      SEKOLAH:'Tetapkan Excel BKU sebagai sumber transaksi, unggah dokumen PDF pembanding, periksa hasil cross-check, dan pantau hasil penilaian.'
    };
    return `<section class="v211-office-hero">
      <img src="${OFFICE_PHOTO}" alt="Kantor Dindikpora Kabupaten Rembang" loading="eager"
           onerror="this.style.display='none'">
      <div class="v211-office-copy">
        <div class="kicker">${labels[role]||'SIMPEL SPJ'}</div>
        <h2>${title[role]||'SIMPEL SPJ'}</h2>
        <p>${desc[role]||''}</p>
      </div>
    </section>`;
  }

  function dinasHome(){
    const c=document.getElementById('mainContent');
    if(!c)return;
    const name=displayName();
    c.innerHTML =
      heroHtml('DINAS') +
      `<div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap">
          <div>
            <small class="muted">BERANDA DINAS</small>
            <h3 style="margin:4px 0 5px">Selamat datang${name?', '+esc(name):''}</h3>
            <div class="muted">Alur DINAS: konfigurasi → sekolah → penugasan → anggaran → monitoring → hasil penilaian.</div>
          </div>
          <button class="btn btn-primary" onclick="loadView('arsipPenilaianV5')">🖨️ Laporan & Cetak</button>
        </div>
        <div class="v211-dinas-grid">
          <button class="v211-dinas-card" onclick="loadView('masterSpj')"><b>⚙️ Periode & Master SPJ</b><small>Tetapkan periodisasi dan komponen penilaian.</small></button>
          <button class="v211-dinas-card" onclick="loadView('sekolah')"><b>🏫 Data Sekolah</b><small>Kelola satuan pendidikan yang menggunakan SIMPEL SPJ.</small></button>
          <button class="v211-dinas-card" onclick="loadView('penugasan')"><b>👥 Penugasan Pengawas</b><small>Atur sekolah binaan dan tanggung jawab pemeriksa.</small></button>
          <button class="v211-dinas-card" onclick="loadView('rkasReview')"><b>📋 RKAS & Anggaran</b><small>Lihat pagu dan konteks anggaran sekolah.</small></button>
          <button class="v211-dinas-card" onclick="loadView('monitoringGlobal')"><b>📊 Monitoring SPJ</b><small>Pantau progres sekolah dan hasil pemeriksaan.</small></button>
          <button class="v211-dinas-card" onclick="loadView('temuan')"><b>⚠️ Temuan & Tindak Lanjut</b><small>Pantau temuan yang memerlukan perbaikan atau tindak lanjut.</small></button>
          <button class="v211-dinas-card" onclick="loadView('arsipPenilaianV5')"><b>🖨️ Laporan Penilaian</b><small>Buka hasil penilaian per sekolah/periode dan cetak.</small></button>
          <button class="v211-dinas-card" onclick="loadView('pesan')"><b>💬 Pesan & Koordinasi</b><small>Koordinasi dengan sekolah dan pengawas.</small></button>
          <button class="v211-dinas-card" onclick="loadView('dbCheck')"><b>✅ Validasi Sistem</b><small>Periksa kesehatan struktur data aplikasi.</small></button>
        </div>
      </div>
      <div class="message info" style="margin-top:14px">
        <b>Prinsip performa:</b> DINAS memperoleh fungsi pengelolaan, monitoring, dan laporan.
        Workbench transaksi BKU dan OCR PDF tetap khusus SEKOLAH/PENGAWAS agar proses berat tidak membebani akun DINAS.
      </div>`;
  }

  // Capture the full home implementation that existed before the old DINAS Lite wrapper.
  const previousHome=window.homeView;

  window.homeView=async function(){
    const role=roleNow();
    if(role==='DINAS'){
      dinasHome();
      return;
    }

    // Preserve the established SEKOLAH / PENGAWAS logic and add the office photo
    // without removing their current status cards/workflow.
    await previousHome();
    const c=document.getElementById('mainContent');
    if(!c || state.view!=='home')return;
    if(c.querySelector('.v211-office-hero'))return;
    c.insertAdjacentHTML('afterbegin',heroHtml(role));
  };
})();
</script>
