<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMPEL SPJ - Sistem Penilaian SPJ BOS SD</title>
<style>
:root{--p:#173b63;--p2:#245579;--soft:#eaf2f8;--bg:#f5f7fa;--text:#1f2937;--muted:#64748b;--border:#d9e2ec;--ok:#176b52;--warn:#a16207;--bad:#b42318;--shadow:0 10px 30px rgba(23,59,99,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#edf4f9,#f8fafc)}.auth-card{width:min(470px,100%);background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:30px}.brand{text-align:center;color:var(--p)}.brand h1{margin:0 0 5px;font-size:27px}.brand p{margin:0 0 22px;color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef3f7;padding:5px;border-radius:10px;margin-bottom:20px}.tabs button{border:0;background:transparent;padding:10px;border-radius:7px;font-weight:700;color:var(--muted)}.tabs button.active{background:#fff;color:var(--p);box-shadow:0 2px 9px #173b6315}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#334155}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#6d8eaa;box-shadow:0 0 0 3px #24557915}.field input[readonly]{background:#f8fafc}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.btn.primary{background:var(--p);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:#fff7df;color:#8a5a00;border:1px solid #efd99a}.btn.bad{background:var(--bad);color:#fff}.btn.gray{background:#eef2f6;color:#334155}.btn.block{width:100%}.message{min-height:20px;margin-top:10px;font-size:12px;color:var(--bad)}
.slider{height:48px;position:relative;border:1px solid var(--border);background:#edf2f6;border-radius:10px;overflow:hidden;user-select:none}.slider-track{position:absolute;inset:0 auto 0 0;width:0;background:#cfe4f3}.slider-text{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700}.slider-thumb{position:absolute;left:0;top:0;width:48px;height:48px;display:grid;place-items:center;background:var(--p);color:#fff;border-radius:9px;z-index:2}.slider.success .slider-thumb{background:var(--ok)}.slider.success .slider-text{color:var(--ok)}
.app{min-height:100vh;display:flex}.sidebar{width:265px;flex:0 0 265px;background:#fff;border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column}.side-brand{padding:7px 8px 18px;border-bottom:1px solid var(--border)}.side-brand strong{font-size:20px;color:var(--p)}.side-brand small{display:block;color:var(--muted);margin-top:4px}.nav{padding-top:13px;overflow:auto}.nav-group{margin-bottom:3px}.nav-btn,.sub-btn{width:100%;border:0;background:transparent;text-align:left;border-radius:8px;color:#334155;padding:10px 11px;font-weight:700}.nav-btn:hover,.nav-btn.active,.sub-btn:hover,.sub-btn.active{background:var(--soft);color:var(--p)}.sub-menu{display:none;padding-left:12px}.nav-group.open .sub-menu{display:block}.sub-btn{font-size:12px;font-weight:600}.logout{margin-top:auto;color:var(--bad)!important;background:#fff3f2!important}
.main{flex:1;min-width:0;padding:22px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.topbar h2{margin:0;color:var(--p);font-size:24px}.user{background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat small{color:var(--muted)}.stat strong{display:block;color:var(--p);font-size:22px;margin-top:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px;text-align:left;vertical-align:middle}th{background:#edf3f8;color:var(--p);font-weight:800}tbody tr:nth-child(even){background:#fbfcfe}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:#e8edf2;color:#475569}.badge.ok{background:#dcfce7;color:#176b52}.badge.bad{background:#fee2e2;color:#b42318}.badge.warn{background:#fef3c7;color:#a16207}.badge.info{background:#dbeafe;color:#1d4ed8}.empty,.loading{padding:24px;text-align:center;color:var(--muted)}.mobile-menu{display:none}
@media(max-width:800px){.sidebar{position:fixed;z-index:20;left:-280px;top:0;bottom:0;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:block;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px}.main{padding:14px}.stats{grid-template-columns:1fr}.topbar{align-items:flex-start}.auth-card{padding:22px}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="auth-card"><div class="brand"><h1>SIMPEL SPJ</h1><p>Sistem Penilaian SPJ BOS SD Kabupaten Rembang</p></div><div class="tabs"><button id="loginTab" class="active" onclick="switchAuth('login')">Masuk</button><button id="registerTab" onclick="switchAuth('register')">Daftar</button></div>
<form id="loginForm" onsubmit="loginSubmit(event)"><div class="field"><label>Username / NPSN</label><input id="loginUser" required autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div><div class="field"><label>Verifikasi</label><div id="loginSlider" class="slider"><div id="loginTrack" class="slider-track"></div><div id="loginText" class="slider-text">Geser ke kanan untuk verifikasi</div><div id="loginThumb" class="slider-thumb">→</div></div></div><button id="loginBtn" class="btn primary block" type="submit">Masuk</button></form>
<form id="registerForm" class="hidden" onsubmit="registerSubmit(event)"><div class="field"><label>Role</label><select id="regRole" onchange="changeRegisterRole()" required><option value="">Pilih role</option><option value="SEKOLAH">SEKOLAH</option><option value="PENGAWAS">PENGAWAS</option></select></div><div class="field"><label id="regIdentityLabel">NPSN / ID Pengawas</label><input id="regIdentity" disabled required oninput="debouncedLookup()"></div><div class="field"><label>Nama Sekolah / Nama Lengkap</label><input id="regName" readonly required></div><div class="field"><label>Password</label><input id="regPass" type="password" minlength="6" required></div><div class="field"><label>Konfirmasi Password</label><input id="regPass2" type="password" minlength="6" required></div><div class="field"><label>Verifikasi</label><div id="registerSlider" class="slider"><div id="registerTrack" class="slider-track"></div><div id="registerText" class="slider-text">Geser ke kanan untuk verifikasi</div><div id="registerThumb" class="slider-thumb">→</div></div></div><button id="registerBtn" class="btn primary block" type="submit">Kirim Pendaftaran</button></form><div id="authMessage" class="message"></div></div></section>
<section id="app" class="app hidden"><aside id="sidebar" class="sidebar"><div class="side-brand"><strong>SIMPEL SPJ</strong><small id="sideUser">-</small></div><nav id="nav" class="nav"></nav><button class="nav-btn logout" onclick="logout()">⎋ Keluar</button></aside><main class="main"><div class="topbar"><button class="mobile-menu" onclick="toggleSidebar()">☰</button><h2 id="pageTitle">Dashboard</h2><div id="userPill" class="user">-</div></div><div class="stats"><div class="card stat"><small>Role</small><strong id="statRole">-</strong></div><div class="card stat"><small>Status Sesi</small><strong>AKTIF</strong></div><div class="card stat"><small>Wilayah</small><strong>Rembang</strong></div></div><div id="content"></div></main></section>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwjTCHPCC5g0YZYygso8LPGSkpWjWF8PJ2F9WXYkMyWD2sTVCDqIFDS2PzdnzRECIkoaQ/exec';
const state={user:null,page:'dashboard',captcha:{login:{id:'',verified:false},register:{id:'',verified:false}},timer:null};
const titles={dashboard:'Dashboard',rkas:'RKAS Aktif',history:'Riwayat & Pengajuan RKAS',reviewAccounts:'Persetujuan Akun',reviewRkas:'Review Pengajuan RKAS',schools:'Data Sekolah',assignments:'Penugasan Pengawas',spj:'Master SPJ',indicators:'Indikator SPJ',periods:'Periode SPJ'};
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function token(){return localStorage.getItem('simpel_spj_token')||''} function role(){return String(state.user?.role||'').toUpperCase()}
function badge(v){let s=String(v??'-').toUpperCase(),c=['AKTIF','APPROVED','DISETUJUI'].includes(s)?'ok':['NONAKTIF','DITOLAK'].includes(s)?'bad':['DIAJUKAN','PERLU_PERBAIKAN'].includes(s)?'warn':'info';return `<span class="badge ${c}">${esc(v??'-')}</span>`}
async function api(action,data={}){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action,data})});const j=await r.json();if(!j.success)throw new Error(j.message||'Permintaan gagal.');return j}
function message(t){$('authMessage').textContent=t||''}
async function getCaptcha(type){try{let r=await api('captcha');state.captcha[type]={id:r.captcha_id,verified:false};resetSlider(type)}catch(e){message(e.message)}}
function resetSlider(type){let s=$(type+'Slider'),t=$(type+'Thumb'),tr=$(type+'Track'),tx=$(type+'Text');if(!s)return;t.style.left='0';tr.style.width='0';s.classList.remove('success');tx.textContent='Geser ke kanan untuk verifikasi'}
function initSlider(type){let s=$(type+'Slider'),t=$(type+'Thumb'),tr=$(type+'Track'),tx=$(type+'Text'),down=false,start=0;const cx=e=>e.touches?.[0]?.clientX??e.clientX;const begin=e=>{if(state.captcha[type].verified)return;down=true;start=cx(e);e.preventDefault()};const move=e=>{if(!down)return;let max=s.clientWidth-t.clientWidth,d=Math.max(0,Math.min(max,cx(e)-start));t.style.left=d+'px';tr.style.width=(d+t.clientWidth)+'px';if(d>=max-3){down=false;state.captcha[type].verified=true;s.classList.add('success');t.style.left=max+'px';tr.style.width='100%';tx.textContent='✓ Verifikasi berhasil'}};const end=()=>{if(down&&!state.captcha[type].verified){down=false;resetSlider(type)}};t.addEventListener('mousedown',begin);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);t.addEventListener('touchstart',begin,{passive:false});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',end)}
function switchAuth(t){$('loginForm').classList.toggle('hidden',t!=='login');$('registerForm').classList.toggle('hidden',t!=='register');$('loginTab').classList.toggle('active',t==='login');$('registerTab').classList.toggle('active',t==='register');message('');if(!state.captcha[t].id)getCaptcha(t)}
function changeRegisterRole(){let r=$('regRole').value,i=$('regIdentity'),n=$('regName');i.value='';n.value='';if(r==='SEKOLAH'){ $('regIdentityLabel').textContent='NPSN Sekolah (8 Digit)';i.disabled=false;i.maxLength=8;i.placeholder='Masukkan NPSN';n.readOnly=true;n.placeholder='Nama sekolah otomatis dari database'}else if(r==='PENGAWAS'){ $('regIdentityLabel').textContent='ID Pengawas';i.disabled=false;i.removeAttribute('maxlength');i.placeholder='Masukkan ID Pengawas';n.readOnly=false;n.placeholder='Nama lengkap'}else{i.disabled=true;n.readOnly=true}}
function debouncedLookup(){clearTimeout(state.timer);if($('regRole').value==='SEKOLAH')state.timer=setTimeout(lookupSchool,300)}
async function lookupSchool(){let n=$('regIdentity').value.trim();if(!/^\d{8}$/.test(n)){ $('regName').value='';return }$('regName').value='Memeriksa...';try{let r=await api('lookupSekolahByNpsn',{npsn:n});$('regName').value=r.data.nama_sekolah;message('')}catch(e){$('regName').value='';message(e.message)}}
async function loginSubmit(e){e.preventDefault();message('');if(!state.captcha.login.verified)return message('Silakan geser CAPTCHA sampai selesai.');let b=$('loginBtn');b.disabled=true;b.textContent='Memproses...';try{let r=await api('login',{username:$('loginUser').value.trim(),password:$('loginPass').value,captcha_id:state.captcha.login.id,captcha_answer:'SUCCESS'});state.user=r.user;localStorage.setItem('simpel_spj_token',r.token);localStorage.setItem('simpel_spj_user',JSON.stringify(r.user));showApp()}catch(e){message(e.message);getCaptcha('login')}finally{b.disabled=false;b.textContent='Masuk'}}
async function registerSubmit(e){e.preventDefault();message('');let r=$('regRole').value,id=$('regIdentity').value.trim(),p=$('regPass').value,p2=$('regPass2').value;if(!state.captcha.register.verified)return message('Silakan geser CAPTCHA sampai selesai.');if(p!==p2)return message('Konfirmasi password tidak sama.');let b=$('registerBtn');b.disabled=true;b.textContent='Mengirim...';try{let result;if(r==='SEKOLAH')result=await api('register',{npsn:id,password:p,password_confirm:p2,captcha_id:state.captcha.register.id,captcha_answer:'SUCCESS'});else if(r==='PENGAWAS')result=await api('registerPengawas',{id_pengawas:id,nama_pengguna:$('regName').value.trim(),password:p,password_confirm:p2,captcha_id:state.captcha.register.id,captcha_answer:'SUCCESS'});else throw new Error('Pilih role pendaftar.');alert(result.message||'Pendaftaran berhasil.');$('loginUser').value=id;switchAuth('login');getCaptcha('register')}catch(e){message(e.message);getCaptcha('register')}finally{b.disabled=false;b.textContent='Kirim Pendaftaran'}}
function allowed(p){let r=role();return {dashboard:['SEKOLAH','DINAS','PENGAWAS'],rkas:['SEKOLAH','DINAS'],history:['SEKOLAH'],reviewAccounts:['DINAS'],reviewRkas:['DINAS'],schools:['DINAS','PENGAWAS'],assignments:['DINAS','PENGAWAS'],spj:['SEKOLAH','DINAS','PENGAWAS'],indicators:['SEKOLAH','DINAS','PENGAWAS'],periods:['SEKOLAH','DINAS','PENGAWAS']}[p]?.includes(r)}
function buildNav(){let r=role(),h=`<button class="nav-btn" data-page="dashboard">▦ Dashboard</button>`;if(['SEKOLAH','DINAS'].includes(r))h+=`<div class="nav-group"><button class="nav-btn" data-group="rkas">▤ RKAS ▾</button><div class="sub-menu"><button class="sub-btn" data-page="rkas">RKAS Aktif</button>${r==='SEKOLAH'?'<button class="sub-btn" data-page="history">Riwayat & Pengajuan</button>':'<button class="sub-btn" data-page="reviewRkas">Pengajuan RKAS</button>'}</div></div>`;h+=`<div class="nav-group"><button class="nav-btn" data-group="spj">▣ SPJ ▾</button><div class="sub-menu"><button class="sub-btn" data-page="spj">Master Komponen SPJ</button><button class="sub-btn" data-page="indicators">Indikator</button><button class="sub-btn" data-page="periods">Periode SPJ</button></div></div>`;if(r==='DINAS')h+=`<div class="nav-group"><button class="nav-btn" data-group="dinas">✓ Dinas ▾</button><div class="sub-menu"><button class="sub-btn" data-page="reviewAccounts">Persetujuan Akun</button><button class="sub-btn" data-page="reviewRkas">Review RKAS</button><button class="sub-btn" data-page="schools">Data Sekolah</button><button class="sub-btn" data-page="assignments">Penugasan Pengawas</button></div></div>`;if(r==='PENGAWAS')h+=`<div class="nav-group"><button class="nav-btn" data-group="pengawas">📍 Pengawasan ▾</button><div class="sub-menu"><button class="sub-btn" data-page="assignments">Sekolah Binaan</button><button class="sub-btn" data-page="schools">Data Sekolah</button></div></div>`;$('nav').innerHTML=h;document.querySelectorAll('[data-group]').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'));document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>navigate(x.dataset.page))}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('sideUser').textContent=`${role()} • ${state.user.username||''}`;$('userPill').textContent=`${state.user.nama_pengguna||state.user.username} • ${role()}`;$('statRole').textContent=role();buildNav();navigate('dashboard')}
function navigate(p){if(!allowed(p))return;state.page=p;$('pageTitle').textContent=titles[p];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));let a=document.querySelector(`[data-page="${p}"]`);if(a?.closest('.nav-group'))a.closest('.nav-group').classList.add('open');$('sidebar').classList.remove('open');loadPage()}
async function loadPage(){let c=$('content');c.innerHTML='<div class="card loading">Memuat data...</div>';try{await ({dashboard:dashboardPage,rkas:rkasPage,history:historyPage,reviewAccounts:reviewAccountsPage,reviewRkas:reviewRkasPage,schools:schoolsPage,assignments:assignmentsPage,spj:spjPage,indicators:indicatorsPage,periods:periodsPage}[state.page])(c)}catch(e){c.innerHTML=`<div class="card"><b style="color:var(--bad)">${esc(e.message)}</b><br><br><button class="btn gray" onclick="loadPage()">Coba lagi</button></div>`}}
function dashboardPage(c){c.innerHTML=`<div class="card"><h3>Selamat datang</h3><p>Anda masuk sebagai <b>${esc(role())}</b>. Gunakan sidebar untuk mengakses modul sesuai hak akses akun.</p></div>`}
async function rkasPage(c){let x=await api('rkasAktif',{token:token(),npsn:state.user.npsn});renderGeneric(c,'RKAS Aktif',x.data||[],['npsn','versi_rkas','kode_rekening','uraian','pagu','status_rkas'])}
async function historyPage(c){let x=await api('rkasHistory',{token:token(),npsn:state.user.npsn});c.innerHTML=`<div class="card"><div class="toolbar"><h3>Riwayat & Pengajuan RKAS</h3><button class="btn primary" onclick="createRevision()">+ Buat Revisi</button></div><div id="tableArea"></div></div>`;renderRows($('tableArea'),x.data||[],['versi_rkas','kode_rekening','uraian','pagu','status_rkas'],row=>['DRAFT','PERLU_PERBAIKAN'].includes(String(row.status_rkas).toUpperCase())?`<button class="btn primary" onclick="submitRkas('${esc(row.versi_rkas)}')">Ajukan</button>`:'-')}
async function createRevision(){try{let x=await api('createRKASVersion',{token:token()});alert(x.message||('Versi '+x.versi_rkas+' berhasil dibuat.'));loadPage()}catch(e){alert(e.message)}}async function submitRkas(v){if(!confirm('Ajukan RKAS versi '+v+'?'))return;try{await api('ajukanRKAS',{token:token(),versi_rkas:v});loadPage()}catch(e){alert(e.message)}}
async function reviewAccountsPage(c){let x=await api('pendaftaranSekolah',{token:token()});c.innerHTML='<div class="card"><h3>Persetujuan Akun Sekolah</h3><div id="tableArea"></div></div>';renderRows($('tableArea'),x.data||[],['username','nama_pengguna','status','catatan_dinas'],r=>`<button class="btn ok" onclick="reviewAccount('${esc(r.id)}','AKTIF')">Aktifkan</button> <button class="btn bad" onclick="reviewAccount('${esc(r.id)}','NONAKTIF')">Tolak</button>`)}
async function reviewAccount(id,k){let cat=prompt('Catatan Dinas (opsional):')||'';try{await api('reviewPendaftaranSekolah',{token:token(),user_id:id,keputusan:k,catatan:cat});loadPage()}catch(e){alert(e.message)}}
async function reviewRkasPage(c){let x=await api('rkasPengajuan',{token:token()});c.innerHTML='<div class="card"><h3>Review Pengajuan RKAS</h3><div id="tableArea"></div></div>';renderRows($('tableArea'),x.data||[],['npsn','versi_rkas','kode_rekening','uraian','pagu','status_rkas'],r=>`<button class="btn ok" onclick="reviewRkas('${esc(r.npsn)}','${esc(r.versi_rkas)}','APPROVED')">Setujui</button> <button class="btn warn" onclick="reviewRkas('${esc(r.npsn)}','${esc(r.versi_rkas)}','PERLU_PERBAIKAN')">Perbaiki</button> <button class="btn bad" onclick="reviewRkas('${esc(r.npsn)}','${esc(r.versi_rkas)}','DITOLAK')">Tolak</button>`)}
async function reviewRkas(n,v,k){if(!confirm('Keputusan '+k+' untuk '+v+'?'))return;try{await api('reviewRKAS',{token:token(),npsn:n,versi_rkas:v,keputusan:k});loadPage()}catch(e){alert(e.message)}}
async function schoolsPage(c){let x=await api('sekolah',{token:token()});renderGeneric(c,'Data Sekolah',x.data||[],['npsn','nama_sekolah','kecamatan','alamat_lengkap'])}
async function assignmentsPage(c){let x=await api('penugasanPengawas',{token:token()});renderGeneric(c,'Penugasan Pengawas / Sekolah Binaan',x.data||[],['id_penugasan','npsn','id_pengawas','tanggal_mulai','tanggal_selesai','status','catatan'])}
async function spjPage(c){let x=await api('masterSPJ',{token:token()});renderGeneric(c,'Master Komponen SPJ',x.data||[],['kode_spj','nama_spj','urutan','status_aktif','keterangan'])}
async function indicatorsPage(c){let x=await api('masterIndikator',{token:token()});renderGeneric(c,'Indikator SPJ',x.data||[],['kode_indikator','id_spj','nama_indikator','metode_pemeriksaan','bobot','status_aktif'])}
async function periodsPage(c){let x=await api('periodeSPJ',{token:token()});renderGeneric(c,'Periode SPJ',x.data||[],['id_periode','tahun','bulan','nama_periode','tanggal_mulai','tanggal_selesai','status'])}
function renderGeneric(c,title,rows,cols){c.innerHTML=`<div class="card"><div class="toolbar"><h3>${title}</h3><span class="badge info">${rows.length} data</span></div><div id="tableArea"></div></div>`;renderRows($('tableArea'),rows,cols)}
function renderRows(box,rows,cols,actions){if(!rows.length){box.innerHTML='<div class="empty">Belum ada data.</div>';return}let h='<div class="table-wrap"><table><thead><tr>'+cols.map(x=>`<th>${esc(x.replaceAll('_',' '))}</th>`).join('')+(actions?'<th>Aksi</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(k=>`<td>${['status','status_rkas','status_aktif'].includes(k)?badge(r[k]):esc(r[k]??'-')}</td>`).join('')+(actions?`<td>${actions(r)}</td>`:'')+'</tr>').join('')+'</tbody></table></div>';box.innerHTML=h}
async function logout(){try{await api('logout',{token:token()})}catch(e){}localStorage.removeItem('simpel_spj_token');localStorage.removeItem('simpel_spj_user');location.reload()}
function toggleSidebar(){$('sidebar').classList.toggle('open')}
function restore(){let t=token(),u=localStorage.getItem('simpel_spj_user');if(t&&u){try{state.user=JSON.parse(u);showApp();return}catch(e){}}getCaptcha('login');getCaptcha('register')}
document.addEventListener('DOMContentLoaded',()=>{initSlider('login');initSlider('register');restore()});
</script></body></html>
