window.openDinasRkasPackage = function(index){
  const list = window._renderedDinasRkasList || window._currentDinasRkasList || [];
  const pkg = list[index]; 
  if(!pkg) return;
  
  window._selectedDinasRkasPackage = pkg;
  renderDinasRkasPackageDetail();
};

window.renderDinasRkasPackageDetail = async function(){
  const panel = $('#dinasRkasPanel'), stat = $('#dinasRkasStatArea'), pkg = window._selectedDinasRkasPackage;
  if(!panel || !pkg) return;
  
  panel.innerHTML = loading('Memuat rincian paket RKAS...');
  try{
    let r;
    if(pkg._queue_source === 'LEGACY'){
      r = await api('getRKASLegacyPackage', { data: { npsn: pkg.npsn, versi_rkas: pkg.versi_rkas || '', sumber_data: pkg.sumber_data || '' } });
    } else {
      r = await api('getRKASImport', { idImport: pkg.id_import_paket || pkg.id_import });
    }
    
    const rows = r.data || [];
    const total = rows.reduce((s, x) => s + Number(x.pagu || 0), 0);
    
    if(stat) {
      stat.innerHTML = `
        <div class="panel" style="margin:0;background:rgba(23,75,67,.05);">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;">
            <div>
              <div class="muted">NPSN ${esc(pkg.npsn)}</div>
              <h3 style="margin:2px 0;">${esc(pkg.nama_sekolah || '-')}</h3>
              <div class="muted">${esc(pkg.nama_file || pkg.versi_rkas || 'RKAS tersimpan')} • ${pkg._queue_source === 'LEGACY' ? 'Data legacy master_rkas' : 'Paket import'}</div>
            </div>
            <div style="text-align:right;">
              <small>Total Pagu</small>
              <div style="font-size:1.25rem;font-weight:900;">${fmtRupiah(total)}</div>
            </div>
          </div>
        </div>`;
    }
    
    const groups = groupBelanjaClient(rows, 'pagu'); 
    let no = 0;
    
    // OPTIMASI: Rendering detail kelompok belanja menggunakan .map().join('') yang bersih
    const detail = groups.flatMap(g => [
      kelompokHeaderHtml(g, 'Subtotal Pagu'),
      ...g.items.map(x => `
        <tr>
          <td>${++no}</td>
          <td><code>${esc(x.kode_rekening || '')}</code></td>
          <td>${esc(x.uraian || x.nama_belanja_asli || '')}</td>
          <td><b>${fmtRupiah(x.pagu || 0)}</b></td>
          <td>${badge(x.status_rkas || pkg.status_rkas, 'success')}</td>
          <td>${
            window._activeDinasStatus === 'DIAJUKAN' && pkg._queue_source !== 'LEGACY'
            ? `<button class="btn btn-sm btn-primary" onclick="doReviewRkas('${esc(pkg.id_import_paket || pkg.id_import)}', 'APPROVED')">Setujui</button>
               <button class="btn btn-sm btn-light" onclick="doReviewRkas('${esc(pkg.id_import_paket || pkg.id_import)}', 'PERLU_PERBAIKAN')">Perbaiki</button>
               <button class="btn btn-sm btn-danger" onclick="doReviewRkas('${esc(pkg.id_import_paket || pkg.id_import)}', 'DITOLAK')">Tolak</button>`
            : `<span class="muted">${pkg.status_rkas === 'APPROVED' ? 'Telah Disetujui' : 'Data Legacy'}</span>`
          }</td>
        </tr>`)
    ]).join('');

    panel.innerHTML = `
      <div class="toolbar"><button class="btn btn-sm btn-light" onclick="filterAndRenderDinasRkasTable()">← Kembali</button><span class="muted">${fmtNum(rows.length)} item RKAS</span></div>
      <div class="table-wrap">
        <table class="friendly-table">
          <thead>
            <tr><th>No</th><th>Kode</th><th>Uraian</th><th>Pagu</th><th>Status</th><th>Aksi</th></tr>
          </thead>
          <tbody>${detail || emptyRow(6)}</tbody>
        </table>
      </div>`;
  }catch(e){
    panel.innerHTML = msg(errorText(e), 'error');
  }
};

window.doReviewRkas = async function(versiRkas, keputusan) {
  if (!versiRkas || !keputusan) return;
  const label = keputusan === 'APPROVED' ? 'menyetujui' : (keputusan === 'DITOLAK' ? 'menolak' : 'meminta perbaikan');
  if (!confirm(`Yakin ${label} RKAS versi ${versiRkas}?`)) return;
  try {
    await api('reviewRKAS', { versiRkas, keputusan });
    toast('Keputusan review RKAS berhasil disimpan.', 'ok');
    await renderDinasRkasReview();
  } catch (err) {
    alert(errorText(err));
  }
};

window._schoolDirectoryCache = null;

async function sekolahView(){
  const c = $('#mainContent');
  if(!c) return;

  c.innerHTML = head('Daftar Sekolah','Pusat navigasi DINAS: cari sekolah, lihat pagu RKAS, lalu buka konteks sekolah.') +
    `<div class="school-directory-toolbar">
       <input id="searchSekolahInput" class="search-box" placeholder="🔍 Cari nama sekolah, NPSN, atau kecamatan...">
       <button class="btn btn-light" onclick="clearSchoolDirectorySearch()">Bersihkan</button>
     </div>
     <div class="panel" id="sekolahContent">${loading('Memuat daftar sekolah...')}</div>`;
     
  try{
    // OPTIMASI: Manfaatkan cache lokal frontend jika data sudah pernah ditarik sebelumnya
    if (!window._schoolDirectoryCache) {
      const [schoolRes, paguRes] = await Promise.all([
        api('getSekolah'),
        isDinas() ? safeApi('getRekapPaguRKAS', {}, { data: [] }) : Promise.resolve({ data: [] })
      ]);
      const list = schoolRes.data || [];
      const paguMap = buildPaguMap(paguRes.data || []);
      
      window._schoolDirectoryCache = list.map(x => Object.assign({}, x, { 
        total_pagu: Number(paguMap[normalizeNpsnClient(x.npsn)] || 0) 
      }));
    }

    window._schoolDirectoryData = window._schoolDirectoryCache;
    renderSchoolDirectory(window._schoolDirectoryData);
    
    const searchInput = $('#searchSekolahInput');
    if(searchInput) {
      searchInput.oninput = e => filterSchoolDirectory(e.target.value);
    }
  }catch(e){
    $('#sekolahContent').innerHTML = msg(errorText(e));
  }
}

function buildPaguMap(list){
  const map = {};
  (Array.isArray(list) ? list : []).forEach(x => {
    const n = normalizeNpsnClient(x.npsn);
    if(n) map[n] = Number(x.total_pagu || 0);
  });
  return map;
}

function filterSchoolDirectory(query){
  const q = String(query || '').trim().toLowerCase();
  const source = window._schoolDirectoryData || [];
  renderSchoolDirectory(!q ? source : source.filter(x =>
    String(x.npsn || '').toLowerCase().includes(q) ||
    String(x.nama_sekolah || '').toLowerCase().includes(q) ||
    String(x.kecamatan || '').toLowerCase().includes(q)
  ));
}

window.clearSchoolDirectorySearch = function(){
  const i = $('#searchSekolahInput');
  if(i) i.value = '';
  filterSchoolDirectory('');
};

  const area = $('#sekolahContent'); 
  if(!area) return;
  
  const rows = Array.isArray(list) ? list : [];
  const totalPagu = rows.reduce((a, x) => a + Number(x.total_pagu || 0), 0);
  
  // OPTIMASI: Menggunakan metode .map().join('') agar seluruh kartu sekolah dirangkai sekaligus di memori
  const cardsHtml = rows.map(x => `

      <div class="school-summary-card"><small>Sekolah</small><strong>${fmtNum(rows.length)}</strong></div>
      <div class="school-summary-card"><small>Total Pagu RKAS</small><strong>${fmtRupiah(totalPagu)}</strong></div>

      <div class="school-summary-card"><small>Konteks Kerja</small><strong style="font-size:1rem;margin-top:8px;">${isDinas() ? 'Pusat Kendali DINAS' : 'Sekolah Saya'}</strong></div>
    </div>

      <b>${fmtNum(rows.length)} sekolah ditampilkan</b>
      <span class="muted"> • Pilih sekolah untuk masuk ke konteks kerja sekolah tanpa memuat semua detail sekaligus.</span>

      ${cardsHtml}

function formatTanggalPenugasan(v){
  if(v==null || v==='') return '-';
  const raw=String(v).trim();
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(raw)) return raw;
  const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  const d=new Date(raw);
  if(!isNaN(d.getTime())) return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
  return raw;
}

function renderPenugasanTable(list){
  const content = $('#penugasanContent'); 
  if(!content) return;
  
  const rows = Array.isArray(list) ? list : [];

  rows.forEach(x => {
    const id = String(x.id_pengawas || '').trim();
    const nama = String(x.nama_pengawas || '').trim();
    const key = id || nama || 'TANPA_PENGAWAS';
    if(!groupsMap.has(key)) groupsMap.set(key, { id, nama: nama || id || 'Tanpa Pengawas', items: [] });
    const item = Object.assign({}, x, { total_pagu: Number(x.pagu_rkas ?? x.total_pagu ?? 0) });
    groupsMap.get(key).items.push(item);
  });
  
  const groups = Array.from(groupsMap.values()).sort((a, b) => String(a.nama).localeCompare(String(b.nama), 'id', { sensitivity: 'base' }));
  const totalPenugasan = rows.length;
  const totalPengawas = groups.length;
  const uniqueSchools = new Set(rows.map(x => normalizeNpsnClient(x.npsn)).filter(Boolean)).size;
  const aktif = rows.filter(x => upper(x.status || '') === 'AKTIF').length;

  content.innerHTML = summary + groupsHtml + `

      <div style="font-size:1.15rem;font-weight:900">${fmtRupiah(totalPagu)}</div>
    </div>`;

window.triggerDistribusiPenugasanAdil = async function(acakUlang = false) {
  const question = acakUlang
    ? 'Acak ulang semua sekolah NON-BEKU? Baris BEKU akan tetap dipertahankan. Sistem akan menyeimbangkan jumlah sekolah, total pagu, dan sebaran kecamatan antar pengawas.'
    : 'Jalankan distribusi adil lintas kecamatan? Sistem akan menyeimbangkan jumlah sekolah dan total pagu antar pengawas.';
  if (!confirm(question)) return;

  const resultBox = $('#distribusiResult');
  if (resultBox) {
    resultBox.style.display = 'block';
    resultBox.innerHTML = loading(acakUlang
      ? 'Mengacak ulang sekolah NON-BEKU dan menyeimbangkan sekolah + pagu...'
      : 'Menjalankan distribusi adil lintas kecamatan...');
  }

  try {
    const action = acakUlang ? 'acakUlangPenugasanAdil' : 'generatePenugasanAdil';
    const res = await api(action);
    const stats = res.statistik_beban || {};
    const balance = res.keseimbangan || {};

    let html = `<div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:16px;border-radius:12px;color:var(--success)">
      <strong>${esc(res.message || 'Distribusi berhasil dijalankan.')}</strong>
      <div class="muted" style="margin-top:6px">Sekolah diproses: <b>${fmtNum(res.reassigned_count || 0)}</b> · Baris BEKU dipertahankan: <b>${fmtNum(res.frozen_count || 0)}</b> · Kecamatan: <b>${fmtNum(res.kecamatan_tercakup || 0)}</b></div>
      <div style="margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px">
        <div class="stat"><small>Selisih jumlah sekolah</small><strong>${fmtNum(balance.selisih_sekolah || 0)}</strong></div>
        <div class="stat"><small>Pagu minimum</small><strong>${fmtRupiah(balance.min_pagu || 0)}</strong></div>
        <div class="stat"><small>Pagu maksimum</small><strong>${fmtRupiah(balance.max_pagu || 0)}</strong></div>
        <div class="stat"><small>Selisih pagu</small><strong>${fmtRupiah(balance.selisih_pagu || 0)}</strong></div>
      </div>
      <div style="font-size:.92rem;color:var(--text);margin-top:14px"><b>Distribusi per Pengawas:</b><ul>`;
    Object.keys(stats).forEach(pid => {
      const item = stats[pid] || {};
      const kec = item.kecamatan || {};
      const kecText = Object.keys(kec).sort().map(k => `${esc(k)} (${fmtNum(kec[k])})`).join(', ') || '-';
      html += `<li><b>${esc(item.nama_pengawas || pid)}</b>: ${fmtNum(item.jumlah_sekolah || 0)} sekolah · ${fmtRupiah(item.total_beban || 0)} · ${fmtNum(item.jumlah_kecamatan || 0)} kecamatan<br><span class="muted">${kecText}</span></li>`;
    });
    html += `</ul></div></div>`;
    if (resultBox) resultBox.innerHTML = html;
    else alert(res.message || 'Distribusi berhasil dijalankan.');

    setTimeout(() => { if (typeof penugasanView === 'function') penugasanView(); }, 700);
  } catch (err) {
    if (resultBox) resultBox.innerHTML = msg(errorText(err));
    else alert('Gagal: ' + errorText(err));
  }
};

// Cache lokal frontend untuk opsi target sekolah pada modul audit/cross-check
window._cachedAuditSchoolsGlobal = null;

async function getCachedAuditSchools_() {
  if (!window._cachedAuditSchoolsGlobal) {
    if (isPengawas()) {
      const r = await safeApi('getPenugasanPengawas', {}, { data: [] });
      const seen = new Set();
      window._cachedAuditSchoolsGlobal = (r.data || []).filter(x => {
        const n = normalizeNpsnClient(x.npsn);
        if (!n || seen.has(n)) return false;
        seen.add(n);
        x.npsn = n;
        return true;
      }).sort((a,b)=>String(a.nama_sekolah||'').localeCompare(String(b.nama_sekolah||''), 'id'));
    } else {
      const r = await safeApi('getSekolah', {}, { data: [] });
      window._cachedAuditSchoolsGlobal = r.data || [];
    }
  }
  return window._cachedAuditSchoolsGlobal;
}

/* ============================================================================
 * PROTECTED PDF VIEWER
 * PDF pemeriksaan tidak lagi membuka URL Google Drive langsung.
 * Alur: file_id -> API Base64 -> Uint8Array -> PDF.js -> Canvas.
 * ========================================================================== */
function drivePreviewUrl(url){ return ''; }

let __pdfJsPromise=null;
const __protectedPdfCache=new Map();

async function ensurePdfJs(){
  if(window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return window.pdfjsLib;
  }
  if(!__pdfJsPromise){
    __pdfJsPromise=new Promise((resolve,reject)=>{
      const existing=document.querySelector('script[data-simpel-pdfjs]');
      if(existing){ existing.addEventListener('load',()=>resolve(window.pdfjsLib)); existing.addEventListener('error',()=>reject(new Error('Library PDF.js gagal dimuat.'))); return; }
      const sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.dataset.simpelPdfjs='1';
      sc.onload=()=>resolve(window.pdfjsLib);
      sc.onerror=()=>reject(new Error('Library PDF.js gagal dimuat.'));
      document.head.appendChild(sc);
    });
  }
  const lib=await __pdfJsPromise;
  if(!lib) throw new Error('PDF.js tidak tersedia.');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return lib;
}

function base64ToUint8Array_(base64){
  const raw=atob(String(base64||''));
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}

async function getProtectedPdfDocument_(doc){
  const fileId=String(doc?.file_id||'');
  const period=String(window.__pdfInteractiveContext?.p||state.selectedPeriode||'');
  const npsn=String(window.__pdfInteractiveContext?.n||state.selectedNpsn||ownNpsn()||'');
  if(!fileId) throw new Error('Dokumen ini tidak memiliki file_id Drive yang dapat dibaca oleh viewer aman.');
  const lib=await ensurePdfJs();
  if(__protectedPdfCache.has(fileId)) return __protectedPdfCache.get(fileId);
  const r=await api('getDokumenPdfBase64',{fileId,idPeriode:period,npsn});
  if(!r?.base64) throw new Error('Server tidak mengembalikan data PDF.');
  const loadingTask=lib.getDocument({data:base64ToUint8Array_(r.base64)});
  const pdf=await loadingTask.promise;
  __protectedPdfCache.set(fileId,pdf);
  return pdf;
}

window.__pageAwareOcrCache = window.__pageAwareOcrCache || {};
window.__pageAwareOcrCancel = false;

function _ocrNormText_(v){
  return String(v||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function _ocrDigits_(v){ return String(v||'').replace(/\D/g,''); }
function _ocrMoneyVariants_(v){
  const n=Math.round(Math.abs(Number(v)||0)); if(!n) return [];
  const raw=String(n), dot=raw.replace(/\B(?=(\d{3})+(?!\d))/g,'.'), comma=raw.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return [raw,dot,comma,'RP '+dot,'RP'+dot];
}
function _ocrDateVariants_(v){
  const s=String(v||'').slice(0,10); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m)return [];
  return [m[3]+'/'+m[2]+'/'+m[1],m[3]+'-'+m[2]+'-'+m[1],m[3]+' '+m[2]+' '+m[1],m[1]+'-'+m[2]+'-'+m[3]];
}
function _scoreTxAgainstOcrPage_(tx,pageText){
  const raw=String(pageText||'').toUpperCase(); const norm=_ocrNormText_(raw); const digits=_ocrDigits_(raw);
  let score=0, reasons=[];
  const bukti=String(tx.nomor_bukti||'').trim();
  if(bukti){
    const bn=_ocrNormText_(bukti); const bd=_ocrDigits_(bukti);
    if((bn.length>=3 && norm.includes(bn)) || (bd.length>=4 && digits.includes(bd))){score+=38;reasons.push('nomor bukti');}
  }
  const kode=String(tx.kode_rekening||'').trim();
  if(kode){const kd=_ocrDigits_(kode);if(kd.length>=6 && digits.includes(kd)){score+=24;reasons.push('kode rekening');}}
  if(_ocrMoneyVariants_(tx.nilai_transaksi).some(v=>raw.includes(v))){score+=28;reasons.push('nominal');}
  if(_ocrDateVariants_(tx.tanggal_transaksi).some(v=>raw.includes(v))){score+=10;reasons.push('tanggal');}
  const words=_ocrNormText_(tx.uraian_transaksi||'').split(' ').filter(w=>w.length>=5 && !/^\d+$/.test(w));
  if(words.length){
    const uniq=[...new Set(words)].slice(0,12); const hit=uniq.filter(w=>norm.includes(w)).length;
    const ratio=hit/uniq.length;
    if(hit>=2){const add=Math.min(18,Math.round(ratio*18));score+=add;reasons.push('uraian');}
  }
  return {score:Math.min(100,score),reasons};
}
function _matchTransactionsToOcrPages_(transactions,pages){
  return (transactions||[]).map(tx=>{
    let best={page:0,score:0,reasons:[]};
    (pages||[]).forEach(p=>{const s=_scoreTxAgainstOcrPage_(tx,p.text);if(s.score>best.score)best={page:p.page,score:s.score,reasons:s.reasons};});
    let level='RENDAH'; if(best.score>=75)level='TINGGI'; else if(best.score>=50)level='SEDANG';
    return {id_transaksi:String(tx.id_transaksi||''),page:best.page,confidence:best.score,confidence_level:level,reasons:best.reasons};
  });
}
async function _canvasToBase64Jpeg_(canvas,quality=.9){
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Canvas tidak dapat dikonversi.')),'image/jpeg',quality));
  const buf=await blob.arrayBuffer(); const bytes=new Uint8Array(buf); let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(binary);
}
function _showPageAwareOcrModal_(name,totalPages){
  document.querySelector('#pageAwareOcrModal')?.remove();
  const modal=document.createElement('div');modal.id='pageAwareOcrModal';modal.className='simple-modal';
  modal.innerHTML=`<div class="simple-modal-card" style="width:min(920px,96vw);max-height:88vh;overflow:auto">
    <h3>OCR Presisi per Halaman — ${esc(name||'Dokumen PDF')}</h3>
    <p class="muted">Sistem membaca text-layer PDF terlebih dahulu. OCR gambar hanya dipakai untuk halaman scan agar lebih cepat dan ringan.</p>
    <div class="progress" style="margin:12px 0"><i id="pageOcrProgressBar" style="width:0%"></i></div>
    <div id="pageOcrProgressText" class="muted">Menyiapkan ${fmtNum(totalPages)} halaman...</div>
    <div id="pageOcrResult" style="margin-top:14px"></div>
    <div class="simple-modal-actions"><button id="pageOcrCancelBtn" class="btn btn-light">Batalkan</button><button class="btn btn-primary" onclick="this.closest('.simple-modal').remove()">Tutup</button></div>
  </div>`;
  document.body.appendChild(modal);
  $('#pageOcrCancelBtn').onclick=()=>{window.__pageAwareOcrCancel=true;$('#pageOcrCancelBtn').disabled=true;$('#pageOcrCancelBtn').textContent='Membatalkan...';};
  return modal;

window.ocrCurrentInteractivePdf=async function(){
  const c=window.__pdfInteractiveContext||{}; const select=$('#interactiveDocSelect');
  const doc=(c.docs||[]).find(d=>String(d.file_id||d.id_dokumen)===String(select?.value||''))||c.docs?.[0];
  if(!doc?.file_id){toast('Dokumen tidak memiliki file_id.','warning');return;}

  // Hasil untuk file yang sama tidak diproses ulang selama sesi browser.
  const cached=window.__pageAwareOcrCache?.[String(doc.file_id)];
  if(cached?.pages?.length){
    const reuse=confirm(`Analisis dokumen ini sudah tersedia (${cached.pages.length} halaman). Gunakan hasil yang sudah ada?`);
    if(reuse){
      const byId={};(cached.matches||[]).forEach(m=>{if(m.id_transaksi)byId[m.id_transaksi]=m;});
      (c.tx||[]).forEach(t=>{const m=byId[String(t.id_transaksi||'')];if(m){t.ocr_page=m.page;t.ocr_confidence=m.confidence;t.ocr_confidence_level=m.confidence_level;t.ocr_reasons=m.reasons;}});
      renderPdfInteractive(c); return;
    }
  }

  window.__pageAwareOcrCancel=false;
  try{
    const pdf=await getProtectedPdfDocument_(doc);
    _showPageAwareOcrModal_(doc.nama_file||'Dokumen PDF',pdf.numPages);
    const pages=[];
    const scannedPages=[];

    // TAHAP 1 — ekstraksi text-layer PDF. Ini sangat ringan dan tidak membutuhkan OCR/API.
    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
      if(window.__pageAwareOcrCancel) break;
      const p=await pdf.getPage(pageNo);
      let extracted='';
      try{
        const tc=await p.getTextContent({normalizeWhitespace:true,disableCombineTextItems:false});
        extracted=(tc.items||[]).map(i=>String(i.str||'')).join(' ').replace(/\s+/g,' ').trim();
      }catch(_){}
      if(extracted.length>=80){
        pages.push({page:pageNo,text:extracted,characters:extracted.length,source:'PDF_TEXT'});
      }else{
        scannedPages.push(pageNo);
      }
      const pct=Math.round(pageNo/pdf.numPages*45);
      const bar=$('#pageOcrProgressBar'),txt=$('#pageOcrProgressText');
      if(bar)bar.style.width=pct+'%';
      if(txt)txt.textContent=`Membaca struktur PDF ${pageNo}/${pdf.numPages} • ${scannedPages.length} halaman memerlukan OCR`;
      // Beri browser kesempatan menggambar UI agar aplikasi tidak terasa freeze.
      if(pageNo%4===0) await new Promise(r=>setTimeout(r,0));
    }

    if(window.__pageAwareOcrCancel){
      toast('Analisis dibatalkan.','warning'); return;
    }

    // TAHAP 2 — hanya halaman scan/tanpa text-layer yang dirender menjadi gambar.
    let ocrAvailable=true;
    if(scannedPages.length){
      const cap=await safeApi('getOcrCapability',{}, {success:true,available:false});
      ocrAvailable=!!cap.available;
    }

    if(scannedPages.length && !ocrAvailable){
      toast(`${scannedPages.length} halaman berupa scan dan memerlukan Drive API untuk OCR. Halaman yang memiliki text-layer tetap dianalisis.`,'warning',9000);
    }

    let processedScan=0;
    if(ocrAvailable){
      for(const pageNo of scannedPages){
        if(window.__pageAwareOcrCancel) break;
        const p=await pdf.getPage(pageNo);
        const base=p.getViewport({scale:1});
        // Resolusi dibuat secukupnya: lebih ringan daripada V20.1 (1500–2200 px).
        const targetWidth=Math.min(1500,Math.max(1100,base.width*1.55));
        const vp=p.getViewport({scale:targetWidth/base.width});
        const canvas=document.createElement('canvas');
        canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
        const ctx=canvas.getContext('2d',{alpha:false});
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        await p.render({canvasContext:ctx,viewport:vp}).promise;
        const imageBase64=await _canvasToBase64Jpeg_(canvas,.78);
        const r=await api('ocrPdfPageImage',{data:{fileId:doc.file_id,idPeriode:c.p,npsn:c.n,pageNo,imageBase64,mimeType:'image/jpeg'}});
        pages.push({page:pageNo,text:String(r.text||''),characters:Number(r.characters||0),source:'OCR'});
        processedScan++;
        canvas.width=1;canvas.height=1;
        const completed=pages.length;
        const pct=45+Math.round(processedScan/Math.max(1,scannedPages.length)*55);
        const bar=$('#pageOcrProgressBar'),txt=$('#pageOcrProgressText');
        if(bar)bar.style.width=Math.min(100,pct)+'%';
        if(txt)txt.textContent=`OCR scan ${processedScan}/${scannedPages.length} • total halaman terbaca ${completed}/${pdf.numPages}`;
        await new Promise(r=>setTimeout(r,0));
      }
    }

    pages.sort((a,b)=>a.page-b.page);
    if(!pages.length){
      toast('Tidak ada teks yang dapat dibaca dari dokumen ini.','warning',7000); return;
    }

    const matches=_matchTransactionsToOcrPages_(c.tx||[],pages);
    window.__pageAwareOcrCache[String(doc.file_id)]={pages,matches,createdAt:Date.now(),scannedPages:scannedPages.length,ocrUsed:processedScan};
    const byId={};matches.forEach(m=>{if(m.id_transaksi)byId[m.id_transaksi]=m;});
    (c.tx||[]).forEach(t=>{const m=byId[String(t.id_transaksi||'')];if(m){t.ocr_page=m.page;t.ocr_confidence=m.confidence;t.ocr_confidence_level=m.confidence_level;t.ocr_reasons=m.reasons;}});

    const high=matches.filter(m=>m.confidence>=75).length;
    const medium=matches.filter(m=>m.confidence>=50&&m.confidence<75).length;
    const low=matches.filter(m=>m.confidence<50).length;
    const textPages=pages.filter(p=>p.source==='PDF_TEXT').length;
    const ocrPages=pages.filter(p=>p.source==='OCR').length;
    const result=$('#pageOcrResult');
    if(result) result.innerHTML=`<div class="cards" style="margin-bottom:12px">
      <div class="stat"><small>Halaman terbaca</small><strong>${pages.length}/${pdf.numPages}</strong></div>
      <div class="stat"><small>Text-layer</small><strong>${textPages}</strong></div>
      <div class="stat"><small>OCR scan</small><strong>${ocrPages}</strong></div>
      <div class="stat"><small>Confidence tinggi</small><strong>${high}</strong></div>
    </div>${msg(`Analisis selesai. ${high} transaksi cocok tinggi, ${medium} sedang, ${low} rendah. OCR gambar hanya dijalankan pada halaman yang tidak memiliki text-layer.`,'ok')}`;

    const txt=$('#pageOcrProgressText');
    if(txt)txt.textContent=window.__pageAwareOcrCancel?`Dihentikan setelah ${pages.length} halaman.`:`Selesai • ${textPages} halaman dibaca langsung • ${ocrPages} halaman memakai OCR`;
    const bar=$('#pageOcrProgressBar');if(bar)bar.style.width='100%';
    const cancel=$('#pageOcrCancelBtn');if(cancel){cancel.disabled=true;cancel.textContent='Selesai';}
    renderPdfInteractive(c);
  }catch(e){toast(errorText(e),'error',9000);}
  finally{renderInteractiveEvidenceSummary_();}
};

function _v217PdfCompareHtml_(r){
  if(!r)return '';
  if(r.status==='PDF_BELUM_UPLOAD')return `<div class="message warning">${esc(r.message||'PDF belum diunggah.')}</div>`;
  if(r.status==='TIDAK_BERLAKU')return `<div class="message info">${esc(r.message||'Tidak berlaku.')}</div>`;
  const cmp=r.comparison||{}, fields=cmp.fields||[];
  const type=r.status==='COCOK'?'ok':(r.status==='SELISIH'?'error':'warning');
  const rows=fields.map(x=>`<tr><td>${esc(x.label)}</td><td>${fmtRupiah(x.expected||0)}</td><td>${x.readable?fmtRupiah(x.pdf||0):'<span class="badge badge-warning">Tidak terbaca</span>'}</td><td>${x.readable?fmtRupiah(x.difference||0):'-'}</td><td>${x.match?'<span class="badge badge-success">COCOK</span>':(x.readable?'<span class="badge badge-danger">SELISIH</span>':'<span class="badge badge-warning">CEK MANUAL</span>')}</td></tr>`).join('');
  return `<div class="message ${type}" style="margin-bottom:8px"><b>${esc(r.status)}</b> — ${esc(r.message||'')}</div><div class="table-wrap"><table class="friendly-table"><thead><tr><th>Komponen</th><th>Excel BKU</th><th>PDF</th><th>Selisih</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderPdfInteractive(x){
  const area=$('#pdfInteractiveArea');
  const rawDocs=x.docs||[];
  const docMap={};
  rawDocs.forEach(d=>{
    const k=String(d.file_id||d.id_dokumen||'');
    if(k && (!docMap[k] || Number(d.versi||0)>Number(docMap[k].versi||0))) docMap[k]=d;
  });
  const docs=Object.values(docMap);
  const tx=x.tx||[], findings=x.findings||[], a=x.assessment||{}, details=x.details||[];
  if(!docs.length){area.innerHTML=msg('Belum ada PDF/bukti yang diunggah untuk periode ini.','warning');return;}

  const ui=window.__pdfInteractiveUiState||{docId:'',page:1,zoom:1,totalPages:0};
  if(!docs.some(d=>String(d.file_id||d.id_dokumen)===String(ui.docId))) ui.docId=String(docs[0].file_id||docs[0].id_dokumen||'');
  const findingsByTx={};
  findings.forEach(f=>{const k=String(f.id_transaksi||'');if(k)(findingsByTx[k] ||= []).push(f);});
  const detailByFinding={};
  details.forEach(d=>{if(d.id_temuan) detailByFinding[String(d.id_temuan)]=d;});
  const docOptions=docs.map((d,i)=>`<option value="${esc(d.file_id||d.id_dokumen||'')}" ${String(ui.docId)===String(d.file_id||d.id_dokumen)?'selected':''}>${esc(d.nama_file||'Dokumen '+(i+1))}${d.id_spj?' • '+esc(d.id_spj):''}</option>`).join('');
  const txRows=tx.slice(0,250).map(t=>{
    const fs=findingsByTx[String(t.id_transaksi)]||[];

window.renderInteractivePdfPage=async function(pageNo){
  const c=window.__pdfInteractiveContext||{};
  const docs=c.docs||[];
  const select=$('#interactiveDocSelect');
  const doc=docs.find(d=>String(d.file_id||d.id_dokumen)===String(select?.value||''))||docs[0];
  const wrap=$('#interactivePdfFrame'); if(!wrap||!doc)return;
  const ui=window.__pdfInteractiveUiState||(window.__pdfInteractiveUiState={docId:'',page:1,zoom:1,totalPages:0});
  ui.docId=String(doc.file_id||doc.id_dokumen||'');
  const requested=Math.max(1,Number(pageNo)||1);
  wrap.innerHTML=loading(`Memuat halaman ${requested}...`);
  try{
    const pdf=await getProtectedPdfDocument_(doc);
    ui.totalPages=pdf.numPages;
    const safePage=Math.min(requested,pdf.numPages);
    ui.page=safePage;
    const input=$('#interactivePage'); if(input){input.value=safePage;input.max=pdf.numPages;}
    const page=await pdf.getPage(safePage);
    const base=page.getViewport({scale:1});
    const maxWidth=Math.max(320,Math.min(wrap.clientWidth-28,1100));
    const fit=Math.min(maxWidth/base.width,1.55);
    ui.zoom=Math.max(.7,Math.min(2,Number(ui.zoom)||1));
    const vp=page.getViewport({scale:fit*ui.zoom});
    const canvas=document.createElement('canvas');
    canvas.style.display='block';canvas.style.maxWidth='100%';canvas.style.height='auto';canvas.style.background='#fff';canvas.style.boxShadow='0 8px 25px rgba(16,42,67,.14)';
    canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
    wrap.innerHTML='';wrap.appendChild(canvas);
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    wrap.dataset.page=String(safePage);wrap.dataset.fileId=ui.docId;
    const info=$('#interactivePageInfo');if(info)info.textContent=`/ ${pdf.numPages}`;
    const zi=$('#interactiveZoomInfo');if(zi)zi.textContent=`${Math.round(ui.zoom*100)}%`;
    const prev=$('#interactivePrevBtn');if(prev)prev.disabled=safePage<=1;
    const next=$('#interactiveNextBtn');if(next)next.disabled=safePage>=pdf.numPages;
    renderInteractiveEvidenceSummary_();
  }catch(e){wrap.innerHTML=msg('PDF tidak dapat ditampilkan: '+errorText(e),'error');}
};

function ensureInteractivePdfKeyboard_(){
  if(window.__interactivePdfKeyboardBound)return;
  window.__interactivePdfKeyboardBound=true;
  document.addEventListener('keydown',e=>{
    if(state.view!=='pdfInteraktif'||!document.getElementById('interactivePdfFrame'))return;
    const tag=String(e.target?.tagName||'').toLowerCase();
    if(['input','textarea','select'].includes(tag)||e.target?.isContentEditable)return;
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();interactivePdfPrev();}
    else if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();interactivePdfNext();}
    else if(e.key==='Home'){e.preventDefault();renderInteractivePdfPage(1);}
    else if(e.key==='End'){e.preventDefault();renderInteractivePdfPage(window.__pdfInteractiveUiState?.totalPages||1);}
  });
}

window.jumpPdfPageFromTx=function(idTx){
  const c=window.__pdfInteractiveContext||{};

  const d=(c.details||[]).find(x=>fs.some(f=>String(f.id_temuan)===String(x.id_temuan)) && x.halaman_bukti);
  if(d?.halaman_bukti){renderInteractivePdfPage(d.halaman_bukti);return;}
  const tx=(c.tx||[]).find(x=>String(x.id_transaksi)===String(idTx));
  if(tx?.ocr_page){renderInteractivePdfPage(tx.ocr_page);toast(`Kandidat halaman OCR: ${tx.ocr_page} • confidence ${tx.ocr_confidence||0}%`,'ok',3500);return;}
  toast('Transaksi ini belum memiliki halaman bukti atau kandidat OCR.','warning');
};

window.saveBkuAutoAssessment=async function(idAsesmen,idIndikator,auto){

  try{await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,hasil_otomatis:Number(auto),catatan_pengawas:note,halaman_bukti:pageEl?.value||''}});toast(score===''?'Nilai otomatis disimpan.':'Nilai penilaian disimpan.','ok');await openPdfInteractive();}catch(e){toast(errorText(e),'error',5000);}

window.saveInlinePdfAssessment=async function(idAsesmen,idIndikator,automatic,idTemuan){
  const scoreEl=$('#v11score_'+idIndikator), pageEl=$('#v11page_'+idIndikator), noteEl=$('#v11note_'+idIndikator);
  if(!pageEl||!/^\d+$/.test(String(pageEl.value||''))||Number(pageEl.value)<1){toast('Nomor halaman bukti wajib diisi dengan benar.','warning');return;}
  const raw=scoreEl?.value||'';
  const score=raw===''?'':Number(raw);
  const auto=Number(automatic);
  let note=(noteEl?.value||'').trim();
  if(score!=='' && (score<0||score>4)){toast('Skor harus 0 sampai 4.','warning');return;}
  if(score!=='' && Math.abs(score-auto)>.001 && !note){toast('Jika skor berbeda dari sistem, alasan/catatan Pengawas wajib diisi.','warning');noteEl?.focus();return;}
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU',halaman_bukti:String(pageEl.value),id_temuan:idTemuan||''}});
    const page=String(pageEl.value);
    $('#interactivePage').value=page;
    toast('Penilaian dan bukti halaman berhasil disimpan.','ok');
    await openPdfInteractive();
  }catch(e){toast(errorText(e),'error',5000);}
};

window.interactiveEditScore=async function(idAsesmen,idIndikator,current,automatic,page,idTemuan){

  try{

};


async function keberatanView(){
  const areaId='appealArea';
  $('#mainContent').innerHTML=head(isSchool()?'Keberatan Penilaian':'Keberatan & Kaji Ulang','Sekolah dapat menyampaikan keberatan; pengawas dapat mengkaji ulang penilaian berdasarkan alasan dan bukti.');
  $('#mainContent').insertAdjacentHTML('beforeend',`<div id="${areaId}">${loading('Memuat keberatan...')}</div>`);
  await renderKeberatanList();
}

async function renderKeberatanList(){
  const area=$('#appealArea'); if(!area)return;
  try{
    const r=await api('getKeberatanPenilaian',{}), rows=r.data||[];
    if(!rows.length){
      area.innerHTML=msg(isSchool()?'Belum ada penilaian selesai yang dapat diajukan keberatan.':'Belum ada pengajuan keberatan dari sekolah.','ok');
      return;
    }
    const cards=rows.map(x=>{
      const status=String(x.status_keberatan||'DIAJUKAN').toUpperCase();
      if(isSchool() && x.can_appeal){
        return `<div class="panel" style="margin-bottom:12px;border-left:4px solid var(--emerald-2);">
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;">
            <div><b>Penilaian selesai</b><div class="muted">Asesmen ${esc(x.id_asesmen||'-')} • Periode ${esc(x.id_periode||'-')}</div></div>
            <span class="badge badge-success">SIAP DIAJUKAN</span>
          </div>
          <div style="margin-top:10px">Nilai akhir: <b>${esc(x.nilai_akhir??'-')}</b></div>
          <div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="ajukanKeberatan('${esc(x.id_asesmen)}')">✉ Ajukan Keberatan</button></div>
        </div>`;
      }
      const badgeClass=status==='SELESAI'?'success':status==='DIKAJI_ULANG'?'info':'warning';
      return `<div class="panel" style="margin-bottom:12px;border-left:4px solid var(--gold);">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;">
          <div><b>${esc(x.nama_sekolah||x.npsn||'Sekolah')}</b><div class="muted">NPSN ${esc(x.npsn||'-')} • Periode ${esc(x.id_periode||'-')}</div></div>
          <span class="badge badge-${badgeClass}">${esc(status.replaceAll('_',' '))}</span>
        </div>
        <div style="margin-top:12px;padding:12px;background:#f7f9fb;border-radius:10px;"><b>Alasan keberatan</b><div style="margin-top:5px;white-space:pre-wrap;line-height:1.55;">${esc(x.alasan||'-')}</div></div>
        <div class="muted" style="margin-top:9px;">Nilai saat ini: <b>${esc(x.nilai_akhir??'-')}</b></div>
        ${isPengawas()&&status==='DIAJUKAN'?`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="mulaiKajiUlang('${esc(x.id_pesan)}')">🔎 Mulai Kaji Ulang</button></div>`:''}
        ${isPengawas()&&status==='DIKAJI_ULANG'?`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="bukaPenilaianUntukKajiUlang('${esc(x.id_asesmen)}')">✎ Buka Penilaian</button><button class="btn btn-light" onclick="selesaikanKajiUlang('${esc(x.id_pesan)}')">Selesaikan Kaji Ulang</button></div>`:''}
        ${status==='SELESAI'?`<div class="message ok" style="margin-top:12px"><b>Hasil kaji ulang:</b> ${esc(x.keputusan||'DITINJAU')}<br>${esc(x.tanggapan_pengawas||'')}</div>`:''}
      </div>`;
    }).join('');
    area.innerHTML=cards;
  }catch(e){area.innerHTML=msg(errorText(e));}
}

window.ajukanKeberatan=async function(idAsesmen){
  const alasan=prompt('Tuliskan alasan keberatan dan bagian penilaian yang menurut sekolah perlu dikaji ulang:','');
  if(alasan===null||!alasan.trim())return;
  if(alasan.trim().length<10){toast('Alasan keberatan perlu dijelaskan dengan cukup jelas.','warning');return;}
  try{await api('ajukanKeberatanPenilaian',{data:{id_asesmen:idAsesmen,alasan:alasan.trim()}});toast('Keberatan berhasil diajukan kepada pengawas.','ok',4000);await renderKeberatanList();}
  catch(e){toast(errorText(e),'error',4500);}
};

window.mulaiKajiUlang=async function(idPesan){
  if(!confirm('Buka kembali penilaian ini untuk dikaji ulang? Nilai final akan kembali ke tahap pemeriksaan dan dapat diperiksa/dikoreksi oleh pengawas.'))return;
  try{await api('mulaiKajiUlangKeberatan',{idPesan});toast('Penilaian dibuka untuk kaji ulang.','ok');await renderKeberatanList();}
  catch(e){toast(errorText(e),'error',4500);}
};

window.bukaPenilaianUntukKajiUlang=async function(idAsesmen){
  state.reopenAssessmentId=idAsesmen; await loadView('asesmen');
};

window.selesaikanKajiUlang=async function(idPesan){
  const keputusan=prompt('Keputusan kaji ulang (misalnya DITERIMA, DITOLAK, atau DIPERBAIKI):','DITINJAU');
  if(keputusan===null||!keputusan.trim())return;
  const tanggapan=prompt('Tulis tanggapan pengawas kepada sekolah:','');
  if(tanggapan===null||!tanggapan.trim())return;
  try{const r=await api('selesaikanKajiUlangKeberatan',{data:{id_pesan:idPesan,keputusan:keputusan.trim(),tanggapan_pengawas:tanggapan.trim()}});toast(`Kaji ulang selesai. Nilai akhir: ${r.nilai_akhir??'-'}`,'ok',5000);await renderKeberatanList();}
  catch(e){toast(errorText(e),'error',5000);}
};

function renderAssessment(a, indicators){
  const interactiveBtn=`<button class="btn btn-light" onclick="loadView('pdfInteraktif')">📄 Buka PDF & Penilaian Interaktif</button>`;
  const totalWeight=indicators.reduce((s,x)=>s+Math.max(0,Number(x.bobot)||0),0);
  const weighted=totalWeight>0
    ? indicators.reduce((s,x)=>s+(Number(x.skor)||0)*Math.max(0,Number(x.bobot)||0),0)/totalWeight
    : (indicators.length?indicators.reduce((s,x)=>s+(Number(x.skor)||0),0)/indicators.length:0);
  const preview=Number((weighted*25).toFixed(2));
  const done=indicators.filter(x=>String(x.sumber_penilaian||'').toUpperCase()==='KOREKSI_MANUAL').length;
  const rows=indicators.map(d=>{
    const manual=String(d.sumber_penilaian||'').toUpperCase()==='KOREKSI_MANUAL';
    const findings=Number(d.jumlah_temuan||0);
    return `<tr>
      <td><b>${esc(d.kode_indikator)}</b><br><small class="muted">${esc(d.nama_indikator)}</small></td>
      <td>${Number(d.risiko||0).toFixed(2)}/100</td>
      <td>${Number(d.bobot||0).toFixed(2)}%</td>
      <td><span class="${manual?'score-manual':'score-auto'}">${Number(d.skor).toFixed(2)}</span><br><small class="muted">otomatis ${Number(d.skor_otomatis).toFixed(2)}</small></td>
      <td>${findings?`<span class="badge badge-warning">${findings} temuan</span>`:'<span class="badge badge-success">Tidak ada</span>'}</td>
      <td>${isPengawas()&&String(a.status_asesmen||'').toUpperCase()!=='SELESAI'?`<button class="btn btn-sm btn-light" onclick="editScore('${esc(a.id_asesmen)}','${esc(d.id_indikator)}','${d.skor}','${d.skor_otomatis}')">${manual?'Koreksi':'Koreksi manual'}</button>`:'-'}</td>
    </tr>`;
  }).join('');

  $('#assessmentArea').innerHTML=`
    <div class="toolbar" style="margin-bottom:12px">${interactiveBtn}</div>
    ${String(a.status_asesmen||'').toUpperCase()==='KAJI_ULANG'?`<div class="message warning" style="margin-bottom:14px"><b>Mode Kaji Ulang.</b> Sekolah mengajukan keberatan atas penilaian ini. Silakan periksa kembali bukti, temuan, dan skor sebelum memfinalisasi ulang.</div>`:''}
    <div class="assessment-guide">
      <div class="assessment-guide-card"><strong>1. Sistem membaca temuan</strong><span>Hanya temuan berstatus TERBUKTI yang menjadi dasar penalti otomatis.</span></div>
      <div class="assessment-guide-card"><strong>2. Risk Engine membentuk indikator</strong><span>Indikator dipilih otomatis berdasarkan pola risiko SPJ, bukan daftar bobot statis.</span></div>
      <div class="assessment-guide-card"><strong>3. Bobot dinamis</strong><span>Bobot setiap indikator dihitung dari profil risiko sekolah dan totalnya dinormalisasi menjadi 100%.</span></div>
    </div>
    <div class="cards">
      <div class="stat"><small>Status</small><strong style="font-size:1.05rem">${esc(a.status_asesmen||'-')}</strong></div>
      <div class="stat"><small>Nilai kualitas sementara</small><strong>${a.nilai_kualitas??preview}</strong></div>
      <div class="stat"><small>Indikator</small><strong>${indicators.length}</strong></div>
      <div class="stat"><small>Koreksi manual</small><strong>${done}</strong></div>
    </div>
    <div class="message ok" style="margin-top:14px">Penilaian menggunakan Risk Engine otomatis. Risiko sistem menentukan bobot dinamis; hanya temuan <b>TERBUKTI</b> yang mengurangi skor indikator.</div><div class="panel" style="margin-top:14px;padding:16px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <div><b>Nilai kualitas</b><div class="muted">Pratinjau berdasarkan indikator aktif dan bobotnya.</div></div>
        <strong style="font-size:1.5rem;color:var(--emerald-2)">${Number(a.nilai_kualitas??preview).toFixed(2)}</strong>
      </div>
    </div>
    <div class="table-wrap"><table class="friendly-table"><thead><tr><th>Indikator</th><th>Risiko</th><th>Bobot Dinamis</th><th>Skor</th><th>Temuan terbukti</th><th>Aksi</th></tr></thead><tbody>${rows||emptyRow(6)}</tbody></table></div>
    ${isPengawas()&&String(a.status_asesmen||'').toUpperCase()!=='SELESAI'?`<div class="toolbar" style="margin-top:14px"><button class="btn btn-primary" onclick="finalizeAssessment('${esc(a.id_asesmen)}')">✓ Finalisasi Penilaian</button></div>`:''}
    ${String(a.status_asesmen||'').toUpperCase()==='SELESAI'?`<div class="message ok" style="margin-top:14px">Penilaian sudah difinalisasi. Nilai akhir: <b>${esc(a.nilai_akhir??'-')}</b>.</div>${isSchool()?`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="ajukanKeberatan('${esc(a.id_asesmen)}')">✉ Ajukan Keberatan Penilaian</button></div>`:''}`:''}
  `;
}

window.finalizeAssessment=async function(idAsesmen){
  if(!confirm('Finalisasi penilaian ini? Setelah finalisasi, nilai tidak dapat diedit lagi.'))return;
  try{const r=await api('finalisasiAsesmen',{idAsesmen});toast(`Penilaian selesai. Nilai akhir: ${r.nilai_akhir}`,'ok',4500);await openAssessment();}
  catch(e){toast(errorText(e),'error',4500);}
};

window.editScore=async function(idAsesmen,idIndikator,current,automatic){
  const raw=prompt(`Skor indikator (0–4).\nSkor otomatis: ${automatic}\nKosongkan untuk kembali ke skor otomatis.`,current??automatic);
  if(raw===null)return;
  let score=raw.trim()===''?'':Number(raw);
  if(score!=='' && (!Number.isFinite(score)||score<0||score>4)){toast('Skor harus antara 0 sampai 4.','warning');return;}
  let note='';
  if(score!=='' && Math.abs(Number(score)-Number(automatic))>0.001){
    note=prompt('Jelaskan alasan koreksi manual:','');
    if(note===null||!note.trim()){toast('Koreksi manual wajib memiliki alasan.','warning');return;}
  }
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU'}});
    toast(score===''?'Indikator dikembalikan ke skor otomatis.':'Koreksi indikator tersimpan.','ok');
    await openAssessment();
  }catch(e){toast(errorText(e),'error',4500);}
};

// Helper identitas sekolah yang rapi untuk topbar maupun kartu
function formatSekolahLabel(npsn, namaSekolah = '', kecamatan = '', alamat = ''){
  const cleanNpsn = esc(npsn || state.user?.npsn || '');
  const cleanNama = esc(namaSekolah || state.user?.nama_sekolah || 'Satuan Pendidikan');
  const cleanKec = esc(kecamatan || state.user?.kecamatan || '');
  const cleanAlamat = esc(alamat || state.user?.alamat_lengkap || '');
  
  // Gabungkan wilayah dan alamat secara rapi
  let details = [];
  if(cleanKec) details.push(`Kec. ${cleanKec}`);
  if(cleanAlamat && cleanAlamat !== '-') details.push(cleanAlamat);
  const detailStr = details.length > 0 ? ` — ${details.join(', ')}` : '';

  return `<span style="text-align:right;display:inline-block;line-height:1.3;">
    <b>${cleanNpsn}</b> (${cleanNama})${detailStr ? `<br><small class="muted" style="font-size:0.75rem;">📍 ${detailStr}</small>` : ''}
  </span>`;
}

function formatPengawasLabel(idPengawas, namaPengguna = '') {
  if (!idPengawas) return '-';
  return `<b>${esc(idPengawas)}</b> ${namaPengguna ? `<span style="color:var(--muted);font-size:0.88rem">(${esc(namaPengguna)})</span>` : ''}`;
}

window.autoFillSekolahByNpsn = async function(npsn) {
  if(!npsn || npsn.trim().length < 4) return;
  const cleanNpsn = npsn.trim();
  const namaSekolahInput = $('#regNamaSekolah');
  const usernameInput = $('#regUsername');
  
  if(namaSekolahInput) namaSekolahInput.value = 'Mencari data sekolah...';
  if(usernameInput) usernameInput.value = cleanNpsn;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getSekolah' })
    });
    const res = await response.json();
    const list = Array.isArray(res) ? res : (res.data || res.sekolah || []);
    const found = list.find(s => String(s.npsn || s.NPSN || '').trim() === cleanNpsn);
    if(found) {
      const namaVal = found.nama_sekolah || found.nama_satuan_pendidikan || found.nama || found.sekolah || '';
      if(namaSekolahInput) namaSekolahInput.value = namaVal;
    } else {
      if(namaSekolahInput) namaSekolahInput.value = '';
      alert('NPSN tidak ditemukan di database tabel sekolah. Silakan ketik nama satuan pendidikan secara manual.');
    }
  } catch(e) {
    if(namaSekolahInput) namaSekolahInput.value = '';
    console.warn('Gagal memuat otomatis nama sekolah:', e.message);
  }
};

      window._cachedRekapPaguGlobal = res.data || [];
    }
    
    const list = window._cachedRekapPaguGlobal;
    let totalKeseluruhan = list.reduce((sum, item) => sum + Number(item.total_pagu || 0), 0);

    // OPTIMASI: Rendering baris tabel menggunakan .map().join('') secara bersih di memori

    $('#paguContent').innerHTML = `

        <div class="stat"><small>Jumlah Satuan Pendidikan</small><strong>${fmtNum(list.length)} Sekolah</strong></div>
        <div class="stat"><small>Akumulasi Total Pagu</small><strong style="font-size:1.4rem; color:var(--primary-2);">${fmtRupiah(totalKeseluruhan)}</strong></div>

        <table class="friendly-table">

            <tr>
              <th>NPSN</th>
              <th>Nama Sekolah</th>
              <th>Kecamatan</th>

  } catch(e) {
    const paguContent = $('#paguContent');
    if(paguContent) paguContent.innerHTML = msg(errorText(e));
  }
}

// 2. Reset ke halaman 1 saat filter atau limit diubah
window.resetPageAndFilter = function() {
  window._monState.currentPage = 1;
  applyGlobalMonFilterAndSort();
};

// 3. Logika Gabungan Filter (Pencarian & Kecamatan), Sorting, & Pagination
window.applyGlobalMonFilterAndSort = function() {
  const rawData = window._cachedGlobalMon || [];
  const searchInput = $('#searchGlobalMon');
  const query = searchInput ? searchInput.value.toLowerCase() : '';
  const selectedKec = $('#filterKecamatan') ? $('#filterKecamatan').value : '';
  const sortMode = $('#sortGlobalMon') ? $('#sortGlobalMon').value : 'nama_asc';
  const pageSizeVal = $('#pageSizeGlobalMon') ? $('#pageSizeGlobalMon').value : '25';

  // A. Filter Data
  let result = rawData.filter(x => {
    const matchText = String(x.npsn).toLowerCase().includes(query) || 
                      String(x.nama_sekolah).toLowerCase().includes(query) || 
                      String(x.kecamatan).toLowerCase().includes(query) ||
                      String(x.alamat_lengkap).toLowerCase().includes(query);
    const matchKec = !selectedKec || String(x.kecamatan) === selectedKec;
    return matchText && matchKec;
  });

  // B. Sorting Data
  result.sort((a, b) => {
    if (sortMode === 'nama_asc') {
      return (a.nama_sekolah || '').localeCompare(b.nama_sekolah || '');
    } else if (sortMode === 'pagu_desc') {
      const valA = typeof num === 'function' ? num(a.total_pagu) : (Number(a.total_pagu) || 0);
      const valB = typeof num === 'function' ? num(b.total_pagu) : (Number(b.total_pagu) || 0);
      return valB - valA;
    } else if (sortMode === 'realisasi_desc') {
      const valA = typeof num === 'function' ? num(a.total_realisasi) : (Number(a.total_realisasi) || 0);
      const valB = typeof num === 'function' ? num(b.total_realisasi) : (Number(b.total_realisasi) || 0);
      return valB - valA;
    } else if (sortMode === 'npsn_asc') {
      return String(a.npsn).localeCompare(String(b.npsn));
    }
    return 0;
  });

  // C. Pagination Logic
  const totalData = result.length;
  let paginatedResult = result;
  let totalPages = 1;

  if (pageSizeVal !== 'all') {
    const limit = parseInt(pageSizeVal) || 25;
    totalPages = Math.ceil(totalData / limit) || 1;
    if (window._monState.currentPage > totalPages) window._monState.currentPage = totalPages;
    if (window._monState.currentPage < 1) window._monState.currentPage = 1;

    const startIdx = (window._monState.currentPage - 1) * limit;
    paginatedResult = result.slice(startIdx, startIdx + limit);
  } else {
    window._monState.currentPage = 1;
  }

  // D. Render Baris Tabel
  const body = $('#globalMonBody');
  const countLabel = $('#countGlobalMon');
  const pagInfo = $('#paginationInfo');
  const pagControls = $('#paginationControls');

  if(body) {
    const startIndexOffset = pageSizeVal === 'all' ? 0 : (window._monState.currentPage - 1) * (parseInt(pageSizeVal) || 25);
    body.innerHTML = generateGlobalMonRows(paginatedResult, startIndexOffset);
  }
  if(countLabel) countLabel.innerText = result.length;
  if(pagInfo && pageSizeVal !== 'all') {
    pagInfo.innerText = `Halaman ${window._monState.currentPage} dari ${totalPages}`;
  } else if(pagInfo) {
    pagInfo.innerText = 'Menampilkan seluruh data';
  }

  // E. Render Tombol Navigasi Halaman
  if(pagControls) {
    if(pageSizeVal === 'all' || totalPages <= 1) {
      pagControls.innerHTML = '';
    } else {
      pagControls.innerHTML = `
        <button class="btn btn-light btn-sm" ${window._monState.currentPage === 1 ? 'disabled' : ''} onclick="changeMonPage(-1)">← Sebelumnya</button>
        <span style="font-size:0.9rem; font-weight:600;">Hal ${window._monState.currentPage} / ${totalPages}</span>
        <button class="btn btn-light btn-sm" ${window._monState.currentPage === totalPages ? 'disabled' : ''} onclick="changeMonPage(1)">Selanjutnya →</button>`;
    }
  }
};

// 4. Fungsi Navigasi Halaman
window.changeMonPage = function(direction) {
  window._monState.currentPage += direction;
  applyGlobalMonFilterAndSort();
};

// Generator monitoring global dipertahankan satu definisi saja.
// 5. Generator Baris Tabel dengan Nomor Urut yang Menyesuaikan Halaman
function generateGlobalMonRows(list, offset = 0) {
  if(!list || list.length === 0) return emptyRow(7, 'Tidak ada data yang cocok dengan filter.');
  return list.map((x, idx) => `
    <tr>
      <td style="text-align:center">${offset + idx + 1}</td>
      <td><b>${esc(x.npsn)}</b></td>
      <td>
        <b>${esc(x.nama_sekolah)}</b><br>
        <small class="muted">📍 ${esc(x.alamat_lengkap)} (Kec. ${esc(x.kecamatan)})</small>
      </td>
      <td><b>${fmtRupiah(x.total_pagu)}</b></td>
      <td style="color:var(--success);font-weight:600">${fmtRupiah(x.total_realisasi)}</td>
      <td style="text-align:center">${badge(x.jumlah_dokumen_spj > 0 ? `${x.jumlah_dokumen_spj} File` : 'Belum', x.jumlah_dokumen_spj > 0 ? 'success' : 'warning')}</td>
      <td style="text-align:center">${badge(x.status_penilaian, x.status_penilaian === 'SELESAI_DINILAI' ? 'success' : 'info')}</td>
    </tr>`).join('');
}

// 6. Integrasi Pencarian Teks ke Filter & Sort Gabungan
window.filterGlobalMon = function(keyword) {
  resetPageAndFilter();

// 7. Fungsi ekspor Excel untuk laporan monitoring global
window.exportGlobalMonExcel = async function(){
  try {
    await ensureXlsxLib();
    const tbl = document.getElementById('tableGlobalMon');
    if(!tbl) {
      alert('Tabel data monitoring tidak ditemukan.');

    }
    const wb = XLSX.utils.table_to_book(tbl, {sheet: "Monitoring Global SPJ"});
    XLSX.writeFile(wb, `Laporan_Monitoring_Global_SPJ_${state.user?.role || 'Dinas'}.xlsx`);
  } catch(e) {
    alert('Gagal mengunduh file Excel: ' + e.message);
  }
};

<script>
/* ============================================================================
 * SIMPEL SPJ V5 — TUTORIAL FEED + PAKET ARSIP PENILAIAN
 * Penyempurnaan V4; tidak mengubah tabel/database.
 * ========================================================================== */
function _v5Field(o, keys, fallback=''){
  for(const k of keys){ if(o && o[k] !== undefined && o[k] !== null && String(o[k]).trim()!=='') return o[k]; }
  return fallback;
}
function _v5RowsTable(rows, title, opts={}){
  rows = Array.isArray(rows)?rows:[];
  const hidden = new Set(opts.hidden||[]);
  if(!rows.length) return `<div class="panel"><h3>${esc(title)}</h3><div class="muted">Tidak ada data.</div></div>`;
  const keys = Array.from(new Set(rows.flatMap(r=>Object.keys(r||{})))).filter(k=>!hidden.has(k) && !String(k).startsWith('_'));
  const head = keys.map(k=>`<th>${esc(k.replaceAll('_',' ').toUpperCase())}</th>`).join('');
  const body = rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r?.[k] ?? '')}</td>`).join('')}</tr>`).join('');
  return `<div class="panel v5-print-block"><h3>${esc(title)} <span class="muted">(${rows.length})</span></h3><div class="table-wrap"><table class="friendly-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}
function _v5DocCards(docs){
  docs=(docs||[]).filter(Boolean);
  if(!docs.length) return `<div class="muted">Belum ada dokumen/bukti yang terhubung.</div>`;
  return `<div class="school-index-grid">${docs.map(d=>{
    const url=_v5Field(d,['file_url','url_dokumen','url'],'');
    const name=_v5Field(d,['nama_file','file_name'],'Dokumen SPJ');
    const type=_v5Field(d,['nama_spj','jenis_dokumen','tipe_dokumen'],'Dokumen');
    const tx=_v5Field(d,['id_transaksi','nomor_bukti'],'');
    return `<div class="panel" style="margin:0"><div class="badge badge-info">${esc(type)}</div><h3 style="margin:8px 0">${esc(name)}</h3>${tx?`<div class="muted">Transaksi/Bukti: ${esc(tx)}</div>`:''}${url?`<div class="toolbar" style="margin-top:10px"><a class="btn btn-primary" target="_blank" rel="noopener" href="${esc(url)}">📄 Buka PDF</a><button class="btn btn-light" onclick="window.open('${esc(url)}','_blank')">👁️ Lihat</button></div>`:'<div class="muted">Tautan file belum tersedia.</div>'}</div>`;
  }).join('')}</div>`;
}
async function tutorialV5View(){
  const c=$('#mainContent');
  const rawUrl='https://raw.githubusercontent.com/DikporaRembang/simpelspj/main/tutorial_simpelspj.pdf';

  c.innerHTML=head('Tutorial SIMPEL SPJ','Panduan resmi penggunaan aplikasi SIMPEL SPJ')+
    `<div class="panel" style="border-left:4px solid var(--gold);">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <div><h2 style="margin:0">📖 Tutorial SIMPEL SPJ</h2><div class="muted">Panduan resmi aplikasi — DINAS, PENGAWAS, dan SEKOLAH.</div></div>
      </div>
      <div id="v5TutorialFeed" style="margin-top:14px">${loading('Menyiapkan pembaca tutorial...')}</div>
    </div>`;

  const area=$('#v5TutorialFeed');
  if(!area) return;

  try{
    /*
     * Jangan gunakan iframe/raw PDF di sini. GitHub/Raw dapat mengirim PDF sebagai
     * attachment sehingga browser mengunduhnya. PDF.js membaca byte PDF lalu
     * menggambar halaman ke canvas, sehingga tutorial benar-benar tampil di feed.
     */
    if(!window.pdfjsLib){
      await new Promise((resolve,reject)=>{
        const sc=document.createElement('script');
        sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        sc.onload=resolve; sc.onerror=()=>reject(new Error('Library pembaca PDF gagal dimuat.'));
        document.head.appendChild(sc);
      });
    }
    if(!window.pdfjsLib) throw new Error('PDF.js tidak tersedia.');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    area.innerHTML=`<div id="v5PdfReader" style="background:#eef2f4;border:1px solid var(--border);border-radius:14px;overflow:hidden">
      <div style="position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div>
          <b>📖 Tutorial lengkap</b>
          <div class="muted" id="v5PdfPageInfo">Menyiapkan seluruh halaman...</div>
        </div>
        <div style="display:flex;align-items:center;gap:7px">
          <button class="btn btn-light btn-sm" id="v5PdfZoomOut" title="Perkecil">−</button>
          <span id="v5PdfZoomInfo" class="muted">100%</span>
          <button class="btn btn-light btn-sm" id="v5PdfZoomIn" title="Perbesar">+</button>
        </div>
      </div>
      <div id="v5PdfCanvasWrap" style="padding:18px;min-height:72vh;max-height:78vh;overflow:auto;background:#dfe4e6;scroll-behavior:smooth">
        <div class="loading-container" style="min-height:55vh">${loading('Membaca PDF dari GitHub...')}</div>
      </div>
    </div>
    <div class="muted" style="margin-top:8px">Seluruh halaman ditampilkan vertikal. Halaman berikutnya dimuat otomatis saat Anda menggulir agar aplikasi tetap ringan.</div>`;

    const pdf=await window.pdfjsLib.getDocument({url:rawUrl,withCredentials:false}).promise;
    let zoom=1;
    const wrap=$('#v5PdfCanvasWrap'), info=$('#v5PdfPageInfo'), zoomInfo=$('#v5PdfZoomInfo');
    if(!wrap) return;

    const slots=[];
    wrap.innerHTML='';
    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
      const slot=document.createElement('section');
      slot.className='v5-pdf-page-slot';
      slot.dataset.page=String(pageNo);
      slot.dataset.rendered='0';
      slot.style.cssText='width:100%;max-width:1040px;margin:0 auto 18px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;';
      slot.innerHTML=`<div class="muted" style="width:100%;max-width:980px;text-align:left;font-weight:750">Halaman ${pageNo} / ${pdf.numPages}</div><div class="v5-pdf-placeholder" style="width:100%;min-height:390px;border:1px dashed #bdc8cc;border-radius:10px;background:rgba(255,255,255,.45);display:grid;place-items:center"><span class="muted">Halaman ${pageNo} akan dimuat saat diperlukan…</span></div>`;
      wrap.appendChild(slot);
      slots.push(slot);
    }
    info.textContent=`${pdf.numPages} halaman • gulir untuk membaca`;

    let renderGeneration=0;
    async function renderSlot(slot, force=false){
      if(!slot || (slot.dataset.rendered==='1' && !force)) return;
      if(slot.dataset.rendering==='1') return;
      slot.dataset.rendering='1';
      const generation=renderGeneration;
      const pageNo=Number(slot.dataset.page)||1;
      try{
        const page=await pdf.getPage(pageNo);
        if(generation!==renderGeneration && !force) return;
        const base=page.getViewport({scale:1});
        const available=Math.max(300,Math.min((wrap.clientWidth||1020)-44,980));
        const fitScale=Math.min(available/base.width,1.55);
        const viewport=page.getViewport({scale:fitScale*zoom});
        const canvas=document.createElement('canvas');
        canvas.className='v5-pdf-page-canvas';
        canvas.width=Math.ceil(viewport.width);
        canvas.height=Math.ceil(viewport.height);
        canvas.style.cssText='display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 8px 25px rgba(16,42,67,.12);border:1px solid #d7e0e5;';
        const label=slot.querySelector('.muted');
        slot.innerHTML='';
        if(label) slot.appendChild(label);
        else {
          const lbl=document.createElement('div');
          lbl.className='muted';
          lbl.style.cssText='width:100%;max-width:980px;text-align:left;font-weight:750';
          lbl.textContent=`Halaman ${pageNo} / ${pdf.numPages}`;
          slot.appendChild(lbl);
        }
        slot.appendChild(canvas);
        await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
        slot.dataset.rendered='1';
      }catch(err){
        const holder=slot.querySelector('.v5-pdf-placeholder');
        if(holder) holder.innerHTML=`<span class="muted">Gagal memuat halaman ${pageNo}. Gulir kembali untuk mencoba lagi.</span>`;
      }finally{
        slot.dataset.rendering='0';
      }
    }

    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting) renderSlot(entry.target);
      });
    },{root:wrap,rootMargin:'700px 0px',threshold:0.01});
    slots.forEach(slot=>observer.observe(slot));

    // Pastikan halaman pertama langsung tersedia walau IntersectionObserver belum mengeksekusi callback.
    await renderSlot(slots[0]);
    if(slots[1]) renderSlot(slots[1]);

    async function applyZoom(nextZoom){
      zoom=Math.max(.75,Math.min(1.8,nextZoom));
      zoomInfo.textContent=`${Math.round(zoom*100)}%`;
      renderGeneration++;
      const visibleOrRendered=slots.filter(slot=>slot.dataset.rendered==='1' || Math.abs(slot.getBoundingClientRect().top-wrap.getBoundingClientRect().top)<(wrap.clientHeight+900));
      visibleOrRendered.forEach(slot=>{slot.dataset.rendered='0';slot.dataset.rendering='0';});
      for(const slot of visibleOrRendered) await renderSlot(slot,true);
    }

    $('#v5PdfZoomOut').onclick=()=>applyZoom(zoom-.1);
    $('#v5PdfZoomIn').onclick=()=>applyZoom(zoom+.1);
    zoomInfo.textContent='100%';
  }catch(e){
    area.innerHTML=msg('Tutorial belum dapat ditampilkan. Periksa koneksi lalu buka kembali menu Tutorial. Detail: '+errorText(e),'error');
  }
}

<script>
/* ============================================================================
 * UI PENGESAHAN ELEKTRONIK — V3
 * Menempel pada modul Penilaian yang sudah ada agar alur utama tidak berubah.
 * ========================================================================== */
async function renderPengesahanPanel(idAsesmen){
  const host=document.getElementById('assessmentSigningArea'); if(!host)return;
  host.innerHTML=loading('Memeriksa status pengesahan...');
  try{
    const r=await api('getPengesahanPenilaian',{idAsesmen});
    const d=r.data||{};
    const approval=d.persetujuan_sekolah;
    const signature=d.pengesahan_pengawas;
    const appeal=d.keberatan_terakhir;
    const signed=!!signature;
    const approved=!!approval;
    let action='';
    if(signed){
      const vr=await api('verifikasiPengesahanPenilaian',{idAsesmen});
      action=`<div class="message ${vr.valid?'ok':'error'}" style="margin-top:12px">
        <b>${vr.valid?'🔒 PENILAIAN DISAHKAN':'⚠ PENGESAHAN PERLU DIVERIFIKASI'}</b><br>
        Penandatangan: ${esc(signature.ditandatangani_oleh||'-')}<br>
        Waktu: ${esc(signature.ditandatangani_at||signature.tanggal||'-')}<br>
        Kode pengesahan: <b>${esc(signature.kode_pengesahan||'-')}</b><br>
        Hash integritas: <code style="word-break:break-all">${esc(signature.integrity_hash||'-')}</code>
        ${signature.verification_url?`<div style="display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap"><img alt="QR Verifikasi" src="https://quickchart.io/qr?size=180&text=${encodeURIComponent(signature.verification_url)}" style="width:140px;height:140px;border:1px solid #ddd;padding:4px;background:#fff"><div><b>QR Verifikasi</b><br><a target="_blank" href="${esc(signature.verification_url)}">Buka halaman verifikasi</a></div></div>`:''}
      </div>`;
    }else if(isPengawas() && approved && String(d.status_asesmen).toUpperCase()==='SELESAI'){
      action=`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="tandaTanganiPenilaian('${esc(idAsesmen)}')">🔏 Tanda Tangani & Sah-kan Penilaian</button></div>`;
    }else if(isSchool() && !approved && String(d.status_asesmen).toUpperCase()==='SELESAI'){
      action=`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="setujuiPenilaian('${esc(idAsesmen)}')">✓ Saya Setuju dengan Penilaian</button></div>`;
    }else if(approved && !signed){
      action=`<div class="message info" style="margin-top:12px">Persetujuan sekolah sudah tercatat. Menunggu pengesahan elektronik pengawas.</div>`;
    }
    host.innerHTML=`
      <div class="panel" style="margin-top:14px;border-left:4px solid var(--primary);">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
          <div><h3 style="margin:0">🔐 Pengesahan Penilaian</h3><div class="muted">Tahap terakhir setelah penilaian dan proses keberatan selesai.</div></div>
          <span class="badge badge-${signed?'success':approved?'info':'warning'}">${signed?'DISAHKAN':approved?'MENUNGGU PENGAWAS':'MENUNGGU PERSETUJUAN SEKOLAH'}</span>
        </div>
        ${approved?`<div class="message ok" style="margin-top:12px">✓ Persetujuan sekolah tercatat oleh <b>${esc(approval.disetujui_oleh||'-')}</b> pada ${esc(approval.disetujui_at||approval.tanggal||'-')}.</div>`:''}
        ${appeal && ['DIAJUKAN','DIKAJI_ULANG'].includes(String(appeal.status_keberatan||'').toUpperCase())?`<div class="message warning" style="margin-top:12px">Keberatan masih dalam proses. Pengesahan ditahan sampai kaji ulang selesai.</div>`:''}
        ${signed?`<div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="btn btn-primary" onclick="bukaArsipTersahkan('${esc(idAsesmen)}')">🖨️ Cetak Berkas Penilaian Sah</button></div>`:''}
        ${action}
      </div>`;
  }catch(e){host.innerHTML=msg(errorText(e));}
}

window.bukaArsipTersahkan=async function(idAsesmen){
  try{
    const r=await api('getPengesahanPenilaian',{idAsesmen});
    const d=r.data||{};
    if(!d.persetujuan_sekolah || !d.pengesahan_pengawas) {
      toast('Berkas baru dapat dicetak sebagai berkas sah setelah persetujuan sekolah dan pengesahan pengawas tercatat.','warning',5000);
      return;
    }
    state.selectedNpsn=d.npsn;
    state.selectedPeriode=d.id_periode;
    await loadView('arsipPenilaianV5');
    const n=$('#v5ArchiveNpsn'), p=$('#v5ArchivePeriode');
    if(n) n.value=d.npsn;
    if(p) p.value=d.id_periode;
    await loadV5Archive();
    setTimeout(()=>printV5Archive(),400);
  }catch(e){toast(errorText(e),'error',5000);}
};

window.setujuiPenilaian=async function(idAsesmen){
  if(!confirm('Anda menyetujui hasil penilaian ini. Setelah disetujui, pengawas dapat melakukan pengesahan elektronik. Lanjutkan?'))return;
  try{
    await api('setujuiPenilaianSekolah',{idAsesmen});
    toast('Persetujuan sekolah berhasil dicatat.','ok',4500);
    await openAssessment();
  }catch(e){toast(errorText(e),'error',5000);}
};

window.tandaTanganiPenilaian=async function(idAsesmen){
  if(!confirm('Tanda tangani dan sahkan hasil penilaian ini? Pastikan hasil kaji ulang dan persetujuan sekolah sudah benar.'))return;
  try{
    const r=await api('tandaTanganiPenilaianPengawas',{idAsesmen});
    toast(r.message||'Penilaian berhasil disahkan.','ok',5000);
    await openAssessment();
  }catch(e){toast(errorText(e),'error',5000);}
};

const _renderAssessmentBeforeSigning = renderAssessment;
renderAssessment = function(a, indicators){
  _renderAssessmentBeforeSigning(a, indicators);
  const area=document.getElementById('assessmentArea');
  if(!area)return;
  const old=document.getElementById('assessmentSigningArea');
  if(old)old.remove();
  const host=document.createElement('div'); host.id='assessmentSigningArea'; area.appendChild(host);
  renderPengesahanPanel(a.id_asesmen);
};
</script>

<script>
/* ============================================================================
 * RKAS REPLACE UI — FINAL17
 * Dinas only: Ganti seluruh sekolah / satu sekolah.
 * Parser khusus format DPA/RKA seperti "RKA Unit - Manajemen Aplikasi RKAS".
 * ========================================================================== */

function _rkasReplaceNorm_(v){
  return String(v ?? '').replace(/\u00a0/g,' ').trim();
}
function _rkasReplaceCode_(v){
  const s=_rkasReplaceNorm_(v).replace(/\s+/g,'');
  return /^\d+(?:\.\d+){5}$/.test(s) ? s : '';
}
function _rkasReplaceNpsn_(v){
  const s=_rkasReplaceNorm_(v).replace(/[^\d]/g,'');
  return /^\d{8}$/.test(s)?s:'';
}
function _rkasReplaceNum_(v){
  if(typeof v==='number' && Number.isFinite(v)) return v;
  const s=_rkasReplaceNorm_(v).replace(/[^\d,.-]/g,'');
  if(!s)return 0;
  if(s.includes(',') && s.includes('.')) return Number(s.replace(/\./g,'').replace(',','.'))||0;
  if(s.includes(',')) return Number(s.replace(',','.'))||0;
  return Number(s)||0;
}

/**
 * Parser format DPA:
 * col A = Kode Rekening / NPSN
 * col F = Uraian
 * col U = Volume
 * col X = Satuan
 * col AA = Harga Satuan
 * col AD = Jumlah
 *
 * Parser tidak menganggap baris subtotal sebagai barang.
 * Kode rekening penuh diwariskan ke detail sampai muncul kode rekening baru.
 */
function _rkasParseDpaWorkbookClient(wb){
  const all = [];
  const diagnostics = { sheets: [], mode: 'DPA_HIERARCHICAL', ignoredSubtotal: 0, ignoredHeader: 0 };
  
  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    
    // Default posisi kolom baku
    let codeCol = 0, descCol = 5, volCol = 20, unitCol = 23, priceCol = 26, totalCol = 29;
    let headerRow = -1;

    // Cari baris header yang mengandung "KODE REKENING" dan "URAIAN"
    for(let r = 0; r < Math.min(rows.length, 300); r++){
      const cells = (rows[r] || []).map(x => _rkasReplaceNorm_(x).toUpperCase());
      const hasCode = cells.some(x => x.includes('KODE REKENING') || x.includes('KODE'));
      const hasUraian = cells.some(x => x.includes('URAIAN'));
      if(hasCode && hasUraian){ 
        headerRow = r; 
        break; 
      }
    }

    // Jika header tidak ditemukan secara persis, gunakan baris default baku
    if(headerRow < 0) headerRow = 27;

    // DINAMIS: Deteksi indeks kolom secara otomatis dari baris header yang ditemukan
    if(headerRow >= 0 && rows[headerRow]) {
      const headerCells = rows[headerRow].map(x => _rkasReplaceNorm_(x).toUpperCase());
      const cCode = headerCells.findIndex(x => x.includes('KODE'));
      const cDesc = headerCells.findIndex(x => x.includes('URAIAN'));
      const cVol  = headerCells.findIndex(x => x.includes('VOL') || x.includes('JUMLAH'));
      const cPrice= headerCells.findIndex(x => x.includes('HARGA') || x.includes('TARIF'));
      const cTotal= headerCells.findIndex(x => x.includes('TOTAL') || x.includes('PAGU') || x.includes('JUMLAH HARGA'));

      if(cCode >= 0) codeCol = cCode;
      if(cDesc >= 0) descCol = cDesc;
      if(cVol >= 0)  volCol = cVol;
      if(cPrice >= 0)priceCol = cPrice;
      if(cTotal >= 0)totalCol = cTotal;
    }

    let currentKode = '';
    let currentNpsn = '';
    let currentKegiatan = '';
    let currentKodeKegiatan = '';

    for(let r = headerRow + 1; r < rows.length; r++){
      const row = rows[r] || [];
      const a = _rkasReplaceNorm_(row[codeCol]);
      const uraian = _rkasReplaceNorm_(row[descCol]);
      const fullCode = _rkasReplaceCode_(a);
      const npsn = _rkasReplaceNpsn_(a);

      // Lewati baris header berulang atau nomor urut kolom
      if(/^KODE\s*$/i.test(a) || /^URAIAN$/i.test(uraian) || a === '1' || a === '2'){
        diagnostics.ignoredHeader++;
        continue;
      }

      // NPSN menandai awal blok sekolah
      if(npsn){
        currentNpsn = npsn;
        continue;
      }

      // Kode rekening penuh menandai parent objek belanja
      if(fullCode){
        currentKode = fullCode;
        currentNpsn = currentNpsn || '';
        continue;
      }

      // Baris subtotal hierarki (misal: 5., 5.1, 5.1.02) diabaikan dari detail item
      if(/^\d+(?:\.\d+){0,4}\.?$/.test(a) && a){
        diagnostics.ignoredSubtotal++;
        continue;
      }

      if(!currentKode || !currentNpsn || !uraian) continue;

      const volume = _rkasReplaceNum_(row[volCol]);
      const harga = _rkasReplaceNum_(row[priceCol]);
      const pagu = _rkasReplaceNum_(row[totalCol]);

      // Detail item valid minimal harus memiliki pagu > 0
      if(!(pagu > 0)) {
        diagnostics.ignoredSubtotal++;
        continue;
      }

      all.push({
        npsn: currentNpsn,
        kode_rekening: currentKode,
        kode_kegiatan: currentKodeKegiatan,
        kegiatan: currentKegiatan,
        nama_belanja_asli: uraian,
        uraian: uraian,
        volume: volume || 1,
        satuan: _rkasReplaceNorm_(row[unitCol]) || 'paket',
        harga_satuan: harga || pagu,
        pagu: pagu,
        nomor_baris_sumber: r + 1,
        sheet_name: sheetName
      });
    }

    diagnostics.sheets.push({ sheet: sheetName, rows: rows.length });
  }

  return { rows: all, diagnostics };
}

function _rkasReplaceSchoolSet_(rows){
  return [...new Set((rows||[]).map(x=>_rkasReplaceNpsn_(x.npsn)).filter(Boolean))];
}

function _rkasReplaceTotal_(rows){
  return (rows||[]).reduce((a,x)=>a+Number(x.pagu||0),0);
}
