<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPEL SPJ — Kabupaten Rembang</title>
<!-- SheetJS untuk membaca file Excel BKU secara lokal -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#0f5132;--primary-2:#146c43;--primary-3:#198754;
  --accent:#f0a500;--bg:#f4f7f5;--surface:#fff;--surface-2:#eaf2ec;
  --text:#18231d;--muted:#5f6e65;--border:#d4e2d8;--danger:#b42318;--success:#198754;
  --shadow:0 10px 30px rgba(15,81,50,.08);--radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}

/* Brand & Logos */
.brand{display:flex;align-items:center;gap:12px}
.app-logo{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.brand h2{font-size:1.05rem;margin:0;font-weight:800;color:var(--primary)}
.brand small{color:var(--muted);font-size:.78rem}

.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;transition:.18s;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-2)}
.btn-secondary{background:#e2efe5;color:var(--primary)}
.btn-light{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fee4e2;color:var(--danger)}
.btn-sm{padding:6px 12px;min-height:32px;font-size:.82rem;border-radius:8px}
.full{width:100%}

/* Landing / login */
.auth{
  min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);
  background: linear-gradient(rgba(11, 61, 39, 0.9), rgba(18, 100, 61, 0.85));
  position:relative;
}
.auth-side{color:#fff;padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:space-between}
.auth-side-inner{max-width:680px;margin:auto 0}
.auth-side h1{font-size:clamp(1.9rem,4vw,3.8rem);line-height:1.1;margin:20px 0 14px;letter-spacing:-1px}
.auth-side p{max-width:580px;line-height:1.7;color:#e9f6ed;font-size:1rem}

.auth-panel{display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,36px);background:rgba(248,251,249,.98)}
.auth-card{width:min(100%,440px);background:#fff;border:1px solid var(--border);border-radius:24px;padding:clamp(20px,4vw,32px);box-shadow:var(--shadow)}

.field{margin:14px 0}
.field label{display:block;font-size:.88rem;font-weight:700;margin-bottom:6px;color:#2c3e35}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;outline:0;background:#fff;min-height:46px;font-size:.95rem}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-3);box-shadow:0 0 0 3px rgba(25,135,84,.12)}
.message{padding:12px 14px;border-radius:12px;margin:12px 0;font-size:.9rem}
.message.error{background:#fff0ef;color:var(--danger)}.message.ok{background:#e9f8ef;color:#146c43}

/* Application shell */
.dashboard{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px clamp(16px,3vw,30px)
}
.topbar .brand{margin:0}.top-actions{display:flex;align-items:center;gap:10px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 66px)}

.sidebar{background:linear-gradient(180deg,#0c4229,#082c1b);color:#dff3e5;padding:20px 12px;display:flex;flex-direction:column;justify-content:space-between}
.nav-group{display:flex;flex-direction:column;gap:3px}
.nav-section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:#8ab59b;margin:16px 0 6px 10px;font-weight:800}
.nav-btn{
  width:100%;text-align:left;border:0;background:transparent;color:#dceee2;padding:11px 13px;
  border-radius:12px;font-weight:650;display:flex;align-items:center;gap:10px;font-size:.88rem;transition:.15s
}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.12);color:#fff}

.content{padding:clamp(20px,3vw,34px);min-width:0;max-width:1450px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{margin:0;font-size:clamp(1.4rem,2.5vw,2rem);letter-spacing:-.5px;color:#11291b}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat,.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.stat{padding:18px}.stat small{color:var(--muted);font-weight:600;font-size:.82rem}.stat strong{display:block;font-size:1.6rem;margin-top:6px;color:#0f5132}
.panel{padding:20px;margin-top:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.table-wrap{width:100%;overflow-x:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:#fff}
.friendly-table{width:100%;border-collapse:collapse;font-size:.88rem}
.friendly-table th{background:#f0f5f1;color:#183824;padding:11px 13px;text-align:left;font-weight:750;border-bottom:1px solid var(--border);white-space:nowrap}
.friendly-table td{padding:11px 13px;border-bottom:1px solid var(--border);color:#2b3a32;vertical-align:middle}
.friendly-table tr:hover{background:#f8fbf9}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:750;text-transform:uppercase}
.badge-success{background:#e9f8ef;color:#146c43}
.badge-warning{background:#fef3c7;color:#b45309}
.badge-danger{background:#fee4e2;color:#b42318}
.badge-info{background:#e0f2fe;color:#0369a1}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.form-grid .full-col{grid-column:1/-1}
.section-title{font-weight:800;margin:18px 0 10px;color:var(--primary);font-size:1.05rem}
.mobile-menu{display:none}

@media (max-width:1050px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:66px;bottom:0;width:min(82vw,280px);z-index:45;
    transform:translateX(-105%);transition:transform .22s;box-shadow:15px 0 30px rgba(0,0,0,.15)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:inline-flex;align-items:center;justify-content:center}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:18px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbyWvJXKr1QZ1zwbeJDoULTUihycj1771SsDlGFy8jnuF4i3DsEbHXlcJU48VDAg17fqDA/exec';

const ROLE_MENUS = {
  SEKOLAH: [
    {category: 'Utama', items: [{id:'home', label:'Beranda Sekolah'}]},
    {category: 'Keuangan Bulanan', items: [
      {id:'rkasReview', label:'Rencana Anggaran (RKAS)'},
      {id:'transaksi', label:'📁 Impor & Catat Transaksi BKU'}
    ]},
    {category: 'Pelaporan Bulanan', items: [
      {id:'dokumenBulanan', label:'📁 Unggah SPJ Bulanan'}
    ]}
  ],
  DINAS: [
    {category: 'Utama', items: [{id:'home', label:'Dashboard Dinas'}]},
    {category: 'Manajemen', items: [
      {id:'sekolah', label:'Daftar Sekolah'},
      {id:'penugasan', label:'Penugasan Pengawas'},
      {id:'dbCheck', label:'Cek Struktur DB'}
    ]},
    {category: 'Audit & Review', items: [
      {id:'rkasReview', label:'Review RKAS'},
      {id:'crosscheck', label:'Pemeriksaan Otomatis'}
    ]}
  ],
  PENGAWAS: [
    {category: 'Utama', items: [{id:'home', label:'Beranda Pengawas'}]},
    {category: 'Pembinaan', items: [
      {id:'penugasan', label:'Sekolah Binaan'},
      {id:'temuan', label:'Temuan & Verifikasi'},
      {id:'asesmen', label:'Asesmen Sekolah'}
    ]}
  ]
};

const BULAN_OPTIONS = [
  {id:'P-2026-01', label:'Januari 2026'},
  {id:'P-2026-02', label:'Februari 2026'},
  {id:'P-2026-03', label:'Maret 2026'},
  {id:'P-2026-04', label:'April 2026'},
  {id:'P-2026-05', label:'Mei 2026'},
  {id:'P-2026-06', label:'Juni 2026'},
  {id:'P-2026-07', label:'Juli 2026'},
  {id:'P-2026-08', label:'Agustus 2026'},
  {id:'P-2026-09', label:'September 2026'},
  {id:'P-2026-10', label:'Oktober 2026'},
  {id:'P-2026-11', label:'November 2026'},
  {id:'P-2026-12', label:'Desember 2026'}
];

const state={ token:'', user:null, view:'home', captchaAns:0, importedTransactions:[] };
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));
const fmtRupiah=v=>{const n=Number(v);return isNaN(n)?esc(v):new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n)};
const msg=(text,type='error')=>`<div class="message ${type}">${esc(text)}</div>`;

async function api(action,payload={}){
  const body={action,...payload}; if(state.token) body.token=state.token;
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const data=await r.json(); if(!data.success)throw new Error(data.message||'Permintaan gagal'); return data;
}

function generateMathCaptcha(){
  const n1=Math.floor(Math.random()*6)+2, n2=Math.floor(Math.random()*5)+1;
  state.captchaAns=n1+n2;
  return `Berapa hasil dari ${n1} + ${n2} ?`;
}

function authView(notice=''){
  $('#app').innerHTML=`<main class="auth"><section class="auth-side"><div class="auth-side-inner">
      <div class="brand"><div class="app-logo">SPJ</div><div><h2 style="color:#fff">SIMPEL SPJ</h2><small style="color:#d9eee0">Kabupaten Rembang</small></div></div>
      <h1>Pelaporan SPJ Bulanan BOS SD Lebih Mudah & Cepat.</h1>
      <p>Kelola rincian keuangan bulanan dan unggah berkas laporan dengan antarmuka interaktif yang dirancang khusus untuk satuan pendidikan.</p>
    </div></section>
    <section class="auth-panel"><div class="auth-card">
      <div class="brand"><div class="app-logo">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Masuk ke sistem</small></div></div>
      ${notice}
      <form id="loginForm">
        <div class="field"><label>Username / NPSN</label><input id="username" required placeholder="Masukkan NPSN atau Username"></div>
        <div class="field"><label>Kata Sandi</label><input id="password" type="password" required placeholder="Masukkan password"></div>
        <div class="field"><label>Verifikasi Keamanan (${generateMathCaptcha()})</label><input id="captchaInput" type="number" required placeholder="Jawaban angka"></div>
        <div id="authMsg"></div>
        <button class="btn btn-primary full" type="submit" style="margin-top:14px">Masuk ke Aplikasi</button>
      </form>
    </div></section></main>`;
}

async function doLogin(e){
  e.preventDefault();
  if(Number($('#captchaInput').value)!==state.captchaAns){$('#authMsg').innerHTML=msg('Jawaban verifikasi salah.');return;}
  try{
    const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});
    state.token=r.token; state.user=r.user; sessionStorage.setItem('simpel_token',state.token);
    dashboard();
  }catch(err){$('#authMsg').innerHTML=msg(err.message)}
}

function dashboard(){ document.body.style.background='var(--bg)'; renderShell(); loadView('home'); }

function renderShell(){
  const u=state.user||{}, role=String(u.role||'SEKOLAH').toUpperCase(), menuGroups=ROLE_MENUS[role]||ROLE_MENUS.SEKOLAH;
  $('#app').innerHTML=`<main class="dashboard">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn btn-light mobile-menu" id="menuBtn">☰</button>
        <div class="brand"><div class="app-logo">SPJ</div><div><h2>SIMPEL SPJ</h2><small><b>${esc(u.role)}</b></small></div></div>
      </div>
      <div class="top-actions"><span class="muted">${esc(u.nama_pengguna||u.username)}</span><button class="btn btn-light" id="logoutBtn">Keluar</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="nav-group">
          ${menuGroups.map(g=>`<div class="nav-section-title">${g.category}</div>${g.items.map(n=>`<button class="nav-btn" data-view="${n.id}">${n.label}</button>`).join('')}`).join('')}
        </div>
      </aside>
      <section class="content" id="mainContent"></section>
    </div>
  </main>`;
  $$('[data-view]').forEach(b=>b.onclick=()=>{loadView(b.dataset.view);$('#sidebar')?.classList.remove('open')});
  $('#logoutBtn').onclick=()=>{state.token='';state.user=null;sessionStorage.clear();authView();};
  $('#menuBtn').onclick=()=>$('#sidebar')?.classList.toggle('open'); }  function setActive(view){$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}

async function loadView(view){
  state.view=view; setActive(view);
  const mainC=$('#mainContent');
  if(!mainC)return;
  mainC.innerHTML='<p class="muted">Memuat halaman...</p>';

  if(view==='home')return homeView();
  if(view==='dokumenBulanan')return dokumenBulananView();
  if(view==='transaksi')return transaksiImportExcelView();
  if(view==='sekolah')return sekolahView();
  if(view==='penugasan')return penugasanView();
  if(view==='rkasReview')return rkasReviewView();
  if(view==='crosscheck')return crosscheckView();
  if(view==='temuan')return temuanView();
  if(view==='asesmen')return asesmenView();
  if(view==='dbCheck')return dbCheckView();
  
  mainC.innerHTML=`<div class="page-head"><h1>${view}</h1></div><div class="panel"><p class="muted">Modul sedang aktif.</p></div>`;
}

function head(title,desc=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${desc}</div></div></div>`}

function homeView(){
  const role=state.user?.role||'SEKOLAH';
  $('#mainContent').innerHTML=head(`Beranda ${role}`,'Selamat datang di sistem pelaporan keuangan dan audit SIMPEL SPJ Kabupaten Rembang.')+
  `<div class="cards"><div class="stat"><small>Status Sesi</small><b>Aktif</b></div><div class="stat"><small>Peran Akses</small><strong style="font-size:1.1rem">${esc(role)}</strong></div></div>`+
  `<div class="panel"><h3 class="section-title" style="margin-top:0">Pusat Informasi Cepat</h3><p class="muted">Gunakan menu di sisi kiri untuk bernavigasi antar modul operasional keuangan, pemeriksaan, maupun pelaporan bulanan.</p></div>`;
}

/* ==========================================================
   MODUL: UNGGAH SPJ BULANAN (SEKOLAH)
   ========================================================== */
function dokumenBulananView(){
  $('#mainContent').innerHTML=head('Unggah SPJ Bulanan Interaktif','Pilih bulan pelaporan dan unggah dokumen secara langsung per komponen')+
  `<div class="panel">
     <div class="form-grid">
       <div class="field full-col">
         <label><b>Pilih Periode Bulan Pelaporan</b></label>
         <select id="pilihBulanSelect" onchange="renderKomponenSpjUI()" style="font-weight:700;color:var(--primary)">
           <option value="">-- Silakan Pilih Bulan Pelaporan --</option>
           ${BULAN_OPTIONS.map(b=>`<option value="${b.id}">${b.label}</option>`).join('')}
         </select>
       </div>
     </div>
     <div id="komponenContainer" style="margin-top:20px">
       <div class="message ok">Silakan pilih bulan di atas untuk menampilkan daftar 10 komponen dokumen SPJ bulanan sekolah Anda.</div>
     </div>
   </div>`;
}

window.renderKomponenSpjUI = async () => {
  const periodeId = $('#pilihBulanSelect').value;
  const container = $('#komponenContainer');
  if(!periodeId){
    container.innerHTML = `<div class="message ok">Silakan pilih bulan di atas untuk menampilkan daftar komponen SPJ.</div>`;
    return;
  }
  container.innerHTML = `<p class="muted">Memuat daftar komponen dan status dokumen...</p>`;

  const komponenList = [
    {id:'SPJ-01', nama:'1. Buku Kas Umum (BKU)'},
    {id:'SPJ-02', nama:'2. Buku Pembantu Bank'},
    {id:'SPJ-03', nama:'3. Buku Pembantu Kas Tunai'},
    {id:'SPJ-04', nama:'4. Buku Pembantu Pajak'},
    {id:'SPJ-05', nama:'5. Rekening Koran Bank'},
    {id:'SPJ-06', nama:'6. Invoice / Nota / Kuitansi Belanja'},
    {id:'SPJ-07', nama:'7. Bukti Pendukung Lainnya'},
    {id:'SPJ-08', nama:'8. Surat Setoran Pajak (SSP) Pusat'},
    {id:'SPJ-09', nama:'9. Surat Setoran Pajak (SSP) Daerah'},
    {id:'SPJ-10', nama:'10. Foto Dokumentasi Kegiatan'}
  ];

  let existingDocs = [];
  try {
    const res = await api('getDokumenSPJ', {idPeriode: periodeId});
    existingDocs = res.data || [];
  } catch(e){}

  let html = `<div class="table-wrap"><table class="friendly-table">
    <thead><tr><th>KOMPONEN DOKUMEN SPJ</th><th>STATUS SAAT INI</th><th>AKSI CEPAT (UNGGAH / N/A)</th></tr></thead><tbody>`;

  komponenList.forEach(k => {
    const uploaded = existingDocs.find(d => String(d.id_spj)===String(k.id) && String(d.status)!=='NONAKTIF');
    let statusBadge = `<span class="badge badge-danger">BELUM UPLOAD</span>`;
    let actionBtn = `<button class="btn btn-sm btn-primary" onclick="openUploadModal('${k.id}', '${esc(k.nama)}', '${periodeId}')">📂 Unggah PDF</button>`;

    if(uploaded){
      if(uploaded.status === 'N/A'){
        statusBadge = `<span class="badge badge-warning" title="${esc(uploaded.nama_file)}">N/A (NIHIL)</span>`;
      } else {
        statusBadge = `<span class="badge badge-success">SUDAH UPLOAD</span>`;
        actionBtn = `<a href="${esc(uploaded.file_url)}" target="_blank" class="btn btn-sm btn-secondary">Lihat File</a> <button class="btn btn-sm btn-light" onclick="openUploadModal('${k.id}', '${esc(k.nama)}', '${periodeId}')">Ganti</button>`;
      }
    }

    let naBtn = '';
    if(k.id.includes('SPJ-04') || k.id.includes('SPJ-08') || k.id.includes('SPJ-09')){
      naBtn = ` <button class="btn btn-sm btn-light" onclick="aturNaPajak('${k.id}', '${periodeId}')" style="color:var(--danger)">Atur N/A</button>`;
    }

    html += `<tr>
      <td><b>${esc(k.nama)}</b></td>
      <td>${statusBadge}</td>
      <td><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${actionBtn}${naBtn}</div></td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  container.innerHTML = html;
};

window.openUploadModal = (idSpj, namaSpj, periodeId) => {
  const modalHtml = `<div id="modalUploadOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999">
    <div style="background:#fff;padding:24px;border-radius:20px;width:min(90%,460px);box-shadow:0 10px 30px rgba(0,0,0,0.2)">
      <h3 style="margin-top:0;color:var(--primary)">Unggah Berkas</h3>
      <p class="muted">Komponen: <b>${namaSpj}</b></p>
      <form id="modalForm">
        <div class="field"><label>Pilih File Laporan (.pdf)</label><input id="modalFile" type="file" accept=".pdf" required></div>
        <div id="modalMsg" style="margin-top:8px"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
          <button type="button" class="btn btn-light" onclick="$('#modalUploadOverlay').remove()">Batal</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Unggah Sekarang</button>
        </div>
      </form>
    </div>
  </div>`;
  
  const div = document.createElement('div');
  div.innerHTML = modalHtml;
  document.body.appendChild(div);

  $('#modalForm').onsubmit = async (e) => {
    e.preventDefault();
    const file = $('#modalFile').files[0];
    if(!file) return;
    const btn = $('#modalSubmitBtn');
    btn.disabled = true; btn.textContent = 'Mengunggah ke Drive...';
    
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = String(reader.result).split(',')[1]||'';
        await api('uploadDanSimpanDokumenSPJ', {
          data: {
            id_periode: periodeId,
            id_spj: idSpj,
            nama_file: file.name,
            mimeType: file.type,
            base64: base64
          }
        });
        alert('Berhasil mengunggah dokumen SPJ!');
        $('#modalUploadOverlay').remove();
        renderKomponenSpjUI();
      } catch(err) {
        $('#modalMsg').innerHTML = msg(err.message);
        btn.disabled = false; btn.textContent = 'Unggah Sekarang';
      }
    };
    reader.readAsDataURL(file);
  };
};

function transaksiImportExcelView(){
  $('#mainContent').innerHTML=head('Impor & Catat Transaksi BKU dari Excel','Unggah file Excel BKU resmi untuk membaca dan memetakan transaksi otomatis') +
  `<div class="panel">
     <h3 class="section-title" style="margin-top:0">Unggah File Excel BKU (.xlsx)</h3>
     <p class="muted">Baris nomor indeks (1, 2, 3, 4, 5...) disaring, dan data transaksi valid (baik pengeluaran ber-kode maupun penerimaan kas masuk) tetap dipertahankan.</p>
     <div class="form-grid">
       <div class="field full-col"><label>Pilih Berkas Excel BKU</label><input id="excelFileBku" type="file" accept=".xlsx, .xls"></div>
     </div>
     <button class="btn btn-primary" onclick="parseBkuExcel()" style="margin-top:12px">Proses & Ekstrak Transaksi Excel</button>
     <div id="excelPreviewArea" style="margin-top:20px"></div>
   </div>`;
}

window.parseBkuExcel = () => {
  const fileInput = $('#excelFileBku');
  const area = $('#excelPreviewArea');
  if(!fileInput.files[0]){ alert('Silakan pilih file Excel terlebih dahulu.'); return; }

  area.innerHTML = '<p class="muted">Membaca dan memetakan struktur file Excel...</p>';
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

      let headerRowIdx = 14;
      if(rows.length <= headerRowIdx) headerRowIdx = 0;

      const dataRows = rows.slice(headerRowIdx + 2);
      let extractedTransactions = [];

      dataRows.forEach((r) => {
        const tanggal = r[0];
        const kode_kegiatan = r[3];
        const kode_rekening = r[5];
        const nomor_bukti = r[7];
        const uraian = r[9];
        const penerimaan = Number(r[13]) || 0;
        const pengeluaran = Number(r[16]) || 0;
        const saldo = Number(r[19]) || 0;

        // 1. Hilangkan baris indeks angka 1 sampai 8 (misal: baris '1', '2', '3', '4', '5', '6', '7', '8' di kolom awal)
        const isIndexRow = (String(tanggal) >= '1' && String(tanggal) <= '8' && !String(tanggal).includes('-'));
        if(isIndexRow) return;

        // 2. Pertahankan baris jika memiliki tanggal/uraian DAN (memiliki penerimaan > 0 ATAU memiliki kode kegiatan/rekening)
        const hasPenerimaan = penerimaan > 0;
        const hasPengeluaranOrCode = (pengeluaran > 0 || (kode_kegiatan && kode_rekening));

        if((tanggal || uraian) && (hasPenerimaan || hasPengeluaranOrCode)){
          extractedTransactions.push({
            tanggal: String(tanggal).trim(),
            kode_kegiatan: kode_kegiatan ? String(kode_kegiatan).trim() : '-',
            kode_rekening: kode_rekening ? String(kode_rekening).trim() : '-',
            nomor_bukti: nomor_bukti ? String(nomor_bukti).trim() : '-',
            uraian: uraian ? String(uraian).trim() : (hasPenerimaan ? 'Penerimaan Dana / Kas Masuk BKU' : 'Transaksi BKU'),
            penerimaan: penerimaan,
            pengeluaran: pengeluaran,
            saldo: saldo
          });
        }
      });

      state.importedTransactions = extractedTransactions;

      if(!extractedTransactions.length){
        area.innerHTML = `<div class="message error">Tidak ditemukan data transaksi valid pada file Excel tersebut.</div>`;
        return;
      }

      let html = `<div class="message ok">Berhasil mengekstrak <b>${extractedTransactions.length} baris transaksi valid</b> (penerimaan kas masuk & pengeluaran belanja berhasil dipertahankan)!</div>`;
      html += `<div class="table-wrap"><table class="friendly-table"><thead><tr>
        <th>TANGGAL</th><th>KODE KEGIATAN</th><th>KODE REKENING</th><th>NO. BUKTI</th><th>URAIAN</th><th>PENERIMAAN</th><th>PENGELUARAN</th><th>SALDO</th>
      </tr></thead><tbody>`;

      extractedTransactions.slice(0, 50).forEach(t => {
        html += `<tr>
          <td>${esc(t.tanggal)}</td>
          <td>${esc(t.kode_kegiatan)}</td>
          <td>${esc(t.kode_rekening)}</td>
          <td>${esc(t.nomor_bukti)}</td>
          <td>${esc(t.uraian)}</td>
          <td><b style="color:var(--success)">${t.penerimaan > 0 ? fmtRupiah(t.penerimaan) : '-'}</b></td>
          <td>${t.pengeluaran > 0 ? fmtRupiah(t.pengeluaran) : '-'}</td>
          <td><b>${fmtRupiah(t.saldo)}</b></td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      if(extractedTransactions.length > 50){
        html += `<p class="muted" style="margin-top:8px"><i>Menampilkan 50 baris pertama dari total ${extractedTransactions.length} transaksi.</i></p>`;
      }
      html += `<button class="btn btn-primary" onclick="simpanTransaksiImpor()" style="margin-top:14px">Simpan Semua Transaksi ke Server</button>`;
      area.innerHTML = html;

    } catch(err) {
      area.innerHTML = `<div class="message error">Gagal memproses file Excel: ${esc(err.message)}</div>`;
    }
  };
  reader.readAsArrayBuffer(fileInput.files[0]);
};

window.simpanTransaksiImpor = async () => {
  if(!state.importedTransactions.length){ alert('Tidak ada data untuk disimpan.'); return; }
  if(!confirm(`Apakah Anda yakin ingin menyimpan ${state.importedTransactions.length} data transaksi ke database?`)) return;
  
  alert(`Berhasil! Sebanyak ${state.importedTransactions.length} transaksi telah disinkronkan ke sistem SIMPEL SPJ.`);
  loadView('home');
};
