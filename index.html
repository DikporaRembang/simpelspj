<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPEL SPJ — Kabupaten Rembang</title>
<!-- SheetJS untuk membaca file Excel BKU secara lokal -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#102A43;
  --navy-2:#173F5F;
  --emerald:#087F5B;
  --emerald-2:#0B6B53;
  --emerald-soft:#E9F7F1;
  --gold:#C8A24A;
  --gold-soft:#F7EFD7;
  --ivory:#F7F8F5;
  --surface:#FFFFFF;
  --surface-soft:#F5F8F7;
  --text:#17212B;
  --muted:#667788;
  --border:#DDE7E3;
  --danger:#B42318;
  --success:#15803D;
  --warning:#A16207;
  --info:#1769AA;
  --shadow:0 10px 30px rgba(16,42,67,.07);
  --shadow-lg:0 20px 55px rgba(16,42,67,.12);
  --radius:18px;
  --radius-sm:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 0 0,rgba(8,127,91,.045),transparent 30%),
    radial-gradient(circle at 100% 0,rgba(200,162,74,.055),transparent 25%),
    var(--ivory);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ================= BRAND ================= */
.brand{display:flex;align-items:center;gap:12px}
.app-logo{
  width:48px;height:48px;object-fit:contain;border-radius:14px;background:#fff;
  padding:5px;box-shadow:0 5px 16px rgba(0,0,0,.09);border:1px solid rgba(255,255,255,.7)
}
.brand h2{font-size:1.08rem;margin:0;font-weight:850;color:var(--navy);letter-spacing:-.35px}
.brand small{color:var(--muted);font-size:.78rem;font-weight:600}

/* ================= LOADING / WELCOME ================= */
@keyframes logoBounce{
  0%,100%{transform:translateY(0);animation-timing-function:cubic-bezier(.8,0,1,1)}
  50%{transform:translateY(-10px);animation-timing-function:cubic-bezier(0,0,.2,1)}
}
.loading-container{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 20px;gap:16px
}
.loading-logo{
  width:58px;height:58px;object-fit:contain;background:#fff;border-radius:16px;padding:7px;
  box-shadow:0 8px 24px rgba(8,127,91,.16);animation:logoBounce .9s infinite
}
.loading-text{font-size:.9rem;font-weight:650;color:var(--muted);letter-spacing:.25px}

@keyframes smoothWelcome{
  0%{opacity:0;transform:scale(.94) translateY(10px);backdrop-filter:blur(0)}
  25%,75%{opacity:1;transform:scale(1) translateY(0);backdrop-filter:blur(10px)}
  100%{opacity:0;transform:scale(1.025) translateY(-8px);backdrop-filter:blur(0);visibility:hidden}
}
.welcome-overlay{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  flex-direction:column;padding:24px;text-align:center;
  background:
    linear-gradient(135deg,rgba(16,42,67,.97),rgba(8,127,91,.95)),
    url('kantordindikpora.jpeg') center/cover;
  animation:smoothWelcome 3.2s cubic-bezier(.16,1,.3,1) forwards
}
.welcome-logo-lg{
  width:90px;height:90px;object-fit:contain;background:#fff;border-radius:24px;padding:10px;
  box-shadow:0 16px 40px rgba(0,0,0,.32);margin-bottom:22px;animation:logoBounce 1.2s infinite
}
.welcome-title-anim{
  font-size:clamp(1.8rem,4.5vw,3.25rem);font-weight:900;text-transform:uppercase;
  background:linear-gradient(90deg,#FFF8D6,#C8A24A,#FFF8D6,#B38728);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1.8px;margin:0;text-shadow:0 10px 30px rgba(0,0,0,.3)
}
.welcome-subtitle-anim{color:#e2e8f0;font-size:1.02rem;margin-top:12px;font-weight:550;letter-spacing:.5px}

/* ================= BUTTONS ================= */
.btn{
  border:0;border-radius:12px;padding:12px 20px;font-weight:750;transition:.2s;
  min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:.92rem;letter-spacing:.05px
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{
  background:linear-gradient(135deg,var(--emerald-2),var(--emerald));color:#fff;
  box-shadow:0 5px 15px rgba(8,127,91,.2)
}
.btn-primary:hover{filter:brightness(1.04)}
.btn-secondary{background:var(--emerald-soft);color:var(--emerald-2)}
.btn-light{background:#fff;border:1px solid var(--border);color:var(--navy)}
.btn-light:hover{background:var(--surface-soft);border-color:#c9d8d2}
.btn-danger{background:#FDECEA;color:var(--danger);border:1px solid #F5C6C2}
.btn-sm{padding:8px 13px;min-height:38px;font-size:.82rem;border-radius:10px}
.full{width:100%}

/* ================= LOGIN ================= */
.auth{
  min-height:100vh;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(410px,.82fr);
  background:var(--ivory);position:relative;overflow:hidden
}
.auth-side{
  color:#fff;padding:clamp(32px,6vw,82px);display:flex;flex-direction:column;
  justify-content:space-between;position:relative;
  background:
    linear-gradient(135deg,rgba(16,42,67,.90),rgba(8,127,91,.76)),
    url('kantordindikpora.jpeg') center/cover no-repeat
}
.auth-side:after{
  content:"";position:absolute;inset:auto 0 0;height:34%;
  background:linear-gradient(transparent,rgba(5,25,36,.32));pointer-events:none
}
.auth-side-inner{max-width:680px;margin:auto 0;position:relative;z-index:2}
.auth-side h1{
  font-size:clamp(2rem,4vw,3.55rem);line-height:1.1;margin:22px 0 16px;
  letter-spacing:-1.4px;font-weight:850
}
.auth-side p{max-width:570px;line-height:1.75;color:#d9e3e9;font-size:1rem}
.footer-logos{
  display:flex;align-items:center;gap:22px;margin-top:34px;padding-top:20px;
  border-top:1px solid rgba(255,255,255,.16);flex-wrap:wrap;position:relative;z-index:2
}
.footer-logo-item{display:flex;align-items:center;gap:11px}
.footer-logo-item img{
  width:40px;height:40px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;
  box-shadow:0 4px 12px rgba(0,0,0,.15)
}
.footer-logo-item div span{display:block;font-size:.76rem;font-weight:800;color:#fff;line-height:1.2;letter-spacing:.25px}
.footer-logo-item div small{font-size:.66rem;color:#d9e3e9}

.auth-panel{
  display:flex;align-items:center;justify-content:center;padding:clamp(18px,4vw,46px);
  background:rgba(255,255,255,.97)
}
.auth-card{
  width:min(100%,465px);background:#fff;border:1px solid var(--border);border-radius:26px;
  padding:clamp(24px,4vw,38px);box-shadow:var(--shadow-lg);position:relative;overflow:hidden
}
.auth-card:before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--emerald),var(--gold),var(--emerald))
}
.auth-card .brand{padding-top:4px}

/* ================= FORMS ================= */
.field{margin:16px 0}
.field label{display:block;font-size:.84rem;font-weight:750;margin-bottom:7px;color:var(--navy)}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--border);border-radius:12px;padding:13px 15px;outline:0;
  background:#fff;min-height:49px;font-size:.95rem;transition:.2s;color:var(--text)
}
.field textarea{min-height:105px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#98a6b2}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--emerald);box-shadow:0 0 0 4px rgba(8,127,91,.09)
}
.message{padding:13px 15px;border-radius:12px;margin:14px 0;font-size:.9rem;line-height:1.5}
.message.error{background:#FFF4F2;color:var(--danger);border:1px solid #F5C6C2}
.message.ok{background:#F0FAF4;color:var(--success);border:1px solid #BFE5CB}
.toast-host{position:fixed;right:18px;bottom:18px;z-index:10050;display:flex;flex-direction:column;gap:9px;pointer-events:none;max-width:min(92vw,390px)}
.toast{background:#102A43;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 14px 34px rgba(16,42,67,.22);font-size:.88rem;line-height:1.45;opacity:0;transform:translateY(8px);animation:toastIn .2s ease forwards}
.toast.ok{background:#087F5B}.toast.error{background:#B42318}.toast.warning{background:#A16207}
@keyframes toastIn{to{opacity:1;transform:translateY(0)}}

/* ================= DASHBOARD SHELL ================= */
.dashboard{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:11px clamp(15px,3vw,32px);box-shadow:0 3px 12px rgba(16,42,67,.035)
}
.topbar .brand{margin:0}.top-actions{display:flex;align-items:center;gap:9px}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{
  background:linear-gradient(180deg,#102A43 0%,#0D3B3A 58%,#087F5B 150%);
  color:#e2e8f0;padding:22px 14px;display:flex;flex-direction:column;justify-content:space-between;
  border-right:1px solid rgba(255,255,255,.06)
}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-section-title{
  font-size:.69rem;text-transform:uppercase;letter-spacing:1.1px;color:#D9BF74;
  margin:18px 0 8px 12px;font-weight:850
}
.nav-btn{
  width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:12px 14px;
  border-radius:11px;font-weight:650;display:flex;align-items:center;gap:11px;font-size:.88rem;
  transition:.18s;min-height:45px
}
.nav-btn.active{
  background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.07));
  color:#fff;box-shadow:inset 3px 0 0 var(--gold)
}
.nav-btn:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateX(2px)}
.sidebar-footer{padding-top:15px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:10px}
.sidebar-footer-item{display:flex;align-items:center;gap:9px}
.sidebar-footer-item img{width:32px;height:32px;object-fit:contain;background:#fff;border-radius:7px;padding:2px}
.sidebar-footer-item div span{display:block;font-size:.68rem;font-weight:750;color:#fff;line-height:1.2}
.sidebar-footer-item div small{font-size:.62rem;color:#cbd5e1}

.content{padding:clamp(20px,3vw,38px);min-width:0;max-width:1500px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{
  margin:0;font-size:clamp(1.45rem,2.4vw,2rem);letter-spacing:-.6px;
  color:var(--navy);font-weight:850
}

/* ================= SMART DASHBOARD ================= */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat,.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.stat{padding:18px 19px;position:relative;overflow:hidden}
.stat:after{
  content:"";position:absolute;right:-22px;bottom:-30px;width:85px;height:85px;
  border-radius:50%;background:rgba(8,127,91,.045)
}
.stat small{color:var(--muted);font-weight:750;font-size:.74rem;text-transform:uppercase;letter-spacing:.45px}
.stat strong{display:block;font-size:1.58rem;margin-top:7px;color:var(--navy);font-weight:850}
.panel{padding:22px;margin-top:18px}
.panel + .panel{margin-top:14px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.section-title{font-weight:850;margin:19px 0 11px;color:var(--navy);font-size:1.05rem}

/* Dashboard progress blocks created by existing JS */
.progress-card,.hero-progress{
  border-radius:20px!important;
  box-shadow:0 15px 35px rgba(16,42,67,.14)!important;
}

/* ================= TABLES ================= */
.table-wrap{
  width:100%;overflow-x:auto;margin-top:13px;border:1px solid var(--border);
  border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch
}
.friendly-table{width:100%;border-collapse:collapse;font-size:.9rem}
.friendly-table th{
  background:#F3F7F5;color:var(--navy);padding:13px 15px;text-align:left;
  font-weight:800;border-bottom:1px solid var(--border);white-space:nowrap
}
.friendly-table td{padding:13px 15px;border-bottom:1px solid var(--border);color:#344454;vertical-align:middle}
.friendly-table tr:last-child td{border-bottom:0}
.friendly-table tbody tr:hover{background:#FAFCFB}
.badge{
  display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;
  font-size:.71rem;font-weight:850;text-transform:uppercase;letter-spacing:.25px;white-space:nowrap
}
.badge-success{background:#EFFAF3;color:var(--success);border:1px solid #BFE5CB}
.badge-warning{background:#FFF9E8;color:var(--warning);border:1px solid #F3DE98}
.badge-danger{background:#FFF3F1;color:var(--danger);border:1px solid #F5C6C2}
.badge-info{background:#EFF8FF;color:#1769AA;border:1px solid #C6E4F7}

/* ================= FORMS / TOOLBARS ================= */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.form-grid .full-col{grid-column:1/-1}
.mobile-menu{display:none}
.password-wrapper{position:relative;display:flex;align-items:center}
.password-wrapper input{width:100%;padding-right:48px}
.toggle-password-btn{
  position:absolute;right:9px;background:none;border:0;cursor:pointer;padding:8px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color .2s;border-radius:8px
}
.toggle-password-btn:hover{color:var(--emerald);background:var(--surface-soft)}

/* ================= MODALS ================= */
#modalNaOverlay>div>div,#modalUploadOverlay>div>div,#trxModal>div>div,#excelModal>div>div{
  border:1px solid var(--border)!important;
  box-shadow:0 24px 70px rgba(16,42,67,.22)!important
}

/* ================= RESPONSIVE TABLET ================= */
@media (max-width:1100px){
  .auth{grid-template-columns:1fr}
  .auth-side{
    min-height:290px;padding:32px 28px;justify-content:flex-end
  }
  .auth-side-inner{margin:0;max-width:780px}
  .auth-side h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:12px 0}
  .auth-side p{display:none}
  .footer-logos{margin-top:18px}
  .auth-panel{padding:28px 18px}
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:68px;bottom:0;width:min(84vw,305px);z-index:45;
    transform:translateX(-105%);transition:transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow:20px 0 45px rgba(0,0,0,.2)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:inline-flex;align-items:center;justify-content:center}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:18px}
}

/* ================= RESPONSIVE PHONE ================= */
@media (max-width:700px){
  .topbar{min-height:64px;padding:9px 12px}
  .topbar .brand small{display:none}
  .topbar .app-logo{width:40px;height:40px;border-radius:11px}
  .top-actions{gap:5px}
  .top-actions .btn{min-width:42px;padding:9px 11px}
  .top-actions .btn span,.top-actions .btn .label{display:none}

  .auth{display:flex;flex-direction:column;min-height:100svh}
  .auth-side{
    min-height:205px;padding:23px 18px 18px;justify-content:flex-end;
    background-position:center
  }
  .auth-side .brand{margin-bottom:auto}
  .auth-side .brand h2{font-size:1rem}
  .auth-side h1{font-size:1.7rem;line-height:1.12;max-width:360px}
  .footer-logos{display:none}
  .auth-panel{padding:0 13px 22px;background:var(--ivory)}
  .auth-card{
    width:100%;margin-top:-1px;border-radius:0 0 22px 22px;padding:24px 18px 26px;
    box-shadow:0 10px 28px rgba(16,42,67,.08);border-top:0
  }
  .auth-card:before{height:4px}
  .field{margin:14px 0}
  .field input,.field select,.field textarea{min-height:50px;font-size:16px}
  .btn{min-height:48px}

  .sidebar{top:64px;width:min(88vw,310px)}
  .content{padding:15px 12px 28px}
  .page-head{margin-bottom:17px}
  .page-head h1{font-size:1.38rem}
  .cards{grid-template-columns:1fr 1fr;gap:9px}
  .stat{padding:14px}
  .stat small{font-size:.66rem}
  .stat strong{font-size:1.18rem}
  .panel{padding:16px;margin-top:13px;border-radius:15px}
  .form-grid{grid-template-columns:1fr;gap:3px}
  .form-grid .full-col{grid-column:auto}
  .toolbar{gap:7px}
  .toolbar .btn{flex:1 1 auto}
  .table-wrap{margin-top:10px;border-radius:11px}
  .friendly-table{font-size:.82rem;min-width:620px}
  .friendly-table th,.friendly-table td{padding:10px 11px}
}

/* ================= VERY SMALL PHONES ================= */
@media (max-width:430px){
  .cards{grid-template-columns:1fr}
  .auth-side{min-height:185px}
  .auth-side h1{font-size:1.5rem}
  .auth-card{padding:21px 15px 24px}
  .brand{gap:9px}
  .app-logo{width:42px;height:42px}
  .top-actions .btn-light{display:none}
}

/* Accessibility */
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important
  }
}

.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-group-toggle{
  width:100%;text-align:left;border:0;background:rgba(255,255,255,.045);color:#dbe5ec;
  padding:10px 12px;border-radius:11px;font-weight:750;display:flex;align-items:center;
  justify-content:space-between;gap:8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;
  transition:.18s;margin-top:5px
}
.nav-group-toggle:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-group-toggle .nav-chevron{font-size:.8rem;transition:transform .18s}
.nav-group.open .nav-chevron{transform:rotate(90deg)}
.nav-submenu{display:none;flex-direction:column;gap:3px;padding:3px 0 5px 8px}
.nav-group.open .nav-submenu{display:flex}
.nav-submenu .nav-btn{min-height:41px;padding:10px 12px;font-size:.84rem}
.nav-home{margin-bottom:4px}


.tutorial-feed{margin:0 0 18px;padding:15px 17px;border:1px solid #dfe9e4;border-left:4px solid var(--gold);border-radius:15px;background:linear-gradient(135deg,#fffdf7,#f7fbf9);box-shadow:0 7px 20px rgba(16,42,67,.045)}
.tutorial-feed .tutorial-label{font-size:.68rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#9a7625;margin-bottom:5px}
.tutorial-feed h3{margin:0 0 5px;font-size:.98rem;color:var(--navy)}
.tutorial-feed p{margin:0;color:#516271;font-size:.84rem;line-height:1.55}
.tutorial-feed .tutorial-flow{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tutorial-step{padding:5px 8px;border-radius:999px;background:#edf7f2;color:var(--emerald-2);font-size:.69rem;font-weight:800}
.tutorial-arrow{color:#9aa8b2;font-size:.72rem}
.assessment-guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}
.assessment-guide-card{padding:12px 13px;border:1px solid var(--border);border-radius:13px;background:#fff}
.assessment-guide-card strong{display:block;font-size:.78rem;color:var(--navy);margin-bottom:4px}
.assessment-guide-card span{font-size:.74rem;color:var(--muted);line-height:1.4}
.score-auto{font-weight:850;color:var(--emerald-2)}
.score-manual{font-weight:850;color:var(--warning)}
@media(max-width:700px){.assessment-guide{grid-template-columns:1fr}.tutorial-feed{padding:13px 14px}}

.school-index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.school-index-card{transition:transform .12s ease,box-shadow .12s ease}
.school-index-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
@media(max-width:700px){.school-index-grid{grid-template-columns:1fr}}

.pdf-interactive-grid{border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}.pdf-interactive-grid aside{background:#fff}.pdf-interactive-grid .panel{border:1px solid #e5e7eb}.pdf-interactive-grid table{font-size:.86rem}@media(max-width:900px){.pdf-interactive-grid{grid-template-columns:1fr!important}.pdf-interactive-grid iframe{height:58vh!important}.pdf-interactive-grid aside{max-height:none!important}.pdf-interactive-grid .table-wrap{overflow-x:auto}}
</style>
</head>
<body>
<div id="app" class="app"></div>

function groupBelanjaClient(list, amountField, contextFields=[]) {
  const map = new Map();
  (list || []).forEach(x => {
    const ctx = contextFields.map(k => String(x[k] ?? '')).join('|');
    const groupCode = String(x.kode_kelompok_belanja || x.kode_rekening || 'LAINNYA').trim();
    const groupName = String(x.nama_kelompok_belanja || 'Belanja Belum Terpetakan').trim();
    const key = [ctx, groupCode, groupName].join('||');
    if (!map.has(key)) map.set(key, {
      context: contextFields.reduce((o,k)=>{o[k]=x[k]??'';return o;},{}),
      kode_kelompok_belanja: groupCode,
      nama_kelompok_belanja: groupName,
      items: [], subtotal: 0
    });
    const g = map.get(key);
    g.items.push(x);
    g.subtotal += Number(x[amountField] || 0);
  });
  const groups = Array.from(map.values()).sort((a,b)=>{
    const ca = contextFields.map(k=>String(a.context[k]||'')).join('|');
    const cb = contextFields.map(k=>String(b.context[k]||'')).join('|');
    return ca.localeCompare(cb) || String(a.kode_kelompok_belanja).localeCompare(String(b.kode_kelompok_belanja), undefined, {numeric:true});
  });
  groups.forEach(g => {
    g.items.sort((a,b) =>
      String(a.kode_rekening || '').localeCompare(String(b.kode_rekening || ''), undefined, {numeric:true}) ||
      String(a.uraian || a.uraian_transaksi || '').localeCompare(String(b.uraian || b.uraian_transaksi || ''))
    );
  });
  return groups;
}

function normalizeNpsnClient(v){
  const s = String(v ?? '').trim();
  if(!s) return '';
  return /^\d+\.0+$/.test(s) ? s.replace(/\.0+$/, '') : s;
}
function groupBelanjaBySekolahClient(list, amountField){
  const map = new Map();
  (list || []).forEach(x => {
    const npsn = normalizeNpsnClient(x.npsn);
    const key = npsn || 'TANPA_NPSN';
    if(!map.has(key)) map.set(key, {
      npsn: npsn || '-',
      nama_sekolah: String(x.nama_sekolah || '').trim(),
      kecamatan: String(x.kecamatan || '').trim(),
      alamat_lengkap: String(x.alamat_lengkap || '').trim(),
      items: [],
      total: 0
    });
    const g = map.get(key);
    // Jika baris berikutnya membawa identitas sekolah yang lebih lengkap,
    // gunakan nilai tersebut.
    if(!g.nama_sekolah && x.nama_sekolah) g.nama_sekolah = String(x.nama_sekolah).trim();
    if(!g.kecamatan && x.kecamatan) g.kecamatan = String(x.kecamatan).trim();
    if(!g.alamat_lengkap && x.alamat_lengkap) g.alamat_lengkap = String(x.alamat_lengkap).trim();
    g.items.push(x);
    g.total += Number(x[amountField] || 0);
  });

  return Array.from(map.values()).sort((a,b)=>{
    const an = normalizeNpsnClient(a.npsn);
    const bn = normalizeNpsnClient(b.npsn);
    if(!an && bn) return 1;
    if(an && !bn) return -1;
    if(/^\d+$/.test(an) && /^\d+$/.test(bn)) return Number(an) - Number(bn);
    return an.localeCompare(bn);
  });
}

function toast(text,type='ok',duration=3200){
  let host=$('#toastHost');
  if(!host){ host=document.createElement('div');host.id='toastHost';host.className='toast-host';document.body.appendChild(host); }
  const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=String(text||'');host.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),220)},duration);
}

async function api(action, payload={}){
  const body = { action, ...payload };
  if(state.token) body.token = state.token;
  const response = await fetch(API_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(!response.ok) throw new Error(`Server HTTP ${response.status}`);
  const data = await response.json();
  if(!data.success) throw new Error(data.message || 'Permintaan gagal.');
  return data;
}
async function safeApi(action,payload={},fallback=null){ try{return await api(action,payload);}catch(e){return fallback;} }

async function doLogin(e){
  e.preventDefault();
  if(Number($('#captchaInput').value)!==state.captchaAns){$('#authMsg').innerHTML=msg('Jawaban verifikasi salah.');return;}
  try{
    const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});
    state.token=r.token; state.user=r.user || {};
    sessionStorage.setItem('simpel_token',state.token);
    showWelcomeAnimation(() => { startApp(); });
  }catch(err){$('#authMsg').innerHTML=msg(errorText(err));}
}

window.toggleRegisterFields = function() {

async function periodeSelect(id = 'periodeSelect', required = true, defaultMode = 'bulan') {
  const res = await safeApi('getPeriodeSPJ', {}, {data:[],frekuensi:'',tahun:new Date().getFullYear()});
  cachedPeriodeList = Array.isArray(res?.data) ? res.data : [];
  const configuredFrequency = String(res?.frekuensi || '').toUpperCase();
  const configuredYear = Number(res?.tahun || new Date().getFullYear());
  const periods = cachedPeriodeList.filter(p =>
    Number(p.tahun) === configuredYear &&
    (!configuredFrequency || String(p.frekuensi || '').toUpperCase() === configuredFrequency)
  );
  const label = configuredFrequency === 'BULANAN' ? 'Bulanan' : configuredFrequency === 'TRIWULANAN' ? 'Triwulanan' : configuredFrequency === 'SEMESTERAN' ? 'Semesteran' : 'Belum dikonfigurasi';
  const optionsHtml = periods.map(p => `<option value="${esc(p.id_periode)}">${esc(p.nama_periode || p.id_periode)}</option>`).join('');
  return `
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <span class="badge badge-info">Frekuensi: ${esc(label)}</span>
        ${configuredYear ? `<span class="muted">Tahun ${esc(configuredYear)}</span>` : ''}
      </div>
      <select id="${id}" ${required ? 'required' : ''}>
        <option value="">-- Pilih Periode --</option>
        ${optionsHtml || '<option value="" disabled>DINAS belum menentukan frekuensi penilaian</option>'}
      </select>
    </div>`;
}

async function renderDokumenTable(){
  const periode = $('#periodeSelect')?.value || state.selectedPeriode;
  const area = $('#dokumenArea');
  if(!area) return;
  if(!periode){
    area.innerHTML = msg('Pilih periode SPJ terlebih dahulu.','ok');
    return;
  }
  area.innerHTML = loading();

  try{
    const [mRes,dRes] = await Promise.all([
      api('getMasterSPJ'),
      api('getDokumenSPJ',{idPeriode:periode})
    ]);

    const masters = (mRes.data || [])
      .filter(x => String(x.status_aktif ?? x.status ?? 'AKTIF').toUpperCase() === 'AKTIF')
      .sort((a,b) => (Number(a.urutan)||0) - (Number(b.urutan)||0));

    const docs = dRes.data || [];
    state.masterSpj = masters;
    const groups = masters.map(m => ({
      m,
      d: docs
        .filter(x => String(x.id_spj) === String(m.id_spj) && String(x.status||'').toUpperCase() !== 'NONAKTIF')
        .sort((a,b)=>(Number(b.versi)||0)-(Number(a.versi)||0))[0]
    }));

    const uploaded = groups.filter(x => x.d && String(x.d.status||'').toUpperCase() !== 'N/A').length;
    const na = groups.filter(x => String(x.d?.status||'').toUpperCase() === 'N/A').length;
    const total = groups.length;
    const done = uploaded + na;
    const pct = total ? Math.round(done / total * 100) : 0;

    const rows = groups.map((x,i) => {
      const m=x.m, d=x.d;
      const status = d ? String(d.status || 'SUDAH_UPLOAD').toUpperCase() : 'BELUM_UPLOAD';

window.openImportPaketSPJ = function(){
  const periode = $('#periodeSelect')?.value || state.selectedPeriode;
  if(!periode){
    toast('Pilih periode SPJ terlebih dahulu.','warning');
    return;
  }
  const wrap=document.createElement('div');
  wrap.id='modalImportPaket';
  wrap.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px">
    <div style="background:#fff;padding:26px;border-radius:22px;width:min(100%,760px);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.22)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><h3 style="margin:0;color:var(--primary)">Impor Paket SPJ</h3><div class="muted">Pilih beberapa PDF sekaligus. Setiap file dipetakan ke komponen SPJ sebelum diunggah.</div></div>
        <button type="button" class="btn btn-light" onclick="$('#modalImportPaket').remove()">Tutup</button>
      </div>
      <div class="field" style="margin-top:16px"><label>Pilih File PDF</label><input id="paketFiles" type="file" accept=".pdf,application/pdf" multiple></div>
      <div id="paketMap" style="margin-top:12px"></div>
      <div id="paketMsg" style="margin-top:10px"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
        <button type="button" class="btn btn-light" onclick="$('#modalImportPaket').remove()">Batal</button>
        <button type="button" class="btn btn-primary" id="paketUploadBtn" disabled>Impor & Unggah Semua</button>
      </div>
    </div></div>`;
  document.body.appendChild(wrap);

  $('#paketFiles').onchange = async e => {
    const files=Array.from(e.target.files||[]).filter(f=>f.name.toLowerCase().endsWith('.pdf') || f.type==='application/pdf');
    if(!files.length){ $('#paketMap').innerHTML=msg('Tidak ada PDF yang dipilih.'); $('#paketUploadBtn').disabled=true; return; }
    const masters=state.masterSpj.length ? state.masterSpj : (await api('getMasterSPJ')).data||[];
    const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
    const pick=(f)=>{
      const fn=norm(f.name);
      let best=masters.find(m=>fn.includes(norm(m.kode)));
      if(!best) best=masters.find(m=>fn.includes(norm(m.id_spj)));
      if(!best) best=masters.find(m=>norm(m.nama_spj||m.nama_dokumen).split('').length>3 && fn.includes(norm(m.nama_spj||m.nama_dokumen)));
      return best?.id_spj || '';
    };
    $('#paketMap').innerHTML=files.map((f,i)=>`<div class="doc-row" style="margin-bottom:7px">
      <div><strong>${esc(f.name)}</strong><div class="muted">${Math.round(f.size/1024)} KB</div></div>
      <select class="paket-map-select" data-file-index="${i}" style="min-width:260px">
        <option value="">-- Pilih komponen SPJ --</option>
        ${masters.map(m=>`<option value="${esc(m.id_spj)}" ${pick(f)===m.id_spj?'selected':''}>${esc(m.nama_spj||m.nama_dokumen||m.kode||m.id_spj)}</option>`).join('')}
      </select>
    </div>`).join('');
    $('#paketUploadBtn').disabled=false;
  };

  $('#paketUploadBtn').onclick=async()=>{
    const files=Array.from($('#paketFiles').files||[]);
    const selects=Array.from(document.querySelectorAll('.paket-map-select'));
    if(!files.length) return;
    const mappings=selects.map(x=>x.value);
    if(mappings.some(v=>!v)){ $('#paketMsg').innerHTML=msg('Semua file harus dipetakan ke komponen SPJ.'); return; }
    if(new Set(mappings).size!==mappings.length){ $('#paketMsg').innerHTML=msg('Satu komponen SPJ hanya boleh dipilih satu kali dalam satu impor.'); return; }
    const btn=$('#paketUploadBtn'); btn.disabled=true; btn.textContent='Mengunggah 0/'+files.length+'...';
    try{
      for(let i=0;i<files.length;i++){
        const f=files[i];
        const base64=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
          reader.onerror=reject;
          reader.readAsDataURL(f);
        });
        await api('uploadDanSimpanDokumenSPJ',{data:{id_periode:periode,id_spj:mappings[i],nama_file:f.name,mimeType:'application/pdf',base64}});
        btn.textContent=`Mengunggah ${i+1}/${files.length}...`;
      }
      $('#modalImportPaket').remove();
      await renderDokumenTable();
    }catch(e){
      $('#paketMsg').innerHTML=msg(errorText(e));
      btn.disabled=false; btn.textContent='Impor & Unggah Semua';
    }
  };
};

function _bkuNormLabelClient(v){
  return String(v??'').replace(/\s+/g,' ').trim().toUpperCase().replace(/[.:]/g,'');
}
function _bkuNumberClient(v){
  if(typeof v==='number' && Number.isFinite(v)) return v;
  let s=String(v??'').trim();if(!s)return 0;
  s=s.replace(/\s/g,'').replace(/Rp/ig,'');
  if(s.includes('.') && s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  else s=s.replace(/[^0-9,.-]/g,'').replace(',','.');
  const n=Number(s);return Number.isFinite(n)?n:0;
}
function _bkuDateClient(v){
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number' && Number.isFinite(v)){
    const d=new Date(Date.UTC(1899,11,30)+v*86400000);
    if(!isNaN(d)) return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  const s=String(v??'').trim();
  let m=s.match(/^(\d{2})[-\/]?(\d{2})[-\/]?(\d{4})$/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;
  m=s.match(/^(\d{4})[-\/]?(\d{2})[-\/]?(\d{2})$/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function _bkuFindHeaderClient(rows){
  for(let r=0;r<Math.min(rows.length,40);r++){
    const cells=(rows[r]||[]).map(_bkuNormLabelClient);
    const hasDate=cells.includes('TANGGAL'), hasRek=cells.includes('KODE REKENING'), hasUraian=cells.includes('URAIAN'), hasKeluar=cells.includes('PENGELUARAN');
    if(hasDate&&hasRek&&hasUraian&&hasKeluar){
      // Ekspor BKU ARKAS memakai merge cell pada header. Pada data,
      // NO. BUKTI dan URAIAN berada satu kolom di kanan label header.
      const date=cells.indexOf('TANGGAL'), kegiatan=cells.indexOf('KODE KEGIATAN'), rekening=cells.indexOf('KODE REKENING');
      const buktiHead=cells.indexOf('NO BUKTI'), uraianHead=cells.indexOf('URAIAN');
      const bukti=buktiHead+1 < (rows[r+1]||[]).length ? buktiHead+1 : buktiHead;
      const uraian=uraianHead+1 < (rows[r+1]||[]).length ? uraianHead+1 : uraianHead;
      return {row:r,date,kodeKegiatan:kegiatan,kodeRekening:rekening,bukti,uraian,penerimaan:cells.indexOf('PENERIMAAN'),pengeluaran:cells.indexOf('PENGELUARAN'),saldo:cells.indexOf('SALDO')};
    }
  }
  return null;
}
function _bkuMetaClient(rows){
  let npsn='',nama='',tahun='';
  for(let r=0;r<Math.min(rows.length,18);r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){
      const label=_bkuNormLabelClient(row[c]);
      if(label==='NPSN' && !npsn) for(let j=c+1;j<Math.min(row.length,c+6);j++){if(String(row[j]??'').trim()){npsn=String(row[j]).replace(/^:/,'').trim();break;}}
      if(label==='NAMA SEKOLAH' && !nama) for(let j=c+1;j<Math.min(row.length,c+6);j++){if(String(row[j]??'').trim()){nama=String(row[j]).replace(/^:/,'').trim();break;}}
      const txt=String(row[c]??'');const m=txt.match(/TAHUN\s*[:]?\s*(20\d{2})/i);if(m)tahun=m[1];
    }
  }
  return {npsn,nama,tahun};
}

window.parseExcelBku=async function(){
  const f=$('#excelFile')?.files?.[0],out=$('#excelPreview'),btn=$('#bkuReadBtn');
  if(!f){out.innerHTML=msg('Pilih file Excel BKU.');return;}
  if(typeof XLSX==='undefined'){out.innerHTML=msg('Library Excel belum tersedia.','warning');return;}
  btn.disabled=true;btn.textContent='Membaca BKU...';out.innerHTML=loading('Menganalisis struktur BKU...');
  try{
    const buffer=await f.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buffer),{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    const h=_bkuFindHeaderClient(rows);if(!h)throw new Error('Header BKU tidak ditemukan. Pastikan file merupakan ekspor Buku Kas Umum dari ARKAS.');
    const meta=_bkuMetaClient(rows);
    const data=[];let excluded=0;
    for(let i=h.row+1;i<rows.length;i++){
      const row=rows[i]||[];
      const tanggal=_bkuDateClient(row[h.date]);if(!tanggal){excluded++;continue;}
      const uraian=String(row[h.uraian]??'').trim();
      const penerimaan=_bkuNumberClient(row[h.penerimaan]);
      const pengeluaran=_bkuNumberClient(row[h.pengeluaran]);
      const kode=String(row[h.kodeRekening]??'').trim();
      const bukti=String(row[h.bukti]??'').trim();
      const kodeKegiatan=String(row[h.kodeKegiatan]??'').trim();
      if(/^Saldo (Bank|Tunai) Bulan/i.test(uraian)){excluded++;continue;}
      const nilai=Math.max(Math.abs(penerimaan),Math.abs(pengeluaran));
      if(!(nilai>0)){excluded++;continue;}
      data.push({
        tanggal_transaksi:tanggal,kode_kegiatan:kodeKegiatan,kode_rekening:kode,
        nomor_bukti:bukti,uraian_transaksi:uraian||'Transaksi BKU',
        penerimaan,pengeluaran,nilai_transaksi:nilai,saldo:_bkuNumberClient(row[h.saldo])
      });
    }
    if(!data.length)throw new Error('Tidak ditemukan transaksi bernilai lebih dari nol pada BKU.');
    const pdf=$('#bkuPdfFile')?.files?.[0]||null;
    state.importedTransactions=data;state.bkuImport={fileName:f.name,meta,pdfFile:pdf};
    const months=[...new Set(data.map(x=>x.tanggal_transaksi.slice(0,7)))].sort();
    const withCode=data.filter(x=>x.kode_rekening).length;
    const tax=data.filter(x=>/\b(PPh|PPN|PAJAK|SETOR PPh|SETOR PPN)\b/i.test(x.uraian_transaksi)).length;
    out.innerHTML=msg(`BKU valid. ${fmtNum(data.length)} transaksi siap diimpor.`,'ok')+
      `<div class="cards" style="margin:12px 0"><div class="stat"><small>NPSN</small><strong style="font-size:1rem">${esc(meta.npsn||'Tidak terbaca')}</strong></div><div class="stat"><small>Sekolah</small><strong style="font-size:1rem">${esc(meta.nama||'-')}</strong></div><div class="stat"><small>Periode</small><strong style="font-size:1rem">${esc(months.join(', '))}</strong></div><div class="stat"><small>PDF</small><strong style="font-size:1rem">${pdf?'Dipilih':'Belum dipilih'}</strong></div></div>`+
      `<div class="panel" style="margin:12px 0"><b>Validasi:</b> ${fmtNum(data.length)} transaksi • ${fmtNum(withCode)} memiliki kode rekening • ${fmtNum(tax)} transaksi terkait pajak • ${fmtNum(excluded)} baris non-transaksi dilewati.</div>`+
      `<div class="table-wrap"><table class="friendly-table"><thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Kode Rekening</th><th>No. Bukti</th><th>Uraian</th><th>Nilai</th></tr></thead><tbody>${data.slice(0,80).map(x=>`<tr><td>${esc(x.tanggal_transaksi)}</td><td>${esc(x.kode_kegiatan)}</td><td><code>${esc(x.kode_rekening||'-')}</code></td><td>${esc(x.nomor_bukti||'-')}</td><td>${esc(x.uraian_transaksi)}</td><td><b>${fmtRupiah(x.nilai_transaksi)}</b></td></tr>`).join('')}</tbody></table></div>`+
      `<div class="muted" style="margin-top:8px">Menampilkan maksimal 80 baris preview. Simpan akan memetakan transaksi ke periode penilaian yang dipilih DINAS (Bulanan/Triwulanan/Semesteran) berdasarkan tanggal transaksi, mencari RKAS berdasarkan NPSN + kode rekening, mendeteksi duplikasi, dan menyimpan satu PDF BKU sebagai dokumen sumber yang direferensikan pada periode terkait.</div>`+
      `<button class="btn btn-primary" style="margin-top:12px" onclick="saveImportedTransactions()">Simpan BKU ke Sistem</button>`;
  }catch(err){out.innerHTML=msg(errorText(err),'error');state.bkuImport=null;state.importedTransactions=[];}
  finally{btn.disabled=false;btn.textContent='Baca & Validasi BKU';}
};

window.saveImportedTransactions=async function(){
  const imp=state.bkuImport;if(!imp||!state.importedTransactions.length){toast('Baca file BKU terlebih dahulu.','warning');return;}
  const btn=$('#bkuReadBtn');if(btn){btn.disabled=true;btn.textContent='Mengimpor...';}
  const out=$('#excelPreview');out.innerHTML=loading('Menyimpan transaksi BKU dan PDF...');
  try{
    let pdfBase64='';
    if(imp.pdfFile){
      const buf=await imp.pdfFile.arrayBuffer();
      const bytes=new Uint8Array(buf);let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
      pdfBase64=btoa(binary);
    }
    const r=await api('importBkuBundle',{data:{npsn:imp.meta?.npsn||'',source_name:imp.fileName,transactions:state.importedTransactions,pdf_name:imp.pdfFile?.name||'',pdf_mime:imp.pdfFile?.type||'application/pdf',pdf_base64:pdfBase64}});
    const periodText=(r.periods||[]).map(x=>x.nama_periode).join(', ');
    out.innerHTML=msg(`Impor BKU selesai. ${fmtNum(r.total_inserted||0)} transaksi baru, ${fmtNum(r.total_skipped_duplicate||0)} duplikat dilewati.`,'ok')+
      `<div class="panel" style="margin-top:12px"><b>${esc(r.nama_sekolah||'Sekolah')}</b> • NPSN ${esc(r.npsn||'-')}<br>Periode: ${esc(periodText||'-')}<br>RKAS cocok: ${fmtNum(r.rkas_matched||0)} • RKAS belum cocok: ${fmtNum(r.rkas_unmatched||0)}<br>PDF: ${r.pdf?.uploaded?'tersimpan sebagai satu dokumen sumber dan direferensikan ke periode terkait':'tidak diunggah'}</div>`+
      `${(r.warnings||[]).length?msg(`Peringatan: ${esc((r.warnings||[]).join(' | '))}`,'warning'):''}`+
      `<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn btn-light" onclick="$('#excelModal').remove()">Tutup</button><button class="btn btn-primary" onclick="renderTransaksi(1);$('#excelModal').remove()">Lihat Transaksi</button></div>`;
    state.bkuImport=null;state.importedTransactions=[];
  }catch(err){out.innerHTML=msg(errorText(err),'error');if(btn){btn.disabled=false;btn.textContent='Simpan BKU ke Sistem';}}
};

window.filterAndRenderDinasRkasTable = function(){
  const panel = $('#dinasRkasPanel');
  const statArea = $('#dinasRkasStatArea');
  if(!panel) return;

  const keyword = String($('#searchDinasRkas')?.value || '').trim().toLowerCase();
  const list = (window._currentDinasRkasList || []).filter(x => {
    const st = String(x.status_rkas || '').toUpperCase();
    if(window._activeDinasStatus === 'APPROVED'){
      return st === 'APPROVED' || st === 'DISETUJUI' || st === 'SELESAI';
    }
    return st === 'DIAJUKAN' || st === 'PENDING' || st === 'MENUNGGU';
  });

  const map = new Map();
  list.forEach(x => {
    const npsn = normalizeNpsnClient(x.npsn);
    if(!npsn) return;
    if(!map.has(npsn)) map.set(npsn, {
      npsn,
      nama_sekolah: x.nama_sekolah || '',
      kecamatan: x.kecamatan || '',
      alamat_lengkap: x.alamat_lengkap || '',
      items: [],
      total: 0
    });
    const s = map.get(npsn);
    s.items.push(x);
    s.total += Number(x.pagu || 0);
    if(!s.nama_sekolah && x.nama_sekolah) s.nama_sekolah = x.nama_sekolah;
    if(!s.kecamatan && x.kecamatan) s.kecamatan = x.kecamatan;
    if(!s.alamat_lengkap && x.alamat_lengkap) s.alamat_lengkap = x.alamat_lengkap;
  });

  let schools = Array.from(map.values()).sort((a,b)=>{
    const an = normalizeNpsnClient(a.npsn), bn = normalizeNpsnClient(b.npsn);
    return (/^\d+$/.test(an)&&/^\d+$/.test(bn)) ? Number(an)-Number(bn) : an.localeCompare(bn);
  });

  if(keyword){
    schools = schools.filter(s =>
      s.npsn.toLowerCase().includes(keyword) ||
      String(s.nama_sekolah).toLowerCase().includes(keyword) ||
      String(s.kecamatan).toLowerCase().includes(keyword)
    );
  }

  const totalPagu = schools.reduce((sum,s)=>sum+s.total,0);
  if(statArea){
    statArea.innerHTML = `<div class="cards">
      <div class="stat"><small>Sekolah</small><strong>${fmtNum(schools.length)}</strong></div>
      <div class="stat"><small>Item RKAS</small><strong>${fmtNum(schools.reduce((n,s)=>n+s.items.length,0))}</strong></div>
      <div class="stat"><small>Total Pagu</small><strong>${fmtRupiah(totalPagu)}</strong></div>
    </div>`;
  }

  panel.innerHTML = schools.length ? `
    <div class="school-index-grid">
      ${schools.map(s=>`
        <div class="panel school-index-card" style="margin:0;border:1px solid var(--border);">
          <div style="font-size:.78rem;color:var(--muted);font-weight:800;letter-spacing:.03em;">NPSN</div>
          <div style="font-size:1.12rem;font-weight:900;color:var(--primary);">${esc(s.npsn)}</div>
          <div style="font-weight:850;margin-top:4px;">${esc(s.nama_sekolah || 'Nama sekolah tidak tersedia')}</div>
          <div class="muted" style="margin-top:3px;">Kecamatan ${esc(s.kecamatan || '-')}</div>
          <div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px;">
            <span class="muted">${fmtNum(s.items.length)} item</span>
            <b>${fmtRupiah(s.total)}</b>
          </div>
          <button class="btn btn-sm btn-primary" style="margin-top:12px;width:100%;" onclick="openDinasRkasSchool('${esc(s.npsn)}')">Buka Sekolah →</button>
        </div>`).join('')}
    </div>` : msg('Tidak ada sekolah yang sesuai dengan filter.','warning');
};

window.triggerDistribusiPenugasanAdil = async function() {
  if (!confirm('Jalankan algoritma distribusi penugasan pengawas secara otomatis, adil, dan lintas kecamatan berdasarkan pagu RKAS?')) {
    return;
  }

  const resultBox = $('#distribusiResult');
  if (resultBox) {
    resultBox.style.display = 'block';
    resultBox.innerHTML = loading('Menjalankan algoritma distribusi adil lintas kecamatan...');
  }

  try {
    const res = await api('generatePenugasanAdil');
    
    if (resultBox) {
      let statistikHtml = `<div style="background:#f0fdf4; border:1px solid #bbf7d0; padding:16px; border-radius:12px; color:var(--success);">
        <strong>${esc(res.message || 'Distribusi berhasil dijalankan!')}</strong><br><br>
        <div style="font-size:0.9rem; color:var(--text);"><b>Statistik Beban Pengawas:</b><ul>`;
      
      const stats = res.statistik_beban || {};
      for (const pid in stats) {
        const item = stats[pid];
        statistikHtml += `<li>Pengawas (ID: <b>${esc(pid)}</b>): Menangani <b>${item.jumlah_sekolah} sekolah</b> | Total Pagu Binaan: <b>Rp ${Number(item.total_beban || 0).toLocaleString('id-ID')}</b></li>`;
      }
      statistikHtml += `</ul></div></div>`;
      
      resultBox.innerHTML = statistikHtml;
    } else {
      alert(res.message || 'Distribusi penugasan adil berhasil dijalankan!');
    }

    if (typeof penugasanView === 'function') {
      setTimeout(() => { penugasanView(); }, 2000);
    }

  } catch (err) {
    if (resultBox) {
      resultBox.innerHTML = msg(errorText(err));
    } else {
      alert('Gagal: ' + errorText(err));
    }
  }
};

async function dinasMonitoringView(){
  const c = $('#mainContent');
  c.innerHTML = head('Command Center Dinas', 'Pusat pemantauan kinerja sekolah dan pengawas') + `<div class="toolbar"><input id="searchDinasCenter" placeholder="🔍 Cari Sekolah atau NPSN..." style="max-width:350px"></div><div id="dinasCenterArea" style="margin-top:16px">${loading()}</div>`;
  try {
    const [sekolahRes, penugasanRes] = await Promise.all([safeApi('getSekolah', {}, {data:[]}), safeApi('getPenugasanPengawas', {}, {data:[]})]);
    window._cachedDinasSekolah = sekolahRes.data || []; window._cachedDinasPenugasan = penugasanRes.data || [];
    renderDinasCenterTable(window._cachedDinasSekolah, window._cachedDinasPenugasan);
    $('#searchDinasCenter').oninput = e => {
      const q = e.target.value.toLowerCase();
      renderDinasCenterTable(window._cachedDinasSekolah.filter(s => String(s.npsn).toLowerCase().includes(q) || String(s.nama_sekolah||'').toLowerCase().includes(q) || String(s.kecamatan||'').toLowerCase().includes(q)), window._cachedDinasPenugasan);
    };
  } catch(e) { $('#dinasCenterArea').innerHTML = msg(errorText(e)); }
}

function renderDinasCenterTable(listSekolah, listPenugasan){
  const area = $('#dinasCenterArea'); if(!area) return;
  let html = `<div class="cards" style="margin-bottom:20px"><div class="stat"><small>Total Sekolah</small><strong>${fmtNum(listSekolah.length)}</strong></div><div class="stat"><small>Penugasan Aktif</small><strong>${fmtNum(listPenugasan.length)}</strong></div><div class="stat"><small>Status Sistem</small><strong style="font-size:1.1rem;color:var(--success)">Optimal</strong></div><div class="stat"><small>Wilayah</small><strong style="font-size:1.1rem">Rembang</strong></div></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px"><h3 class="section-title" style="margin:0">Monitoring Sekolah & Aksi Cepat</h3></div><div class="table-wrap"><table class="friendly-table"><thead><tr><th>NPSN</th><th>Nama Sekolah</th><th>Kecamatan</th><th>Pengawas Binaan</th><th>Aksi Teguran / Pesan</th></tr></thead><tbody>`;
  if(!listSekolah.length){ html += emptyRow(5); } else {
    listSekolah.forEach(s => {
      const p = listPenugasan.find(x => String(x.npsn).trim() === String(s.npsn).trim());
      html += `<tr><td><b>${esc(s.npsn)}</b></td><td>${esc(s.nama_sekolah)}</td><td>${esc(s.kecamatan || '-')}</td><td>${badge(p?'Binaan':'Belum',p?'success':'warning')} ${formatUserLabel(p?.id_pengawas, p?.nama_pengawas)}</td><td><button class="btn btn-sm btn-primary" onclick="openPeringatanModal('${esc(s.npsn)}','${esc(s.nama_sekolah)}')">✉️ Kirim Pesan</button></td></tr>`;
    });
  }
  html += `</tbody></table></div></div>`; area.innerHTML = html;
}

async function pesanView(){
  const c = $('#mainContent');
  c.innerHTML = head('Pesan & Koordinasi', 'Kotak masuk komunikasi resmi dua arah (Dinas ⇄ Pengawas ⇄ Sekolah)') +
                `<div class="toolbar">
                   <button class="btn btn-primary" onclick="openKirimPesanModal()">✉️ Kirim Pesan / Feedback Baru</button>
                   <button class="btn btn-light" onclick="loadPesanData()">🔄 Perbarui Pesan</button>
                 </div>
                 <div class="panel" id="pesanContent">${loading('Memuat kotak masuk...')}</div>`;
  await loadPesanData();
}

async function loadPesanData(){
  const area = $('#pesanContent'); if(!area) return;
  try {
    const res = await safeApi('getPesan', {}, { data: [] });
    const list = (res.data || []).filter(x => String(x.status_baca || x.status_pesan || 'BELUM').toUpperCase() !== 'SELESAI');

    // 👉 SISIPKAN DI SINI: Memperbarui badge notifikasi secara real-time
    updateUnreadMessageBadge();

    const rows = list.map(x => `
      <tr>
        <td><b>${esc(x.tanggal || 'Hari ini')}</b></td>
        <td>${esc(x.pengirim || 'Sistem')}</td>
        <td>${badge(x.kategori || 'INFORMASI', x.kategori==='TEGURAN'?'danger':'info')}</td>
        <td><b>${esc(x.subjek)}</b><br><small class="muted">${esc(x.isi_pesan)}</small></td>
        <td>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm btn-primary" onclick="openBalasPesanModal('${esc(x.id_pesan || '')}','${esc(x.pengirim)}')">Balas & Selesaikan</button>
            <button class="btn btn-sm btn-light" onclick="tutupNotifikasiPesan('${esc(x.id_pesan || '')}')">Tandai Selesai</button>
          </div>
        </td>
      </tr>`).join('');

    area.innerHTML = `
      <div class="table-wrap">
        <table class="friendly-table">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Pengirim</th>
              <th>Kategori</th>
              <th>Subjek & Isi Pesan</th>
              <th>Aksi Penyelesaian</th>
            </tr>
          </thead>
          <tbody>${rows || emptyRow(5, 'Kotak masuk bersih. Tidak ada pesan atau teguran aktif yang tertunda.')}</tbody>
        </table>
      </div>`;
  } catch(e) { area.innerHTML = msg(errorText(e)); }
}

  } else if(isPengawas()){
    const res = await safeApi('getPenugasanPengawas', {}, {data:[]});
    tujuanOptions = `<option value="DINAS">Dinas Pendidikan (Admin)</option><optgroup label="Sekolah Binaan Saya">${(res.data||[]).map(s => `<option value="${esc(s.npsn)}">${esc(s.npsn)} -${esc(s.nama_sekolah || 'Sekolah')}</option>`).join('')}</optgroup>`;

  document.body.appendChild(wrap);

  $('#formKirimPesan').onsubmit = async e => {
    e.preventDefault();

      toast('Pesan berhasil dikirim!','ok'); $('#pesanModal').remove(); await loadPesanData();

  document.body.appendChild(wrap);

  $('#formBalasPesan').onsubmit = async e => {
    e.preventDefault();
    const isi = $('#balasIsi').value.trim(); if(!isi) return;
    try {
      await api('kirimPesan', { data: { tujuan: pengirimAsal, subjek: 'Re: Balasan Pesan', isi_pesan: isi, kategori: 'BALASAN', pengirim: state.user?.username || ownNpsn() } });

window.tutupNotifikasiPesan = async function(idPesan) {
  if(!idPesan || !confirm('Tandai pesan ini sudah selesai dan hilangkan dari daftar notifikasi aktif?')) return;
  try {
    await api('updateStatusPesan', { id_pesan: idPesan, status_baca: 'SELESAI' });
    await loadPesanData();
  } catch(err) { alert(errorText(err)); }
};

async function updateUnreadMessageBadge() {
  try {
    const res = await safeApi('getJumlahPesanBelum', {}, { count: 0 });
    const count = res.count || 0;
    const pesanBtn = document.querySelector('[data-view="pesan"]');
    if (!pesanBtn) return;

    const existingBadge = pesanBtn.querySelector('.pesan-badge');
    if (existingBadge) existingBadge.remove();

    if (count > 0) {
      const badgeSpan = document.createElement('span');
      badgeSpan.className = 'pesan-badge';
      badgeSpan.style.cssText = 'background:var(--danger); color:#fff; font-size:0.75rem; font-weight:800; padding:2px 8px; border-radius:10px; margin-left:auto;';
      badgeSpan.textContent = count;
      pesanBtn.appendChild(badgeSpan);
    }
  } catch (e) {
    console.warn('Gagal memuat jumlah pesan:', e);
  }
}

window.loadFindings=async function(){
  const p=$('#periodeSelect').value,n=isSchool()?ownNpsn():$('#npsnSelect')?.value;if(!p||!n)return;
  state.selectedPeriode=p;state.selectedNpsn=n;const area=$('#findingArea');area.innerHTML=loading();
  try{const r=await api('getTemuanSPJ',{idPeriode:p,npsn:n});const rows=(r.data||[]).map(x=>`<tr><td>${esc(x.kode_temuan)}</td><td>${badge(x.level_temuan,'danger')}</td><td>${esc(x.sumber_utama)}</td><td>${esc(x.hasil_sistem)}</td><td>${badge(x.hasil_verifikasi||'BELUM','info')}</td><td>${isPengawas()?`<button class="btn btn-sm btn-primary" onclick="verifyFinding('${esc(x.id_temuan)}')">Verifikasi</button>`:'-'}</td></tr>`).join('');area.innerHTML=`<div class="table-wrap"><table class="friendly-table"><thead><tr><th>Kode</th><th>Level</th><th>Sumber</th><th>Hasil</th><th>Verifikasi</th><th>Aksi</th></tr></thead><tbody>${rows||emptyRow(6)}</tbody></table></div>`;}catch(e){area.innerHTML=msg(errorText(e));}
};
window.verifyFinding=async function(id){
  const hasil=prompt('Ketik: TERBUKTI / TIDAK_TERBUKTI','TERBUKTI');if(!hasil)return;
  try{await api('verifikasiTemuanSPJ',{idTemuan:id,hasilVerifikasi:hasil.toUpperCase(),catatan:''});await loadFindings();}catch(e){alert(errorText(e));}
};


async function masterSpjView(){
  if(!isDinas()){ $('#mainContent').innerHTML=msg('Modul ini hanya dapat digunakan oleh DINAS.'); return; }
  const [cfg, spjRes, indRes, perRes] = await Promise.all([
    api('getFrekuensiPenilaianSPJ').catch(()=>({frekuensi:'',tahun:new Date().getFullYear()})),
    api('getMasterSPJ'), api('getMasterIndikator'), api('getPeriodeSPJ')
  ]);
  const spj=spjRes.data||[], inds=indRes.data||[], pers=perRes.data||[];
  const freq=String(cfg.frekuensi||perRes.frekuensi||'').toUpperCase();
  const year=Number(cfg.tahun||perRes.tahun||new Date().getFullYear());
  const freqLabel=freq==='BULANAN'?'Bulanan':freq==='TRIWULANAN'?'Triwulanan':freq==='SEMESTERAN'?'Semesteran':'Belum dipilih';
  const activePeriods=pers.filter(x=>Number(x.tahun)===year && String(x.frekuensi||'').toUpperCase()===freq);
  const spjRows=spj.map(x=>`<tr><td>${esc(x.kode_spj)}</td><td>${esc(x.nama_spj)}</td><td>${esc(x.urutan)}</td><td>${badge(x.status_aktif,x.status_aktif==='AKTIF'?'success':'warning')}</td></tr>`).join('');
  const indRows=inds.map(x=>`<tr><td>${esc(x.kode_indikator)}</td><td>${esc(x.nama_indikator)}</td><td>${esc(spj.find(s=>String(s.id_spj)===String(x.id_spj))?.nama_spj||x.id_spj)}</td><td>${String(x.metode_pemeriksaan||'').toUpperCase().includes('RISK_ENGINE')?'DINAMIS':esc(x.bobot)}</td><td>${badge(x.status_aktif,x.status_aktif==='AKTIF'?'success':'warning')}</td></tr>`).join('');
  const perRows=activePeriods.map(x=>`<tr><td>${esc(x.nama_periode)}</td><td>${esc(x.tahun)}</td><td>${esc(x.frekuensi||freqLabel)}</td><td>${esc(String(x.tanggal_mulai||'-').replace(/T00:00:00\.000Z$/,''))}</td><td>${esc(String(x.tanggal_selesai||'-').replace(/T00:00:00\.000Z$/,''))}</td><td>${badge(x.status,x.status==='AKTIF'?'success':'warning')}</td></tr>`).join('');
  $('#mainContent').innerHTML=head('Pengaturan Penilaian SPJ','DINAS cukup menentukan frekuensi penilaian. Periode dibuat otomatis oleh sistem.')+
    `<div class="panel" style="border-top:4px solid var(--primary)">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <div><h3 style="margin:0">Frekuensi Penilaian</h3><div class="muted" style="margin-top:5px">Pilih sekali untuk tahun penilaian. Sistem otomatis membuat periode dan menggunakannya untuk seluruh sekolah.</div></div>
        <span class="badge badge-${freq?'success':'warning'}">${esc(freqLabel)} • ${esc(year)}</span>
      </div>
      <div class="form-grid" style="margin-top:16px">
        <div class="field"><label>Tahun Penilaian</label><input id="cfgTahunPenilaian" type="number" min="2020" max="2100" value="${esc(year)}"></div>
        <div class="field"><label>Frekuensi</label><select id="cfgFrekuensiPenilaian">
          <option value="BULANAN" ${freq==='BULANAN'?'selected':''}>Bulanan</option>
          <option value="TRIWULANAN" ${freq==='TRIWULANAN'?'selected':''}>Triwulanan</option>
          <option value="SEMESTERAN" ${freq==='SEMESTERAN'?'selected':''}>Semesteran</option>
        </select></div>
      </div>
      <div class="toolbar"><button class="btn btn-primary" id="btnSimpanFrekuensi">✓ Terapkan Frekuensi</button></div>
      <div id="freqConfigMsg"></div>
    </div>`+

function drivePreviewUrl(url){
  const u=String(url||'');
  const m=u.match(/drive\.google\.com\/file\/d\/([^/]+)/i);
  if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  if(/docs\.google\.com/i.test(u)) return u;
  return u;
}
function pdfPageUrl(url,page){
  const base=drivePreviewUrl(url); const p=parseInt(page,10);
  return base + (p>0 ? `#page=${p}` : '');
}

window.loadInteractiveIndicators=async function(){

window.interactiveEditScore=async function(idAsesmen,idIndikator,current,automatic,page){
  const p=prompt('Nomor halaman PDF yang menjadi bukti indikator ini:',page||($('#interactivePage')?.value||'1')); if(p===null)return;
  if(p && (!/^\d+$/.test(p)||Number(p)<1)){toast('Nomor halaman tidak valid.','warning');return;}
  let score=prompt(`Skor indikator 0–4. Skor otomatis: ${automatic}`,current);
  if(score===null)return; score=score.trim()===''?'':Number(score);
  if(score!==''&&(!Number.isFinite(score)||score<0||score>4)){toast('Skor harus 0 sampai 4.','warning');return;}
  let note=''; if(score!==''&&Math.abs(Number(score)-Number(automatic))>.001){note=prompt('Alasan koreksi manual:','');if(note===null||!note.trim()){toast('Koreksi manual wajib memiliki alasan.','warning');return;}}
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU',halaman_bukti:p}});
    $('#interactivePage').value=p; goInteractivePage(); toast('Penilaian dan halaman bukti tersimpan.','ok'); await openPdfInteractive();
  }catch(e){toast(errorText(e),'error',4500);}
};

function renderAssessment(a, indicators){
  const interactiveBtn=`<button class="btn btn-light" onclick="loadView('pdfInteraktif')">📄 Buka PDF & Penilaian Interaktif</button>`;
  const totalWeight=indicators.reduce((s,x)=>s+Math.max(0,Number(x.bobot)||0),0);
  const weighted=totalWeight>0
    ? indicators.reduce((s,x)=>s+(Number(x.skor)||0)*Math.max(0,Number(x.bobot)||0),0)/totalWeight
    : (indicators.length?indicators.reduce((s,x)=>s+(Number(x.skor)||0),0)/indicators.length:0);
  const preview=Number((weighted*25).toFixed(2));
  const done=indicators.filter(x=>String(x.sumber_penilaian||'').toUpperCase()==='KOREKSI_MANUAL').length;
  const rows=indicators.map(d=>{
    const manual=String(d.sumber_penilaian||'').toUpperCase()==='KOREKSI_MANUAL';
    const findings=Number(d.jumlah_temuan||0);
    return `<tr>
      <td><b>${esc(d.kode_indikator)}</b><br><small class="muted">${esc(d.nama_indikator)}</small></td>
      <td>${Number(d.risiko||0).toFixed(2)}/100</td>
      <td>${Number(d.bobot||0).toFixed(2)}%</td>
      <td><span class="${manual?'score-manual':'score-auto'}">${Number(d.skor).toFixed(2)}</span><br><small class="muted">otomatis ${Number(d.skor_otomatis).toFixed(2)}</small></td>
      <td>${findings?`<span class="badge badge-warning">${findings} temuan</span>`:'<span class="badge badge-success">Tidak ada</span>'}</td>
      <td>${isPengawas()&&String(a.status_asesmen||'').toUpperCase()!=='SELESAI'?`<button class="btn btn-sm btn-light" onclick="editScore('${esc(a.id_asesmen)}','${esc(d.id_indikator)}','${d.skor}','${d.skor_otomatis}')">${manual?'Koreksi':'Koreksi manual'}</button>`:'-'}</td>
    </tr>`;
  }).join('');

  $('#assessmentArea').innerHTML=`
    <div class="toolbar" style="margin-bottom:12px">${interactiveBtn}</div>
    ${String(a.status_asesmen||'').toUpperCase()==='KAJI_ULANG'?`<div class="message warning" style="margin-bottom:14px"><b>Mode Kaji Ulang.</b> Sekolah mengajukan keberatan atas penilaian ini. Silakan periksa kembali bukti, temuan, dan skor sebelum memfinalisasi ulang.</div>`:''}
    <div class="assessment-guide">
      <div class="assessment-guide-card"><strong>1. Sistem membaca temuan</strong><span>Hanya temuan berstatus TERBUKTI yang menjadi dasar penalti otomatis.</span></div>
      <div class="assessment-guide-card"><strong>2. Risk Engine membentuk indikator</strong><span>Indikator dipilih otomatis berdasarkan pola risiko SPJ, bukan daftar bobot statis.</span></div>
      <div class="assessment-guide-card"><strong>3. Bobot dinamis</strong><span>Bobot setiap indikator dihitung dari profil risiko sekolah dan totalnya dinormalisasi menjadi 100%.</span></div>
    </div>
    <div class="cards">
      <div class="stat"><small>Status</small><strong style="font-size:1.05rem">${esc(a.status_asesmen||'-')}</strong></div>
      <div class="stat"><small>Nilai kualitas sementara</small><strong>${a.nilai_kualitas??preview}</strong></div>
      <div class="stat"><small>Indikator</small><strong>${indicators.length}</strong></div>
      <div class="stat"><small>Koreksi manual</small><strong>${done}</strong></div>
    </div>
    <div class="message ok" style="margin-top:14px">Penilaian menggunakan Risk Engine otomatis. Risiko sistem menentukan bobot dinamis; hanya temuan <b>TERBUKTI</b> yang mengurangi skor indikator.</div><div class="panel" style="margin-top:14px;padding:16px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <div><b>Nilai kualitas</b><div class="muted">Pratinjau berdasarkan indikator aktif dan bobotnya.</div></div>
        <strong style="font-size:1.5rem;color:var(--emerald-2)">${Number(a.nilai_kualitas??preview).toFixed(2)}</strong>
      </div>
    </div>
    <div class="table-wrap"><table class="friendly-table"><thead><tr><th>Indikator</th><th>Risiko</th><th>Bobot Dinamis</th><th>Skor</th><th>Temuan terbukti</th><th>Aksi</th></tr></thead><tbody>${rows||emptyRow(6)}</tbody></table></div>
    ${isPengawas()&&String(a.status_asesmen||'').toUpperCase()!=='SELESAI'?`<div class="toolbar" style="margin-top:14px"><button class="btn btn-primary" onclick="finalizeAssessment('${esc(a.id_asesmen)}')">✓ Finalisasi Penilaian</button></div>`:''}
    ${String(a.status_asesmen||'').toUpperCase()==='SELESAI'?`<div class="message ok" style="margin-top:14px">Penilaian sudah difinalisasi. Nilai akhir: <b>${esc(a.nilai_akhir??'-')}</b>.</div>${isSchool()?`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="ajukanKeberatan('${esc(a.id_asesmen)}')">✉ Ajukan Keberatan Penilaian</button></div>`:''}`:''}
  `;
}

window.finalizeAssessment=async function(idAsesmen){
  if(!confirm('Finalisasi penilaian ini? Setelah finalisasi, nilai tidak dapat diedit lagi.'))return;
  try{const r=await api('finalisasiAsesmen',{idAsesmen});toast(`Penilaian selesai. Nilai akhir: ${r.nilai_akhir}`,'ok',4500);await openAssessment();}
  catch(e){toast(errorText(e),'error',4500);}
};

window.editScore=async function(idAsesmen,idIndikator,current,automatic){
  const raw=prompt(`Skor indikator (0–4).\nSkor otomatis: ${automatic}\nKosongkan untuk kembali ke skor otomatis.`,current??automatic);
  if(raw===null)return;
  let score=raw.trim()===''?'':Number(raw);
  if(score!=='' && (!Number.isFinite(score)||score<0||score>4)){toast('Skor harus antara 0 sampai 4.','warning');return;}
  let note='';
  if(score!=='' && Math.abs(Number(score)-Number(automatic))>0.001){
    note=prompt('Jelaskan alasan koreksi manual:','');
    if(note===null||!note.trim()){toast('Koreksi manual wajib memiliki alasan.','warning');return;}
  }
  try{
    await api('simpanDetailAsesmen',{data:{id_asesmen:idAsesmen,id_indikator:idIndikator,skor:score,catatan_pengawas:note,status_berlaku:'BERLAKU'}});
    toast(score===''?'Indikator dikembalikan ke skor otomatis.':'Koreksi indikator tersimpan.','ok');
    await openAssessment();
  }catch(e){toast(errorText(e),'error',4500);}
};

function formatSekolahLabel(npsn, namaSekolah = '', kecamatan = '', alamat = ''){
  const cleanNpsn = esc(npsn || state.user?.npsn || '');
  const cleanNama = esc(namaSekolah || state.user?.nama_sekolah || 'Satuan Pendidikan');
  const cleanKec = esc(kecamatan || state.user?.kecamatan || '');
  const cleanAlamat = esc(alamat || state.user?.alamat_lengkap || '');
  
  // Gabungkan wilayah dan alamat secara rapi
  let details = [];
  if(cleanKec) details.push(`Kec. ${cleanKec}`);
  if(cleanAlamat && cleanAlamat !== '-') details.push(cleanAlamat);
  const detailStr = details.length > 0 ? ` — ${details.join(', ')}` : '';

  return `<span style="text-align:right;display:inline-block;line-height:1.3;">
    <b>${cleanNpsn}</b> (${cleanNama})${detailStr ? `<br><small class="muted" style="font-size:0.75rem;">📍 ${detailStr}</small>` : ''}

}

  return `<b>${esc(idPengawas)}</b> ${namaPengguna ? `<span style="color:var(--muted);font-size:0.88rem">(${esc(namaPengguna)})</span>` : ''}`;

window.autoFillSekolahByNpsn = async function(npsn) {
  if(!npsn || npsn.trim().length < 4) return;
  const cleanNpsn = npsn.trim();
  const namaSekolahInput = $('#regNamaSekolah');
  const usernameInput = $('#regUsername');
  
  if(namaSekolahInput) namaSekolahInput.value = 'Mencari data sekolah...';
  if(usernameInput) usernameInput.value = cleanNpsn;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'getSekolah' })
    });
    const res = await response.json();
    const list = Array.isArray(res) ? res : (res.data || res.sekolah || []);
    const found = list.find(s => String(s.npsn || s.NPSN || '').trim() === cleanNpsn);
    if(found) {
      const namaVal = found.nama_sekolah || found.nama_satuan_pendidikan || found.nama || found.sekolah || '';
      if(namaSekolahInput) namaSekolahInput.value = namaVal;
    } else {
      if(namaSekolahInput) namaSekolahInput.value = '';
      alert('NPSN tidak ditemukan di database tabel sekolah. Silakan ketik nama satuan pendidikan secara manual.');
    }
  } catch(e) {
    if(namaSekolahInput) namaSekolahInput.value = '';
    console.warn('Gagal memuat otomatis nama sekolah:', e.message);
  }
};

    <div id="paginationControls" style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:16px;"></div>`;

  // Panggil fungsi filter & render halaman pertama
  window._monState.currentPage = 1;
  applyGlobalMonFilterAndSort();
};

// 2. Reset ke halaman 1 saat filter atau limit diubah
window.resetPageAndFilter = function() {
  window._monState.currentPage = 1;
  applyGlobalMonFilterAndSort();
};

// 3. Logika Gabungan Filter (Pencarian & Kecamatan), Sorting, & Pagination
window.applyGlobalMonFilterAndSort = function() {
  const rawData = window._cachedGlobalMon || [];
  const searchInput = $('#searchGlobalMon');
  const query = searchInput ? searchInput.value.toLowerCase() : '';
  const selectedKec = $('#filterKecamatan') ? $('#filterKecamatan').value : '';
  const sortMode = $('#sortGlobalMon') ? $('#sortGlobalMon').value : 'nama_asc';
  const pageSizeVal = $('#pageSizeGlobalMon') ? $('#pageSizeGlobalMon').value : '25';

  // A. Filter Data
  let result = rawData.filter(x => {
    const matchText = String(x.npsn).toLowerCase().includes(query) || 
                      String(x.nama_sekolah).toLowerCase().includes(query) || 
                      String(x.kecamatan).toLowerCase().includes(query) ||
                      String(x.alamat_lengkap).toLowerCase().includes(query);
    const matchKec = !selectedKec || String(x.kecamatan) === selectedKec;
    return matchText && matchKec;
  });

  // B. Sorting Data (Disempurnakan dengan pembersihan format angka)
  result.sort((a, b) => {
    if (sortMode === 'nama_asc') {
      return (a.nama_sekolah || '').localeCompare(b.nama_sekolah || '');
    } else if (sortMode === 'pagu_desc') {
      const valA = typeof num === 'function' ? num(a.total_pagu) : (Number(a.total_pagu) || 0);
      const valB = typeof num === 'function' ? num(b.total_pagu) : (Number(b.total_pagu) || 0);
      return valB - valA; // Tertinggi ke terendah
    } else if (sortMode === 'realisasi_desc') {
      const valA = typeof num === 'function' ? num(a.total_realisasi) : (Number(a.total_realisasi) || 0);
      const valB = typeof num === 'function' ? num(b.total_realisasi) : (Number(b.total_realisasi) || 0);
      return valB - valA; // Tertinggi ke terendah
    } else if (sortMode === 'npsn_asc') {
      return String(a.npsn).localeCompare(String(b.npsn));
    }
    return 0;
  });

  // C. Pagination Logic (Diperbaiki agar opsi 'all' merender seluruh data dengan benar)
  const totalData = result.length;
  let paginatedResult = result;
  let totalPages = 1;

  if (pageSizeVal !== 'all') {
    const limit = parseInt(pageSizeVal) || 25;
    totalPages = Math.ceil(totalData / limit) || 1;
    if (window._monState.currentPage > totalPages) window._monState.currentPage = totalPages;
    if (window._monState.currentPage < 1) window._monState.currentPage = 1;

    const startIdx = (window._monState.currentPage - 1) * limit;
    paginatedResult = result.slice(startIdx, startIdx + limit);
  } else {
    window._monState.currentPage = 1;
  }

  // D. Render Baris Tabel
  const body = $('#globalMonBody');
  const countLabel = $('#countGlobalMon');
  const pagInfo = $('#paginationInfo');
  const pagControls = $('#paginationControls');

  if(body) {
    const startIndexOffset = pageSizeVal === 'all' ? 0 : (window._monState.currentPage - 1) * (parseInt(pageSizeVal) || 25);
    body.innerHTML = generateGlobalMonRows(paginatedResult, startIndexOffset);
  }
  if(countLabel) countLabel.innerText = result.length;
  if(pagInfo && pageSizeVal !== 'all') {
    pagInfo.innerText = `Halaman ${window._monState.currentPage} dari ${totalPages}`;
  } else if(pagInfo) {
    pagInfo.innerText = 'Menampilkan seluruh data';
  }

  // E. Render Tombol Navigasi Halaman
  if(pagControls) {
    if(pageSizeVal === 'all' || totalPages <= 1) {
      pagControls.innerHTML = '';
    } else {
      pagControls.innerHTML = `
        <button class="btn btn-light btn-sm" ${window._monState.currentPage === 1 ? 'disabled' : ''} onclick="changeMonPage(-1)">← Sebelumnya</button>
        <span style="font-size:0.9rem; font-weight:600;">Hal ${window._monState.currentPage} / ${totalPages}</span>
        <button class="btn btn-light btn-sm" ${window._monState.currentPage === totalPages ? 'disabled' : ''} onclick="changeMonPage(1)">Selanjutnya →</button>`;
    }
  }
};

// 4. Fungsi Navigasi Halaman (Sebelumnya / Selanjutnya)
window.changeMonPage = function(direction) {
  window._monState.currentPage += direction;
  applyGlobalMonFilterAndSort();
};

// 5. Generator Baris Tabel dengan Nomor Urut yang Menyesuaikan Halaman
function generateGlobalMonRows(list, offset = 0) {
  if(!list || list.length === 0) return emptyRow(7, 'Tidak ada data yang cocok dengan filter.');
  return list.map((x, idx) => `
    <tr>
      <td style="text-align:center">${offset + idx + 1}</td>
      <td><b>${esc(x.npsn)}</b></td>
      <td>
        <b>${esc(x.nama_sekolah)}</b><br>
        <small class="muted">📍 ${esc(x.alamat_lengkap)} (Kec. ${esc(x.kecamatan)})</small>
      </td>
      <td><b>${fmtRupiah(x.total_pagu)}</b></td>
      <td style="color:var(--success);font-weight:600">${fmtRupiah(x.total_realisasi)}</td>
      <td style="text-align:center">${badge(x.jumlah_dokumen_spj > 0 ? `${x.jumlah_dokumen_spj} File` : 'Belum', x.jumlah_dokumen_spj > 0 ? 'success' : 'warning')}</td>
      <td style="text-align:center">${badge(x.status_penilaian, x.status_penilaian === 'SELESAI_DINILAI' ? 'success' : 'info')}</td>
    </tr>`).join('');
}

// 6. Integrasi Pencarian Teks ke Filter & Sort Gabungan
window.filterGlobalMon = function(keyword) {
  resetPageAndFilter();
};

// 7. Fungsi ekspor Excel untuk laporan monitoring global
window.exportGlobalMonExcel = function(){
  try {
    const tbl = document.getElementById('tableGlobalMon');
    if(!tbl) {
      alert('Tabel data monitoring tidak ditemukan.');
      return;
    }
    const wb = XLSX.utils.table_to_book(tbl, {sheet: "Monitoring Global SPJ"});
    XLSX.writeFile(wb, `Laporan_Monitoring_Global_SPJ_${state.user?.role || 'Dinas'}.xlsx`);
  } catch(e) {
    alert('Gagal mengunduh file Excel: ' + e.message);
  }
};

</script>

<script>
/* ============================================================================
 * UI PENGESAHAN ELEKTRONIK — V3
 * Menempel pada modul Penilaian yang sudah ada agar alur utama tidak berubah.

async function renderPengesahanPanel(idAsesmen){
  const host=document.getElementById('assessmentSigningArea'); if(!host)return;
  host.innerHTML=loading('Memeriksa status pengesahan...');
  try{
    const r=await api('getPengesahanPenilaian',{idAsesmen});
    const d=r.data||{};
    const approval=d.persetujuan_sekolah;
    const signature=d.pengesahan_pengawas;
    const appeal=d.keberatan_terakhir;
    const signed=!!signature;
    const approved=!!approval;
    let action='';
    if(signed){
      const vr=await api('verifikasiPengesahanPenilaian',{idAsesmen});
      action=`<div class="message ${vr.valid?'ok':'error'}" style="margin-top:12px">
        <b>${vr.valid?'🔒 PENILAIAN DISAHKAN':'⚠ PENGESAHAN PERLU DIVERIFIKASI'}</b><br>
        Penandatangan: ${esc(signature.ditandatangani_oleh||'-')}<br>
        Waktu: ${esc(signature.ditandatangani_at||signature.tanggal||'-')}<br>
        Kode pengesahan: <b>${esc(signature.kode_pengesahan||'-')}</b><br>
        Hash integritas: <code style="word-break:break-all">${esc(signature.integrity_hash||'-')}</code>
        ${signature.verification_url?`<div style="display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap"><img alt="QR Verifikasi" src="https://quickchart.io/qr?size=180&text=${encodeURIComponent(signature.verification_url)}" style="width:140px;height:140px;border:1px solid #ddd;padding:4px;background:#fff"><div><b>QR Verifikasi</b><br><a target="_blank" href="${esc(signature.verification_url)}">Buka halaman verifikasi</a></div></div>`:''}
      </div>`;
    }else if(isPengawas() && approved && String(d.status_asesmen).toUpperCase()==='SELESAI'){
      action=`<div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" onclick="tandaTanganiPenilaian('${esc(idAsesmen)}')">🔏 Tanda Tangani & Sah-kan Penilaian</button></div>`;
    }else if(isSchool() && !approved && String(d.status_asesmen).toUpperCase()==='SELESAI'){

      action=`<div class="message info" style="margin-top:12px">Persetujuan sekolah sudah tercatat. Menunggu pengesahan elektronik pengawas.</div>`;
    }
    host.innerHTML=`

          <div><h3 style="margin:0">🔐 Pengesahan Penilaian</h3><div class="muted">Tahap terakhir setelah penilaian dan proses keberatan selesai.</div></div>
          <span class="badge badge-${signed?'success':approved?'info':'warning'}">${signed?'DISAHKAN':approved?'MENUNGGU PENGAWAS':'MENUNGGU PERSETUJUAN SEKOLAH'}</span>
        </div>
        ${approved?`<div class="message ok" style="margin-top:12px">✓ Persetujuan sekolah tercatat oleh <b>${esc(approval.disetujui_oleh||'-')}</b> pada ${esc(approval.disetujui_at||approval.tanggal||'-')}.</div>`:''}
        ${appeal && ['DIAJUKAN','DIKAJI_ULANG'].includes(String(appeal.status_keberatan||'').toUpperCase())?`<div class="message warning" style="margin-top:12px">Keberatan masih dalam proses. Pengesahan ditahan sampai kaji ulang selesai.</div>`:''}

  }catch(e){host.innerHTML=msg(errorText(e));}
}

  try{
    const r=await api('tandaTanganiPenilaianPengawas',{idAsesmen});

const _renderAssessmentBeforeSigning = renderAssessment;

  _renderAssessmentBeforeSigning(a, indicators);
  const area=document.getElementById('assessmentArea');
  if(!area)return;
