<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPEL SPJ — Kabupaten Rembang</title>
<style>
:root{
  --primary:#0f5132;--primary-2:#146c43;--primary-3:#198754;
  --accent:#f0a500;--bg:#f5f8f6;--surface:#fff;--surface-2:#edf5ef;
  --text:#18231d;--muted:#66736b;--border:#dbe6de;--danger:#b42318;--success:#198754;
  --shadow:0 14px 40px rgba(20,50,34,.10);--radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--primary-3),var(--primary));color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:.5px;box-shadow:0 8px 20px rgba(15,81,50,.22)}
.brand h2{font-size:1.08rem;margin:0}
.brand small{color:var(--muted)}
.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:700;transition:.18s;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-2)}
.btn-secondary{background:#e6f2e9;color:var(--primary)}
.btn-light{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fee4e2;color:var(--danger)}
.full{width:100%}

/* Landing / login */
.auth{
  min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.16),transparent 30%),
    linear-gradient(135deg,#0b3d27,#12643d 58%,#198754);
}
.auth-side{color:#fff;padding:clamp(28px,6vw,84px);display:flex;align-items:center}
.auth-side-inner{max-width:700px}
.auth-side h1{font-size:clamp(2rem,4.5vw,4.4rem);line-height:1.02;margin:26px 0 18px;letter-spacing:-1.5px}
.auth-side p{max-width:620px;line-height:1.75;color:#e9f6ed;font-size:1.02rem}
.feature{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:30px}
.feature span{display:flex;gap:10px;align-items:center;padding:13px 15px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);border-radius:15px;font-size:.92rem}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,40px);background:rgba(248,251,249,.96)}
.auth-card{width:min(100%,480px);background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:26px;padding:clamp(22px,4vw,38px);box-shadow:var(--shadow)}
.auth-card .brand{margin-bottom:18px}
.field{margin:15px 0}
.field label{display:block;font-size:.9rem;font-weight:700;margin-bottom:7px;color:#2c3e35}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:13px 15px;outline:0;background:#fff;min-height:48px;font-size:.95rem}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-3);box-shadow:0 0 0 4px rgba(25,135,84,.12)}
.password-wrap{position:relative}.password-wrap input{padding-right:50px}
.toggle-pass{position:absolute;right:6px;top:4px;border:0;background:transparent;padding:9px;color:var(--muted);font-size:1.1rem}
.message{padding:13px 15px;border-radius:14px;margin:14px 0;font-size:.92rem}
.message.error{background:#fff0ef;color:var(--danger)}.message.ok{background:#e9f8ef;color:#146c43}
.slider{border:1px solid var(--border);border-radius:14px;padding:12px;background:#f8faf8}
.slider-track{height:10px;background:#dce7df;border-radius:99px;position:relative}
.slider-progress{height:100%;width:0;background:var(--primary-3);border-radius:99px}
.slider-knob{width:34px;height:34px;border-radius:50%;background:var(--primary);position:relative;top:-22px;left:0;display:grid;place-items:center;color:#fff;font-size:13px;touch-action:none;user-select:none;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.slider-status{text-align:center;font-size:.82rem;color:var(--muted);margin-top:-6px;font-weight:600}
.captcha-ok .slider-progress{width:100%!important;background:#16a34a}.captcha-ok .slider-knob{left:calc(100% - 34px)!important;background:#16a34a}

/* Application shell */
.dashboard{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px clamp(16px,3vw,34px)
}
.topbar .brand{margin:0}.top-actions{display:flex;align-items:center;gap:10px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 74px)}
.sidebar{background:linear-gradient(180deg,#0c4229,#0a3522);color:#dff3e5;padding:20px 14px}
.nav-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:#8ab59b;margin:16px 0 8px 12px;font-weight:800}
.nav-btn{
  width:100%;text-align:left;border:0;background:transparent;color:#dceee2;padding:13px 14px;
  border-radius:14px;margin:4px 0;font-weight:650;display:flex;align-items:center;gap:11px;font-size:.95rem;transition:.15s
}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.content{padding:clamp(20px,3vw,38px);min-width:0;max-width:1500px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{margin:0;font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.5px;color:#11291b}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat,.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.stat{padding:20px}.stat small{color:var(--muted);font-weight:600}.stat strong{display:block;font-size:1.75rem;margin-top:8px;color:#0f5132}
.panel{padding:22px;margin-top:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* Tabel Hasil Ramah Pengguna */
.table-container{width:100%;overflow-x:auto;margin-top:14px;border:1px solid var(--border);border-radius:14px;background:#fff}
.friendly-table{width:100%;border-collapse:collapse;font-size:.9rem}
.friendly-table th{background:#f0f6f2;color:#183824;padding:12px 14px;text-align:left;font-weight:750;border-bottom:2px solid var(--border);white-space:nowrap}
.friendly-table td{padding:12px 14px;border-bottom:1px solid var(--border);color:#2b3a32;vertical-align:middle}
.friendly-table tr:hover{background:#f8fcf9}

/* Badge Status Cantik */
.badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:750;text-transform:uppercase}
.badge-success{background:#e9f8ef;color:#146c43}
.badge-warning{background:#fef3c7;color:#b45309}
.badge-danger{background:#fee4e2;color:#b42318}
.badge-info{background:#e0f2fe;color:#0369a1}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
.form-grid .full-col{grid-column:1/-1}
.section-title{font-weight:800;margin:22px 0 12px;color:var(--primary);font-size:1.1rem}
.mobile-menu{display:none}

.wizard-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}
.wizard-card{background:linear-gradient(145deg,#fff,#f4f9f5);border:1px solid var(--border);border-radius:18px;padding:20px;cursor:pointer;transition:.2s;box-shadow:0 4px 15px rgba(0,0,0,.03)}
.wizard-card:hover{border-color:var(--primary-3);transform:translateY(-2px);box-shadow:0 8px 25px rgba(15,81,50,.08)}
.wizard-card h4{margin:0 0 6px;color:var(--primary);font-size:1.05rem}
.wizard-card p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.5}

/* Tablet */
@media (max-width:1050px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:74px;bottom:0;width:min(84vw,310px);z-index:45;
    transform:translateX(-105%);transition:transform .22s;box-shadow:20px 0 40px rgba(0,0,0,.15)
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:inline-flex;align-items:center;justify-content:center}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wizard-cards{grid-template-columns:1fr}
  .content{padding:22px}
}

/* Phone */
@media (max-width:640px){
  .topbar{padding:10px 14px}.topbar .brand-mark{width:42px;height:42px;border-radius:12px}
  .topbar .brand h2{font-size:.98rem}.top-actions .user-name{display:none}
  .layout{min-height:calc(100vh - 64px)}
  .sidebar{top:64px}
  .content{padding:14px}
  .cards{grid-template-columns:1fr 1fr;gap:12px}
  .stat{padding:15px;border-radius:16px}.stat strong{font-size:1.3rem}
  .panel{padding:16px;border-radius:16px;margin-top:14px}
  .form-grid{grid-template-columns:1fr}.form-grid .full-col{grid-column:auto}
  .page-head{margin-bottom:16px}.page-head h1{font-size:1.4rem}
  .btn{padding:11px 14px;min-height:44px;font-size:.9rem}
  .auth-panel{padding:12px}.auth-card{padding:22px;border-radius:20px}
  .feature{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app" class="app">
  <main class="auth">
    <section class="auth-side"><div class="auth-side-inner">
      <div class="brand"><div class="brand-mark">SPJ</div><div><h2 style="color:#fff">SIMPEL SPJ</h2><small style="color:#d9eee0">Kabupaten Rembang</small></div></div>
      <h1>Pengelolaan SPJ BOS SD yang terintegrasi.</h1>
      <p>RKAS disajikan oleh Dinas, Sekolah dapat memeriksa dan usulkan perbaikan dengan pilihan menu yang praktis.</p>
      <div class="feature"><span>✓ Pilihan Bulan & Dokumen List</span><span>✓ Tabel Ramah Awam</span><span>✓ Validasi Mudah</span></div>
    </div></section>
    <section class="auth-panel"><div class="auth-card">
      <div class="brand"><div class="brand-mark">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Masuk ke sistem</small></div></div>
      <div id="authBody"></div>
    </div></section>
  </main>
</div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbyWvJXKr1QZ1zwbeJDoULTUihycj1771SsDlGFy8jnuF4i3DsEbHXlcJU48VDAg17fqDA/exec';

const ROLE_RULES={
  SEKOLAH:['home','rkasReview','dokumen','transaksi','crosscheck','temuan','asesmen','master'],
  DINAS:['home','sekolah','penugasan','dbcheck','rkas','dokumen','transaksi','crosscheck','temuan','master'],
  PENGAWAS:['home','sekolah','penugasan','dokumen','transaksi','crosscheck','temuan','asesmen','master']
};

const state={token:sessionStorage.getItem('simpel_token')||'',user:null,view:'home',cache:{},captcha:false};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));
const fmt = v => {
  if(!isNaN(v)&&typeof v==='number') return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v);
  return esc(v);
};
function msg(text,type='error'){return `<div class="message ${type}">${esc(text)}</div>`}

async function api(action,payload={}){
  const body={action,...payload}; if(state.token) body.token=state.token;
  if(API_URL.startsWith('PASTE_')) throw new Error('URL Web App Apps Script belum diisi.');
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const data=await r.json(); if(!data.success)throw new Error(data.message||'Permintaan gagal'); return data;
}
function passwordToggle(id){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password'}
function captchaHTML(){return `<div class="slider" id="captchaBox"><div class="muted" style="margin-bottom:8px">Geser ke kanan untuk verifikasi keamanan</div><div class="slider-track"><div class="slider-progress"></div><div class="slider-knob" id="captchaKnob">↔</div></div><div class="slider-status" id="captchaStatus">Geser tombol dari kiri ke kanan</div></div>`}
function setupCaptcha(){
 const box=$('#captchaBox'),knob=$('#captchaKnob');if(!box||!knob)return;
 let dragging=false;
 const move=x=>{if(!dragging||state.captcha)return;const rect=box.querySelector('.slider-track').getBoundingClientRect();let pos=Math.max(0,Math.min(rect.width-34,x-rect.left-17));knob.style.left=pos+'px';box.querySelector('.slider-progress').style.width=(pos/(rect.width-34)*100)+'%';if(pos>=rect.width-44){state.captcha=true;box.classList.add('captcha-ok');$('#captchaStatus').textContent='Verifikasi Berhasil';}};
 const down=e=>{dragging=true;e.preventDefault()};const up=()=>dragging=false;
 knob.addEventListener('pointerdown',down);window.addEventListener('pointermove',e=>move(e.clientX));window.addEventListener('pointerup',up);
}

function authView(mode='login',notice=''){
 const login=mode==='login';
 $('#app').innerHTML=`<main class="auth"><section class="auth-side"><div><div class="brand"><div class="brand-mark">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Kabupaten Rembang</small></div></div><h1>Pengelolaan SPJ BOS SD yang terintegrasi.</h1><p>RKAS disajikan oleh Dinas, Sekolah dapat memeriksa dan mengusulkan perbaikan sebagai basis penilaian.</p><div class="feature"><span>✓ Pilihan List Periode & Dokumen</span><span>✓ Tabel Ramah Awam</span><span>✓ Validasi Mudah</span></div></div></section><section class="auth-panel"><div class="auth-card"><div class="brand"><div class="brand-mark">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Masuk ke sistem</small></div></div>${notice}<div id="authBody"></div></div></section></main>`;
 $('#authBody').innerHTML=login?loginForm():''; if(login)setupCaptcha();
}
function loginForm(){return `<form id="loginForm"><div class="field"><label>Username / NPSN</label><input id="username" autocomplete="username" required placeholder="Masukkan username atau NPSN sekolah"></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan kata sandi"><button type="button" class="toggle-pass" onclick="passwordToggle('password')">👁</button></div></div>${captchaHTML()}<div id="authMsg"></div><button class="btn btn-primary full" type="submit" id="loginBtn" style="margin-top:16px">Masuk ke Aplikasi</button></form>`}
async function doLogin(e){e.preventDefault();const m=$('#authMsg');if(!state.captcha){m.innerHTML=msg('Silakan selesaikan geser verifikasi terlebih dahulu.');return}const b=$('#loginBtn');b.disabled=true;b.textContent='Memeriksa akun...';try{const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});state.token=r.token;state.user=r.user;sessionStorage.setItem('simpel_token',state.token);dashboard();}catch(err){m.innerHTML=msg(err.message)}finally{b.disabled=false;b.textContent='Masuk ke Aplikasi'}}

function navItems(){
  const role=String(state.user?.role||'').toUpperCase();
  const allowed=ROLE_RULES[role]||ROLE_RULES.SEKOLAH;
  const all=[
    {id:'home',label:'Beranda Utama',cat:'Utama'},
    {id:'rkasReview',label:'Periksa & Usul Perbaikan RKAS',cat:'Keuangan'},
    {id:'transaksi',label:'Catatan Keuangan & Transaksi',cat:'Keuangan'},
    {id:'dokumen',label:'Unggah Berkas & SPJ',cat:'Dokumen'},
    {id:'crosscheck',label:'Pemeriksaan & Validasi',cat:'Audit'},
    {id:'temuan',label:'Temuan & Perbaikan',cat:'Audit'},
    {id:'asesmen',label:'Lembar Penilaian Asesmen',cat:'Penilaian'},
    {id:'rkas',label:'Kelola RKAS (Dinas)',cat:'Keuangan'},
    {id:'sekolah',label:'Daftar Sekolah',cat:'Master Data'},
    {id:'penugasan',label:'Penugasan Pengawas',cat:'Master Data'},
    {id:'master',label:'Referensi Komponen SPJ',cat:'Master Data'},
    {id:'dbcheck',label:'Cek Kesehatan Database',cat:'Sistem'}
  ];
  return all.filter(n=>allowed.includes(n.id)||n.id==='home');
}

function dashboard(){document.body.style.background='var(--bg)';renderShell();loadView('home')}
function renderShell(){
  const u=state.user||{};
  $('#app').innerHTML=`<main class="dashboard"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-light mobile-menu" id="menuBtn" aria-label="Buka menu">☰</button><div class="brand"><div class="brand-mark">SPJ</div><div><h2>SIMPEL SPJ</h2><small>Peran: <b>${esc(u.role||'Pengguna')}</b></small></div></div></div><div class="top-actions"><span class="muted user-name">${esc(u.nama_pengguna||u.username||'')}</span><button class="btn btn-light" id="logoutBtn">Keluar</button></div></header><div class="layout"><aside class="sidebar" id="sidebar">
    <div class="nav-section-title">Menu Utama</div>
    ${navItems().map(n=>`<button class="nav-btn" data-view="${n.id}">${n.label}</button>`).join('')}
  </aside><section class="content" id="mainContent"></section></div></main>`;
  $$('[data-view]').forEach(b=>b.onclick=()=>{loadView(b.dataset.view);$('#sidebar')?.classList.remove('open')});
  $('#logoutBtn').onclick=logout;$('#menuBtn').onclick=()=>$('#sidebar')?.classList.toggle('open'); } async function logout(){try{if(state.token)await api('logout')}catch(e){}state.token='';state.user=null;sessionStorage.removeItem('simpel_token');authView('login',msg('Anda telah keluar dari aplikasi.','ok'))} function setActive(view){$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}

function loadView(view){
  state.view=view; setActive(view);
  if(view==='home') return homeView();
  if(view==='sekolah') return friendlyTableAction('Daftar Seluruh Sekolah','getSekolah','Daftar sekolah dasar terdaftar di kabupaten.');
  if(view==='penugasan') return friendlyTableAction('Daftar Penugasan Pengawas','getPenugasanPengawas','Wilayah binaan pengawas sekolah.');
  if(view==='dbcheck') return dbCheckView();
  if(view==='master') return friendlyTableAction('Referensi Komponen SPJ','getMasterSPJ','Daftar master komponen dan indikator penilaian.');
  if(view==='rkasReview') return rkasReviewSchoolView();
  if(view==='rkas') return rkasInteractiveView();
  if(view==='dokumen') return dokumenView();
  if(view==='transaksi') return transaksiView();
  if(view==='crosscheck') return crosscheckView();
  if(view==='temuan') return temuanView();
  if(view==='asesmen') return asesmenInteractiveView();
}

function head(title,desc=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${desc}</div></div></div>`}

// Helper Pilihan List Bulan (Dropdown Generator)
function selectBulanHTML(id='idPeriode', labelText='Pilih Periode Bulan'){
  return `<div class="field"><label>${labelText}</label>
    <select id="${id}">
      <option value="">-- Pilih Bulan Pelaporan --</option>
      <option value="BLN-01">Bulan 01 - Januari</option>
      <option value="BLN-02">Bulan 02 - Februari</option>
      <option value="BLN-03">Bulan 03 - Maret</option>
      <option value="BLN-04">Bulan 04 - April</option>
      <option value="BLN-05">Bulan 05 - Mei</option>
      <option value="BLN-06">Bulan 06 - Juni</option>
      <option value="BLN-07">Bulan 07 - Juli</option>
      <option value="BLN-08">Bulan 08 - Agustus</option>
      <option value="BLN-09">Bulan 09 - September</option>
      <option value="BLN-10">Bulan 10 - Oktober</option>
      <option value="BLN-11">Bulan 11 - November</option>
      <option value="BLN-12">Bulan 12 - Desember</option>
    </select>
  </div>`;
}

// Helper Pilihan List Jenis Dokumen SPJ (Dropdown Generator)
function selectDokumenHTML(id='idSpj', labelText='Pilih Jenis Komponen SPJ'){
  return `<div class="field"><label>${labelText}</label>
    <select id="${id}">
      <option value="">-- Pilih Jenis Komponen SPJ --</option>
      <option value="BKU">Buku Kas Umum (BKU)</option>
      <option value="BUKU_BANK">Buku Bank</option>
      <option value="BKT">Buku Kas Tunai</option>
      <option value="BUKU_PAJAK">Buku Pajak</option>
      <option value="REKENING_KORAN">Rekening Koran</option>
      <option value="INVOICE">Invoice / Nota / Kuitansi</option>
      <option value="BUKTI_PENDUKUNG">Bukti Pendukung Lainnya</option>
      <option value="SSP_PUSAT">SSP Pajak Pusat (PPN/PPh)</option>
      <option value="SSP_DAERAH">SSP Pajak Daerah</option>
      <option value="FOTO">Foto / Dokumentasi Kegiatan</option>
    </select>
  </div>`;
}

function friendlyTableAction(title,action,desc,fields=[]){
  $('#mainContent').innerHTML=head(title,desc)+
  `<div class="panel">
    <div class="toolbar">
      <button class="btn btn-primary" id="friendlyLoadBtn">Tampilkan Data</button>
      <button class="btn btn-light" id="friendlyClearBtn">Bersihkan</button>
    </div>
    ${fields.length ? `<div class="form-grid">${fields.map(f=>`<div class="${f.full?'full-col':''} field"><label>${f.label}</label><input id="f_${f.id}" placeholder="${f.placeholder||''}"></div>`).join('')}</div>` : ''}
    <div id="friendlyResultArea" style="margin-top:16px"><p class="muted">Belum ada data yang dimuat. Klik tombol "Tampilkan Data" di atas.</p></div>
  </div>`;

  $('#friendlyLoadBtn').onclick = async () => {
    const area = $('#friendlyResultArea');
    area.innerHTML = '<p class="muted">Sedang mengambil data dari server...</p>';
    try {
      let payload = {};
      fields.forEach(f => payload[f.key || f.id] = $('#f_'+f.id)?.value || '');
      const res = await api(action, payload);
      let list = [];
      if (Array.isArray(res.data)) list = res.data;
      else if (Array.isArray(res)) list = res;
      else if (res && typeof res === 'object') {
        const foundKey = Object.keys(res).find(k => Array.isArray(res[k]));
        if (foundKey) list = res[foundKey];
        else list = [res];
      }

      if (!list.length) {
        area.innerHTML = `<div class="message ok">Data berhasil dimuat, namun belum ada catatan yang tersedia.</div>`;
        return;
      }

      const keys = Object.keys(list[0]);
      let html = `<div class="table-wrap"><table class="friendly-table"><thead><tr>`;
      keys.forEach(k => { html += `<th>${esc(k.replaceAll('_',' ').toUpperCase())}</th>`; });
      html += `</tr></thead><tbody>`;

      list.forEach(row => {
        html += `<tr>`;
        keys.forEach(k => {
          let val = row[k];
          if (val === null || val === undefined) val = '-';
          if (k.includes('status') || k.includes('keputusan')) {
            const upVal = String(val).toUpperCase();
            let badgeClass = 'badge-info';
            if (upVal.includes('APPROVED') || upVal.includes('AKTIF') || upVal.includes('SELESAI')) badgeClass = 'badge-success';
            else if (upVal.includes('DRAFT') || upVal.includes('DIAJUKAN') || upVal.includes('PERLU')) badgeClass = 'badge-warning';
            else if (upVal.includes('TOLAK') || upVal.includes('NONAKTIF')) badgeClass = 'badge-danger';
            html += `<td><span class="badge ${badgeClass}">${esc(val)}</span></td>`;
          } else if (k.includes('pagu') || k.includes('nilai')) {
            html += `<td><b>${esc(val)}</b></td>`;
          } else {
            html += `<td>${esc(val)}</td>`;
          }
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
      area.innerHTML = html;
    } catch(err) {
      area.innerHTML = `<div class="message error">Gagal memuat data: ${esc(err.message)}</div>`;
    }
  };

  $('#friendlyClearBtn').onclick = () => {
    $('#friendlyResultArea').innerHTML = '<p class="muted">Belum ada data yang dimuat.</p>';
  };
}

        let html = `<div class="table-wrap"><table class="friendly-table"><thead><tr><th>KODE TEMUAN</th><th>LEVEL</th><th>SUMBER UTAMA</th><th>NILAI SUMBER</th><th>CATATAN SISTEM</th></tr></thead><tbody>`;
        list.forEach(item => {
          html += `<tr><td><b>${esc(item.kode_temuan)}</b></td><td><span class="badge badge-warning">${esc(item.level_temuan)}</span></td><td>${esc(item.sumber_utama)}</td><td>${esc(item.nilai_sumber)}</td><td>${esc(item.catatan_sistem)}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        area.innerHTML = html;
      }catch(e){
        area.innerHTML=`<div class="message error">${esc(e.message)}</div>`;
      }
    };
  });
}

function temuanView(){
  $('#mainContent').innerHTML=head('Temuan & Perbaikan Laporan','Kelola catatan hasil temuan audit dan verifikasi pengawas')+
  `<div class="panel">
    <div class="toolbar">
      <button class="btn btn-primary" id="friendlyLoadBtn">Tampilkan Data Temuan</button>
      <button class="btn btn-light" id="friendlyClearBtn">Bersihkan</button>
    </div>
    <div class="form-grid">
      ${selectBulanHTML('f_idPeriode', 'Pilih Periode Bulan')}
    </div>
    <div id="friendlyResultArea" style="margin-top:16px"><p class="muted">Belum ada data temuan yang dimuat.</p></div>
  </div>`+
  actionPanel('verifikasiTemuanSPJ',[{id:'idTemuan',label:'ID Temuan'},{id:'hasilVerifikasi',label:'Hasil (TERBUKTI / TIDAK_TERBUKTI / PERLU_DATA / N/A)'},{id:'catatan',label:'Catatan Verifikasi Pengawas',full:true}]);

  $('#friendlyLoadBtn').onclick = async () => {
    const area = $('#friendlyResultArea');
    area.innerHTML = '<p class="muted">Memuat data temuan...</p>';
    try {
      const p = $('#f_idPeriode').value;
      const res = await api('getTemuanSPJ', {idPeriode: p});
      const list = res.data || [];
      if (!list.length) {
        area.innerHTML = `<div class="message ok">Tidak ada temuan pada periode tersebut.</div>`;
        return;
      }
      let html = `<div class="table-wrap"><table class="friendly-table"><thead><tr><th>ID TEMUAN</th><th>KODE TEMUAN</th><th>LEVEL</th><th>STATUS</th><th>HASIL SISTEM</th><th>VERIFIKASI</th></tr></thead><tbody>`;
      list.forEach(row => {
        html += `<tr><td><b>${esc(row.id_temuan)}</b></td><td>${esc(row.kode_temuan)}</td><td><span class="badge badge-warning">${esc(row.level_temuan)}</span></td><td><span class="badge badge-info">${esc(row.status_temuan)}</span></td><td>${esc(row.hasil_sistem)}</td><td><span class="badge badge-success">${esc(row.hasil_verifikasi || 'BELUM')}</span></td></tr>`;
      });
      html += `</tbody></table></div>`;
      area.innerHTML = html;
    } catch(err) {
      area.innerHTML = `<div class="message error">${esc(err.message)}</div>`;
    }
  };
  $('#friendlyClearBtn').onclick = () => { $('#friendlyResultArea').innerHTML = '<p class="muted">Belum ada data yang dimuat.</p>'; };
}

function asesmenInteractiveView(){
  $('#mainContent').innerHTML=head('Lembar Penilaian Asesmen','Hitung indikator, simpan indeks kompleksitas, dan masukkan skor penilaian pengawas')+
  `<div class="panel">
     <h3 class="section-title" style="margin-top:0">Hitung Indikator Dari Temuan</h3>
     <div class="form-grid">${selectBulanHTML('ind_p', 'Pilih Periode Bulan')}</div>
     <button class="btn btn-primary" id="runIndBtn" style="margin-top:10px">Hitung Indikator</button>
     <div id="indResArea" style="margin-top:12px"></div>
   </div>`+
  `<div class="panel">
     <h3 class="section-title" style="margin-top:0">Simpan Kompleksitas</h3>
     <div class="form-grid">${selectBulanHTML('kom_p', 'Pilih Periode Bulan')}</div>
     <button class="btn btn-primary" id="runKomBtn" style="margin-top:10px">Simpan Kompleksitas</button>
     <pre id="komRes" style="margin-top:12px">Belum ada aksi.</pre>
   </div>`+
  `<div class="panel">
     <h3 class="section-title" style="margin-top:0">Buat atau Ambil Asesmen</h3>
     <div class="form-grid">${selectBulanHTML('asm_p', 'Pilih Periode Bulan')}</div>
     <button class="btn btn-primary" id="runAsmBtn" style="margin-top:10px">Ambil Asesmen</button>
     <pre id="asmRes" style="margin-top:12px">Belum ada aksi.</pre>
   </div>`+
  `<div class="panel"><h3 class="section-title" style="margin-top:0">Input Skor Detail Per Indikator</h3><p class="muted" style="margin-bottom:12px">Masukkan nilai skor (0 sampai 4) serta catatan penilaian pengawas.</p><div class="form-grid">
     <div class="field"><label>ID Asesmen</label><input id="d_asm_id" placeholder="ID Asesmen"></div>
     <div class="field"><label>ID Indikator</label><input id="d_asm_ind" placeholder="ID Indikator"></div>
     <div class="field"><label>Status Berlaku</label><input id="d_asm_status" value="BERLAKU" placeholder="BERLAKU / N/A"></div>
     <div class="field"><label>Skor Penilaian (0 - 4)</label><input id="d_asm_skor" type="number" min="0" max="4" placeholder="0 - 4"></div>
     <div class="field full-col"><label>Catatan Pengawas</label><textarea id="d_asm_catatan" rows="2" placeholder="Tuliskan catatan kualitatif..."></textarea></div>
   </div><div class="toolbar" style="margin-top:12px"><button class="btn btn-primary" id="saveDetailAsesmenBtn">Simpan Skor Indikator</button><button class="btn btn-light" id="clearAsmRes">Bersihkan</button></div><pre id="d_asm_res" style="margin-top:12px">Belum ada data skor.</pre></div>`+
  actionPanel('finalisasiAsesmen',[{id:'idAsesmen',label:'ID Asesmen yang ingin difinalisasi'}]);

  $('#runIndBtn').onclick = async () => {
    const p = $('#ind_p').value;
    const area = $('#indResArea');
    area.innerHTML = '<p class="muted">Menghitung indikator...</p>';
    try {
      const res = await api('hitungIndikatorDariTemuan', {idPeriode: p});
      const list = res.data || [];
      if(!list.length){ area.innerHTML = `<div class="message ok">Tidak ada indikator.</div>`; return; }
      let html = `<div class="table-wrap"><table class="friendly-table"><thead><tr><th>KODE INDIKATOR</th><th>NAMA INDIKATOR</th><th>BOBOT</th><th>SKOR</th><th>JUMLAH TEMUAN</th></tr></thead><tbody>`;
      list.forEach(i => {
        html += `<tr><td><b>${esc(i.kode_indikator)}</b></td><td>${esc(i.nama_indikator)}</td><td>${esc(i.bobot)}</td><td><b>${esc(i.skor)}</b></td><td>${esc(i.jumlah_temuan)}</td></tr>`;
      });
      html += `</tbody></table></div>`;
      area.innerHTML = html;
    } catch(e) { area.innerHTML = `<div class="message error">${esc(e.message)}</div>`; }
  };

  $('#runKomBtn').onclick = async () => {
    const p = $('#kom_p').value;
    $('#komRes').textContent = 'Menyimpan kompleksitas...';
    try {
      const r = await api('simpanKompleksitas', {idPeriode: p});
      $('#komRes').textContent = JSON.stringify(r, null, 2);
    } catch(e) { $('#komRes').textContent = e.message; }
  };

  $('#runAsmBtn').onclick = async () => {
    const p = $('#asm_p').value;
    $('#asmRes').textContent = 'Mengambil asesmen...';
    try {
      const r = await api('buatAtauAmbilAsesmen', {idPeriode: p});
      $('#asmRes').textContent = JSON.stringify(r, null, 2);
    } catch(e) { $('#asmRes').textContent = e.message; }
  };

  $('#saveDetailAsesmenBtn').onclick=async()=>{
    const payload={id_asesmen:$('#d_asm_id').value,id_indikator:$('#d_asm_ind').value,status_berlaku:$('#d_asm_status').value,skor:$('#d_asm_skor').value,catatan_pengawas:$('#d_asm_catatan').value};
    $('#d_asm_res').textContent='Menyimpan nilai...';
    try{const r=await api('simpanDetailAsesmen',{data:payload});$('#d_asm_res').textContent=JSON.stringify(r,null,2)}catch(e){$('#d_asm_res').textContent=e.message}
  };
  $('#clearAsmRes').onclick=()=>$('#d_asm_res').textContent='Belum ada data skor.';
}
