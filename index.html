<!-- SheetJS untuk membaca file Excel BKU secara lokal -->
<script>
// SheetJS dimuat hanya saat fitur Excel benar-benar dipakai agar startup lebih ringan.
let _xlsxLoaderPromise = null;
function ensureXlsxLib(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xlsxLoaderPromise) return _xlsxLoaderPromise;
  _xlsxLoaderPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.async = true;
    s.onload = () => resolve(window.XLSX);
    s.onerror = () => { _xlsxLoaderPromise = null; reject(new Error('Library Excel gagal dimuat. Periksa koneksi internet.')); };
    document.head.appendChild(s);
  });
  return _xlsxLoaderPromise;
}
</script>

/* ================= LOADING / WELCOME ================= */
/* FINAL28: loading sederhana, independen dari logo. */
@keyframes simpleSpin{

}
@keyframes simpleDots{

}
.loading-container{

}
.loading-spinner{

}
.loading-text{

}
.loading-indeterminate-track{

}

  width:35%;

  animation:loadingIndeterminate 1.15s ease-in-out infinite;
  will-change:left;
}
@keyframes loadingIndeterminate{
  0%{left:-35%}
  55%{left:100%}
  100%{left:100%}
}
.loading-steps{
  width:min(390px,88vw);
  margin-top:8px;

  font-size:.76rem;
  line-height:1.75;
  color:var(--muted);
}
.loading-steps .active{color:var(--green);font-weight:750}
.loading-steps .done{color:var(--green)}
/* Global Loading B+E: bidangsd.png + cahaya berjalan + ring progress.
   Catatan: blok .welcome-overlay di bawahnya TIDAK DIUBAH. */
@keyframes loadingBreathe{
  0%,100%{transform:scale(.965);opacity:.92}
  50%{transform:scale(1.035);opacity:1}
}
@keyframes loadingOrbit{
  to{transform:rotate(360deg)}
}
@keyframes loadingSweep{
  to{transform:rotate(360deg)}
}
@keyframes loadingHalo{
  0%,100%{transform:scale(.88);opacity:.28}
  50%{transform:scale(1.06);opacity:.62}
}
.loading-container{
  --loading-progress:0%;
  position:relative;
  min-height:210px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 20px;gap:9px;
  overflow:hidden;
}
.loading-visual{
  position:relative;width:132px;height:132px;
  display:grid;place-items:center;
}
.loading-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from -90deg,var(--green) var(--loading-progress),#e7ece8 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  filter:drop-shadow(0 4px 10px rgba(8,127,91,.12));
  transition:none;
}
.loading-halo{
  position:absolute;width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle,rgba(8,127,91,.18),rgba(8,127,91,.05) 52%,transparent 72%);

}
.loading-logo{

  background:#fff;border-radius:17px;padding:7px;
  box-shadow:0 8px 24px rgba(8,127,91,.15);

}
.loading-sweep{
  position:absolute;inset:7px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:rgba(8,127,91,.48);
  border-right-color:rgba(8,127,91,.10);
  animation:loadingSweep 2.4s linear infinite;
}

  position:absolute;left:calc(50% - 5px);top:calc(50% - 5px);

function groupBelanjaClient(list, amountField, contextFields=[]) {
  const map = new Map();
  (list || []).forEach(x => {
    const ctx = contextFields.map(k => String(x[k] ?? '')).join('|');
    const groupCode = String(x.kode_kelompok_belanja || x.kode_rekening || 'LAINNYA').trim();
    // Jika backend sudah menemukan referensi exact, nama referensi menjadi label utama.
    // Ini hanya memengaruhi label kelompok; pagu/subtotal tetap dihitung dari amountField.
    const groupName = String(x.nama_referensi || x.nama_kelompok_belanja || 'Belanja Belum Terpetakan').trim();
    const key = [ctx, groupCode, groupName].join('||');
    if (!map.has(key)) map.set(key, {
      context: contextFields.reduce((o,k)=>{o[k]=x[k]??'';return o;},{}),
      kode_kelompok_belanja: groupCode,
      nama_kelompok_belanja: groupName,
      items: [], subtotal: 0
    });
    const g = map.get(key);
    g.items.push(x);
    g.subtotal += Number(x[amountField] || 0);
  });
  const groups = Array.from(map.values()).sort((a,b)=>{
    const ca = contextFields.map(k=>String(a.context[k]||'')).join('|');
    const cb = contextFields.map(k=>String(b.context[k]||'')).join('|');
    return ca.localeCompare(cb) || String(a.kode_kelompok_belanja).localeCompare(String(b.kode_kelompok_belanja), undefined, {numeric:true});
  });
  groups.forEach(g => {
    g.items.sort((a,b) =>
      String(a.kode_rekening || '').localeCompare(String(b.kode_rekening || ''), undefined, {numeric:true}) ||
      String(a.uraian || a.uraian_transaksi || '').localeCompare(String(b.uraian || b.uraian_transaksi || ''))
    );
  });
  return groups;
}

}

function groupRkasAccountClient(list, contextFields=[]){
  const map=new Map();
  (list||[]).forEach(x=>{
    const ctx=contextFields.map(k=>String(x[k]??'')).join('|');
    const code=String(x.kode_rekening||'TANPA_KODE').trim();
    const key=[ctx,code].join('||');
    if(!map.has(key))map.set(key,{
      context:contextFields.reduce((o,k)=>{o[k]=x[k]??'';return o;},{}),
      kode_rekening:code,
      items:[],
      subtotal_pagu:0,
      subtotal_realisasi:0,
      subtotal_sisa:0,
      candidate_names:new Set()
    });
    const g=map.get(key);
    g.items.push(x);
    g.subtotal_pagu+=Number(x.pagu||0);
    g.subtotal_realisasi+=Number(x.total_realisasi||0);
    g.subtotal_sisa+=Number(x.sisa_pagu||0);
    const nm=String(x.nama_kelompok_belanja||'').trim();
    if(nm&&nm!==String(x.uraian||'').trim())g.candidate_names.add(nm);
  });
  const groups=Array.from(map.values());
  groups.forEach(g=>{
    const names=Array.from(g.candidate_names);
    g.nama_kelompok=names.length===1?names[0]:'Kelompok Belanja';
    g.items.sort((a,b)=>String(a.uraian||'').localeCompare(String(b.uraian||''),'id'));
    delete g.candidate_names;
  });
  return groups.sort((a,b)=>{
    const ca=contextFields.map(k=>String(a.context[k]||'')).join('|');
    const cb=contextFields.map(k=>String(b.context[k]||'')).join('|');
    return ca.localeCompare(cb)||String(a.kode_rekening).localeCompare(String(b.kode_rekening),undefined,{numeric:true});
  });
}

function normalizeNpsnClient(v){
  const s = String(v ?? '').trim();
  if(!s) return '';
  return /^\d+\.0+$/.test(s) ? s.replace(/\.0+$/, '') : s;
}
function groupBelanjaBySekolahClient(list, amountField){
  const map = new Map();
  (list || []).forEach(x => {
    const npsn = normalizeNpsnClient(x.npsn);
    const key = npsn || 'TANPA_NPSN';
    if(!map.has(key)) map.set(key, {
      npsn: npsn || '-',
      nama_sekolah: String(x.nama_sekolah || '').trim(),
      kecamatan: String(x.kecamatan || '').trim(),
      alamat_lengkap: String(x.alamat_lengkap || '').trim(),
      items: [],
      total: 0
    });
    const g = map.get(key);
    // Jika baris berikutnya membawa identitas sekolah yang lebih lengkap,
    // gunakan nilai tersebut.
    if(!g.nama_sekolah && x.nama_sekolah) g.nama_sekolah = String(x.nama_sekolah).trim();
    if(!g.kecamatan && x.kecamatan) g.kecamatan = String(x.kecamatan).trim();
    if(!g.alamat_lengkap && x.alamat_lengkap) g.alamat_lengkap = String(x.alamat_lengkap).trim();
    g.items.push(x);
    g.total += Number(x[amountField] || 0);
  });

  return Array.from(map.values()).sort((a,b)=>{
    const an = normalizeNpsnClient(a.npsn);
    const bn = normalizeNpsnClient(b.npsn);
    if(!an && bn) return 1;
    if(an && !bn) return -1;
    if(/^\d+$/.test(an) && /^\d+$/.test(bn)) return Number(an) - Number(bn);
    return an.localeCompare(bn);
  });
}

async function api(action, payload={}){
  const body = { action, ...payload };
  if(state.token) body.token = state.token;

  let response;
  try{
    response = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body),
      redirect:'follow'
    });
  }catch(networkErr){
    const err=new Error(
      'Backend SIMPEL SPJ tidak dapat dijangkau (Failed to fetch). '+
      'Periksa URL deployment /exec, status deployment Apps Script, dan hak akses Web App.'
    );
    err.code='NETWORK_FETCH_FAILED';
    err.apiUrl=API_URL;
    err.original=networkErr;
    throw err;
  }

  if(!response.ok) throw new Error(`Server HTTP ${response.status} — ${API_URL}`);

  let data;
  try{
    data=await response.json();
  }catch(parseErr){
    throw new Error('Server dapat dijangkau tetapi respons bukan JSON. Pastikan URL yang digunakan adalah URL Web App /exec terbaru.');
  }

  if(!data.success) throw new Error(data.message || 'Permintaan gagal.');
  return data;
}
async function safeApi(action,payload={},fallback=null){ try{return await api(action,payload);}catch(e){ console.error('[SIMPEL SPJ API]',action,e); if(fallback && typeof fallback==='object' && !Array.isArray(fallback)) return Object.assign({},fallback,{_error:e.message||String(e)}); return fallback; } }

function generateMathCaptcha(){
  // CAPTCHA tetap mudah dihitung manusia, tetapi tidak lagi selalu penjumlahan.
  // Pembagian dibuat selalu menghasilkan bilangan bulat; pengurangan dibuat tidak negatif.
  const op=['+','-','×','÷'][Math.floor(Math.random()*4)];
  let a,b,answer;
  if(op==='+'){
    a=Math.floor(Math.random()*18)+4;
    b=Math.floor(Math.random()*12)+2;
    answer=a+b;
  }else if(op==='-'){
    a=Math.floor(Math.random()*18)+8;
    b=Math.floor(Math.random()*Math.min(12,a-1))+1;
    answer=a-b;
  }else if(op==='×'){
    a=Math.floor(Math.random()*9)+2;
    b=Math.floor(Math.random()*8)+2;
    answer=a*b;
  }else{
    b=Math.floor(Math.random()*7)+2;
    const hasil=Math.floor(Math.random()*8)+2;
    a=b*hasil;
    answer=hasil;
  }
  state.captchaAns=answer;
  state.captchaQuestion=`Geser tombol untuk verifikasi keamanan`;
  return state.captchaQuestion;
}

window.loadPublicRegistrationWindow = async function(){
  const box=$('#registrationWindowInfo');
  if(!box) return;
  const roleVal=$('#regRole')?.value||'SEKOLAH';
  const npsn=roleVal==='SEKOLAH'?($('#regNpsn')?.value||'').trim():'';
  const nip=roleVal==='PENGAWAS'?($('#regNip')?.value||'').trim():'';
  const submitBtn=document.querySelector('#registerForm button[type="submit"]');
  if(submitBtn){
    submitBtn.disabled=true;
    submitBtn.dataset.scheduleLocked='1';
    submitBtn.textContent='Memeriksa Jadwal...';
  }
  box.innerHTML='<div class="workflow-reg-chip">Memeriksa jadwal pendaftaran...</div>';
  try{
    const r=await api('getPublicRegistrationWindow',{role:roleVal,npsn:npsn,nip:nip});
    const d=r?.data||{};
    const meta=workflowPhaseMeta(d.phase);
    const row=d.row||{};
    let dateText='DINAS belum menetapkan jadwal pendaftaran.';
    if(row.mulai_utama){
      dateText=`${fmtWorkflowDate(row.mulai_utama)} – ${fmtWorkflowDate(row.selesai_utama)}${row.selesai_toleransi?` · toleransi s.d. ${fmtWorkflowDate(row.selesai_toleransi)}`:''}`;
    }
    if(d.phase==='PENDAFTARAN_SELESAI') {
      dateText='Pendaftaran telah dinyatakan selesai oleh DINAS.';
    } else if(d.phase==='PERLU_IDENTITAS') {
      dateText=d.identity_message || (roleVal==='SEKOLAH'?'Masukkan NPSN untuk memeriksa jadwal pendaftaran.':'Masukkan NIP untuk memeriksa jadwal pendaftaran.');
    } else if(d.phase==='BELUM_DIJADWALKAN') {
      if(d.source==='REGISTRATION_NOT_SCHEDULED') {
        dateText=`DINAS belum menetapkan jadwal pendaftaran ${roleVal==='SEKOLAH'?'Sekolah':'Pengawas'}.`;
      } else {
        dateText=roleVal==='SEKOLAH'
          ? 'Jadwal pendaftaran ada, tetapi belum berlaku untuk NPSN ini.'
          : 'Jadwal pendaftaran ada, tetapi belum berlaku untuk NIP ini.';
      }
    }
    box.innerHTML=`<div class="workflow-reg-chip ${meta.cls}"><b>${esc(meta.label)}</b><span>${esc(dateText)}</span></div>`;
    if(submitBtn){
      const allowed=!!d.allowed;
      submitBtn.disabled=!allowed;
      submitBtn.dataset.scheduleLocked=allowed?'0':'1';
      if(allowed) submitBtn.textContent='Daftarkan Akun Sekarang';
      else if(d.phase==='PERLU_IDENTITAS') submitBtn.textContent=roleVal==='SEKOLAH'?'Masukkan NPSN untuk Cek Jadwal':'Masukkan NIP untuk Cek Jadwal';

let _sessionHeartbeatTimer = null;
let _lastUserActivityAt = Date.now();
let _sessionHeartbeatBusy = false;

function noteUserActivity(){
  _lastUserActivityAt = Date.now();
}
['click','keydown','pointerdown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,noteUserActivity,{passive:true}));

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') noteUserActivity();
});

function stopSessionHeartbeat(){
  if(_sessionHeartbeatTimer){ clearInterval(_sessionHeartbeatTimer); _sessionHeartbeatTimer=null; }
}

function startSessionHeartbeat(){
  stopSessionHeartbeat();
  if(!state.token) return;
  _sessionHeartbeatTimer=setInterval(async()=>{
    if(!state.token || document.visibilityState==='hidden' || _sessionHeartbeatBusy) return;
    // Heartbeat hanya dikirim jika user benar-benar aktif dalam 20 menit terakhir.
    if(Date.now()-_lastUserActivityAt > 20*60*1000) return;
    _sessionHeartbeatBusy=true;
    try{
      const r=await api('refreshSession');
      if(r?.data) state.user = Object.assign({},state.user||{},r.data);
    }catch(e){
      stopSessionHeartbeat();
      state.token=''; state.user=null;
      sessionStorage.removeItem('simpel_token');
      authView(msg(errorText(e),'warning'));
    }finally{ _sessionHeartbeatBusy=false; }
  }, 10*60*1000);
}

async function restoreSession(){
  if(!state.token){authView();return;}
  try{
    const r=await api('getSession');
    if(!r.data) throw new Error('Sesi berakhir.');
    state.user=r.data;
    // Kompatibilitas akun sekolah lama: bila backend belum mengirim field npsn,
    // username 8 digit dapat dipakai sebagai NPSN.
    if(isSchool() && !state.user.npsn && /^\\d{8}$/.test(String(state.user.username||''))){
      state.user.npsn = String(state.user.username);
    }
    await startApp();
    startSessionHeartbeat();
  }catch(e){state.token=''; state.user=null; sessionStorage.removeItem('simpel_token'); authView();}
}

async function logout(){
  stopSessionHeartbeat();
  try{if(state.token) await api('logout');}catch(e){}
  invalidateRkasFrontendCaches();
  resetViewNavigationState();
  state.token=''; state.user=null; sessionStorage.removeItem('simpel_token'); authView(msg('Anda telah keluar dari aplikasi.','ok'));
}

async function startApp(){
  document.body.style.background='var(--bg)';

  // Setiap login/re-login harus memulai router dari state bersih.
  // Ini mencegah lock navigasi dari sesi/role sebelumnya.
  resetViewNavigationState();

}

async function runGlobalSearch(q){
  const box = $('#globalSearchResults'), input = $('#globalSearchInput');
  if(!box || !input) return;
  q = String(q || '').trim();
  if(q.length < 2){
    window._globalSearchRows = [];
    box.classList.add('hidden');
    box.innerHTML='';
    return;
  }
  box.classList.remove('hidden');
  box.innerHTML = loading('Mencari...');
  try{
    const res = await api('cariGlobalSIMPEL',{q});
    const rows = Array.isArray(res.data) ? res.data : [];
    window._globalSearchRows = rows;
    if(!rows.length){
      box.innerHTML='<div class="search-empty">Tidak ditemukan. Coba nama lengkap, nama sekolah, NPSN, atau kata kunci lain.</div>';
      return;
    }

    box.innerHTML = rows.map((x,i)=>{
      const icon = x.tipe === 'PENGGUNA' ? '👤' : '🏫';
      const roleText = x.tipe === 'PENGGUNA' ? 'Buka informasi pengguna' : 'Buka konteks sekolah';
      return `<button type="button" class="search-result" data-search-index="${i}" aria-label="${esc(roleText)}">
        <span class="search-result-icon">${icon}</span>
        <span class="search-result-main"><strong>${esc(x.nama || x.username || '-')}</strong><small>${esc(x.sub || x.npsn || '')}</small></span>
        <span class="muted">›</span>
      </button>`;
    }).join('');

    $$('#globalSearchResults [data-search-index]').forEach(el=>{
      el.addEventListener('click', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        window.openGlobalSearchResult(Number(this.dataset.searchIndex));
      });
    });
  }catch(e){
    window._globalSearchRows = [];
    box.innerHTML = `<div class="search-empty">${esc(errorText(e) || 'Pencarian belum dapat digunakan. Silakan coba lagi.')}</div>`;
  }
}

function initGlobalSearch(){
  const input = $('#globalSearchInput'), box = $('#globalSearchResults');
  if(!input) return;
  input.oninput = () => {
    clearTimeout(_globalSearchTimer);
    _globalSearchTimer=setTimeout(()=>runGlobalSearch(input.value),280);
  };
  input.onkeydown = e => {
    if(e.key==='Escape'){
      input.value='';
      box?.classList.add('hidden');
      input.blur();
    }
    if(e.key==='Enter'){
      const first = box?.querySelector('[data-search-index="0"]');
      if(first){
        e.preventDefault();
        first.click();
      }
    }
  };
  document.addEventListener('click', e => {
    const host=$('#globalSearchBox');
    if(host && !host.contains(e.target)) box?.classList.add('hidden');
  });
  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k'){
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
}

let _viewNavRunning = false;
let _viewNavPending = null;

function loadView(view){
  return new Promise(resolve => {
    // Jika user mengklik beberapa submenu dengan cepat, hanya permintaan terakhir
    // yang dipertahankan. Permintaan sebelumnya tidak dibiarkan menimpa feed baru.
    if(_viewNavPending) _viewNavPending.resolve();
    _viewNavPending = { view, resolve };
    runViewNavigationQueue();
  });
}

function resetViewNavigationState(){
  try{
    if(_viewNavPending && typeof _viewNavPending.resolve === 'function') _viewNavPending.resolve();
  }catch(e){}
  _viewNavPending = null;
  _viewNavRunning = false;
  window.__SIMPEL_VIEW_TRANSITION_ACTIVE = false;
}

async function runViewNavigationQueue(){
  // Satu worker saja. Klik berikutnya cukup mengganti _viewNavPending;
  // jangan gunakan transition flag sebagai early-return global karena flag
  // tersebut harus selalu dilepas setelah render selesai.
  if(_viewNavRunning) return;

  _viewNavRunning = true;
  window.__SIMPEL_VIEW_TRANSITION_ACTIVE = true;

  try{
    while(_viewNavPending){
      const job = _viewNavPending;
      _viewNavPending = null;
      try{
        if(typeof window.applyRoleThemeV213 === 'function') window.applyRoleThemeV213();
        await renderViewSafely(job.view);
        if(typeof window.applyRoleThemeV213 === 'function') window.applyRoleThemeV213();
      }finally{
        job.resolve();
      }
    }
  }finally{
    _viewNavRunning = false;
    window.__SIMPEL_VIEW_TRANSITION_ACTIVE = false;

    // Jika ada permintaan yang tiba tepat di sela pelepasan worker,
    // jalankan worker baru pada microtask berikutnya.
    if(_viewNavPending){
      Promise.resolve().then(runViewNavigationQueue);
    }
  }
}

async function renderViewSafely(view){
  const c = $('#mainContent');
  if(!c) return;

  // RKAS management is strictly scoped to the RKAS sub-menu.
  // Never leave its menu/modal attached when navigating to Beranda or another module.
  if(view !== 'rkasReview'){
    document.querySelector('#rkasReplaceModal')?.remove();
    document.querySelector('#rkasManageMenu')?.remove();
  }

  state.view = view;
  setActive(view);

  // Tutup feed lama dengan shield, bukan menggantinya langsung dengan HTML baru.
  // Ini mencegah pengguna melihat data submenu sebelumnya saat modul berganti.
  const shield = document.createElement('div');
  shield.className = 'view-transition-shield';
  shield.innerHTML = `<div class="view-transition-card">${loading('Memuat modul...')}</div>`;
  c.appendChild(shield);

  const map = {
    home: homeView,
    jadwalTahapan: jadwalTahapanView,
    manajemenUser: manajemenUserView,
    dokumenBulanan: dokumenBulananView,
    statusSpj: statusSpjView,
    statusSekolah: statusSekolahView,
    transaksi: transaksiView,
    sekolah: sekolahView,
    penugasan: penugasanView,
    dinasMonitoring: dinasMonitoringView,
    rkasReview: rkasReview,
    masterSpj: masterSpjView,
    crosscheck: crosscheckView,
    temuan: temuanView,
    asesmen: isDinas() ? penilaianFase1View : (isPengawas() ? verifikasiUlangView : hasilPenilaianView),
    kesepakatan: isDinas() ? finalisasiSpjView : hasilPenilaianView,
    keberatan: isSchool() ? perbaikanSpjView : verifikasiUlangView,
    dbCheck: dbCheckView,
    pesan: pesanView,
    monitoringGlobal: renderMonitoringGlobalView,
    penilaianFase1: penilaianFase1View,
    rekonsiliasi: rekonsiliasiView,
    penilaianFase2: penilaianFase2View,
    finalisasiSpj: finalisasiSpjView,
    verifikasiUlang: verifikasiUlangView,
    perbaikanSpj: perbaikanSpjView,
    hasilPenilaian: hasilPenilaianView,
    tutorialV5: (typeof tutorialV5View === 'function') ? tutorialV5View : null,
    arsipPenilaianV5: (typeof arsipPenilaianV5View === 'function') ? arsipPenilaianV5View : null,
    pdfInteraktif: (typeof pdfInteraktifView === 'function') ? pdfInteraktifView : null,
    ubahPassword: (typeof ubahPasswordView === 'function') ? ubahPasswordView : null,

    // SIMPEL SPJ workflow alignment
    bkuData: (typeof bkuDataView === 'function') ? bkuDataView : null,
    bkuDocument: (typeof bkuDocumentView === 'function') ? bkuDocumentView : null,
    bkuReconciliation: (typeof bkuReconciliationView === 'function') ? bkuReconciliationView : null
  };

  try{
    if(typeof map[view] !== 'function'){
      throw new Error('Modul belum tersedia: ' + view);
    }
    const moduleTimeoutMs = 45000;
    await Promise.race([
      map[view](),
      new Promise((_, reject) =>
        setTimeout(
          () => reject(new Error('Modul belum selesai dimuat setelah 45 detik. Periksa koneksi/backend lalu coba kembali.')),
          moduleTimeoutMs
        )
      )
    ]);
  }catch(e){
    // Hanya tampilkan error bila modul yang gagal masih merupakan modul aktif.
    if(state.view === view) c.innerHTML = msg(errorText(e));
  }finally{
    // Jika user sudah meminta submenu lain saat modul ini sedang dimuat,
    // shield tetap menutup tampilan sampai modul terbaru selesai.
    if(state.view === view && shield.parentNode === c){
      shield.classList.add('fade-out');
      setTimeout(() => shield.remove(), 300);
    }else if(shield.parentNode === c){
      shield.remove();
    }
  }

  if(typeof window.afterViewRenderV237 === 'function') {
    window.afterViewRenderV237(view, c);
  }
}

async function initV11TutorialFeed(){
  const rawUrl='https://raw.githubusercontent.com/DikporaRembang/simpelspj/main/tutorial_simpelspj.pdf';
  if(!window.pdfjsLib){
    await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Library PDF gagal dimuat.'));document.head.appendChild(sc);});
  }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await window.pdfjsLib.getDocument({url:rawUrl,withCredentials:false}).promise;
  let pageNo=1, zoom=1;
  const wrap=$('#v11PdfCanvasWrap'), info=$('#v11PdfPageInfo'), zi=$('#v11PdfZoomInfo');
  if(!wrap)return;
  async function render(){
    wrap.innerHTML=loading(`Memuat halaman ${pageNo} dari ${pdf.numPages}...`);
    const page=await pdf.getPage(pageNo), base=page.getViewport({scale:1});
    const maxWidth=Math.max(300,Math.min(wrap.clientWidth-36,980));
    const fit=Math.min(maxWidth/base.width,1.5), vp=page.getViewport({scale:fit*zoom});
    const canvas=document.createElement('canvas'); canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);canvas.className='v11-pdf-page';
    wrap.innerHTML='';wrap.appendChild(canvas);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    info.textContent=`Halaman ${pageNo} dari ${pdf.numPages}`;zi.textContent=`${Math.round(zoom*100)}%`;
    $('#v11PdfPrev').disabled=pageNo<=1;$('#v11PdfNext').disabled=pageNo>=pdf.numPages;
  }
  $('#v11PdfPrev').onclick=()=>{if(pageNo>1){pageNo--;render();}};
  $('#v11PdfNext').onclick=()=>{if(pageNo<pdf.numPages){pageNo++;render();}};
  $('#v11PdfZoomOut').onclick=()=>{zoom=Math.max(.75,zoom-.1);render();};
  $('#v11PdfZoomIn').onclick=()=>{zoom=Math.min(1.8,zoom+.1);render();};
  await render();
}

async function periodeSelect(id = 'periodeSelect', required = true, defaultMode = 'bulan') {
  const cfg = await ensurePaketPemeriksaan().catch(()=>null);
  const res = cfg ? {data:cfg.periode||[],frekuensi:cfg.frekuensi||'',tahun:cfg.tahun} : await safeApi('getPeriodeSPJ', {}, {data:[],frekuensi:'',tahun:new Date().getFullYear()});
  cachedPeriodeList = Array.isArray(res?.data) ? res.data : [];
  const configuredFrequency = String(res?.frekuensi || '').toUpperCase();
  const configuredYear = Number(res?.tahun || new Date().getFullYear());
  const periods = cachedPeriodeList.filter(p =>
    Number(p.tahun) === configuredYear &&
    (!configuredFrequency || String(p.frekuensi || '').toUpperCase() === configuredFrequency)
  );
  const label = configuredFrequency === 'BULANAN' ? 'Bulanan' : configuredFrequency === 'TRIWULANAN' ? 'Triwulanan' : configuredFrequency === 'SEMESTERAN' ? 'Semesteran' : 'Belum dikonfigurasi';
  const optionsHtml = periods.map(p => `<option value="${esc(p.id_periode)}">${esc(p.nama_periode || p.id_periode)}</option>`).join('');
  return `
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <span class="badge badge-info">Frekuensi: ${esc(label)}</span>

}

function _v222MasterText_(m){
  return upper((m?.nama_spj||'')+' '+(m?.nama_dokumen||'')+' '+(m?.kode_spj||'')+' '+(m?.kode||''));
}

function _v222EvidenceProfile_(m, summaries){
  const s=_v222MasterText_(m);
  const targets=summaries?.evidence_targets||{};

  if(/BUKU KAS UMUM|\bBKU\b/.test(s))return {kind:'book',book:'bku',title:'Buku Kas Umum'};
  if(/BUKU PEMBANTU BANK|BUKU BANK/.test(s))return {kind:'book',book:'bank',title:'Buku Pembantu Bank'};
  if(/BUKU PEMBANTU KAS TUNAI|BUKU KAS TUNAI|KAS TUNAI/.test(s))return {kind:'book',book:'cash',title:'Buku Pembantu Kas Tunai'};
  if(/BUKU PEMBANTU PAJAK|BUKU PAJAK/.test(s))return {kind:'book',book:'tax',title:'Buku Pembantu Pajak'};

  if(/REKENING KORAN/.test(s)){
    return {kind:'inout',target:targets.rekening_koran_bank||{},source:'Buku Pembantu Kas Tunai',title:'Acuan Rekening Koran Bank'};
  }
  if(/INVOICE|NOTA|KUITANSI|KWITANSI/.test(s)){
    return {kind:'outflow',target:targets.invoice_nota_kuitansi||{},source:'Buku Pembantu Kas Tunai',title:'Nilai belanja yang perlu didukung',coverage:true};
  }
  if(/BUKTI PENDUKUNG LAIN/.test(s)){
    return {kind:'outflow',target:targets.bukti_pendukung_lainnya||{},source:'Buku Pembantu Kas Tunai',title:'Nilai belanja yang perlu didukung',coverage:true};
  }
  if(/SSP.*PAJAK.*PUSAT|SSP PAJAK PUSAT|PAJAK PUSAT/.test(s)){
    return {kind:'outflow',target:targets.ssp_pajak_pusat||{},source:'Buku Pembantu Pajak',title:'Setoran pajak pusat yang perlu dibuktikan',allowNA:false,tax:true};
  }
  if(/SSP.*PAJAK.*DAERAH|SSP PAJAK DAERAH|PAJAK DAERAH/.test(s)){
    const t=targets.ssp_pajak_daerah||{};
    return {kind:'manual_optional',target:t,source:'Buku Pembantu Pajak',title:'SSP Pajak Daerah',allowNA:t.allow_na===true};
  }
  if(/FOTO|DOKUMENTASI/.test(s)){
    return {kind:'outflow',target:targets.foto_dokumentasi||{},source:'Buku Pembantu Kas Tunai',title:'Belanja yang didukung dokumentasi',coverage:true};
  }
  return {kind:'none'};
}

function _v222AllowNa_(m,summaries){
  const p=_v222EvidenceProfile_(m,summaries);
  return p.kind==='manual_optional' && p.allowNA===true;
}

function _v222LegacyNaMustBeIgnored_(m,d,summaries){
  const p=_v222EvidenceProfile_(m,summaries);
  return p.tax===true && upper(d?.status||'')==='N/A';
}

async function renderDokumenTable(){
  const periode = $('#periodeSelect')?.value || state.selectedPeriode;
  const area = $('#dokumenArea');
  if(!area) return;
  if(!periode){
    area.innerHTML = msg('Pilih periode SPJ terlebih dahulu.', 'ok');
    return;
  }
  area.innerHTML = loading();

  try{
    // OPTIMASI: Gunakan ensureMasters() agar data master diambil dari state lokal browser
    // jika sudah ada, sehingga tidak melakukan request berulang ke server.
    await ensureMasters();
    
    // Dokumen dan ringkasan empat buku utama diambil paralel.
    // Summary ini ringan dan hanya membawa total hasil Excel BKU, bukan seluruh transaksi.
    const summaryNpsn = isSchool() ? (state.user?.npsn || state.user?.username || '') : (state.selectedNpsn || '');
    const [dRes, bookSummaryRes] = await Promise.all([
      api('getDokumenSPJ', { idPeriode: periode, npsn: summaryNpsn }),
      safeApi('getBkuBookSummaries', { idPeriode: periode, npsn: summaryNpsn }, {ready:false})
    ]);
    const bookSummaries = bookSummaryRes || {ready:false};

    const masters = (state.masterSpj || [])
      .filter(x => String(x.status_aktif ?? x.status ?? 'AKTIF').toUpperCase() === 'AKTIF')
      .sort((a,b) => (Number(a.urutan)||0) - (Number(b.urutan)||0));

    const docs = dRes.data || [];
    const groups = masters.map(m => {
      let d=docs
        .filter(x => String(x.id_spj) === String(m.id_spj) && String(x.status||'').toUpperCase() !== 'NONAKTIF')
        .sort((a,b)=>(Number(b.versi)||0)-(Number(a.versi)||0))[0];
      // SSP Pajak Pusat lama yang pernah ditandai N/A dianggap belum upload.
      if(_v222LegacyNaMustBeIgnored_(m,d,bookSummaries)) d=null;
      return {m,d};
    });

    const uploaded = groups.filter(x => x.d && String(x.d.status||'').toUpperCase() !== 'N/A').length;
    const na = groups.filter(x => String(x.d?.status||'').toUpperCase() === 'N/A').length;
    const total = groups.length;
    const done = uploaded + na;
    const pct = total ? Math.round(done / total * 100) : 0;

    const missingGroups = groups.filter(x => !x.d);

      </div>

        <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">

            <div class="muted">PDF digunakan untuk membuktikan atau menyandingkan nilai tersebut; PDF tidak membentuk transaksi baru.</div>
          </div>
          <div style="text-align:right"><strong>${done}/${total}</strong><div class="muted">komponen tersedia</div></div>

window.__instrumentPdfState = window.__instrumentPdfState || null;

window.renderInstrumentPdfPage = async function(pageNo){
  const st=window.__instrumentPdfState;
  if(!st || !st.pdf || !st.wrap) return;
  const p=Math.max(1,Math.min(Number(st.pdf.numPages)||1,Number(pageNo)||1));
  st.pageNo=p;
  const stage=st.wrap.querySelector('.instrument-pdf-stage');
  const info=st.wrap.querySelector('.instrument-pdf-page-info');
  const input=st.wrap.querySelector('.instrument-pdf-page-input');
  const prev=st.wrap.querySelector('.instrument-pdf-prev');
  const next=st.wrap.querySelector('.instrument-pdf-next');
  const zoomInfo=st.wrap.querySelector('.instrument-pdf-zoom-info');
  if(input) input.value=String(p);
  if(info) info.textContent=`dari ${st.pdf.numPages}`;
  if(prev) prev.disabled=p<=1;
  if(next) next.disabled=p>=st.pdf.numPages;
  if(zoomInfo) zoomInfo.textContent=`${Math.round(st.zoom*100)}%`;
  if(!stage) return;
  stage.innerHTML=loading(`Memuat halaman ${p} dari ${st.pdf.numPages}...`);
  try{
    const page=await st.pdf.getPage(p);
    const base=page.getViewport({scale:1});
    const available=Math.max(280,Math.min((stage.clientWidth||st.wrap.clientWidth||1000)-28,1080));
    const fitScale=Math.min(available/base.width,1.55);
    const vp=page.getViewport({scale:fitScale*st.zoom});
    const canvas=document.createElement('canvas');
    canvas.className='instrument-pdf-single-canvas';
    canvas.width=Math.ceil(vp.width);
    canvas.height=Math.ceil(vp.height);
    stage.innerHTML='';
    stage.appendChild(canvas);
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  }catch(err){
    stage.innerHTML=msg(`Halaman ${p} tidak dapat ditampilkan: ${errorText(err)}`,'error');
  }
};

window.instrumentPdfGo = async function(delta){
  const st=window.__instrumentPdfState; if(!st) return;
  await renderInstrumentPdfPage(st.pageNo + Number(delta||0));
};
window.instrumentPdfGoInput = async function(input){
  const st=window.__instrumentPdfState; if(!st) return;
  const p=Math.max(1,Math.min(st.pdf.numPages,Number(input?.value)||st.pageNo));
  await renderInstrumentPdfPage(p);
};
window.instrumentPdfZoom = async function(delta){
  const st=window.__instrumentPdfState; if(!st) return;
  st.zoom=Math.max(.65,Math.min(2.2,st.zoom+Number(delta||0)));
  await renderInstrumentPdfPage(st.pageNo);
};
window.instrumentPdfResetZoom = async function(){
  const st=window.__instrumentPdfState; if(!st) return;
  st.zoom=1;
  await renderInstrumentPdfPage(st.pageNo);
};

window.showInstrumentPdf=async function(btn){
  const targetId=btn?.dataset?.target||'';
  const name=btn?.dataset?.pdfName||'Dokumen SPJ';
  const fileId=btn?.closest('.doc-row')?.querySelector('[data-file-id]')?.dataset?.fileId || btn?.dataset?.fileId || '';
  if(!targetId || !fileId){ toast('Berkas PDF tidak memiliki file_id yang valid.','warning'); return; }
  $$('.instrument-pdf-inline').forEach(v=>{ if(v.id!==targetId) v.hidden=true; });
  $$('.instrument-view-pdf-btn').forEach(b=>{ if(b!==btn) b.classList.remove('btn-primary'); });
  const viewer=document.getElementById(targetId); if(!viewer) return;
  const wasHidden=viewer.hidden; viewer.hidden=!wasHidden; btn.textContent=viewer.hidden?'👁️ Lihat':'✕ Tutup';
  if(viewer.hidden){
    if(window.__instrumentPdfState?.viewer===viewer) window.__instrumentPdfState=null;
    return;
  }
  viewer.scrollIntoView({behavior:'smooth',block:'nearest'});
  const wrap=viewer.querySelector('.instrument-pdf-inline-frame');
  if(!wrap) return;

  // Jika PDF ini sudah pernah dimuat, aktifkan kembali state-nya tanpa request ulang.
  if(wrap._pdfDoc){
    window.__instrumentPdfState={viewer,wrap,pdf:wrap._pdfDoc,pageNo:Number(wrap.dataset.page||1),zoom:Number(wrap.dataset.zoom||1)};
    await renderInstrumentPdfPage(window.__instrumentPdfState.pageNo);
    return;
  }

  wrap.innerHTML=loading('Memuat PDF secara aman...');
  try{
    const doc={file_id:fileId,nama_file:name};
    const pdf=await getProtectedPdfDocument_(doc);
    wrap._pdfDoc=pdf;
    wrap.dataset.loaded='1';
    wrap.dataset.page='1';
    wrap.dataset.zoom='1';
    wrap.innerHTML=`
      <div class="instrument-pdf-toolbar v239-pdf-toolbar" role="toolbar" aria-label="Navigasi PDF">
        <div class="v239-pdf-nav" aria-label="Navigasi halaman">
          <button type="button" class="v239-pdf-icon-btn" onclick="renderInstrumentPdfPage(1)" aria-label="Halaman pertama" title="Halaman pertama">⇤</button>
          <button type="button" class="v239-pdf-icon-btn instrument-pdf-prev" onclick="instrumentPdfGo(-1)" aria-label="Halaman sebelumnya" title="Halaman sebelumnya">‹</button>
          <div class="instrument-pdf-page-control v239-pdf-page-pill">
            <span class="v239-pdf-page-label">Hal.</span>
            <input class="instrument-pdf-page-input" type="number" min="1" max="${pdf.numPages}" value="1" inputmode="numeric" aria-label="Nomor halaman" onkeydown="if(event.key==='Enter'){event.preventDefault();instrumentPdfGoInput(this)}" onchange="instrumentPdfGoInput(this)">
            <span class="instrument-pdf-page-info">/ ${pdf.numPages}</span>
          </div>
          <button type="button" class="v239-pdf-icon-btn instrument-pdf-next" onclick="instrumentPdfGo(1)" aria-label="Halaman berikutnya" title="Halaman berikutnya">›</button>
          <button type="button" class="v239-pdf-icon-btn" onclick="renderInstrumentPdfPage(window.__instrumentPdfState?.pdf?.numPages||1)" aria-label="Halaman terakhir" title="Halaman terakhir">⇥</button>
        </div>
        <div class="v239-pdf-toolbar-divider" aria-hidden="true"></div>
        <div class="v239-pdf-zoom" aria-label="Kontrol zoom">
          <button type="button" class="v239-pdf-icon-btn" onclick="instrumentPdfZoom(-.1)" aria-label="Perkecil PDF" title="Perkecil">−</button>
          <button type="button" class="instrument-pdf-zoom-info v239-pdf-zoom-value" onclick="instrumentPdfResetZoom()" title="Reset ke 100%" aria-label="Reset zoom ke 100%">100%</button>
          <button type="button" class="v239-pdf-icon-btn" onclick="instrumentPdfZoom(.1)" aria-label="Perbesar PDF" title="Perbesar">+</button>
        </div>
        <div class="v239-pdf-hint"><span>← → halaman</span><span>•</span><span>+ − zoom</span><span>•</span><span>0 reset</span></div>
      </div>
      <div class="instrument-pdf-stage" tabindex="0" aria-label="Tampilan PDF"></div>`;
    window.__instrumentPdfState={viewer,wrap,pdf,pageNo:1,zoom:1};
    await renderInstrumentPdfPage(1);
    wrap.querySelector('.instrument-pdf-stage')?.focus({preventScroll:true});
  }catch(e){ wrap.innerHTML=msg('PDF tidak dapat ditampilkan: '+errorText(e),'error'); }
};


if(!window.__instrumentPdfKeyboardBound){
  window.__instrumentPdfKeyboardBound=true;
  document.addEventListener('keydown',async function(e){
    const st=window.__instrumentPdfState;
    if(!st || !st.viewer || st.viewer.hidden) return;
    const tag=String(e.target?.tagName||'').toUpperCase();
    const editable=e.target?.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(tag);
    if(editable) return;
    let handled=true;
    if(e.key==='ArrowLeft' || e.key==='PageUp') await instrumentPdfGo(-1);
    else if(e.key==='ArrowRight' || e.key==='PageDown') await instrumentPdfGo(1);
    else if(e.key==='Home') await renderInstrumentPdfPage(1);
    else if(e.key==='End') await renderInstrumentPdfPage(st.pdf.numPages);
    else if(e.key==='+' || e.key==='=') await instrumentPdfZoom(.1);
    else if(e.key==='-' || e.key==='_') await instrumentPdfZoom(-.1);
    else if(e.key==='0') await instrumentPdfResetZoom();
    else handled=false;
    if(handled) e.preventDefault();
  });
}


window.closeInstrumentPdf=function(id){
  const viewer=document.getElementById(id);
  if(!viewer) return;
  const st=window.__instrumentPdfState;
  if(st?.viewer===viewer){
    st.wrap.dataset.page=String(st.pageNo||1);
    st.wrap.dataset.zoom=String(st.zoom||1);
    window.__instrumentPdfState=null;
  }
  viewer.hidden=true;
  const btn=document.querySelector(`.instrument-view-pdf-btn[data-target="${CSS.escape(id)}"]`);
  if(btn) btn.textContent='👁️ Lihat';
};




window.openImportPaketSPJ = function(){
  const periode = $('#periodeSelect')?.value || state.selectedPeriode;
  if(!periode){
    toast('Pilih periode SPJ terlebih dahulu.','warning');
    return;
  }
  const wrap=document.createElement('div');
  wrap.id='modalImportPaket';
  wrap.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px">
    <div style="background:#fff;padding:26px;border-radius:22px;width:min(100%,760px);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.22)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><h3 style="margin:0;color:var(--primary)">Impor Paket SPJ</h3><div class="muted">Pilih beberapa PDF sekaligus. Setiap file dipetakan ke komponen SPJ sebelum diunggah.</div></div>
        <button type="button" class="btn btn-light" onclick="$('#modalImportPaket').remove()">Tutup</button>
      </div>
      <div class="field" style="margin-top:16px"><label>Pilih File PDF</label><input id="paketFiles" type="file" accept=".pdf,application/pdf" multiple></div>
      <div id="paketMap" style="margin-top:12px"></div>
      <div id="paketMsg" style="margin-top:10px"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
        <button type="button" class="btn btn-light" onclick="$('#modalImportPaket').remove()">Batal</button>
        <button type="button" class="btn btn-primary" id="paketUploadBtn" disabled>Impor & Unggah Semua</button>
      </div>
    </div></div>`;
  document.body.appendChild(wrap);

  $('#paketFiles').onchange = async e => {
    const files=Array.from(e.target.files||[]).filter(f=>f.name.toLowerCase().endsWith('.pdf') || f.type==='application/pdf');
    if(!files.length){ $('#paketMap').innerHTML=msg('Tidak ada PDF yang dipilih.'); $('#paketUploadBtn').disabled=true; return; }
    const masters=state.masterSpj.length ? state.masterSpj : (await api('getMasterSPJ')).data||[];
    const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
    const pick=(f)=>{
      const fn=norm(f.name);
      let best=masters.find(m=>fn.includes(norm(m.kode)));
      if(!best) best=masters.find(m=>fn.includes(norm(m.id_spj)));
      if(!best) best=masters.find(m=>norm(m.nama_spj||m.nama_dokumen).split('').length>3 && fn.includes(norm(m.nama_spj||m.nama_dokumen)));
      return best?.id_spj || '';
    };
    $('#paketMap').innerHTML=files.map((f,i)=>`<div class="doc-row" style="margin-bottom:7px">
      <div><strong>${esc(f.name)}</strong><div class="muted">${Math.round(f.size/1024)} KB</div></div>
      <select class="paket-map-select" data-file-index="${i}" style="min-width:260px">
        <option value="">-- Pilih komponen SPJ --</option>
        ${masters.map(m=>`<option value="${esc(m.id_spj)}" ${pick(f)===m.id_spj?'selected':''}>${esc(m.nama_spj||m.nama_dokumen||m.kode||m.id_spj)}</option>`).join('')}
      </select>
    </div>`).join('');
    $('#paketUploadBtn').disabled=false;
  };

  $('#paketUploadBtn').onclick=async()=>{
    const files=Array.from($('#paketFiles').files||[]);
    const selects=Array.from(document.querySelectorAll('.paket-map-select'));
    if(!files.length) return;
    const mappings=selects.map(x=>x.value);
    if(mappings.some(v=>!v)){ $('#paketMsg').innerHTML=msg('Semua file harus dipetakan ke komponen SPJ.'); return; }
    if(new Set(mappings).size!==mappings.length){ $('#paketMsg').innerHTML=msg('Satu komponen SPJ hanya boleh dipilih satu kali dalam satu impor.'); return; }
    const btn=$('#paketUploadBtn'); btn.disabled=true; btn.textContent='Mengunggah 0/'+files.length+'...';
    try{
      for(let i=0;i<files.length;i++){
        const f=files[i];
        const base64=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
          reader.onerror=reject;
          reader.readAsDataURL(f);
        });
        await api('uploadDanSimpanDokumenSPJ',{data:{id_periode:periode,id_spj:mappings[i],nama_file:f.name,mimeType:'application/pdf',base64}});
        btn.textContent=`Mengunggah ${i+1}/${files.length}...`;
      }
      $('#modalImportPaket').remove();
      await renderDokumenTable();
    }catch(e){
      $('#paketMsg').innerHTML=msg(errorText(e));
      btn.disabled=false; btn.textContent='Impor & Unggah Semua';
    }
  };
};

function schoolStatusLabel(st){
  const s=upper(st||'BELUM_UPLOAD');
  const map={BELUM_UPLOAD:['Belum dilengkapi','warning'],SUDAH_UPLOAD:['Sudah diinput','success'],DALAM_PEMERIKSAAN:['Sedang diperiksa','info'],SELESAI_DINILAI:['Sudah dinilai','success'],PERLU_PERBAIKAN:['Perlu diperbaiki','danger'],'N/A':['Tidak berlaku','warning']};
  return map[s]||[s.replaceAll('_',' '),'info'];
}

async function renderStatus(){
  const p=$('#periodeSelect')?.value,area=$('#statusArea');if(!p||!area)return;
  area.innerHTML=loading('Menyusun status SPJ...');
  try{
    const [s,r,pipeline]=await Promise.all([api('getStatusSPJ',{idPeriode:p}),safeApi('getRingkasanSPJ',{idPeriode:p},{}),safeApi('getPipelinePenilaianSPJ',{idPeriode:p},{phase1_done:false,reconciliation_done:false,phase2_done:false,final_done:false,active_stage:''})]);
    const items=Array.isArray(s.data)?s.data:[];
    const ring=r?.ringkasan||{};
    const total=items.length;
    const na=items.filter(x=>upper(x.status)==='N/A').length;
    const required=Math.max(0,total-na);
    const complete=items.filter(x=>['SUDAH_UPLOAD','SELESAI_DINILAI'].includes(upper(x.status))).length;
    const repair=items.filter(x=>upper(x.status)==='PERLU_PERBAIKAN').length;
    const checking=items.filter(x=>upper(x.status)==='DALAM_PEMERIKSAAN').length;
    const progress=required?Math.round(complete/required*100):0;
    const statusUmum=String(r?.status_umum||'BELUM_DIMULAI');
    let next='Lengkapi dokumen SPJ yang belum tersedia.';
    let nextView='dokumenBulanan';
    if(repair){next=`Ada ${repair} komponen yang perlu diperbaiki setelah pemeriksaan Pengawas.`;nextView='perbaikanSpj';}
    else if(required && complete>=required){next=checking?`SPJ sudah lengkap dan ${checking} komponen sedang diperiksa Pengawas.`:'SPJ sudah lengkap. Pantau hasil pemeriksaan dan pipeline penilaian DINAS.';nextView='hasilPenilaian';}
    const activeStage=String(pipeline?.active_stage||'').toUpperCase();
    const steps=[
      ['INPUT SPJ','BKU Data & bukti',`${complete}/${required||total} bukti selesai`,complete>=required],
      ['PEMERIKSAAN','Pengawas',checking?'Sedang diperiksa':complete>=required?'Siap / menunggu pemeriksaan':'Belum siap',['PEMERIKSAAN','PERBAIKAN','PENILAIAN_1','REKONSILIASI','PENILAIAN_2','FINALISASI'].includes(activeStage)],
      ['PERBAIKAN','Tindak lanjut',repair?`${repair} komponen perlu diperbaiki`:'Tidak ada perbaikan aktif',['PENILAIAN_1','REKONSILIASI','PENILAIAN_2','FINALISASI'].includes(activeStage)],
      ['FASE 1','PENGAWAS',pipeline?.phase1_approved?'Disetujui DINAS':pipeline?.phase1_submitted?'Dikirim ke DINAS':'Belum',!!pipeline?.phase1_done],
      ['REKONSILIASI','DINAS',pipeline?.reconciliation_done?'Selesai':'Belum',!!pipeline?.reconciliation_done],
      ['FASE 2 / FINAL','DINAS',pipeline?.final_done?'FINAL':pipeline?.phase2_done?'Fase 2 selesai':'Belum',!!pipeline?.final_done]
    ];
    const rows=items.map(x=>{const [label,type]=schoolStatusLabel(x.status);return `<div class="school-status-row"><div><strong>${esc(x.nama_spj||x.id_spj||'-')}</strong><small>${esc(label)}</small></div><span class="badge badge-${type}">${esc(label)}</span></div>`;}).join('');
    area.innerHTML=`
      <div class="school-result-hero"><div><span class="school-eyebrow">PERIODE ${esc(p)}</span><h3>${esc(statusUmum.replaceAll('_',' '))}</h3><p>${fmtNum(complete)} dari ${fmtNum(required)} komponen wajib selesai.</p></div><div class="school-result-percent">${progress}%</div></div>
      <div class="school-progress-track"><span style="width:${Math.min(100,progress)}%"></span></div>
      <div class="school-next-action ${repair?'danger':''}"><div><span class="school-eyebrow">YANG PERLU DILAKUKAN</span><strong>${esc(next)}</strong></div><button class="btn btn-primary btn-sm" onclick="loadView('${nextView}')">Buka →</button></div>
      <div class="school-timeline">${steps.map((x,i)=>`<div class="school-timeline-step ${x[3]?'done':''}"><span>${x[3]?'✓':i+1}</span><div><strong>${esc(x[0])}</strong><small>${esc(x[1])} · ${esc(x[2])}</small></div></div>`).join('')}</div>
      <div class="school-status-list"><div class="school-list-head"><h3>Komponen SPJ</h3><span class="muted">${fmtNum(total)} komponen</span></div>${rows||msg('Belum ada komponen SPJ.','warning')}</div>
      <div class="toolbar" style="margin-top:14px;justify-content:flex-end"><button class="btn btn-light" onclick="loadView('dokumenBulanan')">📁 Kelola SPJ</button></div>`;
  }catch(e){area.innerHTML=msg(errorText(e));}
}

      const usable=available.filter(p=>optionValues.includes(p));
      if((!state.selectedPeriode || !available.includes(String(state.selectedPeriode))) && usable.length){
        state.selectedPeriode=usable[0];
      }
    }catch(e){}
  }

  sel.value=state.selectedPeriode||'';
  sel.onchange=()=>{

}

function _bkuPdfNorm_(v){return String(v||'').replace(/\s+/g,' ').trim();}
function _bkuPdfHeaderKey_(v){return _bkuPdfNorm_(v).toUpperCase().replace(/[.:]/g,'');}
function _bkuPdfDate_(v){
  const s=String(v||'').trim();
  let m=s.match(/\b(\d{2})[\/-](\d{2})[\/-](\d{4})\b/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;
  m=s.match(/\b(\d{4})[\/-](\d{2})[\/-](\d{2})\b/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function _bkuPdfRows_(items){
  const rows=[]; const tol=2.5;
  (items||[]).filter(x=>_bkuPdfNorm_(x.str)).forEach(x=>{
    const y=Number(x.transform?.[5]||0), xx=Number(x.transform?.[4]||0);
    let row=rows.find(r=>Math.abs(r.y-y)<=tol);
    if(!row){row={y,items:[]};rows.push(row);} row.items.push({x:xx,text:_bkuPdfNorm_(x.str)});
  });
  rows.forEach(r=>r.items.sort((a,b)=>a.x-b.x));
  return rows.sort((a,b)=>b.y-a.y);
}
function _bkuPdfLayout_(rows){
  for(const row of rows){
    const all=_bkuPdfHeaderKey_(row.items.map(x=>x.text).join(' '));
    if(!all.includes('TANGGAL')||!all.includes('URAIAN')||!all.includes('PENGELUARAN')||!all.includes('SALDO'))continue;
    const find=(rx)=>row.items.find(x=>rx.test(_bkuPdfHeaderKey_(x.text)))?.x;
    const xDate=find(/TANGGAL/),xUraian=find(/URAIAN/),xTerima=find(/PENERIMAAN/),xKeluar=find(/PENGELUARAN/),xSaldo=find(/SALDO/);
    const rekeningItem=row.items.find(x=>/REKENING/.test(_bkuPdfHeaderKey_(x.text)));
    const buktiItem=row.items.find(x=>/BUKTI/.test(_bkuPdfHeaderKey_(x.text)));
    const kegiatanItem=row.items.find(x=>/KEGIATAN/.test(_bkuPdfHeaderKey_(x.text)));
    if([xDate,xUraian,xKeluar,xSaldo].some(x=>x===undefined))continue;
    const cols=[['tanggal',xDate],['kode_kegiatan',kegiatanItem?.x],['kode_rekening',rekeningItem?.x],['nomor_bukti',buktiItem?.x],['uraian',xUraian],['penerimaan',xTerima],['pengeluaran',xKeluar],['saldo',xSaldo]].filter(x=>Number.isFinite(x[1])).sort((a,b)=>a[1]-b[1]);
    return cols;
  }
  return null;
}
function _bkuPdfAssign_(row,cols){
  const out={}; cols.forEach(c=>out[c[0]]=[]);
  const boundaries=[]; for(let i=0;i<cols.length-1;i++)boundaries.push((cols[i][1]+cols[i+1][1])/2);
  row.items.forEach(it=>{let idx=0;while(idx<boundaries.length&&it.x>=boundaries[idx])idx++;out[cols[idx][0]].push(it.text);});
  Object.keys(out).forEach(k=>out[k]=_bkuPdfNorm_(out[k].join(' ')));
  return out;
}
function _bkuPdfMeta_(text){
  const t=String(text||'').replace(/\s+/g,' ');
  const n=(t.match(/NPSN\s*[:\-]?\s*(\d{8})/i)||[])[1]||'';
  const y=(t.match(/TAHUN\s*[:\-]?\s*(20\d{2})/i)||[])[1]||'';
  let nama='';const m=t.match(/NAMA\s+SEKOLAH\s*[:\-]?\s*(.{3,80}?)(?=\s+(?:NPSN|ALAMAT|TAHUN|SEMESTER|$))/i);if(m)nama=_bkuPdfNorm_(m[1]);
  return {npsn:n,tahun:y,nama};
}

window.parsePdfBkuDigital=async function(){
  const f=$('#pdfBkuFile')?.files?.[0],out=$('#pdfBkuPreview'),btn=$('#pdfBkuReadBtn');
  if(!f){out.innerHTML=msg('Pilih PDF BKU Digital terlebih dahulu.','warning');return;}
  if(!/\.pdf$/i.test(f.name)){out.innerHTML=msg('File BKU Digital harus berformat PDF.','warning');return;}
  btn.disabled=true;btn.textContent='Membaca PDF...';out.innerHTML=loading('Mengekstrak text layer dan struktur tabel BKU...');
  try{
    const lib=await ensurePdfJs();
    const pdf=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
    let layout=null;const data=[];let allText='';let logicalRow=0;let pagesWithLayout=0;
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p),tc=await page.getTextContent();
      const rows=_bkuPdfRows_(tc.items||[]);allText+=' '+rows.map(r=>r.items.map(x=>x.text).join(' ')).join(' ');
      const pageLayout=_bkuPdfLayout_(rows);if(pageLayout){layout=pageLayout;pagesWithLayout++;}
      if(!layout)continue;
      for(const row of rows){
        const c=_bkuPdfAssign_(row,layout),tanggal=_bkuPdfDate_(c.tanggal);
        if(!tanggal)continue;
        const penerimaan=_bkuNumberClient(c.penerimaan),pengeluaran=_bkuNumberClient(c.pengeluaran),saldo=_bkuNumberClient(c.saldo);
        const nilai=Math.max(Math.abs(penerimaan),Math.abs(pengeluaran));if(!(nilai>0))continue;
        logicalRow++;
        data.push({source_row:`P${p}-R${logicalRow}`,tanggal_transaksi:tanggal,kode_kegiatan:c.kode_kegiatan||'',kode_rekening:c.kode_rekening||'',nomor_bukti:c.nomor_bukti||'',uraian_transaksi:c.uraian||'Transaksi BKU',penerimaan,pengeluaran,nilai_transaksi:nilai,saldo});
      }
    }
    const compact=allText.replace(/\s+/g,' ').trim();
    if(compact.length<200)throw new Error('PDF tidak memiliki text layer yang memadai. File ini terindikasi scan dan tidak dapat digunakan sebagai BKU Data. Unggah sebagai BKU Dokumen Resmi.');
    if(!pagesWithLayout||!data.length)throw new Error('Tabel transaksi BKU tidak dapat dikenali dengan aman dari PDF ini. Gunakan Excel BKU atau PDF digital ekspor BKU yang memuat kolom Tanggal, Uraian, Penerimaan, Pengeluaran, dan Saldo.');
    const meta=_bkuPdfMeta_(compact);
    if(!meta.npsn)throw new Error('NPSN tidak terbaca dari PDF BKU Digital. File belum dapat ditetapkan sebagai sumber transaksi.');
    if(isSchool()&&String(meta.npsn)!==String(ownNpsn()))throw new Error(`NPSN pada PDF (${meta.npsn}) tidak sama dengan akun sekolah (${ownNpsn()}).`);
    const totalPenerimaan=data.reduce((a,x)=>a+Number(x.penerimaan||0),0),totalPengeluaran=data.reduce((a,x)=>a+Number(x.pengeluaran||0),0),lastSaldo=Number(data[data.length-1]?.saldo||0);
    const months=[...new Set(data.map(x=>x.tanggal_transaksi.slice(0,7)))].sort();
    state.importedTransactions=data;
    state.bkuImport={fileName:f.name,sourceType:'PDF_BKU_DIGITAL',meta,validation:{totalPenerimaan,totalPengeluaran,lastSaldo,months,pages:pdf.numPages,pagesWithLayout}};
    out.innerHTML=msg(`PDF BKU Digital valid. ${fmtNum(data.length)} transaksi berhasil diekstrak dan siap dinormalisasi.`,'ok')+
      `<div class="cards" style="margin:12px 0;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><div class="stat"><small>NPSN</small><strong style="font-size:.95rem">${esc(meta.npsn)}</strong><div class="muted">${esc(meta.nama||'-')}</div></div><div class="stat"><small>TAHUN</small><strong>${esc(meta.tahun||'-')}</strong><div class="muted">${esc(months.join(', '))}</div></div><div class="stat"><small>TRANSAKSI</small><strong>${fmtNum(data.length)}</strong><div class="muted">${fmtNum(pdf.numPages)} halaman PDF</div></div><div class="stat"><small>SUMBER</small><strong style="font-size:.9rem">PDF DIGITAL</strong><div class="muted">text layer terdeteksi</div></div></div>`+

function _bkuNormLabelClient(v){
  return String(v??'').replace(/\s+/g,' ').trim().toUpperCase().replace(/[.:]/g,'');
}
function _bkuNumberClient(v){
  if(typeof v==='number' && Number.isFinite(v)) return v;
  let s=String(v??'').trim();if(!s)return 0;
  s=s.replace(/\s/g,'').replace(/Rp/ig,'');
  if(s.includes('.') && s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  else s=s.replace(/[^0-9,.-]/g,'').replace(',','.');
  const n=Number(s);return Number.isFinite(n)?n:0;
}
function _bkuDateClient(v){
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number' && Number.isFinite(v)){
    const d=new Date(Date.UTC(1899,11,30)+v*86400000);
    if(!isNaN(d)) return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  }
  const s=String(v??'').trim();
  let m=s.match(/^(\d{2})[-\/]?(\d{2})[-\/]?(\d{4})$/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;
  m=s.match(/^(\d{4})[-\/]?(\d{2})[-\/]?(\d{2})$/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function _bkuFindHeaderClient(rows){
  for(let r=0;r<Math.min(rows.length,40);r++){
    const cells=(rows[r]||[]).map(_bkuNormLabelClient);
    const hasDate=cells.includes('TANGGAL'), hasRek=cells.includes('KODE REKENING'), hasUraian=cells.includes('URAIAN'), hasKeluar=cells.includes('PENGELUARAN');
    if(hasDate&&hasRek&&hasUraian&&hasKeluar){
      // Ekspor BKU ARKAS memakai merge cell pada header. Pada data,
      // NO. BUKTI dan URAIAN berada satu kolom di kanan label header.
      const date=cells.indexOf('TANGGAL'), kegiatan=cells.indexOf('KODE KEGIATAN'), rekening=cells.indexOf('KODE REKENING');
      const buktiHead=cells.indexOf('NO BUKTI'), uraianHead=cells.indexOf('URAIAN');
      const bukti=buktiHead+1 < (rows[r+1]||[]).length ? buktiHead+1 : buktiHead;
      const uraian=uraianHead+1 < (rows[r+1]||[]).length ? uraianHead+1 : uraianHead;
      return {row:r,date,kodeKegiatan:kegiatan,kodeRekening:rekening,bukti,uraian,penerimaan:cells.indexOf('PENERIMAAN'),pengeluaran:cells.indexOf('PENGELUARAN'),saldo:cells.indexOf('SALDO')};
    }
  }
  return null;
}
function _bkuMetaClient(rows){
  let npsn='',nama='',tahun='';
  for(let r=0;r<Math.min(rows.length,18);r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){
      const label=_bkuNormLabelClient(row[c]);
      if(label==='NPSN' && !npsn) for(let j=c+1;j<Math.min(row.length,c+6);j++){if(String(row[j]??'').trim()){npsn=String(row[j]).replace(/^:/,'').trim();break;}}
      if(label==='NAMA SEKOLAH' && !nama) for(let j=c+1;j<Math.min(row.length,c+6);j++){if(String(row[j]??'').trim()){nama=String(row[j]).replace(/^:/,'').trim();break;}}
      const txt=String(row[c]??'');const m=txt.match(/TAHUN\s*[:]?\s*(20\d{2})/i);if(m)tahun=m[1];
    }
  }
  return {npsn,nama,tahun};
}

window.parseExcelBku=async function(){
  const f=$('#excelFile')?.files?.[0],out=$('#excelPreview'),btn=$('#bkuReadBtn');
  if(!f){out.innerHTML=msg('Pilih file Excel BKU ARKAS terlebih dahulu.');return;}
  btn.disabled=true;
  try{await ensureXlsxLib();}catch(e){out.innerHTML=msg(e.message,'warning');btn.disabled=false;return;}
  btn.textContent='Membaca Excel...';out.innerHTML=loading('Membaca nilai BKU tanpa style/format Excel...');
  try{
    const buffer=await f.arrayBuffer();
    // FAST PATH: untuk BKU kita hanya butuh nilai sel. Style, rich text, formula
    // formatting, dan konversi Date tidak perlu diproses oleh SheetJS.
    const wb=XLSX.read(buffer,{
      type:'array',
      cellDates:false,
      cellStyles:false,
      cellNF:false,
      cellText:false,
      cellFormula:false,
      cellHTML:false
    });
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:false});
    const h=_bkuFindHeaderClient(rows);
    if(!h)throw new Error('Header BKU tidak ditemukan. Pastikan file berasal dari ekspor Buku Kas Umum ARKAS.');
    const meta=_bkuMetaClient(rows);
    if(!meta.npsn)throw new Error('NPSN tidak terbaca dari Excel BKU.');
    if(isSchool() && String(meta.npsn)!==String(ownNpsn()))throw new Error(`NPSN pada Excel (${meta.npsn}) tidak sama dengan akun sekolah (${ownNpsn()}).`);

    const data=[];let excluded=0,invalidSaldo=0;
    let totalPenerimaan=0,totalPengeluaran=0,lastSaldo=null,prevSaldo=null;
    for(let i=h.row+1;i<rows.length;i++){
      const row=rows[i]||[];
      const tanggal=_bkuDateClient(row[h.date]);if(!tanggal){excluded++;continue;}
      const uraian=String(row[h.uraian]??'').trim();
      const penerimaan=_bkuNumberClient(row[h.penerimaan]);
      const pengeluaran=_bkuNumberClient(row[h.pengeluaran]);
      const saldo=_bkuNumberClient(row[h.saldo]);
      const kode=String(row[h.kodeRekening]??'').trim();
      const bukti=String(row[h.bukti]??'').trim();
      const kodeKegiatan=String(row[h.kodeKegiatan]??'').trim();
      if(/^Saldo (Bank|Tunai) Bulan/i.test(uraian)){prevSaldo=saldo;lastSaldo=saldo;excluded++;continue;}
      const nilai=Math.max(Math.abs(penerimaan),Math.abs(pengeluaran));
      if(!(nilai>0)){excluded++;continue;}
      if(prevSaldo!==null){
        const expected=prevSaldo+penerimaan-pengeluaran;
        if(Math.abs(expected-saldo)>1)invalidSaldo++;
      }
      prevSaldo=saldo;lastSaldo=saldo;
      totalPenerimaan+=penerimaan;totalPengeluaran+=pengeluaran;
      data.push({
        source_row:i+1,tanggal_transaksi:tanggal,kode_kegiatan:kodeKegiatan,kode_rekening:kode,
        nomor_bukti:bukti,uraian_transaksi:uraian||'Transaksi BKU',
        penerimaan,pengeluaran,nilai_transaksi:nilai,saldo
      });
    }
    if(!data.length)throw new Error('Tidak ditemukan transaksi bernilai lebih dari nol pada BKU.');
    const months=[...new Set(data.map(x=>x.tanggal_transaksi.slice(0,7)))].sort();
    const withCode=data.filter(x=>x.kode_rekening).length;
    const tax=data.filter(x=>/\b(PPh|PPN|PAJAK|SSPD|SETOR PPh|SETOR PPN)\b/i.test(x.uraian_transaksi)).length;
    const balanced=Math.abs(totalPenerimaan-totalPengeluaran-(Number(lastSaldo)||0))<=1;
    state.importedTransactions=data;
    state.bkuImport={fileName:f.name,sourceType:'EXCEL_BKU_ARKAS',meta,validation:{totalPenerimaan,totalPengeluaran,lastSaldo:Number(lastSaldo)||0,invalidSaldo,months,balanced}};

    out.innerHTML=msg(`Excel BKU valid. ${fmtNum(data.length)} transaksi siap dijadikan basis penilaian.`,'ok')+
      `<div class="cards" style="margin:12px 0;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
        <div class="stat"><small>NPSN</small><strong style="font-size:.95rem">${esc(meta.npsn)}</strong><div class="muted">${esc(meta.nama||'-')}</div></div>
        <div class="stat"><small>TAHUN</small><strong>${esc(meta.tahun||'-')}</strong><div class="muted">${esc(months.join(', '))}</div></div>
        <div class="stat"><small>TRANSAKSI</small><strong>${fmtNum(data.length)}</strong><div class="muted">${fmtNum(withCode)} berkode rekening</div></div>
        <div class="stat"><small>PAJAK</small><strong>${fmtNum(tax)}</strong><div class="muted">baris terindikasi pajak</div></div>
      </div>`+
      `<div class="panel" style="margin:12px 0"><b>Kontrol BKU Excel</b><div class="table-wrap" style="margin-top:8px"><table class="friendly-table"><tbody>
        <tr><td>Total Penerimaan</td><td><b>${fmtRupiah(totalPenerimaan)}</b></td></tr>
        <tr><td>Total Pengeluaran</td><td><b>${fmtRupiah(totalPengeluaran)}</b></td></tr>
        <tr><td>Saldo Akhir</td><td><b>${fmtRupiah(Number(lastSaldo)||0)}</b></td></tr>
        <tr><td>Konsistensi saldo berantai</td><td>${invalidSaldo?badge(`${invalidSaldo} baris perlu review`,'warning'):badge('KONSISTEN','success')}</td></tr>
      </tbody></table></div></div>`+
      `<div class="table-wrap"><table class="friendly-table"><thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Kode Rekening</th><th>No. Bukti</th><th>Uraian</th><th>Penerimaan</th><th>Pengeluaran</th><th>Saldo</th></tr></thead><tbody>${data.slice(0,25).map(x=>`<tr><td>${esc(x.tanggal_transaksi)}</td><td>${esc(x.kode_kegiatan||'-')}</td><td><code>${esc(x.kode_rekening||'-')}</code></td><td>${esc(x.nomor_bukti||'-')}</td><td>${esc(x.uraian_transaksi)}</td><td>${fmtRupiah(x.penerimaan)}</td><td>${fmtRupiah(x.pengeluaran)}</td><td>${fmtRupiah(x.saldo)}</td></tr>`).join('')}</tbody></table></div>`+
      `<div class="message warning" style="margin-top:12px"><b>Snapshot penilaian.</b> Setelah disimpan, Excel ini menjadi BKU aktif untuk periode yang tercakup. Impor Excel baru akan menggantikan snapshot aktif pada penilaian tanpa menghapus riwayat impor sebelumnya.</div>`+
      `<button class="btn btn-primary" style="margin-top:12px" onclick="saveImportedTransactions()">✓ Tetapkan sebagai BKU Penilaian</button>`;
  }catch(err){out.innerHTML=msg(errorText(err),'error');state.bkuImport=null;state.importedTransactions=[];}
  finally{btn.disabled=false;btn.textContent='Baca & Validasi Excel';}
};

/* ============================================================================
 * RKAS IMPORT — UPLOAD EXCEL + PREVIEW MAPPING
 * --------------------------------------------------------------------------
 * Tahap ini membaca Excel di browser, menormalisasi struktur RKAS, lalu
 * mengirim baris terpilih ke backend importRKASPreview().
 * PDF belum diparse pada modul ini; tombol PDF memberi informasi bahwa parser
 * PDF akan menjadi tahap berikutnya.
 * ========================================================================== */

window._rkasImportPreview = null;

function _rkasNormLabelClient(v){
  return String(v ?? '')
    .replace(/\n/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .toUpperCase();
}

function _rkasTextClient(v){
  return String(v ?? '').replace(/\s+/g,' ').trim();
}

function _rkasCodeClient(v){
  if(v instanceof Date && !isNaN(v)){
    const dd=String(v.getDate()).padStart(2,'0');
    const mm=String(v.getMonth()+1).padStart(2,'0');
    const yy=String(v.getFullYear()).slice(-2);
    return `${dd}.${mm}.${yy}`;
  }
  return _rkasTextClient(v).replace(/\s+/g,'').replace(/\.0+$/,'');
}

function _rkasNumberClient(v){
  if(typeof v === 'number' && Number.isFinite(v)) return v;
  let s=String(v ?? '').trim();
  if(!s) return 0;
  s=s.replace(/[^0-9,.-]/g,'');
  if(!s) return 0;
  // Menangani 1.234.567,89 maupun 1234567.89.
  if(s.includes(',') && s.includes('.')){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(s.includes(',')){
    const parts=s.split(',');
    s=parts.length===2 && parts[1].length<=2 ? parts[0]+'.'+parts[1] : s.replace(/,/g,'');
  }else if((s.match(/\./g)||[]).length>1){
    s=s.replace(/\./g,'');
  }
  const n=Number(s);
  return Number.isFinite(n)?n:0;
}

function _rkasFindHeaderClient(rows){
  const aliases={
    kodeRekening:['KODE REKENING','KODE REKENING BELANJA','KODE AKUN','KODE\nREKENING'],
    kodeKegiatan:['KODE KEGIATAN','KODE KEGIATAN/PROGRAM'],
    kegiatan:['URAIAN KEGIATAN','KEGIATAN','NAMA KEGIATAN'],
    uraian:['URAIAN','URAIAN BELANJA','RINCIAN BELANJA','NAMA BELANJA','RINCIAN OBJEK','RINCIAN PERHITUNGAN'],
    volume:['VOLUME','QTY','KUANTITAS','JUMLAH VOLUME'],
    satuan:['SATUAN','UNIT'],
    harga:['HARGA SATUAN','HARGA'],
    pagu:['PAGU','JUMLAH','TOTAL','NILAI','JUMLAH ANGGARAN','JUMLAH (RP)']
  };
  const findIdx=(cells,names)=>cells.findIndex(x=>names.includes(x));
  let best=null;
  for(let r=0;r<Math.min(rows.length,250);r++){
    const cells=(rows[r]||[]).map(_rkasNormLabelClient);
    const score={};
    Object.keys(aliases).forEach(k=>{score[k]=findIdx(cells,aliases[k]);});
    const hits=Object.values(score).filter(i=>i>=0).length;
    const strong=(score.kodeRekening>=0?2:0)+(score.kodeKegiatan>=0?2:0)+((score.uraian>=0||score.kegiatan>=0)?2:0)+(score.pagu>=0?2:0)+(score.volume>=0&&score.harga>=0?1:0);
    if(!best || strong*10+hits > best.rank) best={row:r,idx:score,rank:strong*10+hits};
  }
  // Mendukung dua pola:
  // 1) Lembar RKAS sekolah: Kode Rekening + Kode Kegiatan + Uraian + Jumlah.
  // 2) DPA/RKA Unit: Kode Rekening + Uraian + Volume + Satuan + Harga Satuan + Jumlah.
  if(!best || best.rank<25 || best.idx.kodeRekening<0 || best.idx.pagu<0) return null;
  if(best.idx.uraian<0) best.idx.uraian=best.idx.kegiatan;
  if(best.idx.kegiatan<0) best.idx.kegiatan=-1;
  best.pattern=(best.idx.kodeKegiatan>=0)?'LEMBAR_RKAS':'DPA_UNIT';
  return best;
}

function _rkasLooksLikeNpsnClient(v){
  return /^\d{8}$/.test(String(v??'').trim());
}
function _rkasLooksLikeAccountCodeClient(v){
  const s=_rkasCodeClient(v);
  return /^5(?:\.\d+)+$/.test(s);
}
function _rkasLooksLikeNumberedItemClient(v){
  return /^\s*\d{1,4}\s*[.)\-:]\s+/.test(String(v||''));
}
function _rkasCleanItemDescriptionClient(v){
  return String(v??'')
    .replace(/\u00A0/g,' ')
    .normalize('NFKC')
    .replace(/^\s*\d{1,4}\s*[.)\-:]\s*/,'')
    .replace(/[\-–—]+$/,'')
    .replace(/\s+/g,' ')
    .trim();
}
function _rkasIsParentSubtotalClient(rows,i,header){
  const row=rows[i]||[];
  const code=_rkasCodeClient(row[header.idx.kodeRekening]);
  const desc=_rkasTextClient(row[header.idx.uraian]);
  if(!code||!_rkasLooksLikeAccountCodeClient(code)||!desc||_rkasLooksLikeNumberedItemClient(desc)) return false;
  for(let j=i+1;j<Math.min(rows.length,i+20);j++){
    const rr=rows[j]||[];
    const nextCode=_rkasCodeClient(rr[header.idx.kodeRekening]);
    const nextDesc=_rkasTextClient(rr[header.idx.uraian]);
    if(!nextCode && !nextDesc) continue;
    if(nextCode!==code) return false;
    return _rkasLooksLikeNumberedItemClient(nextDesc);
  }
  return false;
}

function _rkasMetaClient(rows){
  let npsn='',tahun='',nama='',kodeKegiatan='',kegiatan='';
  const flat=rows.slice(0,50).map(r=>(r||[]).map(_rkasTextClient));
  for(const row of flat){
    for(let c=0;c<row.length;c++){
      const label=_rkasNormLabelClient(row[c]);
      if(label==='NPSN'){
        for(let j=c+1;j<Math.min(row.length,c+8);j++){
          const v=String(row[j]||'').replace(/^[:\-]\s*/,'').trim();
          if(_rkasLooksLikeNpsnClient(v)){npsn=v;break;}
        }
      }
      if(label==='NAMA SEKOLAH'){
        for(let j=c+1;j<Math.min(row.length,c+8);j++){
          const v=String(row[j]||'').replace(/^[:\-]\s*/,'').trim();
          if(v){nama=v;break;}
        }
      }
      if(label==='KEGIATAN'){
        for(let j=c+1;j<Math.min(row.length,c+8);j++){
          const v=String(row[j]||'').replace(/^[:\-]\s*/,'').trim();
          const m=v.match(/^([0-9.]+)\s*(?:-|:)?\s*(.*)$/);
          if(m){kodeKegiatan=kodeKegiatan||m[1];kegiatan=kegiatan||m[2];}
        }
      }
      const txt=row[c]||'';
      const m=txt.match(/TAHUN(?:\s+ANGGARAN)?\s*[:\-]?\s*(20\d{2})/i);
      if(m && !tahun) tahun=m[1];
      const m2=txt.match(/RKAS\s*-\s*NPSN\s*:\s*(\d{8})\s*,\s*NAMA SEKOLAH\s*:\s*(.+)/i);
      if(m2){npsn=npsn||m2[1];nama=nama||m2[2].trim();}
    }
  }
  return {npsn,nama,tahun,kodeKegiatan,kegiatan};
}

function _rkasIsDetailCode(code){
  return _rkasLooksLikeAccountCodeClient(code);
}

function _rkasExtractRowsClient(rows, header){
  const out=[];
  let currentKegiatan='';
  let currentKodeKegiatan='';
  let currentKodeRekening='';
  let currentNpsn='';
  const isDpa=header.pattern==='DPA_UNIT' || (header.idx.kodeKegiatan<0 && header.idx.volume>=0 && header.idx.harga>=0 && header.idx.satuan>=0);

  for(let r=header.row+1;r<rows.length;r++){
    const row=rows[r]||[];
    const kodeCell=_rkasCodeClient(row[header.idx.kodeRekening]);
    const kodeKegiatan=header.idx.kodeKegiatan>=0?_rkasCodeClient(row[header.idx.kodeKegiatan]):'';
    const kegiatanCell=header.idx.kegiatan>=0?_rkasTextClient(row[header.idx.kegiatan]):'';
    const uraian=_rkasTextClient(row[header.idx.uraian]);
    const pagu=_rkasNumberClient(row[header.idx.pagu]);
    const volume=header.idx.volume>=0?_rkasNumberClient(row[header.idx.volume]):0;
    const satuan=header.idx.satuan>=0?_rkasTextClient(row[header.idx.satuan]):'';
    const harga=header.idx.harga>=0?_rkasNumberClient(row[header.idx.harga]):0;

    if(!kodeCell && !kodeKegiatan && !kegiatanCell && !uraian && !(pagu>0)) continue;

    // Pola DPA Unit: baris 8 digit pada kolom Kode Rekening adalah NPSN,
    // kemudian baris-baris tanpa kode mewarisi rekening + NPSN tersebut.
    if(isDpa && _rkasLooksLikeNpsnClient(kodeCell)){
      currentNpsn=kodeCell;
      continue;
    }

    if(isDpa && _rkasLooksLikeAccountCodeClient(kodeCell)){
      currentKodeRekening=kodeCell;
      // Baris rekening pada DPA adalah subtotal/parent, bukan item.
      // Jika sekaligus mempunyai volume/harga, tetap boleh dianggap detail.
      if(!(volume>0) || !(harga>0) || !(pagu>0)) continue;
      // Jika uraian parent tidak memiliki rincian perhitungan, jangan impor.
      if(!uraian) continue;
    }

    // Pola Lembar RKAS: kode kegiatan adalah konteks.
    if(!isDpa && kodeKegiatan && !_rkasIsDetailCode(kodeCell)){
      if(kegiatanCell) currentKegiatan=kegiatanCell;
      currentKodeKegiatan=kodeKegiatan;
      continue;
    }
    if(!isDpa && kegiatanCell && !_rkasIsDetailCode(kodeCell)){
      currentKegiatan=kegiatanCell;
      currentKodeKegiatan=kodeKegiatan||currentKodeKegiatan;
      continue;
    }

    if(isDpa){
      // Detail DPA tidak mempunyai kode rekening pada barisnya.
      // Harus memiliki volume, satuan, harga, dan jumlah.
      if(!kodeCell && currentKodeRekening && uraian && volume>0 && harga>0 && pagu>0){
        const clean=_rkasCleanItemDescriptionClient(uraian);
        out.push({
          npsn:currentNpsn,
          kode_kegiatan:currentKodeKegiatan,
          kegiatan:currentKegiatan,
          kode_rekening:currentKodeRekening,
          nama_belanja:clean,
          uraian:clean,
          volume,
          satuan:satuan||'paket',
          harga_satuan:harga,
          pagu,
          nomor_baris_sumber:r+1
        });
      }
      continue;
    }

    // Lembar RKAS: parent/subtotal memiliki kode yang sama dengan item.
    // Jika baris tidak bernomor dan baris berikutnya merupakan item bernomor,
    // baris parent tidak dimasukkan.
    if(!_rkasIsDetailCode(kodeCell)) continue;
    if(_rkasIsParentSubtotalClient(rows,r,header)) continue;
    if(!(pagu>0) && !uraian) continue;

    const numbered=_rkasLooksLikeNumberedItemClient(uraian);
    const namaBelanja=_rkasCleanItemDescriptionClient(uraian || kegiatanCell);
    if(!namaBelanja) continue;

    out.push({
      kode_kegiatan: currentKodeKegiatan || kodeKegiatan,
      kegiatan: currentKegiatan || kegiatanCell,
      kode_rekening: kodeCell,
      nama_belanja:namaBelanja,
      uraian:namaBelanja,
      volume: volume || 1,
      satuan:satuan || 'paket',
      harga_satuan: harga || pagu,
      pagu,
      nomor_baris_sumber:r+1
    });
  }
  return out;
}

function _rkasStatusBadge(status){
  const st=String(status||'').toUpperCase();

}

window.readAndMapRkasFile=async function(){
  const file=$('#rkasImportFile')?.files?.[0];
  const out=$('#rkasPreviewArea'),msgHost=$('#rkasImportMsg'),btn=$('#rkasReadBtn');
  if(!file){msgHost.innerHTML=msg('Pilih file Excel RKAS terlebih dahulu.');return;}
  btn.disabled=true;
  try{ await ensureXlsxLib(); }catch(e){ msgHost.innerHTML=msg(e.message,'warning'); btn.disabled=false; return; }btn.textContent='Membaca & mapping...';out.innerHTML=loading('Menganalisis struktur RKAS dan menjalankan mapping...');
  try{
    const buffer=await file.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buffer),{type:'array',cellDates:true});
    let selected=null, selectedRows=null;
    for(const sheetName of wb.SheetNames){
      const ws=wb.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      const header=_rkasFindHeaderClient(rows);
      if(header){
        const extracted=_rkasExtractRowsClient(rows,header);
        if(extracted.length && (!selected || extracted.length>selectedRows.length)){
          selected={sheetName,rows,header};selectedRows=extracted;
        }
      }
    }
    if(!selectedRows?.length) throw new Error('Struktur RKAS tidak dikenali. Pastikan terdapat kolom Kode Rekening, Kode Kegiatan, Uraian, dan Jumlah/Pagu.');
    const meta=_rkasMetaClient(selected.rows);
    const year=String($('#rkasImportYear').value||meta.tahun||new Date().getFullYear());
    const targetNpsn=isDinas()
      ? normalizeNpsnClient($('#rkasImportTargetNpsn')?.value||'')
      : normalizeNpsnClient(ownNpsn());
    if(!targetNpsn) throw new Error('Pilih sekolah tujuan terlebih dahulu.');
    // Sekolah hanya boleh mengimpor RKAS miliknya. Dinas juga tidak boleh
    // secara tidak sengaja memasukkan file sekolah A ke sekolah B.
    if(meta.npsn && normalizeNpsnClient(meta.npsn)!==targetNpsn){
      throw new Error(`NPSN pada file (${meta.npsn}) berbeda dengan sekolah tujuan (${targetNpsn}).`);
    }
    $('#rkasImportYear').value=year;
    const payload={
      nama_file:file.name,
      jenis_file:file.name.toLowerCase().endsWith('.xls')?'XLS':'XLSX',
      tahun:Number(year),
      versi_rkas:$('#rkasImportVersion').value.trim()||'V1',
      npsn:targetNpsn,
      file_id:'',
      rows:selectedRows
    };
    const r=await api('importRKASPreview',{data:payload});
    window._rkasImportPreview={fileName:file.name,meta:Object.assign({},meta,{sheetName:selected.sheetName,pattern:selected.header.pattern}),payload,response:r,rows:r.data||[]};
    renderRkasImportPreview();
  }catch(e){
    out.innerHTML=msg(errorText(e),'error');
    window._rkasImportPreview=null;
  }finally{btn.disabled=false;btn.textContent='📖 Baca & Mapping RKAS';}
};

  const p=window._rkasImportPreview,row=p?.rows?.[index]; if(!row)return;
  const kegiatan=$('#rkasChoiceKegiatan')?.value||'';
  const barang=$('#rkasChoiceBarang')?.value||'';
  if(!kegiatan||!barang){$('#rkasChoiceMsg').innerHTML=msg('Pilih mapping kegiatan dan referensi barang.','warning');return;}
  const mk=row.mapping_kegiatan||{}, mb=row.mapping_barang||{};
  const k=(mk.kandidat||[]).find(x=>String(x.kode_kegiatan||'')===String(kegiatan));
  const b=(mb.kandidat||[]).find(x=>String(x.kode_barang||'')===String(barang));
  if(!k||!b){$('#rkasChoiceMsg').innerHTML=msg('Kandidat mapping tidak ditemukan pada preview.','error');return;}
  row.id_kegiatan=k.kode_kegiatan||'';
  row.kode_kegiatan=k.kode_kegiatan||'';
  row.id_referensi_barang=b.kode_barang||'';
  row.mapping_kegiatan=Object.assign({},mk,{id_kegiatan:row.id_kegiatan,kode_kegiatan:row.kode_kegiatan,kegiatan:k.uraian||k.sub_program||k.program||''});
  row.mapping_barang=Object.assign({},mb,{id_referensi_barang:row.id_referensi_barang,nama_referensi:b.rincian_obyek||''});
  row.status_mapping='MANUAL';
  row.mapping_score=100;
  row.catatan_mapping=$('#rkasChoiceNote')?.value?.trim()||'Konfirmasi manual sekolah';
  $('#rkasChoiceModal').remove();
  renderRkasImportPreview();
};

window.commitRkasImportFromPreview=async function(){
  const p=window._rkasImportPreview; if(!p)return;
  const btns=document.querySelectorAll('#rkasPreviewArea button');
  btns.forEach(b=>{if(/Simpan Otomatis/.test(b.textContent))b.disabled=true;});
  try{
    const rows=(p.rows||[]).map(x=>Object.assign({},x));
    const payload={id_import:p.response.id_import,rows};
    if(isDinas()) payload.npsn=normalizeNpsnClient($('#rkasImportTargetNpsn')?.value||p.response.npsn||'');
    const r=await api('commitRKASImport',{data:payload});
    invalidateRkasFrontendCaches();
    toast((r.message||`RKAS ${fmtNum(rows.length)} baris berhasil disimpan.`)+(r.archived_lama?` ${fmtNum(r.archived_lama)} baris RKAS lama diarsipkan.`:''),'ok',6500);
    const modal=$('#rkasImportModal');if(modal)modal.remove();
    if(isDinas()) await renderDinasRkasReview(); else await renderSchoolRkasAndRealisasi();
  }catch(e){
    toast(errorText(e),'error',6000);
    btns.forEach(b=>b.disabled=false);
  }
};
